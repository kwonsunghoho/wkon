  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .lx-eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .24em; color: var(--accent-ink); }
    .lx-title { font-family: var(--serif); font-size: clamp(28px, 5vw, 42px); font-weight: 700; color: var(--accent); letter-spacing: -.6px; margin-top: 10px; }
    .lx-sub { font-size: 15px; color: var(--text); opacity: .72; margin-top: 12px; max-width: 34em; margin-left: auto; margin-right: auto; text-wrap: balance; }
    .lx-sub b { color: var(--action); font-weight: 800; white-space: nowrap; }

    main.container { padding-bottom: 80px; }
    .lx-grid { margin-top: 6px; }

    /* 상태(비었음·오류) */
    .lx-state { padding: 40px 0 60px; text-align: center; color: var(--text-muted); }

<body>

  <header class="lx-hero">
    <div class="container">
      <div class="lx-eyebrow">SPECIAL LECTURE</div>
      <h1 class="lx-title">특강</h1>
      <p class="lx-sub">몬크가 주기적으로 여는 승무원 면접 특강 — <b>신청 중인 특강을 골라 바로 신청하세요.</b></p>
    </div>
  </header>

  <main class="container">
    <div class="lx-grid" id="lxGrid"></div>
    <div id="lxState"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="lecture-common.js"></script>
  <script>
    const grid = document.getElementById('lxGrid');
    const stateEl = document.getElementById('lxState');

    function showState(html) { grid.innerHTML = ''; stateEl.innerHTML = html; }

    async function load() {
      grid.innerHTML = LEC.skeletonHtml(6);   // 로딩 스켈레톤
      if (!window.MONC || !window.MONC.sb) {
        showState('<div class="lx-state"><div class="em">특강을 불러오지 못했어요</div>잠시 후 새로고침해 주세요.</div>');
        return;
      }
      // select('*') — airline·seats_left 마이그레이션(20260724130000) 미적용 환경에서도 안 깨지도록
      // (컬럼을 콕 집으면 미적용 시 조회 전체가 400). 카드는 있는 컬럼만 쓰고 없으면 브랜딩만 빠진다.
      const { data, error } = await window.MONC.sb
        .from('special_lectures')
        .select('*')
        .eq('visible', true)
        .order('sort_order', { ascending: true })
        .order('lecture_date', { ascending: true, nullsFirst: false });

      if (error) {
        console.error('[특강] 조회 실패', error);
        showState('<div class="lx-state"><div class="em">특강을 불러오지 못했어요</div>잠시 후 새로고침해 주세요.</div>');
        return;
      }
      if (!data || !data.length) {
        showState('<div class="lx-state"><div class="em">준비 중인 특강이 곧 열려요</div>새로운 특강 소식은 챌린지·승준 도구에서도 안내드릴게요.'
          + '<br><a class="lx-cta" href="index.html">홈으로</a></div>');
        return;
      }
      // 신청 중 → 예정 → 마감 순
      const rank = l => { const s = LEC.status(l.recruit_start, l.recruit_end); return (l.seats_left === 0 || s === 'closed') ? 2 : s === 'upcoming' ? 1 : 0; };
      data.sort((a, b) => rank(a) - rank(b));
      await LEC.attachSlots(window.MONC.sb, data);   // 카드의 'N개 타임' 표기용(실패해도 그냥 넘어감)
      stateEl.innerHTML = '';
      grid.innerHTML = data.map(LEC.cardHtml).join('');
    }
    load();

    /* bfcache — 뒤로/앞으로 오면 크롬이 떠날 때 그리던 화면을 그대로 되살린다(다시 조회하지 않는다).
       이 목록은 **잔여석·정원 마감**을 내걸기 때문에 낡은 채로 되살아나면 화면이 거짓말을 한다
       (마감된 특강이 '잔여 3석'으로 보인다). 신청·결제는 서버가 다시 판정하지만, 학생이 헛걸음한다.
       입력값이 없는 화면이라 통째로 다시 받는다 — lab·answers·mypage 와 같은 규칙(CLAUDE.md). */
    window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
  </script>
