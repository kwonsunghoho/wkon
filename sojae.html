<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- interactive-widget=resizes-content — 키보드가 열리면 화면(레이아웃)까지 줄여 달라는 뜻.
       안드로이드 크롬은 이 한 마디로 끝나고, 아이폰은 안 먹어서 아래 fitShell() 이 대신 한다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light" />
  <title>소재 발굴 — MONC 몬크</title>
  <meta name="description" content="대화하며 내 경험에서 면접 답변 소재를 찾아내는 몬크 소재 발굴." />
  <!-- Open Graph / SNS 공유 — 크롤러는 JS 를 안 돌리므로 여기에 직접 둔다 -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://monc.ai.kr/sojae.html" />
  <meta property="og:title"       content="소재 발굴 — MONC 몬크" />
  <meta property="og:description" content="대화하며 내 경험에서 면접 답변 소재를 찾아내는 몬크 소재 발굴." />
  <meta property="og:image"       content="https://monc.ai.kr/images/og-image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale"      content="ko_KR" />
  <meta property="og:site_name"   content="MONC 몬크" />
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="소재 발굴 — MONC 몬크" />
  <meta name="twitter:description" content="대화하며 내 경험에서 면접 답변 소재를 찾아내는 몬크 소재 발굴." />
  <meta name="twitter:image"       content="https://monc.ai.kr/images/og-image.png" />
  <!-- 파비콘 -->
  <link rel="icon" href="images/MONC_Logo_Full_Package/assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="images/MONC_Logo_Full_Package/assets/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/MONC_Logo_Full_Package/assets/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/MONC_Logo_Full_Package/assets/favicon/apple-touch-icon.png">
  <link rel="mask-icon" href="images/MONC_Logo_Full_Package/assets/favicon/safari-pinned-tab.svg" color="#102B56">
  <link rel="manifest" href="images/MONC_Logo_Full_Package/assets/favicon/site.webmanifest">
  <meta name="theme-color" content="#102B56">
  <link rel="stylesheet" href="tokens.css">
  <!-- 공용 상단 메뉴(2026-07-30) — 마크업은 nav.js 가 심는다. 여기에 nav 를 복사해 넣지 말 것. -->
  <link rel="stylesheet" href="nav.css">
  <script src="nav.js" defer></script>
  <!-- 인앱 브라우저(인스타·카톡) 탈출 안내 — 파일 받기·로그인이 막히는 자리 -->
  <script src="inapp.js?v=10" defer></script>
  <style>
    /* 다크모드 단말에서 입력칸(textarea)이 브라우저 기본 다크로 렌더되는 것 차단 */
    html { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'SUIT Variable', SUIT, 'Apple SD Gothic Neo', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; height: 100svh; display: flex; flex-direction: column;
      max-width: 480px; margin: 0 auto; line-height: 1.5;
    }

    /* 본문 바로가기 착지용 래퍼 — body 플렉스 기둥을 한 겹 그대로 내려받는다(레이아웃 불변).
       이 페이지만 main/.wrap/.container 가 없어 nav.js 의 skip-link 가 빈 앵커였다(2026-08-17).
       ⚠️ min-height:0 이 없으면 안쪽 .chat 의 overflow 스크롤이 안 생긴다. */
    .mainflow { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; outline: none; }

    /* ── 대화 화면 몰입 모드(2026-08-19 오너 "상단 네비 때문에 답변 볼 화면이 작다") ──
       대화가 시작되면(chat-focus) 공용 nav 를 걷어 그 높이(57px)를 대화에 준다.
       나가는 길은 상단 앱바(← 소재 발굴)와 난이도 알약이 맡는다 — admin·review-desk 처럼
       단독 화면 문법. 고르기 화면(pickView)은 사이트 맥락이라 nav 를 유지한다.
       ⚠️ 인앱 안내(.iab)도 같이 걷는다(kb-open 과 같은 취급) — 로그인을 이미 통과한 화면이다. */
    body.chat-focus #navbar, body.chat-focus .iab, body.chat-focus .iab-space { display: none; }
    body.chat-focus[data-nav-offset] { padding-top: 0; }

    /* 상단 바 */
    .appbar { display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; gap: 10px; flex: 0 0 auto; }
    .appbar .back { display: inline-flex; align-items: center; gap: 6px;
      font-size: 16px; font-weight: 700; color: var(--text); text-decoration: none;
      min-height: 44px; }
    .appbar .back svg { width: 18px; height: 18px; }
    .badge { display: inline-flex; align-items: center; background: var(--accent-tint);
      color: var(--accent-ink); font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px;
      border: none; font-family: inherit; cursor: pointer; position: relative; color-scheme: light; }
    /* 알약 자체는 22px 이라 터치 하한(44px)에 못 미친다 — 보이는 크기는 두고 누를 자리만 넓힌다.
       appbar 의 back 이 이미 44px 이라 줄 높이는 그대로다. */
    .badge::before { content: ''; position: absolute; inset: -11px -8px; }
    /* ⚠️ display:inline-flex 가 [hidden] 을 이기므로 명시한다(문제 확정 전에는 안 보여야 한다) */
    .badge[hidden] { display: none; }

    /* 진행 단계 */
    .stepbar { display: flex; align-items: center; gap: 6px; padding: 0 16px 12px;
      font-size: 12px; color: var(--text-muted); flex: 0 0 auto; flex-wrap: wrap; }
    .stepbar .on { color: var(--action); font-weight: 700; }
    .stepbar .sep { opacity: .5; }

    /* 대화 영역 (스크롤) */
    .chat { flex: 1 1 auto; overflow-y: auto; padding: 4px 16px 6px;
      display: flex; flex-direction: column; gap: 12px; }
    /* 메시지를 입력칸 쪽(아래)에서부터 쌓는다 — 카톡·아이메시지와 같은 방향.
       ⚠️ 이 한 줄이 없으면 메시지가 위에 붙어 아래로 441px(393×852 실측)가 비고,
          키보드가 열리는 순간 화면에 그 빈 곳만 남아 질문이 안 보인다(2026-08-04 오너 신고).
       ⚠️ `justify-content:flex-end` 로 바꾸지 말 것 — 대화가 길어지면 위쪽 메시지가
          스크롤로 못 닿게 잘리는 브라우저가 있다. margin-top:auto 는 넘치는 순간 0이 된다. */
    .chat > :first-child { margin-top: auto; }
    /* ── 키보드가 올라와 있는 동안(body.kb-open) = 카톡 채팅창 ──────────────────
       키보드가 열리면 쓸 수 있는 높이가 415 뿐이다. 여기 남는 고정 요소는
       **상단 바(56) + 입력 한 줄(66)** 로 끝이고 나머지는 접는다.
       한때 다듬기 CTA·값 안내·도움 버튼이 세로로 쌓여 고정 요소 합이 453 이 되면서
       대화가 17px 로 눌린 적이 있다(2026-08-04 오너 신고 "두 번만 물어봐도 채팅창이 없어진다").
       ⚠️ **안전영역 여백(env(safe-area-inset-bottom) 34px)을 키보드가 열린 동안 넣지 말 것.**
          그 자리는 키보드가 덮고 있어 순전히 버리는 여백이다 — 카톡이 입력줄 아래 14pt 인데
          우리가 66pt 였던 이유의 절반이 이것이었다. */
    body.kb-open { padding-top: 0; }
    body.kb-open #navbar, body.kb-open .iab, body.kb-open .iab-space { display: none; }
    body.kb-open .stepbar { display: none; }
    body.kb-open .composer { padding-top: 6px; padding-bottom: 6px; }
    /* 상단 바는 남기되 얇게 — 되돌아갈 길과 유형은 계속 보여야 한다. 44px 터치는 유지. */
    body.kb-open .appbar { padding-top: 6px; padding-bottom: 6px; }
    .who { display: flex; align-items: center; gap: 6px; font-size: 12px;
      color: var(--accent-ink); font-weight: 700; margin-bottom: 5px; }
    /* 아바타 이니셜 한 글자 — 20px 원 안의 표식이지 읽는 활자가 아니다(12px 하한 예외).
       이름은 바로 옆 .who(12px)가 말한다. 원을 키우지 않는 한 이 값을 올리면 원을 넘친다. */
    .ava { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-ink);
      color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
    .bub { max-width: 84%; font-size: 15px; line-height: 1.55; padding: 11px 13px; border-radius: 16px; }
    .bub b { font-weight: 700; }
    .ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--border-soft);
      border-bottom-left-radius: 6px; color: var(--text); }
    .me { align-self: flex-end; background: var(--action); color: var(--action-ink);
      border-bottom-right-radius: 6px; }
    /* 강조 안내 말풍선 — 시스템(진행·완료) 안내 전용 세 번째 문법(2026-08-06 오너 확정).
       네이비 틴트 + 왼쪽 4px 띠, 'R 연구원' 머리 없음. ⚠️ 질문·대답 말풍선에 쓰지 말 것 —
       자주 나오면 강조가 죽는다. transcript 에도 넣지 않는다(sysBubble 주석 참조). */
    .bub-sys { align-self: flex-start; max-width: 84%; font-size: 15px; line-height: 1.55;
      padding: 11px 13px 11px 15px; border-radius: 16px; border-bottom-left-radius: 6px;
      background: var(--action-tint); border: 1px solid var(--accent-dark);
      border-left: 4px solid var(--action); color: var(--text); }
    .bub-sys b { font-weight: 800; color: var(--accent-ink); }
    /* '다듬고 있습니다' 진행 점 3개 — 순서대로 깜빡인다 */
    .dots3 { display: inline-flex; gap: 3px; margin-left: 4px; vertical-align: baseline; }
    .dots3 i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-ink);
      opacity: .25; animation: blink 1.2s ease-in-out infinite; }
    .dots3 i:nth-child(2) { animation-delay: .2s; }
    .dots3 i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }

    /* 하단 입력부 */
    .composer { flex: 0 0 auto; padding: 8px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--bg); border-top: 1px solid var(--border-soft); }
    /* ── 도구는 '고정 줄'이 아니라 대화 꼬리에 붙는다 ─────────────────────────────
       카톡을 그대로 재면 마지막 말풍선 아래로 입력줄까지 73pt 뿐이다(2026-08-04 실측).
       우리는 205pt 였다 — 입력줄 위에 도구 줄(52)이 한 겹 더 있었고 안전영역 여백(34)이
       키보드에 가려진 자리에 그대로 들어가 있었다. 그래서 도구 줄을 없애고,
       ① 다듬기 CTA 는 **대화 안 마지막 요소**로 넣어 스크롤과 함께 움직이게 하고
       ② '잘 안 떠올라요'는 **입력줄 안 왼쪽 버튼**으로 넣었다(카톡의 + 자리).
       ⚠️ 이 둘을 다시 입력칸 위 고정 줄로 꺼내지 말 것 — 그 순간 대화가 그만큼 줄어든다. */
    .refinewrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
      padding: 0 16px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px;
      font-weight: 700; white-space: nowrap; background: var(--surface); color: var(--accent-ink);
      border: 1.5px solid var(--accent-dark); color-scheme: light; }
    /* ⚠️ 필수 — display:inline-flex 가 UA [hidden] 을 이긴다(.badge[hidden] 과 같은 함정).
       없으면 재료 게이지(#matMeter)가 대화 시작 전에도 **빈 알약**으로 떠 있는다
       (2026-08-06 오너 신고 "대화를 하지도 않았는데 저 원형이 계속 떠 있다"). */
    .chip[hidden] { display: none; }
    /* 다듬기는 이 화면의 다음 단계라 채운 알약(사이트 CTA 규칙) */
    .chip-go { background: var(--action); color: var(--action-ink); border-color: transparent; }
    /* 충전 안내 전용(크레딧 모자랄 때 '충전하기' 링크) — 상시 안내 문구는 2026-08-05 삭제 */
    .chip-note { font-size: 13px; color: var(--text-muted); }
    .chip-note a { color: var(--accent-ink); font-weight: 700; text-decoration: underline; }
    /* 재료 게이지 — 다듬기 칩과 같은 줄(좁으면 줄바꿈). 대화 꼬리라 스크롤과 함께 움직인다 */
    .mmrow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
    .mm-dots { display: inline-flex; gap: 4px; margin-right: 2px; }
    .mm-dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(27,58,107,.18); }
    .mm-dots i.on { background: var(--accent-ink); }
    /* 다 모인 게이지는 네이비 알약 — B안 반전 연출의 끝 상태와 재렌더(복원·다음 턴)가
       같은 모양이어야 한다. action-tint 로 되돌리면 연출 뒤 다음 턴에 색이 빠져 보인다. */
    .mm.mm-full { background: var(--action); color: var(--action-ink); border-color: transparent; }
    .mm.mm-full .mm-dots i.on { background: rgba(255,255,255,.92); }
    /* ── 재료 5/5 첫 순간 연출(B안 게이지 완성 + 강조 말풍선 — 2026-08-06 오너 확정) ──
       ① 점 5개가 하나씩 차오름(0.05~0.65s) → ② 0.95s 알약 네이비 반전 + 링 1회
       → ③ 1.25s 강조 말풍선 → ④ 1.45s 다듬기 칩(이 턴에 처음 켜질 때만).
       재생은 다 모인 첫 순간 한 번뿐(updateMeter 의 _matCheered). */
    @keyframes popIn { 0% { opacity: 0; transform: translateY(10px) scale(.96); }
      60% { opacity: 1; transform: translateY(-2px) scale(1.01); } 100% { opacity: 1; transform: none; } }
    @keyframes dotPop { 0% { transform: scale(.4); background: rgba(27,58,107,.18); }
      60% { transform: scale(1.5); } 100% { transform: scale(1); background: var(--accent-ink); } }
    @keyframes dotWhite { to { background: rgba(255,255,255,.92); } }
    @keyframes mmFlip { to { background: var(--action); color: var(--action-ink); border-color: transparent; } }
    .mm.mm-arrive .mm-dots i { animation: dotPop .35s ease forwards, dotWhite .3s ease .95s forwards; }
    .mm.mm-arrive .mm-dots i:nth-child(1) { animation-delay: .05s, .95s; }
    .mm.mm-arrive .mm-dots i:nth-child(2) { animation-delay: .2s, .95s; }
    .mm.mm-arrive .mm-dots i:nth-child(3) { animation-delay: .35s, .95s; }
    .mm.mm-arrive .mm-dots i:nth-child(4) { animation-delay: .5s, .95s; }
    .mm.mm-arrive .mm-dots i:nth-child(5) { animation-delay: .65s, .95s; }
    .mm.mm-arrive { animation: mmFlip .3s ease .95s forwards, ring 1s ease-out 1.05s 1; }
    .sys-arrive { opacity: 0; animation: popIn .45s cubic-bezier(.2,.9,.3,1.2) 1.25s forwards; }
    .chip-arrive { opacity: 0; animation: popIn .45s cubic-bezier(.2,.9,.3,1.2) 1.45s forwards; }
    @media (prefers-reduced-motion: reduce) {
      .mm.mm-arrive, .mm.mm-arrive .mm-dots i, .sys-arrive, .chip-arrive, .dots3 i {
        animation-duration: .01s !important; animation-delay: 0s !important;
        animation-iteration-count: 1 !important; }
    }
    .mm-detail { font-size: 13px; line-height: 1.5; color: var(--text-muted);
      text-align: center; padding: 0 8px; word-break: keep-all; }
    .mm-detail b { color: var(--accent-ink); }
    /* 전구를 눌렀을 때 뜨는 확인 카드 — **말풍선이 아니다.**
       연구원 말풍선(흰 카드)과 똑같이 생겼더니 그냥 대화로 읽혀 티가 안 났다(오너 지적).
       그래서 ① 폭을 꽉 채우고 ② 바탕을 연한 네이비 틴트로 ③ 'R 연구원' 머리를 뺐다.
       ⚠️ .bub 스타일로 되돌리지 말 것 — 물어보는 화면인지 대화인지 구분이 안 된다. */
    .askcard { align-self: stretch; background: var(--action-tint);
      border: 1.5px solid var(--accent-dark); border-radius: 14px; padding: 13px 14px; }
    .askcard-t { font-size: 15px; line-height: 1.55; font-weight: 700; color: var(--accent-ink);
      word-break: keep-all; }
    .askrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .askrow .chip { font-size: 13px; padding: 0 14px; }
    /* 입력줄 왼쪽 도움 버튼 — 카톡의 + 와 같은 자리·크기. 44px 터치 유지 */
    .helpic { width: 44px; height: 44px; flex-shrink: 0; border: 0; background: transparent;
      color: var(--accent-ink); display: flex; align-items: center; justify-content: center;
      cursor: pointer; border-radius: 50%; color-scheme: light; }
    .helpic svg { width: 22px; height: 22px; }
    @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(27,58,107,.45); }
      70% { box-shadow: 0 0 0 11px rgba(27,58,107,0); } 100% { box-shadow: 0 0 0 0 rgba(27,58,107,0); } }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .helpic.nudge { animation: ring 1s ease-out 3, pop 1s ease-in-out 3; }
    @media (prefers-reduced-motion: reduce) { .helpic.nudge { animation: none; } }

    /* 위아래 여백 4 — 카톡 입력줄과 같은 두께(버튼 44 + 8 + 테두리 2 = 54).
       ⚠️ 8px 로 되돌리면 대화가 8px 줄어든다. 버튼 44px 은 터치 하한이라 유지. */
    .field { display: flex; align-items: center; gap: 4px; background: var(--bg2);
      border: 1px solid var(--border-soft); border-radius: 18px; padding: 4px 4px 4px 6px;
      color-scheme: light; }
    /* ⚠️ font-size 16px 아래로 내리지 말 것 — 아이폰은 15px 이하 입력칸을 누르면
       화면을 **자동으로 확대**한다(2026-08-04 오너 신고 "누르면 확대되면서 오른쪽이 잘린다").
       사이트 공통 규칙(입력칸 16px+)이 이것 때문에 있다. #finalTa 도 이 규칙을 물려받는다. */
    .field textarea { flex: 1; border: none; outline: none; background: var(--bg2); color: var(--text);
      resize: none; overflow: hidden; font-family: inherit; font-size: 16px; line-height: 1.5;
      min-height: 26px; max-height: 132px; padding: 3px 0; color-scheme: light; }
    .field textarea::placeholder { color: var(--text-dim); }
    .snd { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s, color .15s, transform .1s; color-scheme: light; }
    .snd svg { width: 20px; height: 20px; }
    .snd.on { background: var(--action); color: var(--action-ink); border-color: transparent; }
    .snd:active { transform: scale(.94); }
    /* ⚠️ 다듬기 값(무료 남은 횟수·크레딧)은 칩 글자 안에 같이 싣는다 — 누르는 자리에
       값이 붙어 있어야 한다(결정 화면에 값·버튼·근거). 값을 떼서 다른 줄로 빼지 말 것. */
    #refineCta b { font-weight: 800; }
    #refineNote a { color: var(--accent-ink); font-weight: 700; text-decoration: underline; }
    /* ── 단계 번호 배지(2026-08-19 오너 "뭘 눌러야 할지 모르겠다 — 번호로 순서를") ──
       스텝바(1 되묻기 › 2 다듬기 › 3 최종 작성)의 번호를 다음 행동에 그대로 붙인다.
       ⚠️ 번호는 다듬기(②)와 최종 작성(③)에만 — '소재 창고에 담기'는 순서가 아니라
       선택지라 번호를 주지 않는다(①② 로 나열하면 둘 다 눌러야 하는 걸로 읽힌다). */
    .stepno { display: inline-flex; width: 19px; height: 19px; border-radius: 50%;
      align-items: center; justify-content: center; background: rgba(255,255,255,.25);
      font-size: 12px; font-weight: 800; font-style: normal; flex-shrink: 0; }
    /* 재료 5/5 첫 순간 두 번만 콕콕 — 상시 깜빡임 금지(nav bfPulse 를 지운 이유와 같다) */
    @keyframes stepPop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.45); } }
    .stepno-pop { animation: stepPop .7s ease-in-out .5s 2; }
    @media (prefers-reduced-motion: reduce) { .stepno-pop { animation: none; } }
    #writeMode .wlabel { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    /* 96px(약 4줄) — 120px 은 대화(뼈대) 영역을 지나치게 눌렀다(2026-08-19 오너
       "쓰는 창이 너무 커서 답변 볼 화면이 작다"). 더 길게 쓰는 학생은 아래 손잡이로 늘린다. */
    #finalTa { min-height: 96px; max-height: none; overflow: auto; resize: vertical; }
    #saveBtn { display: block; width: 100%; margin-top: 10px; background: var(--action);
      color: var(--action-ink); border: none; border-radius: 14px; padding: 14px; font-size: 15px;
      font-weight: 700; cursor: pointer; min-height: 48px; color-scheme: light; }
    #saveBtn:disabled { opacity: .7; cursor: default; }
    /* 저장이 끝나면 '다시 저장'은 한 단계 물러난다 — 아래 '다음 문제' 버튼이 주 행동이 된다
       (같은 급 버튼 두 개를 쌓으면 어디를 눌러야 할지 알 수 없다). */
    #saveBtn.is-saved { background: var(--surface); color: var(--accent-ink);
      border: 1.5px solid var(--border); padding: 12.5px 14px; }
    #saveFoot { text-align: center; margin-top: 8px; font-size: 12px; color: var(--text-muted); min-height: 16px; }
    /* ── 저장 완료 → 다음 문제 잇기(2026-08-19 사용자 피드백 "저장한 뒤 두 번째 문제가
       연결되지 않는다 / 초급편을 한번에 쭉 풀고 싶다"). 저장을 막다른 길로 두지 않는다. ── */
    #nextStep { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-soft); }
    .ns-prog { font-size: 13px; font-weight: 700; }
    .ns-next { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.5;
      word-break: keep-all; }
    /* 저장 뒤 1순위는 첨삭 직행(2026-08-19 오너 "직행 버튼") — 채운 알약은 이 하나뿐.
       '다음 문제'는 흰 버튼으로 한 단계 물러난다(같은 급 버튼 두 개를 쌓지 않는다). */
    .ns-polish { display: block; width: 100%; margin-top: 10px; background: var(--action);
      color: var(--action-ink); border-radius: 14px; padding: 14px; font-size: 15px;
      font-weight: 700; text-align: center; text-decoration: none; min-height: 48px; }
    .ns-polish[hidden] { display: none; }  /* display:block 이 [hidden] 을 이긴다 — .badge 와 같은 함정 */
    .ns-go { display: block; width: 100%; margin-top: 8px; background: var(--surface);
      color: var(--accent-ink); border: 1.5px solid var(--border); border-radius: 14px;
      padding: 12.5px 14px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
      min-height: 48px; color-scheme: light; }
    .ns-go[hidden] { display: none; }
    /* 창고 담기는 세 번째 순위라 글줄 버튼 — 알약을 셋 쌓으면 어디를 눌러야 할지 모른다 */
    .ns-wh { display: block; width: 100%; margin-top: 4px; background: none; border: none;
      font: inherit; font-size: 13px; font-weight: 700; color: var(--accent-ink);
      text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
      min-height: 44px; color-scheme: light; }
    .ns-wh[hidden] { display: none; }
    .ns-wh:disabled { opacity: .6; cursor: default; }

    /* ── v2: 소재 카드 + 뼈대 렌더 ── */
    .mcard { border: 1.5px solid var(--accent-dark); border-radius: 12px; padding: 12px 13px;
      margin-bottom: 12px; background: var(--accent-tint); }
    .mcard-h { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--accent-ink); }
    .mcard-t { font-size: 15px; font-weight: 800; margin-top: 4px; }
    .mcard-one { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
    .mcard-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .mcard-tag { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
      background: var(--surface); color: var(--accent-ink); border: 1px solid var(--border-soft); }
    .mcard-re { font-size: 14px; line-height: 1.55; margin-top: 8px; }
    .mcard-link { display: inline-block; margin-top: 9px; font-size: 13px; font-weight: 800;
      color: var(--accent-ink); }
    .sk-h { font-size: 14px; font-weight: 800; margin: 4px 0 8px; }
    .sk-step { margin-bottom: 9px; font-size: 15px; line-height: 1.55; }
    .sk-step b { display: block; margin-bottom: 2px; }
    .sk-str { margin-top: 11px; font-size: 14px; line-height: 1.55; padding-top: 9px;
      border-top: 1px dashed var(--border-soft); }
    .sk-close { margin-top: 8px; font-size: 14px; color: var(--text-muted); }
    /* 첨삭과 같은 규칙 — (괄호 빈칸)은 학생이 제 사실로 채울 자리 */
    .blank { background: var(--action-tint); border-radius: 4px; padding: 0 2px; font-weight: 700; }

    /* ── 진입 화면: 난이도 고르기 (2026-08-05) ──────────────────────────────
       들어오면 대화가 아니라 이 화면이 먼저다. 문제 풀 전체가 한 줄로 순환하던 때는
       학생이 자기 수준을 고를 수 없었다(오너 지적 "기초 문제만 계속 나온다").
       ⚠️ 대화(.chat)·입력부(.composer)와 **같은 자리를 쓰는 화면**이라 셋이 동시에
          뜨지 않는다(body.picking 이 가른다). 키보드가 없는 화면이라 kb-open 과 무관. */
    body.picking .chat, body.picking .composer, body.picking .stepbar { display: none; }
    .pickview { display: none; flex: 1 1 auto; overflow-y: auto;
      padding: 4px 16px calc(24px + env(safe-area-inset-bottom)); }
    body.picking .pickview { display: block; }
    /* 부트 전에는 어느 화면도 안 보여준다(2026-08-05 오너 신고 — "들어갈 때 채팅창이
       깜빡인다"). 기본 마크업이 채팅 UI 라, 로그인 확인·문제 조회가 끝나 난이도 화면으로
       갈리기 전까지 빈 채팅창이 먼저 비쳤다. booting 은 갈림길(난이도 화면 켜기 또는
       대화 시작)에서 뗀다. ⚠️ picking 규칙보다 뒤에 있어야 booting 이 이긴다. */
    body.booting .chat, body.booting .composer, body.booting .stepbar,
    body.booting .pickview { display: none; }
    .pv-h { font-size: 17px; font-weight: 800; line-height: 1.5; word-break: keep-all; margin-bottom: 4px; }
    .pv-sub { font-size: 13px; color: var(--text-muted); line-height: 1.55; word-break: keep-all; }
    /* 네 난이도를 한 줄에 — 순서(초급→심화)가 한눈에 보여야 고르는 기준이 선다.
       375px 에서 칸 하나가 79px 이라 라벨 2글자 + 문제 수가 들어간다. */
    .pv-levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 12px; }
    .pv-lv { min-height: 60px; padding: 8px 4px; border-radius: 14px; cursor: pointer;
      background: var(--surface); border: 1.5px solid var(--border); color: var(--text);
      font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; color-scheme: light; }
    .pv-lv-t { font-size: 15px; font-weight: 800; }
    .pv-lv-n { font-size: 12px; color: var(--text-muted); }
    .pv-lv[aria-pressed="true"] { background: var(--action); border-color: transparent; color: var(--action-ink); }
    .pv-lv[aria-pressed="true"] .pv-lv-n { color: var(--action-ink); opacity: .85; }
    .pv-desc { font-size: 13px; color: var(--text-muted); line-height: 1.55; word-break: keep-all;
      margin-bottom: 12px; }
    .pv-card { border: 1.5px solid var(--accent-dark); border-radius: 14px; padding: 14px;
      background: var(--surface); }
    .pv-cap { font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--accent-ink); }
    .pv-q { font-size: 16px; font-weight: 700; line-height: 1.55; margin-top: 6px; word-break: keep-all; }
    /* 예시 한 줄(2026-08-19) — 추상적인 문제가 어렵다는 피드백. questions.hint 가 있을 때만 */
    .pv-hint { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; line-height: 1.5;
      word-break: keep-all; }
    .pv-meta { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
    .pv-go { display: block; width: 100%; margin-top: 12px; min-height: 48px; padding: 14px;
      background: var(--action); color: var(--action-ink); border: none; border-radius: 14px;
      font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; color-scheme: light; }
    .pv-empty { font-size: 14px; color: var(--text-muted); line-height: 1.6; word-break: keep-all; }
    /* '다른 문제 보기' — 기본은 접혀 있고, 펼치면 그 난이도 문제가 전부 나온다 */
    .pv-more { margin-top: 16px; border-top: 1px solid var(--border-soft); }
    .pv-more > summary { list-style: none; cursor: pointer; min-height: 44px; display: flex;
      align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--accent-ink); }
    .pv-more > summary::-webkit-details-marker { display: none; }
    .pv-more > summary::after { content: '▾'; font-size: 12px; }
    .pv-more[open] > summary::after { content: '▴'; }
    .pv-item { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      width: 100%; text-align: left; min-height: 52px; padding: 10px 12px; margin-bottom: 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      font: inherit; cursor: pointer; color: var(--text); color-scheme: light; }
    .pv-item-t { font-size: 14px; line-height: 1.5; word-break: keep-all; }
    .pv-item-s { font-size: 12px; font-weight: 800; color: var(--accent-ink); white-space: nowrap; }
    .pv-item.is-today { border-color: var(--accent-dark); border-width: 1.5px; }
  </style>
</head>
<body data-nav-offset class="booting">
  <!-- 페이지 제목 h1 (2026-08-02 D-2) — 이 화면의 시각 제목은 이미지·장식 요소라
       태그를 h1 으로 바꾸면 조판이 깨진다. 낭독기·검색엔진용으로만 둔다.
       ⚠️ 지우지 말 것: h1 이 없으면 낭독기 사용자가 "여기가 어디인지"를 못 듣는다. -->
  <h1 class="sr-only">답변 소재 발굴</h1>
  <div class="appbar">
    <a class="back" href="mypage.html">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      소재 발굴
    </a>
    <!-- 지금 푸는 문제의 난이도·유형. 누르면 난이도 고르는 화면으로 돌아간다
         (대화는 서버에 저장돼 있어 같은 문제로 다시 들어오면 그대로 이어진다). -->
    <button class="badge" id="catBadge" type="button" hidden aria-label="난이도·문제 바꾸기"></button>
  </div>

  <main id="main" tabindex="-1" class="mainflow">
  <!-- 진입 화면 — 난이도를 먼저 고른다(2026-08-05). ?q=<문제id> 로 들어오면 건너뛴다. -->
  <div class="pickview" id="pickView">
    <div class="pv-h">오늘은 어떤 난이도로 해볼까요?</div>
    <div class="pv-sub">고른 난이도에서 오늘의 문제가 나옵니다. 난이도는 언제든 바꿀 수 있어요.</div>
    <div class="pv-levels" id="pvLevels"></div>
    <div class="pv-desc" id="pvDesc"></div>
    <div id="pvToday"></div>
    <details class="pv-more" id="pvMore" hidden>
      <summary>다른 문제 보기</summary>
      <div id="pvList"></div>
    </details>
  </div>

  <div class="stepbar">
    <span class="on" id="step1">1 되묻기</span><span class="sep">›</span>
    <span id="step2">2 다듬기</span><span class="sep">›</span>
    <span id="step3">3 최종 작성</span>
  </div>

  <div class="chat" id="chat">
    <!-- 다듬기 CTA 는 대화의 꼬리다 — 고정 줄이 아니라 마지막 말풍선 다음에 붙어
         스크롤과 함께 움직인다. JS 가 메시지를 추가할 때마다 맨 끝으로 다시 옮긴다. -->
    <div class="refinewrap" id="refineWrap">
      <div class="mmrow">
        <!-- 재료 게이지 — 서버가 매 턴 실측한 재료 체크리스트. 서버 응답이 없으면 안 뜬다 -->
        <button class="chip mm" id="matMeter" type="button" hidden></button>
        <button class="chip chip-go" id="refineCta" type="button" style="display:none;">다듬기</button>
        <!-- ⚠️ '소재 창고에 담기'를 여기(대화 꼬리)에 되살리지 말 것(2026-08-19 오너).
             대화 도중 화면을 떠나는 문이라 마무리 전 이탈·대화 유실 사고가 났다 —

      </div>
      <div class="mm-detail" id="mmDetail" hidden></div>
      <!-- 충전 안내 전용 — '되묻기 대화는 무료예요' 상시 문구는 2026-08-05 오너 지시로 삭제 -->
      <span class="chip-note" id="refineNote" style="display:none;"></span>

          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
        </button>
        <textarea id="ta" rows="1" placeholder="떠오르는 대로 편하게 적어보세요"></textarea>
        <button class="snd" id="snd" aria-label="전송">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <!-- ⚠️ 입력줄 아래에 아무것도 두지 않는다(2026-08-04 오너 지시 — 카톡처럼 여백만).
           'Enter 전송 · Shift+Enter 줄바꿈' 안내는 폰에서 누를 수 없는 조작이라 삭제했고,
           미니 다듬기 티저(quickfix)도 이 화면에서는 뺐다. 다시 달지 말 것. -->
    </div>
    <!-- 최종작성 모드 -->
    <div id="writeMode" style="display:none;">
      <div class="wlabel">③ 최종 답변 — 뼈대를 보고 내 말로 완성하세요. <b>자동 저장돼요.</b></div>
      <!-- maxlength 1500 — 답변노트 자유 글 폴백(writeAnswer)의 DB CHECK 상한이자
           첨삭·킬러 입력 상한과 같은 값. 없으면 폴백 저장만 조용히 죽는다(2026-08-22 감사). -->
      <div class="field"><textarea id="finalTa" rows="4" maxlength="1500" placeholder="내 말로 최종 답변을 작성하세요"></textarea></div>
      <button id="saveBtn">답변집에 저장(완료)</button>
      <div id="saveFoot" aria-live="polite"></div>
      <!-- 저장 완료 뒤에만 보인다 — 첨삭 직행(1순위) + 진행·다음 문제 잇기.
           2026-08-19 오너: "저장하고 바로 첨삭으로 넘어가는 직행 버튼". -->
      <div id="nextStep" hidden>
        <div class="ns-prog" id="nsProg"></div>
        <div class="ns-next" id="nsNext"></div>
        <a class="ns-polish" id="nsPolish" hidden>이 답변 첨삭받기 →</a>
        <button class="ns-go" id="nsGo" type="button" hidden></button>
        <!-- 대화 → 소재 창고 옮기기. 저장 완료 뒤에만 연다(2026-08-19 오너 "다 완성하기
             전까지는 넣으면 안 되는 것 아니냐") — 대화 도중 여길 눌러 화면을 떠나면서
             마무리가 끊기고 대화가 사라지는 사고가 났다. 되묻기 2번 미만이면 숨김. -->
        <button class="ns-wh" id="toWhCta" type="button" hidden>이 대화를 소재 창고에도 담기 →</button>
      </div>
    </div>
  </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="sojae-common.js?v=2"></script>
  <script>
    // ── 문제 유형 코드 → 라벨 (questions.category 와 매칭) ──
    const CAT_LABEL = window.SOJAE.CAT_LABEL;   // 공용(sojae-common.js)

    // ── 계측(page_events) — index.html moncTrack 과 같은 관습. 실패는 조용히 무시.
    //    되묻기 턴 수·다듬기 전환율·저장률을 실측한다(스펙 확정 9 — 2단계 판단 근거).
    function moncTrack(event, meta) {
      if (!window.MONC || !window.MONC.sb) return;
      try {
        window.MONC.sb.from('page_events')
          .insert({ event: event, path: '/sojae', meta: meta || {} })
          .then(function () {}, function () {});
      } catch (_) {}
    }
    let category = 'experience';     // 오늘의 문제에서 확정
    let currentQuestion = null;      // 저장 단계에서 쓸 오늘의 문제 행
    const FALLBACK_QUESTION = '예상치 못한 문제를 침착하게 해결했던 경험';  // DB 조회 실패 시 표시·AI 전달용

    // ── 이어쓰기(서버 단일 원천) ──
    //    대화·뼈대 → discovery_sessions/discovery_messages, 답변 초안 → answers(status=draft).
    //    되묻기 시작부터 자동 저장. 나갔다/날 바뀌어도 마이페이지에서 ?q=id 로 다시 열어 이어쓰기.
    let _srvSession = null;    // discovery_sessions.id
    let _srvSynced = 0;        // 서버에 이미 저장된 메시지 수 → 재방문해도 중복 삽입 방지
    let _answerStatus = null;  // null | 'draft' | 'final' — 초안 저장이 완료본을 덮어쓰지 않게
    let _answerId = null;      // 이 화면이 저장한 answers 행 id — 첨삭 직행(polish?answer=)에 쓴다
    let _freeId = null;        // 자유 글 폴백으로 만든 answers 행 id(문제 행이 없을 때만)
    let _restoring = false;    // 복원 렌더 중엔 저장/서버동기 건너뜀

    // ── 되묻기 질문(가짜) — 유형별로 결이 다름. 실제로는 Haiku Edge Function이 생성 ──
    const FOLLOWUPS = {
      experience: [
        '그 상황이 구체적으로 어떤 자리였어요? 언제·어디서 있었던 일인지부터요.',
        '그 순간 가장 먼저 든 생각은 뭐였나요?',
        '그때 어떻게 행동했는지, 몸이 먼저 어떻게 움직였는지 떠올려볼까요?',
        '그 일이 끝나고 스스로 어떤 점이 남았어요?',
        '그 경험이 승무원 일과 어떻게 연결될 수 있을까요?'
      ],
      values: [
        '그렇게 생각하게 된 결정적인 계기가 있었나요?',
        '그 가치를 지키려다 손해를 감수했던 순간이 있어요?',
        '반대되는 상황에 놓였을 때 어떻게 판단했나요?'
      ],
      judgment: [
        '그 상황에서 가장 먼저 고려한 기준은 뭐였나요?',
        '가능한 선택지가 여러 개였을 텐데, 왜 그 방법이었어요?',
        '승객·동료 입장에서 다시 본다면 어떤 점을 챙기겠어요?'
      ],
      company: [
        '그 항공사에서 가장 인상 깊었던 서비스나 방향은 뭐였나요?',
        '그 점이 왜 지원자님에게 특별하게 다가왔어요?',
        '본인의 어떤 강점이 거기에 맞닿아 있다고 생각해요?'
      ],
      personal: [
        '그걸 좋아하게 된 계기가 있었나요?',
        '그게 지원자님의 어떤 면을 보여준다고 생각해요?',
        '가장 최근에 그걸로 기억에 남는 순간이 있었어요?'
      ]
    };
    const HELP_REPLY = '좋아요, 같이 찾아봐요. 거창한 사건이 아니어도 돼요 — <b>예상과 달랐던 \'작은 순간\'</b> 하나부터 떠올려볼까요? 그때 몸이 먼저 어떻게 움직였나요?';

    // ── AI 호출: Edge Function 'sojae-chat' (되묻기=Haiku 4.5, 다듬기=Sonnet 5) ──
    // 함수 코드: supabase/functions/sojae-chat/index.ts (오너가 콘솔 배포 + ANTHROPIC_API_KEY 시크릿)
    // 미배포·비로그인 등 실패 시 canned 응답으로 폴백 → 화면은 항상 동작.
    let _step = 0;
    function cannedAsk(help) {
      const list = FOLLOWUPS[category] || FOLLOWUPS.experience;
      if (help) return HELP_REPLY;
      const t = list[_step % list.length]; _step++; return t;
    }
    async function askAI(help) {
      try {
        const { data, error } = await MONC.sb.functions.invoke('sojae-chat', {
          body: { stage: 'ask', question_id: currentQuestion && currentQuestion.id,
                  question_text: (currentQuestion && currentQuestion.content) || FALLBACK_QUESTION,
                  category, help: !!help, history: transcript },
        });
        if (error || !data || !data.message) throw error || new Error('빈 응답');
        // AI가 "재료가 충분히 모였어요"([멈춤] 신호)라고 판단하면 다듬기 버튼 노출.
        // 칩이 이 턴에 처음 켜지는지를 updateMeter 가 알아야 등장 연출을 붙일지 정한다.
        const ctaWasHidden = document.getElementById('refineCta').style.display === 'none';
        if (data.materials_sufficient) showRefine();
        updateMeter(data, ctaWasHidden);             // 재료 게이지 갱신(missing 실측 기반)
        return esc(data.message).replace(/\n/g, '<br>');
      } catch (_) { return cannedAsk(help); }
    }
    // 반환 {v2:{card,skeleton,card_saved}} 또는 {html} 또는 {err, msg}.
    // ⚠️ 신구 판정은 프로브가 아니라 응답 형태로 한다 — 구함수는 message 만 주고(기존 렌더),
    //    신함수는 card/skeleton 을 준다. 차감 로직이 신구 동일이라 과금 위험이 없는 자리다.
    async function refineAI() {
      try {
        const { data, error } = await MONC.sb.functions.invoke('sojae-chat', {
          body: { stage: 'refine', question_id: currentQuestion && currentQuestion.id,
                  question_text: (currentQuestion && currentQuestion.content) || FALLBACK_QUESTION,
                  category, materials: collectedMaterials() },
        });
        if (error) throw error;
        // ⚠️ 크레딧 부족·실패는 서버가 200 + code 로 알려준다. 이걸 다른 오류와 함께
        //    폴백(뼈대)으로 삼키면 "왜 안 깎였는데 결과가 나오지"가 되고, 사용자는
        //    충전해야 한다는 사실을 영영 모른다. code 가 있으면 반드시 그대로 띄운다.
        if (data && data.code) return { err: data.code, msg: data.error };
        if (!data || !data.message) throw new Error('빈 응답');
        if (_wallet && data.balance != null) {          // 차감 결과로 남은 양 갱신
          _wallet.balance = data.balance;
          _wallet.daily_left = data.daily_left;
        }
        if (data.card && data.skeleton) return { v2: data };
        return { html: esc(data.message).replace(/\n/g, '<br>') };
      } catch (_) { return { html: refineSkeleton() }; }
    }

    // (괄호 빈칸) 칠하기 — polish.html 과 같은 규칙. esc 를 거친 문자열에만 쓴다.
    function markBlanks(escaped) {
      return escaped.replace(/\(([^()<>]{1,24})\)/g, '<span class="blank">($1)</span>');
    }

    // v2 결과 렌더 — 소재 카드 + 답변 뼈대. 카드의 장면·행동 전문은 서랍(answers.html)이 보여준다.
    function refineHtmlV2(d) {
      const c = d.card, s = d.skeleton;
      const comps = (c.competencies || []).map(x => '<span class="mcard-tag">' + esc(x) + '</span>').join('');
      const steps = (s.steps || []).map((st, i) =>
        '<div class="sk-step"><b>' + (i + 1) + '. ' + esc(st.what) + '</b>'
        + markBlanks(esc(st.fill)) + '</div>').join('');
      return '<div class="mcard"><div class="mcard-h">소재 카드</div>'
        + '<div class="mcard-t">' + esc(c.title) + '</div>'
        + '<div class="mcard-one">' + esc(c.one_line) + '</div>'
        + (comps ? '<div class="mcard-tags">' + comps + '</div>' : '')
        + '<div class="mcard-re">' + markBlanks(esc(c.reinterpretation)) + '</div>'
        + (d.card_saved
            ? '<a class="mcard-link" href="answers.html#materials">소재 모음에 저장됨 · 모음 보기 →</a>'
            : '')
        + '</div>'
        + '<div class="sk-h">답변 뼈대 — 이 순서로 말해보세요</div>' + steps
        + '<div class="sk-str"><b>강점 포인트</b> · ' + markBlanks(esc(s.strengths)) + '</div>'
        + '<p class="sk-close">' + esc(s.closing) + '</p>';
    }

    // ── 크레딧: 다듬기에만 값이 붙는다 (되묻기 대화는 무료) ────────────────
    // ⚠️ 서버(supabase/functions/sojae-chat/index.ts)도 같은 규칙으로 차감한다.
    //    "한 문제당 얼마" 같은 세션 요금으로 되돌리지 말 것 — 다듬기를 몇 번 눌러도
    //    같은 값이라 하루 무료 한도가 원가 상한 노릇을 못 한다(2026-07-27 확정).
    let _wallet = null;
    async function loadWallet() {
      try {
        const { data } = await MONC.sb.rpc('credit_wallet');
        _wallet = data || null;
      } catch (_) { _wallet = null; }   // 마이그레이션 미적용 → 안내만 생략, 대화는 정상
      return _wallet;
    }
    function refineCost() {
      return Number(_wallet && _wallet.costs && _wallet.costs.sojae) || 2;
    }
    /* 다듬기 칩을 켠다. 값(무료 남은 횟수·크레딧)은 **칩 글자 안에** 싣는다 —
       예전엔 전폭 버튼 + 그 아래 안내 줄로 두 덩어리였는데, 세로로 쌓이면서
       키보드가 열릴 때 대화를 다 잡아먹었다(2026-08-04). 값을 다시 딴 줄로 빼지 말 것.
       #refineNote 는 충전 안내 전용이다('되묻기 무료' 상시 문구는 2026-08-05 오너 지시로 삭제). */
    function showRefine() {
      const cta = document.getElementById('refineCta');
      const note = document.getElementById('refineNote');
      // 등장 연출 클래스는 한 번 쓰고 뗀다 — 단 채로 display 가 토글되면(다듬기 실패
      // 복귀·다음 턴) popIn 이 다시 재생돼 칩이 1.45초 사라진다.
      cta.classList.remove('chip-arrive');
      const cost = refineCost();
      const bal = Number(_wallet && _wallet.balance) || 0;
      const freeLeft = Math.floor((Number(_wallet && _wallet.daily_left) || 0) / cost);
      // ⚠️ 무료는 '크레딧'이 아니라 '횟수'로 말한다 — 두 단위를 섞으면
      //    "3크레딧 남았는데 왜 안 되지"가 된다(AI킬러와 같은 규칙).
      // 앞의 ② 는 스텝바 '2 다듬기'의 번호 — 다음 누를 것을 가르친다(2026-08-19).
      const no2 = '<i class="stepno" aria-hidden="true">2</i>';
      cta.innerHTML = _wallet === null
        ? no2 + '다듬기 →'
        : (freeLeft > 0
            ? no2 + '다듬기 · 오늘 <b>' + freeLeft + '번</b> 무료'
            : (bal >= cost
                ? no2 + '다듬기 · <b>' + cost + '크레딧</b>'
                : no2 + '다듬기 · 충전 필요'));
      document.getElementById('refineWrap').style.display = '';
      cta.style.display = 'inline-flex';
      // ('소재 창고에 담기'는 저장 완료 패널로 이사 — 2026-08-19. 여기서 켜지 말 것)
      // 크레딧이 모자랄 때만 충전 길을 아래에 남긴다(그 외엔 값이 칩에 다 들어가 있다)
      if (_wallet !== null && freeLeft <= 0 && bal < cost) {
        // AI킬러 준비중(2026-08-11) 동안 충전은 마이페이지 지갑으로 — 다시 열면 ai-killer.html 로 되돌린다
        note.innerHTML = '<a href="mypage.html">충전하기</a>';
        note.style.display = '';
      } else {
        note.style.display = 'none';
      }
    }
    // 되묻기가 끝났으면(다듬기로 넘어감) 대화 꼬리의 도구도 같이 걷는다 — 최종 작성 화면에
    // 게이지·다듬기 칩이 남아 있으면 지나간 단계의 말이 대화에 섞인다.
    function hideRefine() {
      document.getElementById('refineWrap').style.display = 'none';
    }

    /* ── 재료 게이지 ──────────────────────────────────────────────────────────
       "질문이 끝도없이 나온다. 경험 추출만 하다가 지칠 것 같다"(2026-08-05 오너)의 답.
       서버가 매 턴 실측해 보내는 재료 체크리스트(missing)를 그대로 보여준다 —
       학생이 '언제 끝나는지'를 볼 수 있게. 지어낸 퍼센트 금지: 서버 판정이 없으면
       (canned 폴백·구버전 함수) 게이지를 아예 안 띄운다. */
    const MAT_KEYS = ['scene', 'action', 'judgment', 'result', 'feeling'];
    const MAT_LABEL = { scene: '장면', action: '행동', judgment: '판단', result: '결과', feeling: '감정' };
    let _mat = null;          // 마지막 서버 판정 { ok, missing[] }
    let _matCheered = false;  // '다 모였어요' 안내 자동 펼침은 한 번만
    const matMeter = document.getElementById('matMeter');
    const mmDetail = document.getElementById('mmDetail');
    function matDetailHtml() {
      if (_mat.ok) return '재료가 다 모였어요 — 이 정도면 <b>30초 분량 답변</b>을 만들 수 있어요. 다듬기로 뼈대를 잡아보세요.';
      const got = MAT_KEYS.filter(k => !_mat.missing.includes(k)).map(k => MAT_LABEL[k]);
      const miss = _mat.missing.map(k => MAT_LABEL[k]);
      return (got.length ? '<b>모인 재료</b> ' + got.join('·') : '이야기를 시작하면 재료가 쌓여요')
        + (miss.length ? ' &nbsp;·&nbsp; <b>남은 재료</b> ' + miss.join('·') : '');
    }
    function updateMeter(d, ctaWasHidden) {
      if (!d || !Array.isArray(d.missing)) return;   // 구버전 함수 — 게이지 없이 기존 흐름
      _mat = { ok: !!d.materials_sufficient, missing: d.missing.filter(k => MAT_KEYS.includes(k)) };
      const got = _mat.ok ? 5 : Math.max(0, MAT_KEYS.length - _mat.missing.length);
      /* 다 모인 첫 순간만 연출(B안 — 2026-08-06 오너 확정): 점을 비운 채 그리고
         mm-arrive 애니메이션이 차오르게 한다. 이후 턴·복원은 연출 없이 끝 상태로만. */
      const firstFull = _mat.ok && !_matCheered;
      matMeter.classList.remove('mm-arrive');
      matMeter.innerHTML = '<span class="mm-dots" aria-hidden="true">'
        + MAT_KEYS.map((_, i) => '<i' + (i < got && !firstFull ? ' class="on"' : '') + '></i>').join('')
        + '</span>재료 <b>' + got + '/5</b>';
      matMeter.setAttribute('aria-label', '답변 재료 ' + got + '/5 — 눌러서 자세히 보기');
      matMeter.classList.toggle('mm-full', _mat.ok && !firstFull);
      matMeter.hidden = false;
      if (firstFull) {
        _matCheered = true;
        matMeter.classList.add('mm-arrive');
        // 안내는 게이지 아래 펼침(mm-detail)이 아니라 강조 말풍선으로(E안 문법 채택).
        sysBubble('재료가 <b>5개 다 모였어요.</b> 이 정도면 30초 분량 답변을 만들 수 있어요 — 다듬기로 뼈대를 잡아보세요.', 'sys-arrive');
        // 다듬기 칩은 이 턴에 처음 켜졌을 때만 ④ 등장 연출 — 이전 턴부터 떠 있던 칩을
        // 사라졌다 다시 띄우면 "버튼이 없어졌다"가 된다.
        if (ctaWasHidden) document.getElementById('refineCta').classList.add('chip-arrive');
        // ② 배지를 두 번 콕콕 — '다음 누를 것'을 이 순간에만 가르친다(상시 반복 금지)
        const sn = document.querySelector('#refineCta .stepno');
        if (sn) sn.classList.add('stepno-pop');
        // 연출이 끝나면 끝 상태로 굳힌다 — ① mm-arrive 를 단 채로 display 가 토글되면
        // (다듬기 실패 복귀 등) 애니메이션이 처음부터 다시 튀고 ② sys-arrive·chip-arrive 는
        // opacity:0 에서 시작하므로 애니메이션이 끝까지 못 돌면(탭이 백그라운드로 가는 등)
        // 말풍선·칩이 안 보인 채 남는다. 클래스를 떼면 어느 경우든 끝 상태가 보장된다.
        setTimeout(() => {
          matMeter.classList.remove('mm-arrive');
          if (_mat && _mat.ok) {
            matMeter.classList.add('mm-full');
            matMeter.querySelectorAll('.mm-dots i').forEach(el => el.classList.add('on'));
          }
          document.querySelectorAll('.sys-arrive').forEach(el => el.classList.remove('sys-arrive'));
          document.getElementById('refineCta').classList.remove('chip-arrive');
          const sn2 = document.querySelector('#refineCta .stepno');
          if (sn2) sn2.classList.remove('stepno-pop');
        }, 2100);                                    // 마지막 연출(칩 1.45+0.45s·링 2.05s) 뒤
      }
      if (!mmDetail.hidden) mmDetail.innerHTML = matDetailHtml();   // 펼쳐 둔 상태면 내용만 갱신
    }
    matMeter.addEventListener('click', () => {
      if (!_mat) return;
      if (mmDetail.hidden) { mmDetail.innerHTML = matDetailHtml(); mmDetail.hidden = false; }
      else mmDetail.hidden = true;
    });

    // ── 렌더 헬퍼 ──
    const chat = document.getElementById('chat');
    const refineWrap = document.getElementById('refineWrap');
    // 다듬기 CTA 는 늘 대화의 맨 끝에 선다 — 메시지를 붙일 때마다 뒤로 다시 옮긴다.
    // (고정 줄로 빼지 말 것: 그만큼 대화 높이가 줄어든다 — 위 .refinewrap 주석)
    function tailTools(){ chat.appendChild(refineWrap); }
    function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    function bubble(cls, html){
      const d = document.createElement('div');
      d.className = 'bub ' + cls; d.innerHTML = html;
      chat.appendChild(d); tailTools(); chat.scrollTop = chat.scrollHeight;
    }
    // 되묻기 대화 로그 — 다듬기 프롬프트의 {collected_materials} 재료 (docs/prompts/sojae-refine.md)
    // TODO(save): 로그인 붙이면 discovery_messages 에도 저장.
    const transcript = [];
    function ai(html){
      bubble('ai', '<div class="who"><span class="ava">R</span>연구원</div>' + html);
      transcript.push({ role: 'researcher', content: html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() });
    }
    function me(text){
      bubble('me', esc(text));
      transcript.push({ role: 'user', content: text });
    }
    /* 강조 안내 말풍선(시스템 전용 — .bub-sys) — ⚠️ transcript 에 넣지 않는다.
       대화 재료가 아니라 화면 장치라, 넣으면 다듬기 프롬프트의 {collected_materials}
       와 서버 저장본이 오염된다(전구 확인 말풍선과 같은 규칙). */
    function sysBubble(html, cls){
      const d = document.createElement('div');
      d.className = 'bub-sys' + (cls ? ' ' + cls : '');
      d.innerHTML = html;
      chat.appendChild(d); tailTools(); chat.scrollTop = chat.scrollHeight;
      return d;
    }
    // 지원자가 꺼낸 재료만 모아 텍스트로 (Edge Function 에 {collected_materials} 로 주입)
    function collectedMaterials(){
      return transcript.filter(t => t.role === 'user').map((t, i) => (i + 1) + '. ' + t.content).join('\n');
    }
    // 응답 대기 말풍선(…) — 채워지기 전에는 transcript 에 넣지 않는다
    function aiPending(){
      const d = document.createElement('div');
      d.className = 'bub ai';
      d.innerHTML = '<div class="who"><span class="ava">R</span>연구원</div><span style="color:var(--text-muted);">생각 중…</span>';
      chat.appendChild(d); tailTools(); chat.scrollTop = chat.scrollHeight;
      return d;
    }
    function aiFill(el, html){
      el.innerHTML = '<div class="who"><span class="ava">R</span>연구원</div>' + html;
      chat.scrollTop = chat.scrollHeight;
      transcript.push({ role: 'researcher', content: html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() });
    }

    /* ── 키보드가 열려도 화면이 밀려 올라가지 않게 ──────────────────────────────
       아이폰은 키보드가 올라와도 페이지 높이(100svh)를 그대로 둔다. 대신 입력칸을
       키보드 위로 올리려고 **페이지 전체를 밀어 올린다** — 상단 바·단계 표시·질문이
       화면 밖으로 나가고, 남은 자리엔 대화의 빈 꼬리만 보인다(2026-08-04 오너 신고).
       그래서 지금 실제로 보이는 높이(visualViewport)를 셸 높이로 그대로 받아쓴다.
       ⚠️ 사용자가 위쪽 대화를 읽는 중이면 끌어내리지 않는다 — 바닥에 붙어 있을 때만 따라간다. */
    const vv = window.visualViewport;
    if (vv) {
      const baseH = vv.height;   // 키보드가 없는 상태의 높이 — 열림 판정 기준
      const atBottom = () => chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
      const fitShell = () => {
        const stick = atBottom();
        document.body.style.height = vv.height + 'px';
        /* 키보드가 올라오면 남는 높이가 427px 수준이라, 고정 요소(공용 메뉴 57 + 상단 바 68
           + 단계 30 + 입력부 214)만으로 369를 먹어 대화에 58밖에 안 남는다 — 질문 말풍선(96)이
           잘린다(2026-08-04 오너 신고 2차). 그동안만 공용 메뉴를 접어 그 자리를 대화에 준다.
           ⚠️ 50px 남짓은 주소창이 접힐 때도 줄어드니 120 이상 줄었을 때만 키보드로 본다. */
        document.body.classList.toggle('kb-open', vv.height < baseH - 120);
        if (window.scrollY) window.scrollTo(0, 0);   // 이미 밀려 올라갔으면 되돌린다
        if (stick) chat.scrollTop = chat.scrollHeight;
      };
      vv.addEventListener('resize', fitShell);
      vv.addEventListener('scroll', fitShell);
      fitShell();
    }

    // ── 입력/전송 ──
    const ta = document.getElementById('ta'), snd = document.getElementById('snd');
    const help = document.getElementById('help');
    let idleT;
    function grow(){ ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight,132)+'px'; }
    function toggle(){ ta.value.trim() ? snd.classList.add('on') : snd.classList.remove('on'); }
    // 막혀서 8초 멈추면 '잘 안 떠올라요' 칩이 잠깐 울린다(예전의 '막히면 여기서 도움받기'
    // 안내 줄은 칩 자체가 이름을 말하고 있어 없앴다 — 한 줄 더 쌓지 않는다).
    function pulse(){
      help.classList.remove('nudge'); void help.offsetWidth; help.classList.add('nudge');
    }
    function resetIdle(){ clearTimeout(idleT); idleT = setTimeout(pulse, 8000); }
    let userMsgCount = 0;
    let _busy = false;    // AI 응답 대기 중 — 연타/동시요청 방지
    let _ready = false;   // 오늘의 문제 로드 완료 전 전송 방지
    function send(){
      const v = ta.value.trim(); if(!v || _busy || !_ready) return;
      /* 보내도 키보드를 내리지 않는다(카톡과 같다) — 도구 칩이 한 줄로 늘 떠 있어서
         키보드를 내려야 다듬기 CTA 를 보는 상황이 없어졌기 때문이다. 잠깐 blur 로
         내렸던 때가 있었는데(2026-08-04), 매 턴 키보드가 오르내려 흐름이 끊겼다. */
      me(v); ta.value=''; grow(); toggle();
      /* 한글 IME 잔글자 방어(2026-08-05 오너 신고 — "전송하면 끝 1글자가 남는다").
         키보드를 안 내리므로 마지막 글자의 조합이 살아 있는데, 입력칸을 비우면 IME 가
         조합 중이던 글자를 도로 넣는다. 값은 이미 v 로 다 읽었으니 그 글자는 찌꺼기다 —
         조합이 정리된 직후 딱 한 글자만 남아 있으면 지운다. 80ms 안에 사람이 다음
         글자를 시작할 수 없어 정상 입력이 지워질 일은 없다. */
      setTimeout(()=>{ if(ta.value.length===1){ ta.value=''; grow(); toggle(); } }, 80);
      userMsgCount++;
      moncTrack('sojae_turn', { turn: userMsgCount });
      if (userMsgCount >= 2) showRefine();
      /* ⚠️ 여기서 answers 초안 행을 만들지 않는다(2026-08-05 오너 지적 — "아무것도 안 썼는데
         답변노트에 저장된다"). 예전엔 첫 전송부터 빈 행을 만들어 마이페이지 '작성 중'에
         띄웠는데, 대화만 하다 나가면 내용 없는 항목이 노트에 남았다. 이어쓰기는 그 행이
         없어도 된다 — 대화·뼈대는 discovery_sessions 가 들고 있고, 진입 화면이 그 문제에
         '이어쓰기' 를 붙여 준다. 노트에는 학생이 실제로 쓴 글이 생겼을 때만 들어간다. */
      _busy = true;
      const p = aiPending();
      askAI(false).then(html => { aiFill(p, html); _busy = false; syncServer(); });
      resetIdle();
    }
    ta.addEventListener('input', ()=>{ grow(); toggle(); resetIdle(); });
    ta.addEventListener('keydown', e=>{
      if(e.key==='Enter' && !e.shiftKey){
        e.preventDefault();
        /* 한글 조합 중의 Enter 는 글자 확정용이다 — 이때 보내면 위와 같은 잔글자가 남는다.
           확정만 시키고, 조합이 끝난 다음 Enter 에서 보낸다(카톡 PC판과 같은 동작). */
        if(e.isComposing || e.keyCode===229) return;
        send();
      }
    });
    snd.addEventListener('click', send);
    /* 전구는 바로 도움을 부르지 않고 **한 번 물어본다**(2026-08-04 오너 지시).
       입력칸 옆 아이콘이라 잘못 눌리기 쉽고, 눌러 보기 전에는 뭘 하는 버튼인지도 모른다.
       확인 말풍선이 그 두 가지를 같이 해결한다 — 이름을 말해 주고, 실수 클릭을 막는다.
       ⚠️ 이 확인 말풍선은 transcript 에 넣지 않는다 — 대화 재료가 아니라 화면 장치라,
          넣으면 다듬기 프롬프트의 {collected_materials} 와 서버 저장본이 오염된다. */
    let _helpAskEl = null;
    function closeHelpAsk(){ if (_helpAskEl) { _helpAskEl.remove(); _helpAskEl = null; } }
    function runHelp(){
      if (_busy || !_ready) return;
      transcript.push({ role: 'help', content: '잘 안 떠올라요' });   // 서버에서 [막힘 대응] 트리거
      _busy = true;
      const p = aiPending();
      askAI(true).then(html => { aiFill(p, html); _busy = false; syncServer(); });
      resetIdle();
    }
    function askHelpConfirm(){
      if (_helpAskEl) return;                       // 이미 물어보는 중이면 겹쳐 띄우지 않는다
      const d = document.createElement('div');
      d.className = 'askcard';
      d.innerHTML = '<div class="askcard-t">지금 쓰기 어려우신가요?<br>아무 말이나 적기보다, 원하시면 제가 실마리부터 드릴게요.</div>'
        + '<div class="askrow">'
        +   '<button class="chip chip-go" type="button" data-yes>네, 도와주세요</button>'
        +   '<button class="chip" type="button" data-no>아니요, 더 써볼게요</button>'
        + '</div>';
      chat.appendChild(d); tailTools(); chat.scrollTop = chat.scrollHeight;
      _helpAskEl = d;
      d.querySelector('[data-no]').addEventListener('click', closeHelpAsk);
      d.querySelector('[data-yes]').addEventListener('click', ()=>{ closeHelpAsk(); runHelp(); });
    }
    help.addEventListener('click', ()=>{
      if (_busy || !_ready) return;
      askHelpConfirm();
    });

    // ── 다듬기(뼈대) 폴백 — Edge Function 실패 시에만 사용 (실호출은 refineAI) ──
    function refineSkeleton(){
      const mats = transcript.filter(t => t.role === 'user').map(t => t.content);
      const hook = mats[0] ? '“' + esc(mats[0].slice(0, 24)) + (mats[0].length > 24 ? '…' : '') + '”' : '꺼낸 이야기';
      if (category === 'judgment') {
        // 상황판단형: 경험 서술이 아니라 판단·대처 흐름 (프롬프트 [유형별 주의])
        return '<b>답변 뼈대 — 판단·대처 흐름으로</b><br><br>'
          + '① <b>판단 기준</b> — 이 상황에서 무엇을 최우선으로 볼지(안전·규정·승객 마음) 먼저 한 문장으로.<br>'
          + '② <b>즉시 대처</b> — 그 기준에 따라 내가 먼저 할 행동을 순서대로. 여기에 무게를 두세요.<br>'
          + '③ <b>후속 마무리</b> — 동료·선임 공유, 승객 재확인까지 한 문장으로.<br><br>'
          + '<b>강점 포인트</b>: ' + hook + ' 에서 보인 침착한 기준 잡기. 그대로 살리세요.<br><br>'
          + '이제 아래 칸에서 “나는 이렇게 판단하고, 이렇게 대처하겠다” 흐름으로 직접 완성해보세요.';
      }
      return '<b>답변 뼈대 — 이 순서로 말해보세요</b><br><br>'
        + '① <b>장면 꺼내기</b> — ' + hook + ' 상황을 한두 문장으로. 언제·어디서였는지만 간결히.<br>'
        + '② <b>나의 행동</b> — 그때 무엇을 어떤 순서로 했는지. 답변의 무게는 여기에.<br>'
        + '③ <b>결과와 느낀 점</b> — 상대 반응·결과 + 그때 감정을 한 문장으로.<br>'
        + '④ <b>승무원과 연결</b> — 이 경험이 기내에서 어떻게 이어질지로 마무리.<br><br>'
        + '<b>강점 포인트</b>: 직접 겪은 구체적인 장면이 있다는 것. 표정·말 같은 디테일을 살리면 더 생생해져요.<br><br>'
        + '완성 문장은 제가 만들지 않아요 — 아래 칸에 지원자님의 말로 직접 채워보세요.';
    }

    // ── 이어쓰기 저장/복원 (서버 단일 원천) ──────────────────────────────
    /* 답변 한 건을 서버에 쓴다 — 저장 버튼·자동 저장이 같이 쓰는 유일한 경로.
       ① 문제 행이 있으면 (member,question) upsert — 문제당 1행, 재저장=수정.
       ② 문제 행이 없으면(문제 조회 실패 폴백 대화) **자유 글(title=문항)로 저장한다.**
          예전엔 이 경우 저장 버튼이 "문제 정보를 불러오지 못했어요"로 막히고 자동 저장도
          조용히 건너뛰어, 학생이 답변을 다 쓰고도 '내 답변'에 아무것도 남지 않았다
          (2026-08-19 오너 "답변을 작성하는데 내 답변으로 저장이 안된다").
       ③ upsert 가 23503(문제 행이 방금 삭제됨 — admin 정리와 경합)이면 ②로 넘어가
          학생이 쓴 글을 어떤 경우에도 살린다. 실패는 sojae_save_fail 로 계측. */
    async function writeAnswer(session, content, status){
      if (currentQuestion) {
        try {
          const { data, error } = await MONC.sb.from('answers').upsert(
            { member_id: session.user.id, question_id: currentQuestion.id, content, status },
            { onConflict: 'member_id,question_id' }).select('id').maybeSingle();
          if (!error) { if (data) _answerId = data.id; return { ok: true }; }
          if (error.code !== '23503') {
            moncTrack('sojae_save_fail', { code: error.code || '' });
            return { ok: false, error };
          }
          // 23503(문제 행 삭제 경합) → 아래 자유 글 폴백으로. 운영이 알아야 하는 신호라 남긴다.
          moncTrack('sojae_save_fail', { code: '23503', recovered: true });
        } catch (e) { moncTrack('sojae_save_fail', { code: 'net' }); return { ok: false, error: e }; }
      }
      try {
        const title = ((currentQuestion && currentQuestion.content) || FALLBACK_QUESTION).slice(0, 200);
        if (_freeId) {   // 이 화면에서 이미 만든 자유 글이 있으면 그 행만 고친다(중복 행 방지)
          const { data, error } = await MONC.sb.from('answers')
            .update({ content, status }).eq('id', _freeId).eq('member_id', session.user.id)
            .select('id').maybeSingle();
          if (!error && data) { _answerId = _freeId; return { ok: true }; }
          if (error) { moncTrack('sojae_save_fail', { code: error.code || '' }); return { ok: false, error }; }
          _freeId = null;   // 0행(다른 데서 삭제) — 아래에서 새로 만든다
        }
        const { data, error } = await MONC.sb.from('answers')
          .insert({ member_id: session.user.id, title, content, status })
          .select('id').single();
        if (error) { moncTrack('sojae_save_fail', { code: error.code || '' }); return { ok: false, error }; }
        _freeId = data.id; _answerId = data.id;
        return { ok: true };
      } catch (e) { moncTrack('sojae_save_fail', { code: 'net' }); return { ok: false, error: e }; }
    }
    // 답변 초안 자동 저장. 완료본이면 final 유지(다운그레이드 방지).
    async function saveDraftAnswer(){
      if (_restoring) return;
      const text = document.getElementById('finalTa').value;
      // 빈 글로 새 행을 만들지 않는다 — 노트에 내용 없는 '작성 중'이 쌓인다.
      // 단 이미 저장된 행이면 지운 것도 저장한다(글을 다 지운 것도 학생의 편집이다).
      if (!text.trim() && !_answerStatus) return;
      let session;
      try { session = await MONC.getSession(); } catch (_) { return; }
      if (!session) return;
      const status = _answerStatus === 'final' ? 'final' : 'draft';
      const r = await writeAnswer(session, text, status);
      if (r.ok) _answerStatus = status;
    }
    // 대화·뼈대: 세션 1행(문제당 unique) + 아직 안 올린 메시지만 추가 → 재방문해도 중복 없음.
    /* 대화 저장이 계속 안 되면(2번 연속) 한 번만 알린다 — 예전엔 실패를 전부 조용히 삼켜서
       학생이 허공에 대고 쓰다 화면을 떠나며 통째로 잃었다(2026-08-19 오너 "대화가 저장이
       안 되더라, 계속 다시 썼다"). 문제 행이 없는 폴백 대화는 FK 때문에 아예 저장을 못 하는
       상태라 같은 경고를 띄운다. 답변 자체는 writeAnswer 폴백이 따로 지킨다. */
    let _syncFails = 0, _syncWarned = false;
    function syncTrouble(){
      _syncFails++;
      if (_syncFails >= 2 && !_syncWarned) {
        _syncWarned = true;
        sysBubble('지금 <b>대화 기록이 저장되지 않고 있어요</b> — 이 화면을 벗어나면 대화가 사라질 수 있어요. '
          + '이어서 최종 답변까지 완성해 <b>[답변집에 저장]</b>을 눌러 주세요. 답변 저장은 정상 동작해요.');
        moncTrack('sojae_sync_fail', { fallback: !currentQuestion });
      }
    }
    async function syncServer(stage){
      if (_restoring) return;
      if (!currentQuestion) { if (userMsgCount >= 2) syncTrouble(); return; }
      let session;
      try { session = await MONC.getSession(); } catch (_) { return; }
      if (!session) return;
      try {
        if (!_srvSession) {
          const { data } = await MONC.sb.from('discovery_sessions')
            .upsert({ member_id: session.user.id, question_id: currentQuestion.id, stage: stage || 'ask' },
                    { onConflict: 'member_id,question_id' })
            .select('id').single();
          if (!data) { syncTrouble(); return; }
          _srvSession = data.id;
          const { count } = await MONC.sb.from('discovery_messages')
            .select('id', { count: 'exact', head: true }).eq('session_id', _srvSession);
          _srvSynced = count || 0;                            // 이미 저장된 만큼은 건너뛴다(중복 방지 기준선)
        } else if (stage) {
          await MONC.sb.from('discovery_sessions').update({ stage }).eq('id', _srvSession);
        }
        const pending = transcript.slice(_srvSynced);
        if (pending.length) {
          const rows = pending.map(m => ({
            session_id: _srvSession, member_id: session.user.id,
            role: (m.role === 'help' || m.role === 'researcher') ? m.role : 'user',
            content: m.content,
          }));
          const { error } = await MONC.sb.from('discovery_messages').insert(rows);
          if (error) { syncTrouble(); return; }
          _srvSynced = transcript.length;
        }
        _syncFails = 0;   // 한 번 성공하면 경고 카운트 초기화(일시 끊김을 사고로 안 읽는다)
      } catch (_) { syncTrouble(); }
    }
    // 저장된 대화를 화면+transcript 로 다시 그린다(복원).
    function replayTranscript(items){
      items.forEach(m => {
        if (m.role === 'user') me(m.content);
        else if (m.role === 'help') transcript.push({ role: 'help', content: m.content }); // 말풍선 없는 트리거
        else ai(m.content);
      });
    }
    // 최종작성 모드 UI 로 전환(복원 시 사용).
    function showWriteMode(){
      hideRefine();
      document.getElementById('askMode').style.display = 'none';
      document.getElementById('step1').classList.remove('on');
      document.getElementById('step2').classList.add('on');
      document.getElementById('step3').classList.add('on');
      document.getElementById('writeMode').style.display = 'block';
    }
    // 진입 시 복원(서버): 그 문제의 대화·뼈대(discovery) + 답변 초안(answers) 을 화면에 재현.
    async function restoreSession(){
      let session;
      try { session = await MONC.getSession(); } catch (_) { return false; }
      if (!session || !currentQuestion) return false;
      let msgs = [], sess = null, answer = null;
      try {
        const { data: s } = await MONC.sb.from('discovery_sessions')
          .select('id, stage').eq('member_id', session.user.id).eq('question_id', currentQuestion.id).maybeSingle();
        sess = s || null;
        if (sess) {
          const r = await MONC.sb.from('discovery_messages')
            .select('role, content').eq('session_id', sess.id).order('created_at', { ascending: true });
          msgs = r.data || [];
        }
        const { data: a } = await MONC.sb.from('answers')
          .select('id, content, status').eq('member_id', session.user.id).eq('question_id', currentQuestion.id).maybeSingle();
        answer = a || null;
      } catch (_) {}
      // 되살릴 게 아무것도 없으면 새 세션(인사말)로.
      if (!msgs.length && !(answer && answer.content)) return false;
      _restoring = true;
      if (sess) { _srvSession = sess.id; _srvSynced = msgs.length; }   // 이후 syncServer 가 새 메시지만 추가(중복 방지)
      if (answer) { _answerStatus = answer.status || 'draft'; _answerId = answer.id; }   // id 는 첨삭 직행용
      replayTranscript(msgs);
      userMsgCount = transcript.filter(t => t.role === 'user').length;
      if (userMsgCount >= 2) showRefine();
      // 뼈대까지 갔거나(=write/done) 이미 답변을 쓰기 시작했으면 최종작성 모드로 복원
      const inWrite = (sess && (sess.stage === 'write' || sess.stage === 'done')) || (answer && answer.content);
      if (inWrite) {
        showWriteMode();
        if (answer && answer.content) document.getElementById('finalTa').value = answer.content;
        // 이미 완료한 문제로 돌아온 경우 — 여기서도 다음 문제로 가는 길을 연다
        // (완료 화면이 막다른 길이면 두 번째 문제로 이어지지 않는다. 2026-08-19 피드백)
        if ((sess && sess.stage === 'done') || _answerStatus === 'final') {
          document.getElementById('saveBtn').textContent = '다시 저장';
          showNextStep();
        }
      }
      _restoring = false;
      return true;
    }

    // ── 대화 → 소재 창고 옮기기(2026-08-16 오너 "대화를 창고로 연동") ──────
    //    서버(answer-program card_from_chat)가 학생 발화의 사실만 추려 카드로 저장하고,
    //    소재 창고의 수정 폼을 바로 연다(학생이 훑어보고 고치는 게 확인 절차).
    //    무과금이라 프로브 게이트는 안 둔다 — 구버전 함수면 bad_action 안내로 끝난다.
    //    ⚠️ 저장 완료 패널에서만 열린다(2026-08-19 오너) — 대화 도중의 문이었을 때
    //    마무리가 끊기고 대화가 사라지는 사고가 났다. 떠나기 전에 남은 대화를 마저 밀어 둔다.
    document.getElementById('toWhCta').addEventListener('click', async () => {
      const btn = document.getElementById('toWhCta');
      if (btn.disabled) return;
      let session = null;
      try { session = await MONC.getSession(); } catch (_) {}
      if (!session) {
        location.href = 'login.html?returnTo=' + encodeURIComponent('sojae.html' + location.search);
        return;
      }
      moncTrack('sojae_to_warehouse', { turns: userMsgCount });
      btn.disabled = true; const oldLabel = btn.textContent; btn.textContent = '옮기는 중…';
      await syncServer();   // 아직 안 올라간 대화가 있으면 화면을 떠나기 전에 마저 저장
      let out = null;
      try {
        const r = await MONC.sb.functions.invoke('answer-program', {
          body: {
            action: 'card_from_chat',
            questionText: (currentQuestion && currentQuestion.content) || '',
            messages: transcript.map(t => ({ role: t.role === 'user' ? 'user' : 'ai', content: t.content })),
          },
        });
        out = r.error ? null : r.data;
      } catch (_) {}
      btn.disabled = false; btn.textContent = oldLabel;
      if (!out) { sysBubble('서버에 연결하지 못했어요. 잠시 뒤 다시 시도해 주세요.'); return; }
      if (out.error || !out.ok) {
        sysBubble(out.code === 'bad_action'
          ? '이 기능은 준비 중이에요 — 곧 열려요.'
          : esc(out.error || '옮기지 못했어요. 잠시 뒤 다시 시도해 주세요.'));
        return;
      }
      location.href = 'experiences.html?edit=' + encodeURIComponent(out.card_id);
    });

    // ── 다듬기 진입 → 최종 작성 모드 ──
    document.getElementById('refineCta').addEventListener('click', () => {
      if (_busy) return;                                     // 되묻기 응답 대기 중엔 전환 금지
      moncTrack('sojae_refine_click', { turns: userMsgCount });
      _busy = true;
      hideRefine();                                          // 중복 클릭 방지
      clearTimeout(idleT);                                   // 되묻기 넛지 중지
      document.getElementById('askMode').style.display = 'none';
      document.getElementById('step1').classList.remove('on');
      document.getElementById('step2').classList.add('on');
      // 진행 안내도 강조 말풍선 한 문법으로(2026-08-06 오너 확정) — 예전의 연구원
      // 말풍선("좋아요, 뼈대를 잡아볼게요") + '생각 중…' 두 덩어리를 이것 하나가 대체한다.
      const p = sysBubble('모인 재료로 <b>답변 뼈대를 다듬고 있습니다</b><span class="dots3" aria-hidden="true"><i></i><i></i><i></i></span>');
      refineAI().then(r => {
        p.className = 'bub ai';   // 결과·오류는 대화(연구원 말풍선)로 — 강조 말풍선은 시스템 안내 전용
        // ⚠️ 크레딧이 모자라거나 실패하면 다음 단계로 넘기면 안 된다 — 되묻기 화면으로
        //    되돌려 이어서 대화하거나 충전할 수 있게 한다(대화는 무료라 잃는 게 없다).
        if (r.err) {
          aiFill(p, esc(r.msg || '다듬기를 하지 못했어요.')
            + (r.err === 'no_credit' ? ' <a href="mypage.html">충전하기</a>' : ''));  // AI킬러 준비중(2026-08-11) 동안 마이페이지 지갑으로
          document.getElementById('askMode').style.display = 'block';
          document.getElementById('step2').classList.remove('on');
          document.getElementById('step1').classList.add('on');
          showRefine();                                      // 충전 뒤 바로 다시 누를 수 있게
          _busy = false;
          return;
        }
        if (r.v2) {
          aiFill(p, refineHtmlV2(r.v2));
          if (r.v2.card_saved) moncTrack('sojae_card_saved');
        } else {
          aiFill(p, r.html);
        }
        moncTrack('sojae_refine_done');
        syncServer('refine');   // ⚠️ 성공한 뒤에 기록 — 실패했는데 '다듬기 완료'로 남으면
                                //    새로고침 때 되묻기로 못 돌아온다.
        document.getElementById('step3').classList.add('on');
        document.getElementById('writeMode').style.display = 'block';
        chat.scrollTop = chat.scrollHeight;
        _busy = false;
        syncServer('write');
      });
    });
    // 최종 답변 초안 자동 저장(디바운스 800ms)
    let _draftT;
    document.getElementById('finalTa').addEventListener('input', () => {
      clearTimeout(_draftT); _draftT = setTimeout(saveDraftAnswer, 800);
    });

    // ── 답변집 저장 (answers upsert — 문제당 1개, 재저장=수정) ──
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveBtn');
      const footEl = document.getElementById('saveFoot');
      const content = document.getElementById('finalTa').value.trim();
      if (!content) { footEl.textContent = '답변을 입력하세요.'; return; }
      clearTimeout(_draftT);   // 대기 중인 자동 저장을 끊는다 — 자유 글 폴백에서 행이 둘 생기는 경합 방지
      btn.disabled = true; footEl.textContent = '저장 중…';
      try {
        const session = await MONC.getSession();
        if (!session) {
          // ⚠️ 여기서 다른 화면으로 보내지 말 것 — 쓴 글은 이 화면에만 있다(이동=유실).
          footEl.textContent = '로그인이 풀렸어요. 다른 탭에서 로그인한 뒤 다시 눌러 주세요 — 쓴 글은 화면에 남아 있어요.';
        } else {
          const r = await writeAnswer(session, content, 'final');
          if (!r.ok) throw (r.error || new Error('잠시 뒤 다시 시도해 주세요'));
          _answerStatus = 'final';               // 이후 자동 저장이 완료본을 draft 로 되돌리지 않게
          footEl.textContent = '답변집에 저장됐어요. (완료)';
          moncTrack('sojae_save_final');
          btn.textContent = '다시 저장';
          syncServer('done');   // 되묻기 대화도 서버에 마저 기록 + 세션 완료 표시
          showNextStep();       // 저장을 막다른 길로 두지 않는다 — 첨삭 직행·다음 문제
        }
      } catch (e) { footEl.textContent = '저장 실패: ' + (e.message || e.code || '잠시 뒤 다시 시도해 주세요'); }
      btn.disabled = false;
    });

    // ── 저장 완료 → 다음 문제 잇기(2026-08-19 사용자 피드백) ─────────────────
    //    같은 난이도에서 아직 완료 안 한 문제를 골라 버튼 하나로 잇는다. 진행(몇 개 완료)도
    //    같이 보여 '초급편 완주'가 목표로 잡히게 한다. 조회가 실패하면 블록 자체를 안 띄운다
    //    (지어낸 숫자를 보여주지 않는다 — 저장 흐름은 이 블록 없이도 그대로 성립).
    let _nsPool = null;   // 문제 풀 캐시 — 다시 저장을 눌러도 조회는 한 번
    async function showNextStep(){
      // 첨삭 직행이 1순위(2026-08-19 오너 "저장하고 바로 첨삭으로") — 저장·복원이
      // 잡아 둔 answers 행 id 를 그대로 물려 polish 가 이 답변을 불러온 채 열린다.
      const pol = document.getElementById('nsPolish');
      if (_answerId) {
        pol.href = 'polish.html?answer=' + encodeURIComponent(_answerId);
        pol.hidden = false;
      }
      // 창고 담기는 추려낼 학생 발화가 있을 때만(되묻기 2번부터 — 서버가 카드로 만들 재료)
      document.getElementById('toWhCta').hidden = userMsgCount < 2;
      document.getElementById('nextStep').hidden = false;
      document.getElementById('saveBtn').classList.add('is-saved');
      if (!currentQuestion) return;   // 폴백 대화(자유 글 저장) — 다음 문제 계산은 문제 풀이 있어야
      const S = window.SOJAE;
      try {
        if (!_nsPool || !_nsPool.length) _nsPool = await S.fetchQuestionPool(MONC.sb);
        const level = S.levelOf(currentQuestion);
        const pool = S.poolOf(_nsPool, level);
        if (!pool.length) return;
        // 완료 여부는 고르기 화면과 같은 원장(discovery_sessions.stage)으로 판정.
        // 조회 실패면 done=null — 진행 숫자는 숨기고 '다음 문제' 버튼만 남긴다.
        let done = null;
        try {
          const session = await MONC.getSession();
          if (session) {
            const { data, error } = await MONC.sb.from('discovery_sessions')
              .select('question_id, stage').eq('member_id', session.user.id);
            if (!error && data) {
              done = {};
              data.forEach(s => { if (s.stage === 'done') done[s.question_id] = true; });
            }
          }
        } catch (_) {}
        // 방금 저장한 문제는 완료로 친다 — syncServer('done') 반영 전에 조회해도 어긋나지 않게
        if (done) done[currentQuestion.id] = true;
        // 다음 문제: 지금 문제 다음 자리부터 한 바퀴 돌며 완료 아닌 첫 문제
        const idx = Math.max(0, pool.findIndex(q => q.id === currentQuestion.id));
        let next = null;
        for (let i = 1; i <= pool.length; i++) {
          const q = pool[(idx + i) % pool.length];
          if (q.id === currentQuestion.id) continue;
          if (done && done[q.id]) continue;
          next = q; break;
        }
        const label = LEVEL_LABEL[level] || '';
        const progEl = document.getElementById('nsProg');
        if (done) {
          const n = pool.filter(q => done[q.id]).length;
          progEl.textContent = next
            ? label + ' ' + pool.length + '문제 중 ' + n + '개 완료'
            : label + ' 문제 ' + pool.length + '개를 모두 완료했어요!';
        } else progEl.textContent = '';
        const goBtn = document.getElementById('nsGo');
        if (next) {
          document.getElementById('nsNext').textContent = '다음 문제 — ' + next.content;
          goBtn.textContent = '다음 문제 이어서 풀기';
          goBtn.onclick = () => {
            moncTrack('sojae_next_q', { level });
            location.href = 'sojae.html?q=' + encodeURIComponent(next.id);
          };
        } else {
          document.getElementById('nsNext').textContent = '';
          goBtn.textContent = '다른 난이도 골라보기';
          goBtn.onclick = () => {
            moncTrack('sojae_next_q', { level, all_done: true });
            location.href = 'sojae.html';
          };
        }
        goBtn.hidden = false;   // 풀 계산이 실패하면 빈 버튼을 안 보여준다(지어낸 값 금지와 같은 결)
      } catch (_) {}
    }
    document.getElementById('nsPolish').addEventListener('click', () => moncTrack('sojae_to_polish'));

    // ── 진입: 로그인 가드 → 문제 확정(오늘 또는 ?q=) → 복원 또는 첫 되묻기 ──
    // ?q=<문제id> 로 오면 그 문제를 열어 이어쓰기(오늘 문제에 안 묶임 → 날짜 넘어가도 복원).
    async function fetchQuestionById(id) {
      // 재시도 1회 — 모바일 순간 끊김 한 번으로 폴백 대화(자유 글 저장 경로)에
      // 떨어지지 않게 한다. 진짜 없는 문제(삭제·잘못된 id)는 두 번 다 null 이라 그대로 폴백.
      for (let i = 0; i < 2; i++) {
        try {
          const { data, error } = await MONC.sb.from('questions').select('*').eq('id', id).maybeSingle();
          if (!error) return data || null;
        } catch (_) {}
      }
      return null;
    }
    // ── 진입 화면: 난이도 고르기 (2026-08-05) ─────────────────────────────────
    // ?q= 없이 들어오면 대화가 아니라 이 화면이 먼저다. 문제를 고르면 ?q= 를 붙여
    // 화면을 다시 연다 — 대화 상태(대화·뼈대·초안)를 손으로 지우지 않아 되돌릴 자리가 없다.
    const LEVEL_LABEL = window.SOJAE.LEVEL_LABEL;
    let _pool = [];         // 활성 문제 전체(난이도별로 갈라 쓴다)
    let _sessions = {};     // question_id → stage. 이어쓰기·완료 표시용
    let _pickLevel = window.SOJAE.getLevel();

    function pvGo(id) { location.href = 'sojae.html?q=' + encodeURIComponent(id); }
    function pvState(q) {
      const s = _sessions[q.id];
      return s ? (s === 'done' ? '완료' : '이어쓰기') : '';
    }
    function renderPick() {
      const S = window.SOJAE;
      // 난이도 칩 — 숫자에 '문제'를 붙여 둔다(값만 남으면 무엇을 센 수인지 모른다).
      // 하나라도 완료했으면 '완료 M/N'로 진행을 보여준다(2026-08-19 피드백 "초급편 완주" 목표감).
      document.getElementById('pvLevels').innerHTML = S.LEVELS.map(lv => {
        const lvPool = S.poolOf(_pool, lv);
        const dn = lvPool.filter(q => _sessions[q.id] === 'done').length;
        return '<button class="pv-lv" type="button" data-lv="' + lv + '" aria-pressed="' + (lv === _pickLevel) + '">'
          + '<span class="pv-lv-t">' + LEVEL_LABEL[lv] + '</span>'
          + '<span class="pv-lv-n">' + (dn ? '완료 ' + dn + '/' + lvPool.length : lvPool.length + '문제')
          + '</span></button>';
      }).join('');
      document.getElementById('pvDesc').textContent = S.LEVEL_DESC[_pickLevel] || '';

      const pool = S.poolOf(_pool, _pickLevel);
      const today = S.pickEffective(_pool, _pickLevel);
      const wrap = document.getElementById('pvToday');
      if (!today) {
        wrap.innerHTML = '<div class="pv-card"><div class="pv-empty">이 난이도에는 아직 문제가 없어요. '
          + '다른 난이도를 골라 주세요.</div></div>';
      } else {
        const st = pvState(today);
        wrap.innerHTML = '<div class="pv-card">'
          + '<div class="pv-cap">' + LEVEL_LABEL[_pickLevel] + ' · 오늘의 문제</div>'
          + '<div class="pv-q">' + esc(today.content) + '</div>'
          + (today.hint ? '<div class="pv-hint">예시: ' + esc(today.hint) + '</div>' : '')
          /* ⚠️ 항공사 이름을 여기 다시 붙이지 말 것 — 소재 문제는 전 항공사 공통이라
             2026-08-05 에 admin 의 항공사 칸을 지웠다. 구 데이터에 남은 questions.airline 을
             학생 화면만 계속 보여 주고 있었다(2026-08-06 감사). 관리자는 이제 그 값을
             admin 에서 보거나 지울 수도 없다. 항공사별 기출은 답변 프로그램 쪽 이야기다. */
          + '<div class="pv-meta">' + esc(CAT_LABEL[today.category] || '')
          + (st ? ' · ' + st : '') + '</div>'
          + '</div>'
          + '<button class="pv-go" type="button" id="pvStart">'
          /* 완료한 문제에 '시작하기'가 떠 있으면 "오늘 할 건 끝났다"로 읽힌다(2026-08-19 피드백).
             완료면 '다시 보기'로 바꿔, 새 문제는 아래 '다른 문제 보기'에서 고르게 안내한다. */
          + (st === '이어쓰기' ? '이어서 쓰기' : st === '완료' ? '완료한 답변 다시 보기' : '이 문제로 시작하기')
          + '</button>';
        document.getElementById('pvStart').addEventListener('click', () => pvGo(today.id));
      }
      // '다른 문제 보기' — 그 난이도 문제 전체. 문제가 하나뿐이면 펼칠 것이 없다.
      const more = document.getElementById('pvMore'), list = document.getElementById('pvList');
      more.hidden = pool.length < 2;
      list.innerHTML = pool.map(q => {
        const isT = today && q.id === today.id, st = isT ? '오늘' : pvState(q);
        return '<button class="pv-item' + (isT ? ' is-today' : '') + '" type="button" data-q="' + esc(q.id) + '">'
          + '<span class="pv-item-t">' + esc(q.content) + '</span>'
          + '<span class="pv-item-s">' + st + '</span></button>';
      }).join('');
      list.querySelectorAll('.pv-item').forEach(b =>
        b.addEventListener('click', () => pvGo(b.dataset.q)));
    }
    document.getElementById('pvLevels').addEventListener('click', e => {
      const b = e.target.closest('.pv-lv'); if (!b) return;
      _pickLevel = b.dataset.lv;
      window.SOJAE.setLevel(_pickLevel);           // 다음 방문·마이페이지가 같은 난이도로 열린다
      moncTrack('sojae_level_pick', { level: _pickLevel });
      renderPick();
    });

    // ── 대화 시작(문제 확정 후) ──
    async function startChat(q) {
      document.body.classList.remove('booting');   // 갈림길 도착 — 대화 화면을 켠다
      document.body.classList.add('chat-focus');   // 몰입 모드 — 공용 nav 를 걷어 대화 높이 확보(2026-08-19)
      if (q) {
        currentQuestion = q;
        if (CAT_LABEL[q.category]) category = q.category;
        window.SOJAE.setLevel(window.SOJAE.levelOf(q));   // 이어쓰기로 연 문제의 난이도를 기억
      }
      const level = window.SOJAE.levelOf(q || {});
      const badge = document.getElementById('catBadge');
      badge.hidden = false;
      badge.textContent = LEVEL_LABEL[level] + ' · ' + CAT_LABEL[category] + ' ▾';
      badge.addEventListener('click', () => { location.href = 'sojae.html'; });
      // 저장돼 있으면 대화·뼈대·초안 복원 → 복원되면 인사말 생략(중복 방지)
      const restored = await restoreSession();
      if (!restored) {
        const content = q ? q.content : FALLBACK_QUESTION;
        // 예시(questions.hint)가 있으면 인사말에 같이 싣는다(2026-08-19 피드백 —
        // "추상적인 질문이 어렵다"). 값 입력은 admin '소재 문제' 탭.
        const hint = q && q.hint ? ' 예를 들면 ' + esc(q.hint) + ' 같은 것도 좋아요.' : '';
        ai('안녕하세요. 오늘 문제는 <b>' + esc(content) + '</b>이에요.' + hint + ' 혹시 떠오르는 순간이 있나요?');
      }
      moncTrack('sojae_start', { category, level });
      _ready = true;                       // 문제 확정 후에만 전송 허용
      setTimeout(pulse, 1800);             // 인사말이 뜬 뒤에 넛지 시작
      resetIdle();
    }

    /* booting 안전핀 — 부트가 예기치 못한 곳에서 멎어도(리다이렉트 지연 등) 화면이
       영영 비지 않게 4초 뒤에는 무조건 연다. 정상 부트에서는 이미 떼어져 no-op. */
    setTimeout(() => document.body.classList.remove('booting'), 4000);
    (async () => {
      const session = await MONC.requireSession();   // 미로그인 → login 으로 이동
      if (session && !(await MONC.requireConsent())) return;  // 약관 동의(가입 시 1회) 미완료 → 동의 게이트
      // 본인인증 게이트(2026-08-26 오너 지시) — 승준 도구는 인증 회원만(fail-open)
      if (session && !(await MONC.requireVerified())) return;
      if (!session) return;
      // ⚠️ 구 members.sojae_enabled 권한 차단 화면은 2026-07-27 삭제 — 회원이면 누구나
      //    들어와 되묻기(무료)를 하고, 값은 다듬기에서만 받는다. 권한 게이트 재도입 금지.
      await loadWallet();
      const qid = new URLSearchParams(location.search).get('q');
      if (qid) { startChat(await fetchQuestionById(qid)); return; }

      _pool = await window.SOJAE.fetchQuestionPool(MONC.sb);
      // 문제 풀이 비었거나 조회가 실패하면 고를 것이 없다 — 폴백 문제로 바로 대화를 연다
      // (진입 화면만 띄우면 학생이 아무것도 못 하고 막힌다).
      if (!_pool.length) { startChat(null); return; }
      document.body.classList.add('picking');
      document.body.classList.remove('booting');   // 갈림길 도착 — 난이도 화면을 켠다
      try {
        const { data } = await MONC.sb.from('discovery_sessions')
          .select('question_id, stage').eq('member_id', session.user.id);
        (data || []).forEach(s => { _sessions[s.question_id] = s.stage; });
      } catch (_) {}
      renderPick();
      moncTrack('sojae_pick_open', { level: _pickLevel });
    })();
  </script>
</body>
