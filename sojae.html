<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>MONC · 소재 발굴</title>
  <!-- 파비콘 -->
  <link rel="icon" href="images/MONC_Logo_Full_Package/assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="images/MONC_Logo_Full_Package/assets/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/MONC_Logo_Full_Package/assets/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/MONC_Logo_Full_Package/assets/favicon/apple-touch-icon.png">
  <link rel="mask-icon" href="images/MONC_Logo_Full_Package/assets/favicon/safari-pinned-tab.svg" color="#102B56">
  <link rel="manifest" href="images/MONC_Logo_Full_Package/assets/favicon/site.webmanifest">
  <meta name="theme-color" content="#102B56">
  <link rel="stylesheet" href="tokens.css">
  <!-- 공용 상단 메뉴(2026-07-30) — 마크업은 nav.js 가 심는다. 여기에 nav 를 복사해 넣지 말 것. -->
  <link rel="stylesheet" href="nav.css">
  <script src="nav.js" defer></script>
  <style>
    /* 다크모드 단말에서 입력칸(textarea)이 브라우저 기본 다크로 렌더되는 것 차단 */
    html { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'SUIT Variable', SUIT, 'Apple SD Gothic Neo', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; height: 100svh; display: flex; flex-direction: column;
      max-width: 480px; margin: 0 auto; line-height: 1.5;
    }

    /* 상단 바 */
    .appbar { display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; gap: 10px; flex: 0 0 auto; }
    .appbar .back { display: inline-flex; align-items: center; gap: 6px;
      font-size: 16px; font-weight: 700; color: var(--text); text-decoration: none;
      min-height: 44px; }
    .appbar .back svg { width: 18px; height: 18px; }
    .badge { display: inline-flex; align-items: center; background: var(--accent-tint);
      color: var(--accent-ink); font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; }

    /* 진행 단계 */
    .stepbar { display: flex; align-items: center; gap: 6px; padding: 0 16px 12px;
      font-size: 12px; color: var(--text-muted); flex: 0 0 auto; flex-wrap: wrap; }
    .stepbar .on { color: var(--action); font-weight: 700; }
    .stepbar .sep { opacity: .5; }

    /* 대화 영역 (스크롤) */
    .chat { flex: 1 1 auto; overflow-y: auto; padding: 4px 16px 8px;
      display: flex; flex-direction: column; gap: 12px; }
    .who { display: flex; align-items: center; gap: 6px; font-size: 12px;
      color: var(--accent-ink); font-weight: 700; margin-bottom: 5px; }
    .ava { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-ink);
      color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
    .bub { max-width: 84%; font-size: 15px; line-height: 1.55; padding: 11px 13px; border-radius: 16px; }
    .bub b { font-weight: 700; }
    .ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--border-soft);
      border-bottom-left-radius: 6px; color: var(--text); }
    .me { align-self: flex-end; background: var(--action); color: var(--action-ink);
      border-bottom-right-radius: 6px; }

    /* 하단 입력부 */
    .composer { flex: 0 0 auto; padding: 8px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--bg); border-top: 1px solid var(--border-soft); }
    .hint { display: block; text-align: center; font-size: 12px; color: var(--action);
      height: 16px; opacity: 0; transform: translateY(4px);
      transition: opacity .3s, transform .3s; margin-bottom: 4px; }
    .hint.show { opacity: 1; transform: translateY(0); }
    .pillrow { display: flex; justify-content: center; margin-bottom: 10px; }
    .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700;
      border-radius: 999px; padding: 10px 18px; min-height: 44px; cursor: pointer;
      background: var(--surface); color: var(--accent-ink); border: 1.5px solid var(--accent-dark);
      color-scheme: light; }
    .pill svg { width: 16px; height: 16px; }
    @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(27,58,107,.45); }
      70% { box-shadow: 0 0 0 11px rgba(27,58,107,0); } 100% { box-shadow: 0 0 0 0 rgba(27,58,107,0); } }
    @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .pill.nudge { animation: ring 1s ease-out 3, pop 1s ease-in-out 3; }
    @media (prefers-reduced-motion: reduce) { .pill.nudge { animation: none; } }

    .field { display: flex; align-items: center; gap: 8px; background: var(--bg2);
      border: 1px solid var(--border-soft); border-radius: 18px; padding: 8px 8px 8px 14px;
      color-scheme: light; }
    .field textarea { flex: 1; border: none; outline: none; background: var(--bg2); color: var(--text);
      resize: none; overflow: hidden; font-family: inherit; font-size: 15px; line-height: 1.6;
      min-height: 26px; max-height: 132px; padding: 3px 0; color-scheme: light; }
    .field textarea::placeholder { color: var(--text-dim); }
    .snd { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s, color .15s, transform .1s; color-scheme: light; }
    .snd svg { width: 20px; height: 20px; }
    .snd.on { background: var(--action); color: var(--action-ink); border-color: transparent; }
    .snd:active { transform: scale(.94); }
    .foot { text-align: center; margin-top: 8px; font-size: 12px; color: var(--text-muted); }
    #refineCta { display: block; width: 100%; background: transparent; color: var(--action);
      border: 1.5px solid var(--action); border-radius: 13px; padding: 12px; font-size: 14px;
      font-weight: 700; cursor: pointer; margin-bottom: 6px; min-height: 44px; }
    /* 다듬기 값·남은 무료 안내. ⚠️ 값을 말하는 줄이라 캡션(14px)보다 작게 두지 말 것
       — 9대 원칙 1번(가독성)에 걸린다. 되묻기가 무료라는 사실도 여기서만 말한다. */
    #refineNote { display: none; text-align: center; margin-bottom: 10px;
      font-size: var(--fs-caption, 14px); line-height: 1.5; color: var(--text-muted); }
    #refineNote b { color: var(--text); font-weight: 700; }
    #refineNote a { color: var(--accent-ink); font-weight: 700; }
    #writeMode .wlabel { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    #finalTa { min-height: 120px; max-height: none; overflow: auto; resize: vertical; }
    #saveBtn { display: block; width: 100%; margin-top: 10px; background: var(--action);
      color: var(--action-ink); border: none; border-radius: 14px; padding: 14px; font-size: 15px;
      font-weight: 700; cursor: pointer; min-height: 48px; color-scheme: light; }
    #saveBtn:disabled { opacity: .7; cursor: default; }
    #saveFoot { text-align: center; margin-top: 8px; font-size: 12px; color: var(--text-muted); min-height: 16px; }

    /* ── v2: 소재 카드 + 뼈대 렌더 ── */
    .mcard { border: 1.5px solid var(--accent-dark); border-radius: 12px; padding: 12px 13px;
      margin-bottom: 12px; background: var(--accent-tint); }
    .mcard-h { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--accent-ink); }
    .mcard-t { font-size: 15px; font-weight: 800; margin-top: 4px; }
    .mcard-one { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
    .mcard-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .mcard-tag { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
      background: var(--surface); color: var(--accent-ink); border: 1px solid var(--border-soft); }
    .mcard-re { font-size: 14px; line-height: 1.55; margin-top: 8px; }
    .mcard-link { display: inline-block; margin-top: 9px; font-size: 13px; font-weight: 800;
      color: var(--accent-ink); }
    .sk-h { font-size: 14px; font-weight: 800; margin: 4px 0 8px; }
    .sk-step { margin-bottom: 9px; font-size: 15px; line-height: 1.55; }
    .sk-step b { display: block; margin-bottom: 2px; }
    .sk-str { margin-top: 11px; font-size: 14px; line-height: 1.55; padding-top: 9px;
      border-top: 1px dashed var(--border-soft); }
    .sk-close { margin-top: 8px; font-size: 14px; color: var(--text-muted); }
    /* 첨삭과 같은 규칙 — (괄호 빈칸)은 학생이 제 사실로 채울 자리 */
    .blank { background: var(--action-tint); border-radius: 4px; padding: 0 2px; font-weight: 700; }
  </style>
</head>
<body data-nav-offset>
  <div class="appbar">
    <a class="back" href="mypage.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      소재 발굴
    </a>
    <span class="badge" id="catBadge">과거경험검증형</span>
  </div>

  <div class="stepbar">
    <span class="on" id="step1">1 되묻기</span><span class="sep">›</span>
    <span id="step2">2 다듬기</span><span class="sep">›</span>
    <span id="step3">3 최종 작성</span>
  </div>

  <div class="chat" id="chat"><!-- 메시지는 JS가 렌더 --></div>

  <div class="composer">
    <!-- 되묻기 모드 -->
    <div id="askMode">
      <button id="refineCta" style="display:none;">모은 이야기로 다듬어볼까요 →</button>
      <div id="refineNote"></div>
      <span class="hint" id="hint">막히면 여기서 도움받기</span>
      <div class="pillrow">
        <button class="pill" id="help">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
          잘 안 떠올라요
        </button>
      </div>
      <div class="field">
        <textarea id="ta" rows="1" placeholder="떠오르는 대로 편하게 적어보세요"></textarea>
        <button class="snd" id="snd" aria-label="전송">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="foot">Enter 전송 · Shift+Enter 줄바꿈</div>
    </div>
    <!-- 최종작성 모드 -->
    <div id="writeMode" style="display:none;">
      <div class="wlabel">최종 답변 — 위 뼈대를 보고 내 말로 완성하세요. <b>작성 중인 내용은 자동 저장돼요.</b></div>
      <div class="field"><textarea id="finalTa" rows="4" placeholder="내 말로 최종 답변을 작성하세요"></textarea></div>
      <button id="saveBtn">답변집에 저장(완료)</button>
      <div id="saveFoot"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="sojae-common.js"></script>
  <script>
    // ── 문제 유형 코드 → 라벨 (questions.category 와 매칭) ──
    const CAT_LABEL = window.SOJAE.CAT_LABEL;   // 공용(sojae-common.js)

    // ── 계측(page_events) — index.html moncTrack 과 같은 관습. 실패는 조용히 무시.
    //    되묻기 턴 수·다듬기 전환율·저장률을 실측한다(스펙 확정 9 — 2단계 판단 근거).
    function moncTrack(event, meta) {
      if (!window.MONC || !window.MONC.sb) return;
      try {
        window.MONC.sb.from('page_events')
          .insert({ event: event, path: '/sojae', meta: meta || {} })
          .then(function () {}, function () {});
      } catch (_) {}
    }
    let category = 'experience';     // 오늘의 문제에서 확정
    let currentQuestion = null;      // 저장 단계에서 쓸 오늘의 문제 행
    const FALLBACK_QUESTION = '예상치 못한 문제를 침착하게 해결했던 경험';  // DB 조회 실패 시 표시·AI 전달용

    // ── 이어쓰기(서버 단일 원천) ──
    //    대화·뼈대 → discovery_sessions/discovery_messages, 답변 초안 → answers(status=draft).
    //    되묻기 시작부터 자동 저장. 나갔다/날 바뀌어도 마이페이지에서 ?q=id 로 다시 열어 이어쓰기.
    let _srvSession = null;    // discovery_sessions.id
    let _srvSynced = 0;        // 서버에 이미 저장된 메시지 수 → 재방문해도 중복 삽입 방지
    let _answerStatus = null;  // null | 'draft' | 'final' — 초안 저장이 완료본을 덮어쓰지 않게
    let _restoring = false;    // 복원 렌더 중엔 저장/서버동기 건너뜀

    // ── 되묻기 질문(가짜) — 유형별로 결이 다름. 실제로는 Haiku Edge Function이 생성 ──
    const FOLLOWUPS = {
      experience: [
        '그 상황이 구체적으로 어떤 자리였어요? 언제·어디서 있었던 일인지부터요.',
        '그 순간 가장 먼저 든 생각은 뭐였나요?',
        '그때 어떻게 행동했는지, 몸이 먼저 어떻게 움직였는지 떠올려볼까요?',
        '그 일이 끝나고 스스로 어떤 점이 남았어요?',
        '그 경험이 승무원 일과 어떻게 연결될 수 있을까요?'
      ],
      values: [
        '그렇게 생각하게 된 결정적인 계기가 있었나요?',
        '그 가치를 지키려다 손해를 감수했던 순간이 있어요?',
        '반대되는 상황에 놓였을 때 어떻게 판단했나요?'
      ],
      judgment: [
        '그 상황에서 가장 먼저 고려한 기준은 뭐였나요?',
        '가능한 선택지가 여러 개였을 텐데, 왜 그 방법이었어요?',
        '승객·동료 입장에서 다시 본다면 어떤 점을 챙기겠어요?'
      ],
      company: [
        '그 항공사에서 가장 인상 깊었던 서비스나 방향은 뭐였나요?',
        '그 점이 왜 지원자님에게 특별하게 다가왔어요?',
        '본인의 어떤 강점이 거기에 맞닿아 있다고 생각해요?'
      ],
      personal: [
        '그걸 좋아하게 된 계기가 있었나요?',
        '그게 지원자님의 어떤 면을 보여준다고 생각해요?',
        '가장 최근에 그걸로 기억에 남는 순간이 있었어요?'
      ]
    };
    const HELP_REPLY = '좋아요, 같이 찾아봐요. 거창한 사건이 아니어도 돼요 — <b>예상과 달랐던 \'작은 순간\'</b> 하나부터 떠올려볼까요? 그때 몸이 먼저 어떻게 움직였나요?';

    // ── AI 호출: Edge Function 'sojae-chat' (되묻기=Haiku 4.5, 다듬기=Sonnet 5) ──
    // 함수 코드: supabase/functions/sojae-chat/index.ts (오너가 콘솔 배포 + ANTHROPIC_API_KEY 시크릿)
    // 미배포·비로그인 등 실패 시 canned 응답으로 폴백 → 화면은 항상 동작.
    let _step = 0;
    function cannedAsk(help) {
      const list = FOLLOWUPS[category] || FOLLOWUPS.experience;
      if (help) return HELP_REPLY;
      const t = list[_step % list.length]; _step++; return t;
    }
    async function askAI(help) {
      try {
        const { data, error } = await MONC.sb.functions.invoke('sojae-chat', {
          body: { stage: 'ask', question_id: currentQuestion && currentQuestion.id,
                  question_text: (currentQuestion && currentQuestion.content) || FALLBACK_QUESTION,
                  category, help: !!help, history: transcript },
        });
        if (error || !data || !data.message) throw error || new Error('빈 응답');
        // AI가 "재료가 충분히 모였어요"([멈춤] 신호)라고 판단하면 다듬기 버튼 노출
        if (data.materials_sufficient) showRefine();
        return esc(data.message).replace(/\n/g, '<br>');
      } catch (_) { return cannedAsk(help); }
    }
    // 반환 {v2:{card,skeleton,card_saved}} 또는 {html} 또는 {err, msg}.
    // ⚠️ 신구 판정은 프로브가 아니라 응답 형태로 한다 — 구함수는 message 만 주고(기존 렌더),
    //    신함수는 card/skeleton 을 준다. 차감 로직이 신구 동일이라 과금 위험이 없는 자리다.
    async function refineAI() {
      try {
        const { data, error } = await MONC.sb.functions.invoke('sojae-chat', {
          body: { stage: 'refine', question_id: currentQuestion && currentQuestion.id,
                  question_text: (currentQuestion && currentQuestion.content) || FALLBACK_QUESTION,
                  category, materials: collectedMaterials() },
        });
        if (error) throw error;
        // ⚠️ 크레딧 부족·실패는 서버가 200 + code 로 알려준다. 이걸 다른 오류와 함께
        //    폴백(뼈대)으로 삼키면 "왜 안 깎였는데 결과가 나오지"가 되고, 사용자는
        //    충전해야 한다는 사실을 영영 모른다. code 가 있으면 반드시 그대로 띄운다.
        if (data && data.code) return { err: data.code, msg: data.error };
        if (!data || !data.message) throw new Error('빈 응답');
        if (_wallet && data.balance != null) {          // 차감 결과로 남은 양 갱신
          _wallet.balance = data.balance;
          _wallet.daily_left = data.daily_left;
        }
        if (data.card && data.skeleton) return { v2: data };
        return { html: esc(data.message).replace(/\n/g, '<br>') };
      } catch (_) { return { html: refineSkeleton() }; }
    }

    // (괄호 빈칸) 칠하기 — polish.html 과 같은 규칙. esc 를 거친 문자열에만 쓴다.
    function markBlanks(escaped) {
      return escaped.replace(/\(([^()<>]{1,24})\)/g, '<span class="blank">($1)</span>');
    }

    // v2 결과 렌더 — 소재 카드 + 답변 뼈대. 카드의 장면·행동 전문은 서랍(answers.html)이 보여준다.
    function refineHtmlV2(d) {
      const c = d.card, s = d.skeleton;
      const comps = (c.competencies || []).map(x => '<span class="mcard-tag">' + esc(x) + '</span>').join('');
      const steps = (s.steps || []).map((st, i) =>
        '<div class="sk-step"><b>' + (i + 1) + '. ' + esc(st.what) + '</b>'
        + markBlanks(esc(st.fill)) + '</div>').join('');
      return '<div class="mcard"><div class="mcard-h">소재 카드</div>'
        + '<div class="mcard-t">' + esc(c.title) + '</div>'
        + '<div class="mcard-one">' + esc(c.one_line) + '</div>'
        + (comps ? '<div class="mcard-tags">' + comps + '</div>' : '')
        + '<div class="mcard-re">' + markBlanks(esc(c.reinterpretation)) + '</div>'
        + (d.card_saved
            ? '<a class="mcard-link" href="answers.html#materials">소재 서랍에 저장됨 · 서랍 보기 →</a>'
            : '')
        + '</div>'
        + '<div class="sk-h">답변 뼈대 — 이 순서로 말해보세요</div>' + steps
        + '<div class="sk-str"><b>강점 포인트</b> · ' + markBlanks(esc(s.strengths)) + '</div>'
        + '<p class="sk-close">' + esc(s.closing) + '</p>';
    }

    // ── 크레딧: 다듬기에만 값이 붙는다 (되묻기 대화는 무료) ────────────────
    // ⚠️ 서버(supabase/functions/sojae-chat/index.ts)도 같은 규칙으로 차감한다.
    //    "한 문제당 얼마" 같은 세션 요금으로 되돌리지 말 것 — 다듬기를 몇 번 눌러도
    //    같은 값이라 하루 무료 한도가 원가 상한 노릇을 못 한다(2026-07-27 확정).
    let _wallet = null;
    async function loadWallet() {
      try {
        const { data } = await MONC.sb.rpc('credit_wallet');
        _wallet = data || null;
      } catch (_) { _wallet = null; }   // 마이그레이션 미적용 → 안내만 생략, 대화는 정상
      return _wallet;
    }
    function refineCost() {
      return Number(_wallet && _wallet.costs && _wallet.costs.sojae) || 2;
    }
    function showRefine() {
      document.getElementById('refineCta').style.display = 'block';
      const note = document.getElementById('refineNote');
      const cost = refineCost();
      const bal = Number(_wallet && _wallet.balance) || 0;
      const freeLeft = Math.floor((Number(_wallet && _wallet.daily_left) || 0) / cost);
      // ⚠️ 무료는 '크레딧'이 아니라 '횟수'로 말한다 — 두 단위를 섞으면
      //    "3크레딧 남았는데 왜 안 되지"가 된다(AI킬러와 같은 규칙).
      note.innerHTML = _wallet === null
        ? '되묻기 대화는 무료예요.'
        : (freeLeft > 0
            ? '되묻기 대화는 무료 · 다듬기는 오늘 <b>' + freeLeft + '번</b> 더 무료예요'
            : (bal >= cost
                ? '되묻기 대화는 무료 · 다듬기에 <b>' + cost + '크레딧</b>이 쓰여요 (남은 크레딧 ' + bal + ')'
                : '오늘 무료분을 다 썼어요 · <a href="ai-killer.html">충전하기</a>'));
      note.style.display = 'block';
    }
    function hideRefine() {
      document.getElementById('refineCta').style.display = 'none';
      document.getElementById('refineNote').style.display = 'none';
    }

    // ── 렌더 헬퍼 ──
    const chat = document.getElementById('chat');
    function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    function bubble(cls, html){
      const d = document.createElement('div');
      d.className = 'bub ' + cls; d.innerHTML = html;
      chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
    }
    // 되묻기 대화 로그 — 다듬기 프롬프트의 {collected_materials} 재료 (docs/prompts/sojae-refine.md)
    // TODO(save): 로그인 붙이면 discovery_messages 에도 저장.
    const transcript = [];
    function ai(html){
      bubble('ai', '<div class="who"><span class="ava">R</span>연구원</div>' + html);
      transcript.push({ role: 'researcher', content: html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() });
    }
    function me(text){
      bubble('me', esc(text));
      transcript.push({ role: 'user', content: text });
    }
    // 지원자가 꺼낸 재료만 모아 텍스트로 (Edge Function 에 {collected_materials} 로 주입)
    function collectedMaterials(){
      return transcript.filter(t => t.role === 'user').map((t, i) => (i + 1) + '. ' + t.content).join('\n');
    }
    // 응답 대기 말풍선(…) — 채워지기 전에는 transcript 에 넣지 않는다
    function aiPending(){
      const d = document.createElement('div');
      d.className = 'bub ai';
      d.innerHTML = '<div class="who"><span class="ava">R</span>연구원</div><span style="color:var(--text-muted);">생각 중…</span>';
      chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
      return d;
    }
    function aiFill(el, html){
      el.innerHTML = '<div class="who"><span class="ava">R</span>연구원</div>' + html;
      chat.scrollTop = chat.scrollHeight;
      transcript.push({ role: 'researcher', content: html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() });
    }

    // ── 입력/전송 ──
    const ta = document.getElementById('ta'), snd = document.getElementById('snd');
    const help = document.getElementById('help'), hint = document.getElementById('hint');
    let idleT;
    function grow(){ ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight,132)+'px'; }
    function toggle(){ ta.value.trim() ? snd.classList.add('on') : snd.classList.remove('on'); }
    function pulse(){
      help.classList.remove('nudge'); void help.offsetWidth; help.classList.add('nudge');
      hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'), 3400);
    }
    function resetIdle(){ clearTimeout(idleT); idleT = setTimeout(pulse, 8000); }
    let userMsgCount = 0;
    let _busy = false;    // AI 응답 대기 중 — 연타/동시요청 방지
    let _ready = false;   // 오늘의 문제 로드 완료 전 전송 방지
    function send(){
      const v = ta.value.trim(); if(!v || _busy || !_ready) return;
      me(v); ta.value=''; grow(); toggle();
      userMsgCount++;
      moncTrack('sojae_turn', { turn: userMsgCount });
      if (userMsgCount >= 2) showRefine();
      saveDraftAnswer();   // 첫 전송부터 answers 초안 행 생성 → 마이페이지 '작성 중'에 노출
      _busy = true;
      const p = aiPending();
      askAI(false).then(html => { aiFill(p, html); _busy = false; syncServer(); });
      resetIdle();
    }
    ta.addEventListener('input', ()=>{ grow(); toggle(); resetIdle(); });
    ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
    snd.addEventListener('click', send);
    help.addEventListener('click', ()=>{
      if (_busy || !_ready) return;
      transcript.push({ role: 'help', content: '잘 안 떠올라요' });   // 서버에서 [막힘 대응] 트리거
      _busy = true;
      const p = aiPending();
      askAI(true).then(html => { aiFill(p, html); _busy = false; syncServer(); });
      resetIdle();
    });

    // ── 다듬기(뼈대) 폴백 — Edge Function 실패 시에만 사용 (실호출은 refineAI) ──
    function refineSkeleton(){
      const mats = transcript.filter(t => t.role === 'user').map(t => t.content);
      const hook = mats[0] ? '“' + esc(mats[0].slice(0, 24)) + (mats[0].length > 24 ? '…' : '') + '”' : '꺼낸 이야기';
      if (category === 'judgment') {
        // 상황판단형: 경험 서술이 아니라 판단·대처 흐름 (프롬프트 [유형별 주의])
        return '<b>답변 뼈대 — 판단·대처 흐름으로</b><br><br>'
          + '① <b>판단 기준</b> — 이 상황에서 무엇을 최우선으로 볼지(안전·규정·승객 마음) 먼저 한 문장으로.<br>'
          + '② <b>즉시 대처</b> — 그 기준에 따라 내가 먼저 할 행동을 순서대로. 여기에 무게를 두세요.<br>'
          + '③ <b>후속 마무리</b> — 동료·선임 공유, 승객 재확인까지 한 문장으로.<br><br>'
          + '<b>강점 포인트</b>: ' + hook + ' 에서 보인 침착한 기준 잡기. 그대로 살리세요.<br><br>'
          + '이제 아래 칸에서 “나는 이렇게 판단하고, 이렇게 대처하겠다” 흐름으로 직접 완성해보세요.';
      }
      return '<b>답변 뼈대 — 이 순서로 말해보세요</b><br><br>'
        + '① <b>장면 꺼내기</b> — ' + hook + ' 상황을 한두 문장으로. 언제·어디서였는지만 간결히.<br>'
        + '② <b>나의 행동</b> — 그때 무엇을 어떤 순서로 했는지. 답변의 무게는 여기에.<br>'
        + '③ <b>결과와 느낀 점</b> — 상대 반응·결과 + 그때 감정을 한 문장으로.<br>'
        + '④ <b>승무원과 연결</b> — 이 경험이 기내에서 어떻게 이어질지로 마무리.<br><br>'
        + '<b>강점 포인트</b>: 직접 겪은 구체적인 장면이 있다는 것. 표정·말 같은 디테일을 살리면 더 생생해져요.<br><br>'
        + '완성 문장은 제가 만들지 않아요 — 아래 칸에 지원자님의 말로 직접 채워보세요.';
    }

    // ── 이어쓰기 저장/복원 (서버 단일 원천) ──────────────────────────────
    // 답변 초안: answers 에 status='draft' 로 upsert(문제당 1행). 완료본이면 final 유지(다운그레이드 방지).
    async function saveDraftAnswer(){
      if (_restoring || !currentQuestion) return;
      let session;
      try { session = await MONC.getSession(); } catch (_) { return; }
      if (!session) return;
      try {
        const status = _answerStatus === 'final' ? 'final' : 'draft';
        const { error } = await MONC.sb.from('answers').upsert(
          { member_id: session.user.id, question_id: currentQuestion.id,
            content: document.getElementById('finalTa').value, status },
          { onConflict: 'member_id,question_id' });
        if (!error) _answerStatus = status;
      } catch (_) {}
    }
    // 대화·뼈대: 세션 1행(문제당 unique) + 아직 안 올린 메시지만 추가 → 재방문해도 중복 없음.
    async function syncServer(stage){
      if (_restoring || !currentQuestion) return;
      let session;
      try { session = await MONC.getSession(); } catch (_) { return; }
      if (!session) return;
      try {
        if (!_srvSession) {
          const { data } = await MONC.sb.from('discovery_sessions')
            .upsert({ member_id: session.user.id, question_id: currentQuestion.id, stage: stage || 'ask' },
                    { onConflict: 'member_id,question_id' })
            .select('id').single();
          if (!data) return;
          _srvSession = data.id;
          const { count } = await MONC.sb.from('discovery_messages')
            .select('id', { count: 'exact', head: true }).eq('session_id', _srvSession);
          _srvSynced = count || 0;                            // 이미 저장된 만큼은 건너뛴다(중복 방지 기준선)
        } else if (stage) {
          await MONC.sb.from('discovery_sessions').update({ stage }).eq('id', _srvSession);
        }
        const pending = transcript.slice(_srvSynced);
        if (pending.length) {
          const rows = pending.map(m => ({
            session_id: _srvSession, member_id: session.user.id,
            role: (m.role === 'help' || m.role === 'researcher') ? m.role : 'user',
            content: m.content,
          }));
          const { error } = await MONC.sb.from('discovery_messages').insert(rows);
          if (!error) _srvSynced = transcript.length;
        }
      } catch (_) {}
    }
    // 저장된 대화를 화면+transcript 로 다시 그린다(복원).
    function replayTranscript(items){
      items.forEach(m => {
        if (m.role === 'user') me(m.content);
        else if (m.role === 'help') transcript.push({ role: 'help', content: m.content }); // 말풍선 없는 트리거
        else ai(m.content);
      });
    }
    // 최종작성 모드 UI 로 전환(복원 시 사용).
    function showWriteMode(){
      hideRefine();
      document.getElementById('askMode').style.display = 'none';
      document.getElementById('step1').classList.remove('on');
      document.getElementById('step2').classList.add('on');
      document.getElementById('step3').classList.add('on');
      document.getElementById('writeMode').style.display = 'block';
    }
    // 진입 시 복원(서버): 그 문제의 대화·뼈대(discovery) + 답변 초안(answers) 을 화면에 재현.
    async function restoreSession(){
      let session;
      try { session = await MONC.getSession(); } catch (_) { return false; }
      if (!session || !currentQuestion) return false;
      let msgs = [], sess = null, answer = null;
      try {
        const { data: s } = await MONC.sb.from('discovery_sessions')
          .select('id, stage').eq('member_id', session.user.id).eq('question_id', currentQuestion.id).maybeSingle();
        sess = s || null;
        if (sess) {
          const r = await MONC.sb.from('discovery_messages')
            .select('role, content').eq('session_id', sess.id).order('created_at', { ascending: true });
          msgs = r.data || [];
        }
        const { data: a } = await MONC.sb.from('answers')
          .select('content, status').eq('member_id', session.user.id).eq('question_id', currentQuestion.id).maybeSingle();
        answer = a || null;
      } catch (_) {}
      // 되살릴 게 아무것도 없으면 새 세션(인사말)로.
      if (!msgs.length && !(answer && answer.content)) return false;
      _restoring = true;
      if (sess) { _srvSession = sess.id; _srvSynced = msgs.length; }   // 이후 syncServer 가 새 메시지만 추가(중복 방지)
      if (answer) _answerStatus = answer.status || 'draft';
      replayTranscript(msgs);
      userMsgCount = transcript.filter(t => t.role === 'user').length;
      if (userMsgCount >= 2) showRefine();
      // 뼈대까지 갔거나(=write/done) 이미 답변을 쓰기 시작했으면 최종작성 모드로 복원
      const inWrite = (sess && (sess.stage === 'write' || sess.stage === 'done')) || (answer && answer.content);
      if (inWrite) {
        showWriteMode();
        if (answer && answer.content) document.getElementById('finalTa').value = answer.content;
      }
      _restoring = false;
      return true;
    }

    // ── 다듬기 진입 → 최종 작성 모드 ──
    document.getElementById('refineCta').addEventListener('click', () => {
      if (_busy) return;                                     // 되묻기 응답 대기 중엔 전환 금지
      moncTrack('sojae_refine_click', { turns: userMsgCount });
      _busy = true;
      hideRefine();                                          // 중복 클릭 방지
      clearTimeout(idleT);                                   // 되묻기 넛지 중지
      document.getElementById('askMode').style.display = 'none';
      document.getElementById('step1').classList.remove('on');
      document.getElementById('step2').classList.add('on');
      ai('좋아요, 지금까지 꺼낸 이야기로 뼈대를 잡아볼게요.');
      const p = aiPending();
      refineAI().then(r => {
        // ⚠️ 크레딧이 모자라거나 실패하면 다음 단계로 넘기면 안 된다 — 되묻기 화면으로
        //    되돌려 이어서 대화하거나 충전할 수 있게 한다(대화는 무료라 잃는 게 없다).
        if (r.err) {
          aiFill(p, esc(r.msg || '다듬기를 하지 못했어요.')
            + (r.err === 'no_credit' ? ' <a href="ai-killer.html">충전하기</a>' : ''));
          document.getElementById('askMode').style.display = 'block';
          document.getElementById('step2').classList.remove('on');
          document.getElementById('step1').classList.add('on');
          showRefine();                                      // 충전 뒤 바로 다시 누를 수 있게
          _busy = false;
          return;
        }
        if (r.v2) {
          aiFill(p, refineHtmlV2(r.v2));
          if (r.v2.card_saved) moncTrack('sojae_card_saved');
        } else {
          aiFill(p, r.html);
        }
        moncTrack('sojae_refine_done');
        syncServer('refine');   // ⚠️ 성공한 뒤에 기록 — 실패했는데 '다듬기 완료'로 남으면
                                //    새로고침 때 되묻기로 못 돌아온다.
        document.getElementById('step3').classList.add('on');
        document.getElementById('writeMode').style.display = 'block';
        chat.scrollTop = chat.scrollHeight;
        _busy = false;
        syncServer('write');
      });
    });
    // 최종 답변 초안 자동 저장(디바운스 800ms)
    let _draftT;
    document.getElementById('finalTa').addEventListener('input', () => {
      clearTimeout(_draftT); _draftT = setTimeout(saveDraftAnswer, 800);
    });

    // ── 답변집 저장 (answers upsert — 문제당 1개, 재저장=수정) ──
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveBtn');
      const footEl = document.getElementById('saveFoot');
      const content = document.getElementById('finalTa').value.trim();
      if (!content) { footEl.textContent = '답변을 입력하세요.'; return; }
      btn.disabled = true; footEl.textContent = '저장 중…';
      try {
        const session = await MONC.getSession();
        if (!session || !currentQuestion) {
          footEl.textContent = '문제 정보를 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.';
        } else {
          const { error } = await MONC.sb.from('answers').upsert(
            { member_id: session.user.id, question_id: currentQuestion.id, content, status: 'final' },
            { onConflict: 'member_id,question_id' });
          if (error) throw error;
          _answerStatus = 'final';               // 이후 자동 저장이 완료본을 draft 로 되돌리지 않게
          footEl.textContent = '답변집에 저장됐어요. (완료)';
          moncTrack('sojae_save_final');
          btn.textContent = '다시 저장';
          syncServer('done');   // 되묻기 대화도 서버에 마저 기록 + 세션 완료 표시
        }
      } catch (e) { footEl.textContent = '저장 실패: ' + e.message; }
      btn.disabled = false;
    });

    // ── 진입: 로그인 가드 → 문제 확정(오늘 또는 ?q=) → 복원 또는 첫 되묻기 ──
    // ?q=<문제id> 로 오면 그 문제를 열어 이어쓰기(오늘 문제에 안 묶임 → 날짜 넘어가도 복원).
    async function fetchQuestionById(id) {
      try {
        const { data } = await MONC.sb.from('questions').select('*').eq('id', id).maybeSingle();
        return data || null;
      } catch (_) { return null; }
    }
    (async () => {
      const session = await MONC.requireSession();   // 미로그인 → login 으로 이동
      if (session && !(await MONC.requireConsent())) return;  // 약관 동의(가입 시 1회) 미완료 → 동의 게이트
      if (!session) return;
      // ⚠️ 구 members.sojae_enabled 권한 차단 화면은 2026-07-27 삭제 — 회원이면 누구나
      //    들어와 되묻기(무료)를 하고, 값은 다듬기에서만 받는다. 권한 게이트 재도입 금지.
      await loadWallet();
      const qid = new URLSearchParams(location.search).get('q');
      const q = qid ? await fetchQuestionById(qid) : await window.SOJAE.fetchTodayQuestion(MONC.sb);
      if (q) { currentQuestion = q; if (CAT_LABEL[q.category]) category = q.category; }
      document.getElementById('catBadge').textContent = CAT_LABEL[category];
      // 저장돼 있으면 대화·뼈대·초안 복원 → 복원되면 인사말 생략(중복 방지)
      const restored = await restoreSession();
      if (!restored) {
        const content = q ? q.content : FALLBACK_QUESTION;
        ai('안녕하세요. 오늘 문제는 <b>' + esc(content) + '</b>이에요. 혹시 떠오르는 순간이 있나요?');
      }
      moncTrack('sojae_start', { category });
      _ready = true;                       // 문제 확정 후에만 전송 허용
      setTimeout(pulse, 1800);             // 인사말이 뜬 뒤에 넛지 시작
      resetIdle();
    })();
  </script>
</body>
</html>
