        후기 전체 보기

    </div>

  <main class="container">
    <div class="st-list" id="stList">
      <div class="rv-skeleton"></div>
      <div class="rv-skeleton"></div>
      <div class="rv-skeleton"></div>
    </div>
    <div class="rv-empty" id="stEmpty" hidden>아직 올라온 합격 수기가 없어요.</div>

    <div class="rv-foot-cta">
      <a class="rv-foot-btn" href="apply.html">나도 도전하기 →</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
  (function () {
    const listEl = document.getElementById('stList');
    const emptyEl = document.getElementById('stEmpty');
    const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function thumbUrl(path) { return MONC.sb.storage.from('reviews').getPublicUrl(path).data.publicUrl; }
    function ymd(d) { const m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[1]}.${m[2]}.${m[3]}` : ''; }
    // 목록용 발췌 — 본문 앞부분을 한 줄로 눌러 두 줄까지만 보여 준다
    function excerpt(body) { return String(body || '').replace(/\s+/g, ' ').trim().slice(0, 160); }

    async function load() {
      if (!window.MONC || !window.MONC.sb) { listEl.innerHTML = ''; emptyEl.hidden = false; emptyEl.textContent = '합격 수기를 불러올 수 없어요.'; return; }
      const { data, error } = await MONC.sb.from('success_stories').select('*').eq('visible', true);
      if (error) {
        listEl.innerHTML = ''; emptyEl.hidden = false;
        // ⚠️ 표 없음 판정은 42P01 이 아니라 PGRST205(PostgREST 스키마 캐시).
        //    마이그레이션 20260801180000 미적용이면 '아직 없음'으로 조용히 떨어뜨린다.
        if (error.code !== 'PGRST205') { console.warn('합격 수기 로드 실패:', error); emptyEl.textContent = '합격 수기를 불러오지 못했어요.'; }
        return;
      }
      const items = (data || []).sort((a, b) =>
        (b.sort_order || 0) - (a.sort_order || 0) ||
        String(b.published_at || b.created_at || '').localeCompare(String(a.published_at || a.created_at || ''))
      );
      if (!items.length) { listEl.innerHTML = ''; emptyEl.hidden = false; return; }
      emptyEl.hidden = true;

      listEl.innerHTML = items.map(s => {
        // ⚠️ 기수 칩은 반드시 '몬크 N기' — 합격 항공사 칩 바로 옆이라 'N기' 만 두면
        //    '대한항공 1기'(항공사 입사 기수)로 읽힌다. 이건 몬크 참여 기수다.
        const tags = (s.airline ? `<span class="st-tag">${esc(s.airline)} 합격</span>` : '')
                   + (s.cohort != null ? `<span class="st-tag st-tag-cohort">몬크 ${Number(s.cohort)}기</span>` : '');
        const meta = [s.author_name || '', ymd(s.published_at)].filter(Boolean).join(' · ');
        const thumb = s.thumb_path ? `<img class="st-thumb" src="${esc(thumbUrl(s.thumb_path))}" alt="" loading="lazy">` : '';
        return `<a class="st-item" href="story.html?id=${encodeURIComponent(s.id)}">
          ${thumb}
          <div class="st-main">
            ${tags ? `<div class="st-tags">${tags}</div>` : ''}
            <h2 class="st-title">${esc(s.title)}</h2>
            <p class="st-excerpt">${esc(excerpt(s.body))}</p>
            ${meta ? `<div class="st-meta">${esc(meta)}</div>` : ''}
          </div>
        </a>`;
      }).join('');
    }

    load();
  })();
  </script>

<script>
/* bfcache — 뒤로/앞으로 오면 크롬은 떠날 때 그리던 화면을 그대로 되살린다(파일을 새로 받지 않는다).
