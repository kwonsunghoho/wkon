  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'SUIT Variable', SUIT,'Apple SD Gothic Neo',-apple-system,sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    .container { max-width: 720px; margin: 0 auto; padding: 0 20px; }   /* 읽는 글이라 한 줄이 길어지지 않게 */
    a { color: inherit; }

    /* ⚠️ 보조 텍스트는 opacity 로 흐리지 말 것(9대원칙 4 · 4.5:1). 확정 색을 직접 쓴다. */
    :root { --rv-dim: #5D5851; }

    .st-back { display: inline-flex; align-items: center; gap: 6px; margin-top: 88px; font-size: 14px; font-weight: 800; color: var(--accent-ink); text-decoration: none; padding: 8px 4px; }
    .st-back:hover { text-decoration: underline; }
    .st-back svg { width: 14px; height: 14px; }

    .st-head { padding: 10px 0 22px; border-bottom: 1px solid var(--border-soft); }
    .st-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .st-tag { font-size: 12px; font-weight: 800; padding: 4px 11px; border-radius: 999px; background: rgba(27,58,107,.10); color: var(--accent-ink); }
    .st-tag-cohort { background: var(--action-tint); }
    /* 히어로 제목은 500 이상 — 300 은 한글 SUIT 에서 큰 글씨가 본문보다 흐리게 읽힌다(상세 4종 전례) */
    .st-title { font-family: var(--serif); font-size: clamp(24px, 4.6vw, 34px); font-weight: 700; line-height: 1.35; color: var(--accent); letter-spacing: -.5px; word-break: keep-all; }
    .st-meta { font-size: 14px; font-weight: 700; color: var(--rv-dim); margin-top: 12px; font-variant-numeric: tabular-nums; }

    .st-cover { width: 100%; height: auto; display: block; margin: 22px 0 0; border-radius: var(--radius-sm); background: var(--surface2); }

    /* 본문 — 평문을 빈 줄 기준으로 문단으로 끊는다. 활자 하한 15px(9대원칙 1) */

    .rv-foot-cta { text-align: center; padding: 18px 0 72px; }

<body>

  <main class="container">
    <a class="st-back" href="stories.html">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      합격 수기 목록
    </a>

    <article id="stArticle" hidden>
      <header class="st-head">
        <div class="st-tags" id="stTags"></div>
        <h1 class="st-title" id="stTitle"></h1>
        <div class="st-meta" id="stMeta"></div>
      </header>
      <img class="st-cover" id="stCover" alt="" hidden>
      <div class="st-body" id="stBody"></div>
      <div class="st-foot">
        <p class="st-foot-note">MONC 몬크와 함께 준비한 기록입니다.</p>
      </div>
    </article>

    <div id="stLoading">
      <div class="rv-skeleton" style="height:32px;width:70%;margin-top:24px"></div>
      <div class="rv-skeleton" style="height:16px;width:40%"></div>
      <div class="rv-skeleton" style="height:220px;margin-top:20px"></div>
    </div>
    <div class="rv-empty" id="stEmpty" hidden>수기를 찾을 수 없어요.</div>

    <div class="rv-foot-cta">
      <a class="rv-foot-btn" href="apply.html">나도 도전하기 →</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
  (function () {
    const artEl = document.getElementById('stArticle');
    const loadEl = document.getElementById('stLoading');
    const emptyEl = document.getElementById('stEmpty');
    const id = new URLSearchParams(location.search).get('id');

    function thumbUrl(path) { return MONC.sb.storage.from('reviews').getPublicUrl(path).data.publicUrl; }
    function ymd(d) { const m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[1]}.${m[2]}.${m[3]}` : ''; }

    function fail(msg) { loadEl.hidden = true; emptyEl.hidden = false; if (msg) emptyEl.textContent = msg; }

    async function load() {
      if (!id) { fail('주소에 수기 번호가 없어요.'); return; }
      if (!window.MONC || !window.MONC.sb) { fail('수기를 불러올 수 없어요.'); return; }
      // visible 조건을 같이 걸어, 비공개 수기는 주소를 알아도 열리지 않게 한다
      // (RLS 정책도 같은 조건이라 이중 방어다).
      const { data, error } = await MONC.sb.from('success_stories').select('*').eq('id', id).eq('visible', true).maybeSingle();
      if (error) {
        if (error.code !== 'PGRST205') console.warn('합격 수기 로드 실패:', error);
        fail('수기를 찾을 수 없어요.'); return;
      }
      if (!data) { fail('수기를 찾을 수 없어요.'); return; }

      document.title = data.title + ' — MONC 몬크';
      document.getElementById('stTitle').textContent = data.title;

      const tagsEl = document.getElementById('stTags');
      // ⚠️ 칩 글자는 stories.html 목록과 같은 규칙 — 항공사는 'OO 합격', 기수는 '몬크 N기'.
      //    'N기' 만 두면 항공사 칩 옆에서 '대한항공 1기'(입사 기수)로 읽힌다.
      if (data.airline) { const s = document.createElement('span'); s.className = 'st-tag'; s.textContent = data.airline + ' 합격'; tagsEl.appendChild(s); }
      if (data.cohort != null) { const s = document.createElement('span'); s.className = 'st-tag st-tag-cohort'; s.textContent = '몬크 ' + Number(data.cohort) + '기'; tagsEl.appendChild(s); }

      const meta = [data.author_name || '', ymd(data.published_at)].filter(Boolean).join(' · ');
      document.getElementById('stMeta').textContent = meta;

      if (data.thumb_path) {
        const cover = document.getElementById('stCover');
        cover.src = thumbUrl(data.thumb_path);
        cover.hidden = false;
      }

      /* 본문 — 평문을 빈 줄로 끊어 <p> 로 세운다.
         ⚠️ textContent 로 넣는다(innerHTML 금지) — 수기는 사람이 쓴 글이라
            <> 가 섞여 들어올 수 있고, HTML 로 해석하면 그대로 실행된다. */
      const bodyEl = document.getElementById('stBody');
      String(data.body || '').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean).forEach(par => {
        const p = document.createElement('p');
        p.textContent = par;          // 문단 안 홑 줄바꿈은 그대로 흐르게 둔다
        bodyEl.appendChild(p);
      });

      loadEl.hidden = true; artEl.hidden = false;
    }

    load();
  })();
  </script>

<script>
/* bfcache — 뒤로/앞으로 오면 크롬은 떠날 때 그리던 화면을 그대로 되살린다(파일을 새로 받지 않는다).
   배포 전에 열어 둔 탭·기록이 있으면 옛 화면이 그대로 뜬다(2026-08-03 오너 지적).
   입력값이 없는 화면이라 통째로 다시 받는다 — lab·answers·mypage 와 같은 규칙(CLAUDE.md).
   ⚠️ 홈(index.html)은 일부러 뺀다 — 뒤로 올 때마다 히어로 애니메이션이 처음부터 다시 돌아 오너가 기각했다. */
window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
</script>
