  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'SUIT Variable', SUIT,'Apple SD Gothic Neo',-apple-system,sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; }
    .container { max-width: 640px; margin: 0 auto; padding: 0 20px; }
    a { color: inherit; }
    /* touch-action — 게임은 연타가 기본이라 더블탭 줌이 걸리면 화면이 튄다 */
    button { font: inherit; color: inherit; touch-action: manipulation; }
    .gm-board { user-select: none; -webkit-user-select: none; }

    .bf-head { padding: 104px 0 4px; text-align: center; }
    .bf-eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .24em; color: var(--accent-ink); }
    .bf-title { font-size: clamp(28px, 5vw, 42px); font-weight: 800; color: var(--accent); letter-spacing: -.6px; margin-top: 10px; }
    .bf-sub { font-size: 15px; color: var(--text); opacity: .72; margin-top: 12px; max-width: 34em; margin-left: auto; margin-right: auto; text-wrap: balance; }
    .bf-sub b { color: var(--action); font-weight: 800; white-space: nowrap; }

    /* ── 안내 상자 — 자체 제작 고지(법적)·PC 응시 안내. 활자 12px 하한 준수 ── */
    .gm-note { margin: 22px auto 0; max-width: 560px; padding: 12px 14px; background: var(--bg2);
      border-radius: 12px; font-size: 12.5px; color: var(--text-muted); line-height: 1.65; text-align: left; }
    .gm-note b { color: var(--text); font-weight: 700; }

    /* ── 게임 목록(허브) — 2열 카드, 순백 배경 위라 테두리+그림자로 띄운다(밝기 차 아님) ── */
    .gm-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
    @media (min-width: 600px) { .gm-grid { grid-template-columns: repeat(3, 1fr); } }
    .gm-card { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 108px;
      padding: 14px 14px 12px; background: var(--surface); border: 1px solid var(--border-soft);
      border-radius: 16px; box-shadow: var(--shadow); text-align: left; cursor: pointer; }
    .gm-card:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    @media (hover: hover) { .gm-card:hover { border-color: rgba(23,42,71,.30); } }
    /* 자체 아이콘 — 이모지 금지(2026-08-25 오너). 굵기는 심볼이 아니라 여기(바깥 svg)서 준다 — tools.html 규칙 */
    .gm-card .ic { line-height: 0; margin-bottom: 8px; }
    .gm-card .ic svg { width: 26px; height: 26px; stroke-width: 1.5; color: var(--accent-ink); }
    .gm-top h2 svg { width: 21px; height: 21px; stroke-width: 1.8; color: var(--accent-ink);
      vertical-align: -3px; margin-right: 3px; }
    .gm-result .r-name svg { width: 15px; height: 15px; stroke-width: 1.9; color: var(--accent-ink);
      vertical-align: -2.5px; margin-right: 2px; }
    .gm-card .nm { font-size: 15px; font-weight: 800; color: var(--ink); }
    .gm-card .ms { font-size: 12px; color: var(--text-muted); line-height: 1.45; }
    .gm-card .bs { font-size: 12px; font-weight: 700; color: var(--accent-ink); margin-top: auto; padding-top: 6px; }

    /* ── 게임 화면(스테이지) — 허브와 자리를 바꿔 그린다 ── */
    .gm-stage { display: none; margin-top: 18px; }
    .gm-stage.on { display: block; }
    .gm-hubwrap.off { display: none; }

    .gm-top { display: flex; align-items: center; gap: 10px; }
    .gm-back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px;
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer; }
    .gm-back:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .gm-top h2 { font-size: 19px; font-weight: 800; }

    /* 시작 전 소개 판 */
    .gm-intro { margin-top: 14px; padding: 18px 16px 16px; background: var(--surface);
      border: 1px solid var(--border-soft); border-radius: 16px; box-shadow: var(--shadow); }
    .gm-intro .meas { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--accent-ink);
      background: var(--accent-tint); border-radius: 8px; padding: 3px 10px; }
    .gm-intro ul { margin: 12px 0 0; padding-left: 18px; font-size: 14.5px; line-height: 1.7; }
    .gm-intro details { margin-top: 12px; font-size: 13.5px; color: var(--text-muted); }
    .gm-intro summary { cursor: pointer; font-weight: 700; color: var(--text); min-height: 44px; display: flex; align-items: center; }
    .gm-start { display: block; width: 100%; margin-top: 14px; min-height: 52px; background: var(--action);
      color: var(--action-ink); border: 0; border-radius: 12px; font-size: 16px; font-weight: 800;
      cursor: pointer; box-shadow: var(--shadow-action); }
    .gm-start:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 2px; }
    /* 모드가 있는 게임 — 슬라이더·옵션 나열 대신 버튼 두세 개(기본값 고정 — "더 쉽게", 오너 방향) */
    .gm-start small { display: block; font-size: 12px; font-weight: 500; opacity: .85; margin-top: 2px; }
    .gm-start.alt { margin-top: 8px; background: var(--surface); color: var(--text);
      border: 1px solid var(--border-strong); box-shadow: none; }
    .gm-start.alt small { color: var(--text-muted); opacity: 1; }

    /* 문항 제한시간 막대 — 문항당 3초 같은 짧은 시간은 전역 타이머 대신 이걸 쓴다 */
    .gm-qtimer { height: 6px; max-width: 340px; margin: 12px auto; border-radius: 999px;
      background: var(--bg3); overflow: hidden; }
    .gm-qtimer i { display: block; height: 100%; width: 0; background: var(--action); border-radius: 999px; }

    /* 진행 중 HUD — 값에는 이름을 붙인다(원칙 15) */
    .gm-hud { display: none; align-items: center; gap: 12px; margin-top: 14px; padding: 10px 14px;
      background: var(--surface); border: 1px solid var(--border-soft); border-radius: 12px; }
    .gm-hud.on { display: flex; }
    .gm-hud .hv { font-size: 13px; color: var(--text-muted); }
    .gm-hud .hv b { display: block; font-size: 18px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
    .gm-hud .bar { flex: 1 1 auto; height: 8px; border-radius: 999px; background: var(--bg3); overflow: hidden; }
    .gm-hud .bar i { display: block; height: 100%; width: 100%; background: var(--action); border-radius: 999px;
      transition: width .2s linear; }

    /* 게임 보드 공통 */
    .gm-board { margin-top: 12px; padding: 16px 12px 18px; background: var(--surface);
      border: 1px solid var(--border-soft); border-radius: 16px; box-shadow: var(--shadow);
      min-height: 300px; display: none; }
    .gm-board.on { display: block; }
    .gm-q { text-align: center; font-size: 16px; font-weight: 800; color: var(--ink); margin-bottom: 12px; }
    .gm-q .sub { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-top: 2px; }

    /* 결과 판 */
    .gm-result { display: none; margin-top: 14px; padding: 24px 16px; background: var(--surface);
      border: 1px solid var(--border-soft); border-radius: 16px; box-shadow: var(--shadow); text-align: center; }
    .gm-result.on { display: block; }
    .gm-result .r-name { font-size: 13px; font-weight: 700; color: var(--text-muted); }
    .gm-result .r-score { font-size: 42px; font-weight: 800; color: var(--accent); line-height: 1.2; margin-top: 4px; }
    .gm-result .r-score small { font-size: 16px; font-weight: 700; color: var(--text-muted); }
    .gm-result .r-best { font-size: 13.5px; color: var(--text-muted); margin-top: 6px; }
    .gm-result .r-best b { color: var(--accent-ink); }
    .gm-result .r-new { display: inline-block; margin-top: 8px; font-size: 12.5px; font-weight: 800;
      color: var(--action-ink); background: var(--action); border-radius: 8px; padding: 3px 10px; }
    .gm-result .r-btns { display: flex; gap: 10px; margin-top: 18px; }
    .gm-result .r-btns button { flex: 1 1 0; min-height: 48px; border-radius: 12px; font-size: 15px;
      font-weight: 800; cursor: pointer; }
    .gm-again { background: var(--action); color: var(--action-ink); border: 0; box-shadow: var(--shadow-action); }
    .gm-tohub { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); }
    .r-btns button:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 2px; }

    /* ── 게임별 부품 ── */
    /* 큰 선택 버튼(가위바위보·개수 비교) */
    .gm-bigrow { display: flex; gap: 10px; justify-content: center; }
    .gm-big { flex: 1 1 0; max-width: 150px; min-height: 84px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px; background: var(--surface);
      border: 1.5px solid var(--border-strong); border-radius: 14px; cursor: pointer;
      font-size: 13px; font-weight: 800; color: var(--ink); }
    .gm-big svg { width: 32px; height: 32px; stroke-width: 1.4; }
    .gm-big:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .gm-big:active { background: var(--accent-tint); }
    .gm-oppo { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 96px;
      font-size: 14px; font-weight: 800; color: var(--ink); }
    .gm-oppo svg { width: 58px; height: 58px; stroke-width: 1.1; }
    .gm-rule { text-align: center; }
    .gm-rule b { display: inline-block; font-size: 22px; font-weight: 800; padding: 4px 18px; border-radius: 12px;
      background: var(--accent-tint); color: var(--accent-ink); }

    /* 정오 피드백 번쩍임 */
    .gm-flash-ok { animation: gmok .25s; }
    .gm-flash-no { animation: gmno .3s; }
    @keyframes gmok { 0% { background: #E7F3EA; } 100% { background: transparent; } }
    @keyframes gmno { 0%, 60% { background: #FBEBEA; } 100% { background: transparent; } }
    .gm-shake { animation: gmshake .3s; }
    @keyframes gmshake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

    /* 격자 보드(숫자 누르기·도형 순서) */
    .gm-cells { display: grid; gap: 8px; margin: 0 auto; max-width: 340px; }
    .gm-cell { aspect-ratio: 1/1; min-width: 0; border-radius: 12px; border: 1.5px solid var(--border-strong);
      background: var(--surface); font-size: 20px; font-weight: 800; color: var(--ink); cursor: pointer;
      display: flex; align-items: center; justify-content: center; }
    .gm-cell:focus-visible { outline: 3px solid var(--action); outline-offset: 1px; }
    .gm-cell.done { border-color: var(--border-soft); background: var(--bg2); color: var(--text-dim); }
    .gm-cell.lit { background: var(--action); border-color: var(--action); color: var(--action-ink); }
    .gm-cell.empty { border-color: transparent; background: transparent; cursor: default; }

    /* 개수 비교 — 단어가 흩어진 좌우 판(1초 노출 뒤 사라짐) */
    .gm-wpanel { position: relative; flex: 1 1 0; aspect-ratio: 5/6; max-width: 170px; background: var(--bg2);
      border: 1.5px solid var(--border-strong); border-radius: 14px; cursor: pointer; overflow: visible; }
    .gm-wpanel:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .gm-wpanel span { position: absolute; font-weight: 800; color: var(--accent); line-height: 1; white-space: nowrap; }
    .gm-wpanel .tag { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%);
      font-size: 12px; font-weight: 800; font-style: normal; color: var(--action-ink); background: var(--action);
      padding: 2px 12px; border-radius: 999px; z-index: 1; }
    .gm-reveal { text-align: center; font-size: 14px; font-weight: 800; color: var(--ink); min-height: 24px; }

    /* 도형 회전 */
    .gm-rot-target { display: flex; justify-content: center; margin-bottom: 14px; }
    .gm-rot-opts { display: grid; grid-template-columns: repeat(2, minmax(0,150px)); gap: 10px; justify-content: center; }
    .gm-shape { padding: 10px; background: var(--bg2); border: 1.5px solid var(--border-strong);
      border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .gm-shape:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .gm-shape.target { background: var(--accent-tint); cursor: default; }

    /* 길 만들기 */
    .gm-path { display: grid; gap: 4px; margin: 0 auto; max-width: 340px; }
    .gm-tile { aspect-ratio: 1/1; min-width: 0; border-radius: 10px; border: 1px solid var(--border-soft);
      background: var(--bg2); cursor: pointer; padding: 0; position: relative; }
    .gm-tile:focus-visible { outline: 3px solid var(--action); outline-offset: 1px; }
    .gm-tile svg { display: block; width: 100%; height: 100%; transition: transform .12s; }
    .gm-tile.hot svg { stroke: var(--accent); }
    .gm-pathmeta { display: flex; justify-content: center; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--text-muted); }

    /* 약속 정하기 */
    .gm-say { max-width: 380px; margin: 0 auto 12px; display: flex; flex-direction: column; gap: 6px; }
    .gm-say p { font-size: 14px; line-height: 1.55; background: var(--bg2); border-radius: 12px; padding: 8px 12px; }
    .gm-say p b { color: var(--accent-ink); }
    .gm-week { display: grid; grid-template-columns: 44px repeat(5, 1fr); gap: 5px; max-width: 380px; margin: 0 auto; }
    .gm-week .hd { font-size: 12.5px; font-weight: 800; color: var(--text-muted); text-align: center; align-self: center; }
    .gm-slot { min-height: 46px; border-radius: 10px; border: 1.5px solid var(--border-strong);
      background: var(--surface); cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text-dim); }
    .gm-slot:focus-visible { outline: 3px solid var(--action); outline-offset: 1px; }

    /* 도형 2-back — 가운데 큰 도형 + 판단 버튼 */
    .gm-nb-stage { display: flex; align-items: center; justify-content: center; min-height: 128px;
      font-size: 15px; font-weight: 800; color: var(--text-muted); text-align: center; }
    .gm-nb-stage svg { width: 92px; height: 92px; color: var(--accent); }
    .gm-nb-btns { display: flex; gap: 8px; justify-content: center; }
    .gm-nb-btns button { flex: 1 1 0; max-width: 150px; min-height: 56px; border-radius: 12px;
      border: 1.5px solid var(--border-strong); background: var(--surface); font-size: 13px; font-weight: 800;
      cursor: pointer; padding: 6px 4px; line-height: 1.35; }
    .gm-nb-btns button:disabled { opacity: .4; cursor: default; }
    .gm-nb-btns button:focus-visible { outline: 3px solid var(--action); outline-offset: 1px; }

    .gm-foot { padding: 44px 0 80px; }

    @media (max-width: 360px) {
      .container { padding: 0 12px; }
      .gm-grid { gap: 8px; }
    }
  </style>
</head>
