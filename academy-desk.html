<main class="ac-main ac-desk" id="academy" data-mode="teacher">
<div class="ac-top"><a href="mypage.html">← 마이페이지</a><a href="academy.html">내 수업 →</a></div>
<header class="ac-intro"><span class="ac-status">MONC TEACHER DESK</span><h1>수업 피드백</h1><p class="ac-muted">학생의 제출물을 확인하고 피드백을 남겨 주세요.</p></header>
<p id="acMessage" class="ac-notice" role="status" aria-live="polite">권한을 확인하고 있어요.</p>
<div id="acList" hidden><div class="ac-row"><div><label for="acCourse">수업</label><select id="acCourse"></select></div><div><label for="acFilter">피드백 상태</label><select id="acFilter"><option value="submitted">피드백 대기</option><option value="revision_requested">학생 수정 대기</option><option value="approved">완료</option><option value="">전체 제출</option></select></div></div>
<ul id="acTasks" class="ac-list"></ul><div class="ac-actions"><button id="acPrevious" type="button">이전 목록</button><button id="acNext" type="button">다음 목록</button></div>
<details class="ac-card"><summary>과제 등록</summary><form id="acTaskForm"><label for="acTaskTitle">과제 제목</label><input id="acTaskTitle" required maxlength="160"><label for="acTaskPrompt">과제 안내</label><textarea id="acTaskPrompt" maxlength="12000"></textarea><div class="ac-row"><div><label for="acTaskKind">제출 종류</label><select id="acTaskKind"><option value="text">글</option><option value="video">영상</option><option value="audio">음성</option></select></div><div><label for="acTaskDue">마감일시 · 한국 시간</label><input id="acTaskDue" type="datetime-local" required></div></div><div class="ac-actions"><button class="ac-primary" type="submit">과제 등록</button></div><p id="acTaskMessage" class="ac-notice" role="status"></p></form></details>
<details class="ac-card" id="acAdmin" hidden><summary>수업 · 학생 · 선생님 관리</summary>
<form id="acCourseForm"><label for="acNewCourse">새 수업 이름</label><input id="acNewCourse" required maxlength="120"><div class="ac-actions"><button type="submit">수업 만들기</button></div></form>
<form id="acMemberSearch"><label for="acSearch">가입 회원 찾기 · 이름 또는 이메일</label><input id="acSearch" required minlength="2"><div class="ac-actions"><button type="submit">회원 찾기</button></div></form>
<form id="acEnrollForm"><label for="acMember">연결할 회원</label><select id="acMember" required></select><label for="acStudentName">수업에서 사용할 이름</label><input id="acStudentName" required maxlength="80"><div class="ac-row"><div><label for="acStart">수강 시작일</label><input id="acStart" type="date" required></div><div><label for="acEnd">수강 종료일 · 선택</label><input id="acEnd" type="date"></div></div><div class="ac-actions"><button type="submit">선택한 수업에 학생 등록</button><button type="button" id="acAddTeacher">선생님 권한 부여</button><button type="button" id="acRemoveTeacher">선생님 권한 해제</button></div></form>
<p id="acAdminMessage" class="ac-notice" role="status"></p><p id="acUsage" class="ac-meta"></p>
</details></div><section id="acEditor" hidden></section>
</main>
