    /* 챌린지 제출 전용 화면 (2026-08-24 오너 "링크 하나 주면 로그인해서 올리고, 마이페이지에도 남게")

<!-- 기수 시작 전 잠금 판정(2026-09-03) — mypage 제출 카드·admin 과 같은 파일(MONC_GATE). -->
<script src="round-gate.js?v=1"></script>
<script>
  /* bfcache 로 되살아나면 통째로 새로고침 — 입력값 없는 화면 공통 규칙(CLAUDE.md).
     스크롤은 scroll-keep.js 가 되돌린다. */
  window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

  (function () {
    'use strict';
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
      m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

    /* ── 칸 정의 — mypage 제출 카드와 한 벌(이름을 바꾸면 mypage.html·admin.html 도 같이) ── */
    const CH_META = {
      voice:      { label: '보.신.각 · 보이스', media: 'audio', accept: 'audio/*', what: '음성' },
      expression: { label: '영.합.각 · 표현력', media: 'video', accept: 'video/*', what: '영상' },
      spinning:   { label: '스.피.닝 · 스피치', media: 'audio', accept: 'audio/*', what: '음성' },
      answer:     { label: '승.자.각 · 답변', media: 'answers' },
      culture:    { label: '댄.특.완 · 대한항공 특화 답변', media: 'answers' },
    };
    const CH_ORDER = ['voice', 'expression', 'spinning', 'answer', 'culture'];
    // 스피닝만 첫날 녹음 2개(before·before2) — 나머지는 처음/끝 한 쌍
    const typesOf = ch => ch === 'spinning' ? ['before', 'before2', 'after'] : ['before', 'after'];
    const tagOf = (ch, type) => type === 'after' ? '끝 · 마칠 무렵'
      : ch === 'spinning' ? (type === 'before' ? '첫날 ① · 첫 녹음본' : '첫날 ② · 다시 읽은 녹음본')
        : '처음 · 시작 무렵';
    const hintOf = ch => ch === 'spinning'
      ? '첫날에 녹음 두 개를 올려 주세요 — ① 첫 녹음본, ② 발음을 신경 써서 다시 읽은 녹음본. 마지막 날엔 녹음본 하나예요.'
      : `챌린지 ${CH_META[ch].what}을 직접 올려 주세요 — 시작 무렵 한 번, 마칠 무렵 한 번이면 됩니다.${CH_META[ch].media === 'video' ? ' 영상은 1~2분, 50MB 이하로 부탁해요.' : ''}`;
    const MAX_MB = 50;   // recordings 버킷 file_size_limit(50MB)와 한 쌍

    /* ── 링크 매개변수 — 오픈챗에 공유하는 주소가 여기를 정한다.
       ?t=before(시작 무렵) / ?t=after(마칠 무렵) : 그 시기의 칸만 보여준다(없으면 전부).
       ?ch=voice|expression|spinning|answer|culture : 그 챌린지만(없으면 내가 참가한 전부).
       기수는 링크에 안 싣는다 — 각자 신청에서 자동으로 붙는다(저장 시 round). ── */
    const qs = new URLSearchParams(location.search);
    const onlyCh = CH_META[qs.get('ch')] ? qs.get('ch') : '';
    const onlyT = ['before', 'after'].indexOf(qs.get('t')) >= 0 ? qs.get('t') : '';

    document.getElementById('sbSub').textContent =
      onlyT === 'before' ? '시작 무렵(첫날) 제출물을 올리는 곳이에요.'
      : onlyT === 'after' ? '마칠 무렵(마지막 날) 제출물을 올리는 곳이에요.'
      : '챌린지 제출물을 올리는 곳이에요.';

    /* ── 답변형 챌린지(승자각·댄특완) DAY 문항 ─────────────────────────────────
       ⚠️ 정본은 challenge_lessons(admin '챌린지' 탭 → DAY 문항 고치기)다. 아래는 **폴백**이니
          지우지 말 것 — 표가 없거나 조회에 실패하면 이 값으로 그린다.
       ⚠️⚠️ 둘 다 저장소(answers)에 같은 모양의 제목으로 쌓인다. 'DAY 1' 만으로는 어느
          챌린지의 DAY 1 인지 알 수 없어(둘 다 1~10), 제목 앞 **표식**으로 가른다.
          승자각은 표식이 없다(빈 문자열) — 이미 쌓인 답변 제목을 깨지 않기 위해서다.
          새 답변형 챌린지를 넣으면 반드시 고유 표식을 준다.
       ⚠️ 학생이 저장소에서 제목을 고쳐 표식을 지우면 그 답변은 다시 '쓰기'로 보인다.
          번호·낱말만으로 가르면 반대로 **남의 챌린지 답변이 '작성됨'으로 잘못 뜬다** —
          덜 나쁜 쪽을 택했다. 표식을 떼지 말 것. */
    const ANSWER_CHS = ['answer', 'culture'];
    const CH_DAY_MARK = { answer: '', culture: '댄.특.완 ' };
    /* 이름이 바뀌기 전(2026-09-04 '대.문.각')에 쓴 답변도 계속 알아본다 — 표식이 학생의
       답변 제목에 이미 박혀 있어서, 새 표식만 보면 그 답변들이 전부 '쓰기'로 되돌아간다.
       ⚠️ 지우지 말 것. 새 표식은 위 CH_DAY_MARK 가, 알아보기는 여기까지가 담당이다. */
    const CH_DAY_MARK_OLD = { culture: ['대.문.각'] };
    const DAY_FALLBACK = {
      answer: [
      'DAY 1. 가치관',
      'DAY 2. 좋은 서비스',
      'DAY 3. 팀워크',
      'DAY 4. 규정 상황 대처',
      'DAY 5. 실패 경험',
      'DAY 6. 항공사 장점',
      'DAY 7. 뽑아야 하는 이유',
      'DAY 8. 영어 자기소개',
      'DAY 9. 승무원 자질',
      'DAY 10. 마지막 할 말'
      ],
      culture: [
      'DAY 1. 좋은 신입은 처음부터 일을 잘하는 사람일까?',
      'DAY 2. 팀워크는 사이좋게 지내는 게 아니다',
      'DAY 3. 센스 있는 승무원은 무조건 먼저 움직이지 않는다',
      'DAY 4. 친절한 승무원이 좋은 승무원일까?',
      'DAY 5. 그래서 대한항공은 어떤 사람과 같이 일하고 싶을까?',
      'DAY 6. 면접관은 승무원이 아닙니다',
      'DAY 7. 일을 못해서 미운 후배는 별로 없었습니다',
      'DAY 8. 싫어하는 사람이랑도 비행해야 합니다',
      'DAY 9. 임원과 최종의 합격 차이',
      'DAY 10. 대한항공 10년 후, 다시 신입 면접을 본다면'
      ]
    };
    // 사이 공백·마침표·괄호를 걷어낸 비교용 문자열. 'DAY 1. 자기소개' → 'day1자기소개'
    const normTitle = s => String(s || '').toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
    // 문항 이름 → 작성 판정에 쓸 낱말. '장점/단점' 처럼 갈래가 있으면 나눠 각각 본다.
    // ⚠️ 낱말을 손으로 적는 칸이 admin 에 있었는데 2026-08-24 없앴다(오너 "헷갈려").
    //    규칙은 이 함수 하나다 — 문항 이름이 곧 낱말이다. 손으로 적는 목록을 다시 만들지 말 것.
    const wordsOf = title => String(title || '').split(/[\/·,]/).map(x => normTitle(x)).filter(Boolean);
    const dayWordsOf = list => list.map(d => wordsOf(d.replace(/^DAY\s*\d+\.\s*/, '')));
    let CH_DAYS = { answer: DAY_FALLBACK.answer.slice(), culture: DAY_FALLBACK.culture.slice() };
    let CH_DAY_WORDS = { answer: dayWordsOf(CH_DAYS.answer), culture: dayWordsOf(CH_DAYS.culture) };

    // 제목 → 그 챌린지의 DAY 번호(못 찾으면 0). ① 표식으로 챌린지를 가르고
    // ② 'DAY 3'·'3일차' 같은 번호가 있으면 그것 ③ 없으면 낱말.
    // ⚠️ 정확 일치로 되돌리지 말 것 — 학생이 저장소에서 제목을 고치면 이미 쓴 답변이
    //    다시 '쓰기'로 보여 "썼는데 왜 안 뜨냐"가 됐다(2026-08-23).
    function dayNoOf(title, ch) {
      const t = normTitle(title);
      if (!t) return 0;
      const marksOf = k => [CH_DAY_MARK[k] || ''].concat(CH_DAY_MARK_OLD[k] || [])
        .map(normTitle).filter(Boolean);
      const mine = marksOf(ch);
      if (mine.length) {
        if (!mine.some(m => t.indexOf(m) >= 0)) return 0;   // 표식 있는 챌린지 = 표식이 있어야 내 것
      } else if (ANSWER_CHS.some(k =>                       // 표식 없는 챌린지 = 남의 표식이 붙었으면 남의 것
        marksOf(k).some(m => t.indexOf(m) >= 0)
      )) return 0;
      const days = CH_DAYS[ch] || [], words = CH_DAY_WORDS[ch] || [];
      const m = t.match(/day0*(\d{1,2})/) || t.match(/(\d{1,2})일차/);
      if (m) { const n = Number(m[1]); if (n >= 1 && n <= days.length) return n; }
      for (let i = 0; i < words.length; i++) {
        if (words[i].some(w => t.indexOf(w) >= 0)) return i + 1;
      }
      return 0;
    }
    // ⚠️ 챌린지별로 나눠 받는다 — 한쪽 조회가 실패해도 다른 쪽 폴백만 남기고 넘어간다.
    async function loadDayLessons() {
      for (const ch of ANSWER_CHS) {
        try {
          const { data, error } = await MONC.sb.from('challenge_lessons')
            .select('day_no, title').eq('challenge', ch).order('day_no');
          if (error || !data || !data.length) continue;
          CH_DAYS[ch] = data.map(r => 'DAY ' + r.day_no + '. ' + r.title);
          CH_DAY_WORDS[ch] = data.map(r => wordsOf(r.title));
        } catch (_) { /* 표 미생성 — 폴백 문항으로 그린다 */ }
      }
    }

    let ctx = null;   // 업로드 뒤 다시 그릴 재료 { me, partOf, lockOf }
    const mdKor = s => { const p = String(s || '').split('-'); return p.length === 3 ? (+p[1]) + '월 ' + (+p[2]) + '일' : ''; };

    function slotHtml(ch, type, sub, notReady) {
      let body;
      if (sub) {
        const day = String(sub.updated_at || sub.created_at || '').slice(0, 10).replace(/-/g, '.');
        body = `<div id="sbPlay-${ch}-${type}"></div>
          <div class="sb-row">
            <button type="button" class="sb-btn ghost" data-cs="${ch}" data-type="${type}" data-old="${esc(sub.storage_path)}">다시 올리기</button>
            ${day ? `<span class="sb-hint" style="margin:0;">${esc(day)} 올림</span>` : ''}
          </div>`;
      } else if (notReady) {
        body = '<div class="sb-empty">제출 준비 중이에요. 조금만 기다려 주세요.</div>';
      } else {
        body = `<div class="sb-empty">아직 올린 파일이 없어요.</div>
          <div class="sb-row"><button type="button" class="sb-btn" data-cs="${ch}" data-type="${type}">올리기</button></div>`;
      }
      return `<div class="sb-slot${type === 'after' ? ' after' : ''}"><div class="sb-tag">${tagOf(ch, type)}</div>${body}</div>`;
    }

    // lockOf[챌린지] = 시작일 — 있으면 시작 전(2026-09-03). 문항·제출 칸 대신 시작일 안내만 그린다.
    async function render(me, partOf, lockOf) {
      const box = document.getElementById('sbCards');
      lockOf = lockOf || {};
      ctx = { me: me, partOf: partOf, lockOf: lockOf };
      let keys = CH_ORDER.filter(c => c in partOf);
      if (onlyCh) keys = keys.filter(c => c === onlyCh);
      const openKeys = keys.filter(c => !lockOf[c]);

      if (!keys.length) {
        const want = onlyCh ? (CH_META[onlyCh].label + ' ') : '';
        box.innerHTML = `<div class="sb-card">
          <div class="sb-t">${esc(want)}신청 내역을 찾지 못했어요</div>
          <p class="sb-hint">결제(무료 참여 포함)한 신청이 이 계정에 연결돼 있어야 올릴 수 있어요.
          신청할 때 쓴 계정으로 다시 로그인해 보시고, 그래도 안 보이면 오픈챗으로 알려 주세요.</p>
        </div>`;
        return;
      }

      // 제출물 조회 — 표 미생성(PGRST205 등)이면 '준비 중'으로 조용히 내려간다. 시작 전뿐이면 조회 안 함.
      let subs = [], notReady = false;
      if (openKeys.length) {
        try {
          const { data, error } = await MONC.sb.from('challenge_submissions')
            .select('*').eq('member_id', me);
          if (error) notReady = true; else subs = data || [];
        } catch (_) { notReady = true; }
      }
      const subOf = {};
      subs.forEach(s => { subOf[s.challenge + '#' + s.type] = s; });

      // 답변형 챌린지 작성 여부 — answers 에서 제목만 가볍게 받는다(select('*') 방어는 mypage 와 동일)
      const doneOf = {};
      const ansChs = openKeys.filter(c => ANSWER_CHS.indexOf(c) >= 0);
      if (ansChs.length) {
        await loadDayLessons();
        try {
          let { data, error } = await MONC.sb.from('answers')
            .select('*, questions(content)').eq('member_id', me);
          if (error) ({ data } = await MONC.sb.from('answers').select('*').eq('member_id', me));
          const rows = data || [];
          ansChs.forEach(ch => {
            const d = doneOf[ch] = {};
            rows.forEach(a => {
              const t = (a.title || '').trim() || ((a.questions || {}).content || '').trim();
              const n = dayNoOf(t, ch);
              if (n && !(n in d)) d[n] = t;
            });
          });
        } catch (_) {}
      }

      box.innerHTML = keys.map(c => {
        const meta = CH_META[c];
        const rTxt = partOf[c] ? partOf[c] + '기' : '';
        if (lockOf[c]) {
          const when = lockOf[c].start ? esc(mdKor(lockOf[c].start)) + '에 시작해요.' : '시작 안내는 챌린지 카톡방에서 드려요.';
          return `<div class="sb-card">
            <div class="sb-h"><span class="sb-t">${meta.label}</span><span class="sb-r">${esc(rTxt)}</span></div>
            <p class="sb-hint">${when} 문항과 제출 칸은 시작일에 열려요.</p>
          </div>`;
        }
        if (meta.media === 'answers') {
          const days = CH_DAYS[c] || [];
          const doneC = doneOf[c] || {};
          return `<div class="sb-card">
            <div class="sb-h"><span class="sb-t">${meta.label}</span><span class="sb-r">${rTxt ? esc(rTxt) + ' · ' : ''}답변 ${Object.keys(doneC).length}/${days.length}</span></div>
            <p class="sb-hint">문항을 누르면 나만의 승준노트에 답변을 쓸 수 있어요. 쓴 답변은 마이페이지·저장소에 그대로 남아요.</p>
            <ul class="sb-days">${days.map((d, i) => {
              const done = doneC[i + 1];
              // ⚠️ 새 답변 제목엔 챌린지 표식을 붙인다(위 CH_DAY_MARK) — mypage 와 한 쌍이다.
              const href = done ? 'answers.html' : 'answers.html?title=' + encodeURIComponent((CH_DAY_MARK[c] || '') + d) + '#new';
              return `<li><a href="${href}">
                <span class="q">${esc(d)}</span>
                <span class="sb-chip${done ? ' is-done' : ''}">${done ? '작성됨' : '쓰기'}</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
              </a></li>`;
            }).join('')}</ul>
          </div>`;
        }
        // ?t= 로 시기를 좁힌다 — before 링크는 스피닝 첫날 ①·② 를 같이 보여준다
        const types = typesOf(c).filter(t => !onlyT || (onlyT === 'after' ? t === 'after' : t !== 'after'));
        const slots = types.map(t => slotHtml(c, t, subOf[c + '#' + t], notReady)).join('');
        return `<div class="sb-card">
          <div class="sb-h"><span class="sb-t">${meta.label}</span><span class="sb-r">${esc(rTxt)}</span></div>
          <p class="sb-hint">${hintOf(c)}</p>
          <div class="sb-slots">${slots}</div>
        </div>`;
      }).join('');
      wire(notReady);

      // 올려 둔 파일 재생 — 서명 URL 은 비동기라 자리부터 그리고 나중에 채운다
      subs.forEach(async s => {
        const holder = document.getElementById('sbPlay-' + s.challenge + '-' + s.type);
        if (!holder) return;
        const url = await MONC.getSignedUrl(s.storage_path);
        if (!url) { holder.innerHTML = '<div class="sb-empty">재생 링크를 불러오지 못했어요.</div>'; return; }
        holder.innerHTML = (CH_META[s.challenge] || {}).media === 'video'
          ? `<video controls preload="none" src="${url}"></video>`
          : `<audio controls preload="none" src="${url}"></audio>`;
      });
    }

    /* 업로드 — mypage 제출 카드와 같은 저장 경로·같은 표(그래서 마이페이지에 그대로 보인다).
       허용 판정의 원장은 DB RLS(is_challenge_participant) — 화면을 속여도 서버가 거부한다. */
    function wire(notReady) {
      if (notReady) return;
      document.querySelectorAll('#sbCards [data-cs]').forEach(btn => btn.addEventListener('click', () => {
        const ch = btn.dataset.cs, type = btn.dataset.type, old = btn.dataset.old || '';
        const meta = CH_META[ch];
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = meta.accept;
        input.addEventListener('change', async () => {
          const file = input.files && input.files[0];
          if (!file) return;
          if (file.size > MAX_MB * 1024 * 1024) {
            alert('파일이 ' + MAX_MB + 'MB 를 넘어요.\n' + (meta.media === 'video'
              ? '1~2분 분량으로 잘라서 올려 주세요.' : '조금 줄여서 올려 주세요.'));
            return;
          }
          // 형식이 명확히 다른 것만 막는다 — 폰이 type 을 비워 보내는 경우가 있어 빈 값은 통과
          if (file.type && file.type.indexOf(meta.media + '/') !== 0) {
            alert(meta.what + ' 파일을 올려 주세요.');
            return;
          }
          const prev = btn.textContent;
          btn.disabled = true; btn.textContent = '업로드 중…';
          try {
            let ext = (file.name.indexOf('.') > 0 ? file.name.split('.').pop() : '')
              .toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!ext || ext.length > 8) ext = meta.media === 'video' ? 'mp4' : 'm4a';
            const path = ctx.me + '/' + ch + '-' + type + '.' + ext;
            const up = await MONC.sb.storage.from('recordings')
              .upload(path, file, { upsert: true, contentType: file.type || undefined });
            if (up.error) throw up.error;
            const { error } = await MONC.sb.from('challenge_submissions').upsert({
              member_id: ctx.me, challenge: ch, type: type,
              round: ctx.partOf[ch] || null, storage_path: path,
            }, { onConflict: 'member_id,challenge,type' });
            if (error) throw error;
            if (old && old !== path) { try { await MONC.sb.storage.from('recordings').remove([old]); } catch (_) {} }
            await render(ctx.me, ctx.partOf, ctx.lockOf);
            return;   // 카드를 통째로 다시 그렸으니 버튼 복원 불필요(요소가 교체됐다)
          } catch (e) {
            alert('업로드하지 못했어요: ' + (e && e.message ? e.message : e));
          }
          btn.disabled = false; btn.textContent = prev;
        });
        input.click();
      }));
    }

    (async () => {
      const session = await MONC.requireSession();
      if (!session) return;
      // 약관 동의(가입 시 1회) 가드 — 회원 페이지 공통(한 곳 빠지면 주소창 우회가 된다)
      if (!(await MONC.requireConsent())) return;
      const me = session.user.id;

      // 참가 판정 — mypage 와 같은 기준(결제완료·무료·부분 환불 유지)
      const { data: myApps } = await MONC.sb.from('applications')
        .select('created_at, challenges, total_price, paid, refunded, payment_status')
        .eq('member_id', me).order('created_at', { ascending: false });
      const stateOf = a =>
        (a.refunded || a.payment_status === 'refunded') ? '환불' :
        a.payment_status === 'partial_refunded' ? '부분' :
        a.payment_status === 'free' ? '무료' :
        (a.paid || a.payment_status === 'paid') ? '결제' : '대기';
      const roundsOf = {};
      (myApps || []).forEach(a => {
        const st = stateOf(a);
        if (st !== '결제' && st !== '무료' && st !== '부분') return;
        (Array.isArray(a.challenges) ? a.challenges : []).forEach(c => {
          if (!c || c.type === 'lecture' || c.lecture_id || !CH_META[c.challenge]) return;
          (roundsOf[c.challenge] = roundsOf[c.challenge] || []).push(Number(c.round) || null);
        });
      });
      // 시작 전 기수는 잠근다(2026-09-03) — 기수 선택·시작일 규칙은 round-gate.js(MONC_GATE · mypage 와 한 벌).
      // 스크립트가 못 실렸으면 최신 기수·열림(종전 동작).
      const G = window.MONC_GATE;
      const startMap = G ? await G.loadRoundStartMap() : null;
      const partOf = {}, lockOf = {};
      Object.keys(roundsOf).forEach(ch => {
        const pick = G ? G.pickContentRound(ch, roundsOf[ch], startMap)
          : { round: roundsOf[ch].filter(Boolean).sort((a, b) => b - a)[0] || null, locked: false };
        partOf[ch] = pick.round;
        if (pick.locked) lockOf[ch] = { start: pick.start, pending: pick.pending };
      });

      await render(me, partOf, lockOf);
    })();
  })();
</script>

</body>
</html>
