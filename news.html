  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* ⚠️ hidden 속성은 UA 스타일의 display:none 이라 저자 CSS 의 display 에 진다.
       .nw-list 가 display:flex 라서 탭을 '내 스크랩'으로 바꿔도 전체 뉴스 목록이
       그대로 남아 있었다 — 스크랩한 적 없는 기사가 스크랩 화면에 보이던 원인
       (2026-07-24 오너 신고). 이 한 줄을 지우면 재발한다. */
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }
    body { font-family: 'SUIT Variable', SUIT,'Apple SD Gothic Neo',-apple-system,sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; }
    .container { max-width: 860px; margin: 0 auto; padding: 0 20px; }
    a { color: inherit; }

    /* NAV — reviews.html과 동일 패턴 */

    /* HERO */
    .nw-hero { padding: 104px 0 20px; text-align: center; }
    .nw-eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .24em; color: var(--accent-ink); }
    .nw-title { font-family: var(--serif); font-size: clamp(28px, 5vw, 42px); font-weight: 700; color: var(--accent); letter-spacing: -.6px; margin-top: 10px; }
    /* 두 줄로 나뉠 땐 양쪽 길이를 비슷하게(balance), 강조 구절은 통째로 유지 */
    .nw-sub { font-size: 15px; color: var(--text); opacity: .72; margin-top: 12px; max-width: 34em; margin-left: auto; margin-right: auto; text-wrap: balance; }
    .nw-sub b { color: var(--action); font-weight: 800; white-space: nowrap; }

    /* 탭 (전체 뉴스 / 내 스크랩) */
    .nw-tabs { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
    .nw-tab { appearance: none; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; font-weight: 800; padding: 10px 22px; border-radius: 999px; min-height: 44px; -webkit-tap-highlight-color: transparent; }
    .nw-tab.active { background: var(--action); color: var(--action-ink); border-color: transparent; }
    .nw-tab:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }

    /* 필터 바 — reviews.html 패턴 + 제목 검색(2026-07-22 스펙) */
    .nw-filters { position: sticky; top: 67px; z-index: 50; background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); padding: 14px 0 12px; margin-bottom: 8px; border-bottom: 1px solid var(--border-soft); }
    /* ⚠️ 공용 nav(고정 67px / 모바일 57px) 바로 아래에 붙는다 — 구 58px 은 삭제된
       페이지 자체 바(50px) 기준이라 지금은 필터바 위쪽이 nav 뒤로 들어간다. */
    @media (max-width: 768px) { .nw-filters { top: 57px; } }
    .nw-search { display: flex; margin-bottom: 10px; }
    /* ⚠️ font-size 16px 하한 — iOS 자동 확대 방지(2026-08-02). 14px 로 되돌리지 말 것. */
    .nw-search input { width: 100%; min-height: 44px; padding: 10px 16px; font: inherit; font-size: 16px; color: var(--text); background: var(--surface); border: 1.5px solid var(--border-strong); border-radius: 999px; }
    .nw-search input::placeholder { color: var(--text-muted); }
    .nw-search input:focus-visible { outline: 3px solid var(--action); outline-offset: 1px; }
    /* 필터 픽커(2026-07-23) — 칩 나열 대신 [항공사]·[주제] 버튼 → 바텀시트 선택(오너 지시).
       선택된 상태는 버튼 라벨이 값으로 바뀌고 틴트(.set) — 현재 필터가 항상 보인다. */
    .nw-pickrow { display: flex; gap: 8px; margin-top: 10px; }
    .nw-pick { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); font: inherit; font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background .15s, color .15s, border-color .15s; }
    .nw-pick:hover { border-color: var(--accent-dark); }
    .nw-pick:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    /* ▾ 글리프 — aria-hidden 장식이라 활자 하한(12px) 대상이 아니다. */
    .nw-pick .pk-cv { font-size: 10px; opacity: .55; }
    .nw-pick.set { background: var(--action-tint); border-color: var(--accent-dark); color: var(--accent-ink); font-weight: 800; }
    .nw-scrim { position: fixed; inset: 0; z-index: 205; background: rgba(23,42,71,.45); opacity: 0; transition: opacity .22s; }
    .nw-scrim.open { opacity: 1; }
    .nw-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 210; width: min(100%, 560px); margin: 0 auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 18px calc(22px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -14px 44px rgba(23,42,71,.24); max-height: 72vh; overflow-y: auto; transform: translateY(18px); opacity: 0; transition: transform .26s cubic-bezier(.22,1,.36,1), opacity .2s; }
    .nw-sheet.open { transform: none; opacity: 1; }
    .nw-sheet-handle { width: 38px; height: 4px; border-radius: 999px; background: var(--border); margin: 6px auto 14px; }
    .nw-sheet-title { font-family: var(--serif); font-size: 18px; font-weight: 700; margin: 0 0 12px; color: var(--text); }
    .nw-sheet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (min-width: 640px) { .nw-sheet-grid { grid-template-columns: 1fr 1fr 1fr; } }
    .nw-opt { appearance: none; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; font-weight: 700; min-height: 46px; padding: 8px 10px; border-radius: 999px; -webkit-tap-highlight-color: transparent; }
    .nw-opt:hover { border-color: var(--accent-dark); }
    .nw-opt:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .nw-opt.on { background: var(--action); color: var(--action-ink); border-color: transparent; }
    /* 칩 줄은 모바일에서 한 줄 가로 스크롤 — 세로로 쌓으면 sticky 필터바가 375px 화면의 70%를
       먹어 기사가 안 보인다(2026-07-22 실측). 데스크톱(≥640px)만 줄바꿈 허용. */
    .nw-filter-row { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; align-items: center; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .nw-filter-row::-webkit-scrollbar { display: none; }
    .nw-filter-row + .nw-filter-row { margin-top: 8px; }
    .nw-chip { flex: 0 0 auto; }
    .nw-filter-label { flex: 0 0 auto; font-size: 12px; font-weight: 800; color: var(--text); opacity: .55; margin-right: 4px; min-width: 42px; }
    @media (min-width: 640px) {
      .nw-filter-row { flex-wrap: wrap; overflow-x: visible; }
    }
    .nw-chip { appearance: none; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; font-weight: 700; padding: 8px 15px; border-radius: 999px; min-height: 40px; transition: background .15s, color .15s, border-color .15s; -webkit-tap-highlight-color: transparent; }
    .nw-chip:hover { border-color: var(--accent-dark); }
    .nw-chip.active { background: var(--accent-ink); color: #fff; border-color: var(--accent-ink); }
    .nw-chip:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }

    /* 기사 리스트 */
    .nw-list { list-style: none; padding: 8px 0 16px; display: flex; flex-direction: column; gap: 12px; }
    .nw-card { position: relative; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); box-shadow: 0 2px 10px rgba(23,42,71,.06); transition: box-shadow .2s, transform .2s; }
    .nw-card:hover { box-shadow: 0 10px 30px rgba(23,42,71,.14); transform: translateY(-2px); }
    /* 오른쪽 여백은 스크랩 알약(≈86px)이 제목 위로 겹치지 않을 만큼 — 알약이 absolute라 자동으로 안 밀린다 */
    .nw-link { display: block; padding: 16px 98px 14px 16px; text-decoration: none; }
    .nw-card-title { font-size: 15.5px; font-weight: 700; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .nw-card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--text-muted); }
    .nw-tag { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: rgba(27,58,107,.10); color: var(--accent-ink); }
    .nw-tag-topic { background: rgba(27,58,107,.16); color: var(--accent-ink); }
    /* 스크랩 버튼 = 몬크 로고 창문 + 글자 라벨(2026-07-22 스펙 — 리본 북마크 금지)
       전: 무채색(grayscale) 창문 + '스크랩' / 후: 원색 창문 + '저장됨'. 그림은 #moncWin 심볼 1벌.
       ⚠️ 라벨을 빼고 아이콘만 두지 말 것 — 창문은 브랜드 심볼이지 '저장'의 관습 기호가 아니라서
       아이콘 단독으로는 무슨 버튼인지 읽히지 않는다(오너 피드백 2026-07-22). */
    .nw-bm { position: absolute; top: 8px; right: 8px; height: 36px; padding: 0 12px 0 9px; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--border); border-radius: 999px; background: var(--surface); cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 800; color: var(--accent-ink); white-space: nowrap; transition: background .2s, border-color .2s; -webkit-tap-highlight-color: transparent; }
    /* 시각 높이는 36px이되 터치 타겟은 44px(9대 원칙) — 카드 여백을 먹지 않고 히트영역만 넓힌다 */
    .nw-bm::after { content: ''; position: absolute; inset: -4px; }
    .nw-bm:hover { background: var(--surface2); border-color: var(--accent-dark); }
    .nw-bm svg { width: 14px; height: 19.6px; filter: grayscale(1); opacity: .45; transition: filter .25s, opacity .25s; }
    .nw-bm.on { background: var(--accent-tint); border-color: var(--accent-ink); }
    .nw-bm.on svg { filter: none; opacity: 1; }
    .nw-bm:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    /* 두 라벨을 DOM에 두고 CSS로 토글 — JS는 .on 클래스만 건드린다 */
    .nw-bm .bm-on, .nw-bm.on .bm-off { display: none; }
    .nw-bm.on .bm-on { display: inline; }

    /* 같은 날·같은 항공사 도배 접기(2026-08-01) — 보도자료 하나를 수십 곳이 받아쓰면 제목이
       제각각이라 수집기의 중복 묶기(제목 유사도)로는 안 걸린다(실측: 부여군-에어로케이
       업무협약 8건이 서로 유사도 0.06~0.29). ⚠️ 지우지 말고 화면에서만 접을 것 —
       잘못 묶여도 펼치면 보이므로 멀쩡한 기사가 사라지지 않는다. */
    .nw-fold-btn { appearance: none; cursor: pointer; display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--border-soft); background: transparent; color: var(--accent-ink); font: inherit; font-size: 13px; font-weight: 800; padding: 12px 16px; min-height: 44px; border-radius: 0 0 var(--radius-sm) var(--radius-sm); -webkit-tap-highlight-color: transparent; }
    .nw-fold-btn:hover { background: var(--surface2); }
    .nw-fold-btn:focus-visible { outline: 3px solid var(--action); outline-offset: -3px; }
    /* 두 라벨을 DOM에 두고 CSS로 토글 — 스크랩 버튼과 같은 방식 */
    .nw-fold-btn .fd-open { display: none; }
    .nw-fold-btn.open .fd-open { display: inline; }
    .nw-fold-btn.open .fd-off { display: none; }
    .nw-sublist { list-style: none; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
    .nw-sublist .nw-card { box-shadow: none; background: var(--surface2); }
    .nw-sublist .nw-card:hover { transform: none; box-shadow: 0 4px 14px rgba(23,42,71,.10); }
    .nw-sublist .nw-card-title { font-size: 14px; }
    .nw-sublist .nw-link { padding: 13px 98px 12px 14px; }

    .nw-count { font-size: 13px; font-weight: 700; color: var(--text); opacity: .6; margin: 16px 2px 4px; }
    .nw-empty { text-align: center; padding: 60px 20px; color: var(--text); opacity: .6; font-size: 15px; }
    .nw-skeleton { height: 92px; border-radius: var(--radius-sm); background: var(--surface2); margin-bottom: 12px; }
    .nw-more-wrap { text-align: center; padding: 8px 0 72px; }
    .nw-more { appearance: none; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; font-weight: 800; padding: 13px 34px; border-radius: 999px; min-height: 48px; }
    .nw-more:hover { border-color: var(--accent-dark); }

    /* 내 스크랩 — 항공사별 그룹 + 활용 메모 + 자유 태그 */
    .nw-scrap-lead { font-size: 14px; color: var(--text-muted); margin: 16px 2px 6px; }
    .nw-scrap-lead b { color: var(--accent-ink); }
    .nw-scrap-top { display: flex; align-items: flex-start; gap: 10px; }
    .nw-scrap-top .nw-scrap-lead { flex: 1; min-width: 0; }
    .nw-clear { flex: 0 0 auto; margin-top: 14px; min-height: 44px; padding: 8px 14px; font: inherit;
      font-size: 12.5px; font-weight: 700; color: var(--text-muted); background: var(--surface);
      border: 1px solid var(--border); border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .nw-clear:hover { border-color: var(--action-dark); color: var(--action-dark); }
    /* 스크랩한 날짜 — '내가 언제 담았는지'가 보여야 잘못 눌린 것을 스스로 가려낼 수 있다 */
    .nw-scrapped-at { color: var(--accent-ink); font-weight: 700; }
    /* 토글 알림 + 되돌리기 */
    .nw-toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(8px); z-index: 240;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 12px;
      max-width: min(92vw, 420px); padding: 12px 12px 12px 18px; border-radius: 999px;
      background: var(--bg-dark); color: var(--text-on-dark); font-size: 14px; font-weight: 700;
      box-shadow: 0 12px 32px rgba(20,32,52,.32); opacity: 0; transition: opacity .18s, transform .18s; }
    .nw-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .nw-toast button { min-height: 40px; padding: 8px 16px; font: inherit; font-size: 13px; font-weight: 800;
      color: var(--accent-ink); background: #FFFFFF; border: 0; border-radius: 999px; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { .nw-toast { transition: none; } }
    .nw-tagbar { margin: 10px 0 4px; }
    .nw-group-h { display: flex; align-items: baseline; gap: 8px; margin: 22px 2px 10px; }
    .nw-group-name { font-family: var(--serif); font-size: 19px; font-weight: 700; }
    .nw-group-n { font-size: 13px; font-weight: 700; color: var(--accent-ink); }
    .nw-extras { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 0 16px 14px; }
    .nw-mytag { display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 800; color: var(--accent-ink); background: var(--accent-tint); border-radius: 999px; padding: 4px 12px; }
    .nw-note { margin: 0 16px 14px; padding: 10px 12px; border-left: 3px solid var(--action); background: var(--surface2); border-radius: 0 var(--radius-xs) var(--radius-xs) 0; font-size: 13.5px; }
    .nw-note-btn, .nw-tag-btn { appearance: none; cursor: pointer; border: 0; background: none; font: inherit; font-size: 12.5px; font-weight: 700; color: var(--accent-ink); padding: 0; min-height: 32px; }
    .nw-note-btn { padding: 0 16px 14px; }
    .nw-edit { margin: 0 16px 14px; }
    /* ⚠️ font-size 16px 하한 — iOS 자동 확대 방지(2026-08-02). */
    .nw-edit textarea, .nw-edit input { width: 100%; padding: 10px 12px; font: inherit; font-size: 16px; border: 1px solid var(--border); border-radius: var(--radius-xs); background: var(--surface); color: var(--text); }
    .nw-edit textarea { min-height: 64px; resize: vertical; }
    .nw-edit .row { display: flex; gap: 8px; margin-top: 8px; }
    .nw-edit .sug { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .nw-edit .sug button { appearance: none; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--accent-ink); font: inherit; font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 999px; min-height: 34px; }
    .nw-save { appearance: none; cursor: pointer; border: 0; background: var(--action); color: var(--action-ink); font: inherit; font-size: 13px; font-weight: 800; padding: 9px 18px; border-radius: 999px; min-height: 40px; }
    .nw-cancel { appearance: none; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font: inherit; font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 999px; min-height: 40px; }

    @media (prefers-reduced-motion: reduce) {
      .nw-card, .nw-bm svg, .nw-pick, .nw-sheet, .nw-scrim { transition: none; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <!-- 몬크 로고 창문 심볼 — 스크랩 버튼이 <use>로 공유. 구 MONC-symbol.svg 기반이나
       원본 폴더는 로고 교체(a5f1b85)로 삭제됐으므로 이 인라인 심볼이 정본이다. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="moncWinG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E4E6E"/><stop offset=".36" stop-color="#7F7C9B"/><stop offset=".66" stop-color="#D6B389"/><stop offset="1" stop-color="#F2E3C8"/></linearGradient>
      <clipPath id="moncWinC"><rect x="18" y="18" width="64" height="104" rx="29" ry="31"/></clipPath>
      <symbol id="moncWin" viewBox="0 0 100 140">
        <rect x="4" y="4" width="92" height="132" rx="44" ry="46" fill="#1B2A4A"/>
        <rect x="11" y="11" width="78" height="118" rx="37" ry="39" fill="#F4F1EA"/>
        <g clip-path="url(#moncWinC)"><rect x="18" y="18" width="64" height="104" fill="url(#moncWinG)"/><ellipse cx="50" cy="104" rx="46" ry="20" fill="#F8ECD4" opacity=".7"/></g>
        <rect x="18" y="18" width="64" height="104" rx="29" ry="31" fill="none" stroke="#EDE7DB" stroke-width="2"/>
        <rect x="41" y="24" width="18" height="7" rx="3.5" fill="#ECE5D7" stroke="#B7AB93" stroke-width=".6"/>
      </symbol>
    </defs>
  </svg>


  <header class="nw-hero">
    <div class="container">
      <div class="nw-eyebrow">AVIATION NEWS</div>
      <h1 class="nw-title">항공 뉴스</h1>
      <p class="nw-sub">스크랩하면 마이페이지에 <b>항공사별로</b> 쌓여요 — 면접 답변 재료가 됩니다.</p>
      <div class="nw-tabs" role="tablist">
        <button class="nw-tab active" type="button" data-tab="all" role="tab" aria-selected="true">전체 뉴스</button>
        <button class="nw-tab" type="button" data-tab="scraps" id="nwScrapTab" role="tab" aria-selected="false" hidden>내 스크랩</button>
      </div>
    </div>
  </header>

  <div class="nw-filters" id="nwFilters" hidden>
    <div class="container">
      <div class="nw-search"><input type="search" id="nwSearch" placeholder="제목 검색 — 예: 유니폼, 채용설명회, 인천공항" aria-label="기사 제목 검색" /></div>
      <!-- 필터 픽커(2026-07-23 오너 지시) — 칩 나열 대신 버튼 2개 → 바텀시트에서 선택 -->
      <div class="nw-pickrow">
        <button class="nw-pick" type="button" id="nwAirBtn" hidden aria-haspopup="dialog" aria-expanded="false"><span class="pk-label">항공사</span><span class="pk-cv" aria-hidden="true">▾</span></button>
        <button class="nw-pick" type="button" id="nwTopicBtn" hidden aria-haspopup="dialog" aria-expanded="false"><span class="pk-label">주제</span><span class="pk-cv" aria-hidden="true">▾</span></button>
      </div>
    </div>
  </div>

  <main class="container">
    <div id="nwScrapView" hidden>
      <div class="nw-scrap-top">
        <p class="nw-scrap-lead">스크랩한 기사에 <b>활용 메모</b>와 <b>태그</b>를 남겨보세요 — "이 기사를 어느 답변에 어떻게 쓸지" 한 줄이면 면접 준비가 빨라져요.</p>
        <button class="nw-clear" type="button" id="nwClearAll" hidden>전체 비우기</button>
      </div>
      <div class="nw-filter-row nw-tagbar" id="nwTagRow" hidden>
        <span class="nw-filter-label">내 태그</span>
      </div>
      <div id="nwScrapGroups"></div>
      <div class="nw-empty" id="nwScrapEmpty" hidden>아직 스크랩한 기사가 없어요. <br><button class="nw-more" type="button" style="margin-top:14px" onclick="document.querySelector('[data-tab=all]').click()">뉴스 보러 가기</button></div>
    </div>
    <div class="nw-count" id="nwCount"></div>
    <div id="nwSkeleton">
      <div class="nw-skeleton"></div><div class="nw-skeleton"></div><div class="nw-skeleton"></div>
      <div class="nw-skeleton"></div><div class="nw-skeleton"></div>
    </div>
    <ul class="nw-list" id="nwList"></ul>
    <div class="nw-empty" id="nwEmpty" hidden>표시할 뉴스가 없어요.</div>
    <div class="nw-more-wrap"><button class="nw-more" id="nwMore" type="button" hidden>더 보기</button></div>

    <!-- 커뮤니티 오픈챗 모집 카드(공용 community-card.js — 회원 전용 게이트) -->
    <div data-community-card></div>
  </main>

  <!-- 스크랩 토글 알림 — 실수로 눌렀을 때 즉시 되돌릴 수 있게(피드백 없으면 눌린 줄도 모른다) -->
  <div class="nw-toast" id="nwToast" role="status" aria-live="polite" hidden>
    <span id="nwToastMsg"></span>
    <button type="button" id="nwToastUndo">되돌리기</button>
  </div>

  <!-- 필터 선택 바텀시트 — [항공사]/[주제] 버튼이 연다. 옵션은 openSheet()가 동적 렌더 -->
  <div class="nw-scrim" id="nwScrim" hidden></div>
  <div class="nw-sheet" id="nwSheet" role="dialog" aria-modal="true" aria-labelledby="nwSheetTitle" hidden>
    <div class="nw-sheet-handle" aria-hidden="true"></div>
    <h2 class="nw-sheet-title" id="nwSheetTitle">항공사 선택</h2>
    <div class="nw-sheet-grid" id="nwSheetGrid"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="community-card.js?v=2" defer></script>
  <script>
  (function () {
    // ⚠️ 슬러그 계약 — scripts/fetch-news.mjs·mypage.html과 동기화
    const AIRLINE_LABEL = { kal:'대한항공', asiana:'아시아나항공', jinair:'진에어', jejuair:'제주항공', twayair:'티웨이항공', airbusan:'에어부산', airseoul:'에어서울', eastarjet:'이스타항공', airpremia:'에어프레미아', aerok:'에어로케이' };
    const AIRLINE_ORDER = ['kal','asiana','jinair','jejuair','twayair','airbusan','airseoul','eastarjet','airpremia','aerok'];
    const TOPIC_LABEL = { recruit:'채용·모집', route:'취항·노선', biz:'경영·실적', service:'서비스·기내', policy:'정책·공항·안전' };
    const TOPIC_ORDER = ['recruit','route','biz','service','policy'];
    const PAGE = 20;
    const TAG_SUGGEST = ['지원동기 재료', '최근 이슈', '산업 동향', '서비스 아이디어'];

    const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    // 스크랩 버튼 그림 = 몬크 로고 창문(상단 #moncWin 심볼) — 상태 전환은 CSS 필터가 담당
    const BM_SVG = '<svg viewBox="0 0 100 140" aria-hidden="true"><use href="#moncWin"/></svg>'
      + '<span class="bm-off">스크랩</span><span class="bm-on">저장됨</span>';

    // 게시 날짜 (YYYY.MM.DD) — 상대시각 대신 날짜로 통일
    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso), p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate());
    }

    const listEl = document.getElementById('nwList');
    const emptyEl = document.getElementById('nwEmpty');
    const countEl = document.getElementById('nwCount');
    const moreBtn = document.getElementById('nwMore');
    const skelEl = document.getElementById('nwSkeleton');
    const filtersEl = document.getElementById('nwFilters');
    const searchEl = document.getElementById('nwSearch');

    let session = null;            // 로그인 세션(스크랩 기능 게이트)
    let scrapByArticle = new Map();// article_id → scrap row(id, note, tag)
    let fAirline = 'all', fTopic = 'all', fSearch = '';
    let offset = 0, exhausted = false;

    // ── 폴백: 테이블 미생성(마이그레이션 전) → 준비 중 안내 ──
    function showNotReady() {
      skelEl.hidden = true; filtersEl.hidden = true;
      emptyEl.hidden = false; emptyEl.textContent = '뉴스 게시판을 준비 중이에요. 조금만 기다려주세요!';
    }

    // ── 필터 바: 기사가 있으면 검색창 노출. 항공사·주제는 픽커 버튼 → 바텀시트에서 선택
    //    (2026-07-23 오너 지시 — 칩 나열 폐기). 옵션은 데이터에 존재하는 값만(최근 1000건 기준). ──
    const airBtn = document.getElementById('nwAirBtn');
    const topicBtn = document.getElementById('nwTopicBtn');
    const scrimEl = document.getElementById('nwScrim');
    const sheetEl = document.getElementById('nwSheet');
    const sheetTitleEl = document.getElementById('nwSheetTitle');
    const sheetGridEl = document.getElementById('nwSheetGrid');
    let sheetKind = null;                                  // 'air' | 'top' | null(닫힘)
    const sheetOpts = { air: [], top: [] };                // 데이터에 실존하는 슬러그만

    async function buildFilters() {
      const { data, error } = await MONC.sb.from('news_articles')
        .select('airline, topic').order('created_at', { ascending: false }).limit(1000);
      if (error || !data || !data.length) return;         // 실패·0건이면 필터바 숨김 유지
      filtersEl.hidden = false;                            // 검색창은 기사만 있으면 쓸 수 있다
      const airSet = new Set(data.map(r => r.airline).filter(Boolean));
      const topSet = new Set(data.map(r => r.topic).filter(Boolean));
      sheetOpts.air = AIRLINE_ORDER.filter(a => airSet.has(a));
      sheetOpts.top = TOPIC_ORDER.filter(t => topSet.has(t));
      syncPickers();
      syncPickerVisibility();
    }

    // ── 필터바는 두 탭이 공유한다(2026-07-24 오너 지시: "스크랩에서도 검색·항공사·주제") ──
    // 옵션 목록만 탭에 따라 바꾼다. 스크랩 탭에서 내가 안 가진 항공사를 고를 수 있으면
    // 눌러도 0건이라 혼란스럽다 → 스크랩 탭 옵션은 내 스크랩에 실제로 있는 값만.
    const scrapOpts = { air: [], top: [] };
    function curOpts() { return curTab === 'scraps' ? scrapOpts : sheetOpts; }

    function computeScrapOpts() {
      const airSet = new Set(), topSet = new Set();
      scrapRows.forEach(r => {
        const a = r.news_articles;
        if (a.airline) airSet.add(a.airline);
        if (a.topic) topSet.add(a.topic);
      });
      scrapOpts.air = AIRLINE_ORDER.filter(a => airSet.has(a));
      scrapOpts.top = TOPIC_ORDER.filter(t => topSet.has(t));
      // 지금 걸린 필터가 이 탭에 없는 값이면 풀어준다(고를 수 없는 값이 라벨에 남지 않게)
      if (fAirline !== 'all' && !scrapOpts.air.includes(fAirline)) fAirline = 'all';
      if (fTopic !== 'all' && !scrapOpts.top.includes(fTopic)) fTopic = 'all';
      syncPickers();
      syncPickerVisibility();
    }

    function syncPickerVisibility() {
      const o = curOpts();
      airBtn.hidden = !o.air.length;
      topicBtn.hidden = !o.top.length;
    }

    // 필터가 바뀌었을 때 무엇을 다시 그릴지는 탭이 정한다
    let filterDirty = false;             // 스크랩 탭에서 바꾼 필터를 전체 탭 복귀 시 반영
    function applyFilter() {
      if (curTab === 'scraps') { filterDirty = true; drawScraps(); }
      else resetAndLoad();
    }

    // 버튼 라벨 = 현재 선택(전체면 축 이름) — 지금 무엇으로 걸러진 상태인지 항상 보인다
    function syncPickers() {
      const a = fAirline === 'all' ? null : AIRLINE_LABEL[fAirline];
      const t = fTopic === 'all' ? null : TOPIC_LABEL[fTopic];
      airBtn.querySelector('.pk-label').textContent = a || '항공사';
      topicBtn.querySelector('.pk-label').textContent = t || '주제';
      airBtn.classList.toggle('set', !!a);
      topicBtn.classList.toggle('set', !!t);
    }

    function openSheet(kind) {
      sheetKind = kind;
      const isAir = kind === 'air';
      sheetTitleEl.textContent = isAir ? '항공사 선택' : '주제 선택';
      const cur = isAir ? fAirline : fTopic;
      const labels = isAir ? AIRLINE_LABEL : TOPIC_LABEL;
      sheetGridEl.innerHTML = '';
      const mk = (val, text) => {
        const b = document.createElement('button');
        b.type = 'button'; b.dataset.val = val;
        b.className = 'nw-opt' + (cur === val ? ' on' : '');
        b.textContent = text;
        return b;
      };
      sheetGridEl.appendChild(mk('all', isAir ? '전체 항공사' : '전체 주제'));
      const o = curOpts();
      (isAir ? o.air : o.top).forEach(v => sheetGridEl.appendChild(mk(v, labels[v])));
      scrimEl.hidden = false; sheetEl.hidden = false;
      void sheetEl.offsetWidth;                            // 강제 리플로 — hidden 해제를 먼저 커밋해 슬라이드업 전환이 걸린다(rAF는 백그라운드 탭에서 안 돎)
      scrimEl.classList.add('open'); sheetEl.classList.add('open');
      document.body.style.overflow = 'hidden';             // 시트 열린 동안 배경 스크롤 잠금
      (isAir ? airBtn : topicBtn).setAttribute('aria-expanded', 'true');
      (sheetGridEl.querySelector('.on') || sheetGridEl.firstChild).focus();
    }

    function closeSheet() {
      if (!sheetKind) return;
      const wasAir = sheetKind === 'air';
      sheetKind = null;
      scrimEl.classList.remove('open'); sheetEl.classList.remove('open');
      document.body.style.overflow = '';
      airBtn.setAttribute('aria-expanded', 'false');
      topicBtn.setAttribute('aria-expanded', 'false');
      setTimeout(() => {                                   // 전환이 끝난 뒤 숨김(그새 재오픈이면 스킵)
        if (!sheetEl.classList.contains('open')) { scrimEl.hidden = true; sheetEl.hidden = true; }
      }, 240);
      (wasAir ? airBtn : topicBtn).focus();
    }

    airBtn.addEventListener('click', () => openSheet('air'));
    topicBtn.addEventListener('click', () => openSheet('top'));
    scrimEl.addEventListener('click', closeSheet);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
    sheetGridEl.addEventListener('click', e => {
      const b = e.target.closest('.nw-opt'); if (!b) return;
      if (sheetKind === 'air') fAirline = b.dataset.val; else fTopic = b.dataset.val;
      syncPickers(); closeSheet(); applyFilter();
    });

    // ── 제목 검색(2026-07-22 스펙) — 디바운스 300ms, 칩 필터와 AND ──
    let searchTimer = null;
    searchEl.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        const v = searchEl.value.trim();
        if (v === fSearch) return;
        fSearch = v;
        applyFilter();
      }, 300);
    });

    // ── 기사 목록(서버 필터 + range 페이지네이션) ──
    async function fetchPage() {
      let q = MONC.sb.from('news_articles')
        .select('id, title, url, source, published_at, airline, topic')
        .order('published_at', { ascending: false, nullsFirst: false })
        .range(offset, offset + PAGE - 1);
      if (fAirline !== 'all') q = q.eq('airline', fAirline);
      if (fTopic !== 'all') q = q.eq('topic', fTopic);
      if (fSearch) q = q.ilike('title', '%' + fSearch.replace(/[%_]/g, '') + '%');
      return q;
    }

    function cardHtml(a, group) {
      const scrapped = scrapByArticle.has(a.id);
      const chips =
        (a.airline ? `<span class="nw-tag">${esc(AIRLINE_LABEL[a.airline] || a.airline)}</span>` : '') +
        (a.topic ? `<span class="nw-tag nw-tag-topic">${esc(TOPIC_LABEL[a.topic] || a.topic)}</span>` : '');
      return `<li class="nw-card" data-id="${esc(a.id)}"${group ? ` data-group="${esc(group)}"` : ''}>
        <a class="nw-link" href="${esc(a.url)}" target="_blank" rel="noopener">
          <div class="nw-card-title">${esc(a.title)}</div>
          <div class="nw-card-meta">${chips}<span>${esc(a.source || '')}</span><span>${fmtDate(a.published_at)}</span></div>
        </a>
        <button class="nw-bm${scrapped ? ' on' : ''}" type="button" data-id="${esc(a.id)}"
          aria-label="${scrapped ? '스크랩 해제' : '스크랩'}" aria-pressed="${scrapped}">${BM_SVG}</button>${group ? `
        <button class="nw-fold-btn" type="button" hidden aria-expanded="false"><span class="fd-off">같은 소식 <b>0</b>건 더 보기</span><span class="fd-open">접기</span></button>
        <ul class="nw-sublist" hidden></ul>` : ''}
      </li>`;
    }

    // ── 같은 소식 접기 ────────────────────────────────────────────────────────
    // 같은 날 + 같은 항공사 + 제목이 어느 정도 겹치면 한 소식으로 보고 뒤엣것을 접는다.
    // ⚠️ 날짜·항공사만으로 묶지 말 것 — 실측에서 같은 날 대한항공 기사 26건이 한 묶음이 됐고,
    //    그 안에 '기내식 자회사 지분 인수 연기'·'MRO 아웃소싱 확대'처럼 면접 재료가 되는
    //    별개 사건이 '출국 팁' 도배 밑으로 숨었다.
    // ⚠️ 주제(topic)는 조건에 넣지 말 것 — 같은 사건인데 언론사마다 service/policy 로
    //    갈려 들어온다(에어서울 결항 7건 실측).
    // ⚠️ 항공사 미분류(airline=null)는 묶지 않는다 — 업계 일반 기사라 같은 날이어도 다른 사건이다.
    // 임계값이 수집기(0.5)보다 훨씬 낮은 건 실패 비용이 다르기 때문이다 — 수집기는 지우지만
    // 여기는 접을 뿐이라, 잘못 묶여도 펼치면 그대로 보인다.
    const FOLD_SIM = 0.15;
    const groupKey = a => (a.published_at || '').slice(0, 10) + '|' + (a.airline || '');
    const foldTok = t => new Set(t.replace(/\[[^\]]{0,20}\]/g, ' ')
      .replace(/[^가-힣A-Za-z0-9]+/g, ' ').split(' ').filter(w => w.length >= 2));
    function foldSim(a, b) {
      if (!a.size || !b.size) return 0;
      let inter = 0;
      for (const w of a) if (b.has(w)) inter++;
      return inter / (a.size + b.size - inter);
    }
    const groupHeads = new Map();            // "날짜|항공사" → [{el, tok}] (펼쳐 둔 대표 카드들)

    function appendRows(rows) {
      for (const a of rows) {
        const key = a.airline ? groupKey(a) : '';
        const tok = foldTok(a.title);
        const heads = key ? (groupHeads.get(key) || []) : [];
        const hit = heads.find(h => foldSim(h.tok, tok) >= FOLD_SIM);
        if (!hit) {
          listEl.insertAdjacentHTML('beforeend', cardHtml(a, key));
          if (key) { heads.push({ el: listEl.lastElementChild, tok }); groupHeads.set(key, heads); }
          continue;
        }
        const sub = hit.el.querySelector('.nw-sublist');
        sub.insertAdjacentHTML('beforeend', cardHtml(a));
        const btn = hit.el.querySelector('.nw-fold-btn');
        btn.hidden = false;
        btn.querySelector('.fd-off b').textContent = sub.children.length;
      }
    }

    // 펼치기/접기 — 스크랩 토글은 body 위임이라 접힌 카드에서도 그대로 동작한다.
    listEl.addEventListener('click', e => {
      const btn = e.target.closest('.nw-fold-btn');
      if (!btn) return;
      const sub = btn.closest('.nw-card').querySelector('.nw-sublist');
      const open = sub.hidden;
      sub.hidden = !open;
      btn.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
    });

    async function loadMore() {
      moreBtn.disabled = true;
      const { data, error } = await fetchPage();
      skelEl.hidden = true;
      if (error) { if (!offset) showNotReady(); moreBtn.disabled = false; return; }
      const rows = data || [];
      if (!offset && !rows.length) { emptyEl.hidden = false; listEl.innerHTML = ''; moreBtn.hidden = true; return; }
      emptyEl.hidden = true;
      appendRows(rows);
      offset += rows.length;
      exhausted = rows.length < PAGE;
      moreBtn.hidden = exhausted;
      moreBtn.disabled = false;
      countEl.textContent = offset ? `${offset}건${exhausted ? '' : '+'}` : '';
    }

    function resetAndLoad() {
      offset = 0; exhausted = false; listEl.innerHTML = ''; countEl.textContent = '';
      groupHeads.clear();                       // 필터가 바뀌면 묶음 계산도 처음부터
      moreBtn.hidden = true; emptyEl.hidden = true;
      loadMore();
    }

    // ── 스크랩 토글(낙관적 업데이트, 실패 시 실제 상태로 원복) ──
    // ⚠️ 예전 구현엔 경쟁 조건이 세 겹 있었고, 전부 "해제했는데 그대로 남아 있다 /
    //    안 누른 기사가 스크랩돼 있다"로 나타났다(2026-07-24 오너 신고). 되돌리지 말 것.
    //    (a) 초기 로드 경쟁 — 목록이 스크랩 상태보다 먼저 도착하면 scrapByArticle 이 비어
    //        있어 이미 스크랩한 기사를 눌러도 was=false → insert → unique 위반으로 실패.
    //        UI 만 꺼지고 DB 행은 남았다.  → scrapsReady 를 기다린다.
    //    (b) 연타 — insert 응답 전 재클릭 시 낙관적으로 넣어둔 {id:null} 때문에
    //        delete().eq('id', null) 이 되어 아무것도 안 지워졌다.  → id 가 아니라
    //        (member_id, article_id) 로 지우고, 진행 중인 기사는 잠근다.
    //    (c) 응답 역전 — 늦게 도착한 insert 응답이 map 에 행을 되살렸다.  → 잠금으로 차단.
    function setScrapBtn(btn, on) {
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-pressed', String(on));
      btn.setAttribute('aria-label', on ? '스크랩 해제' : '스크랩');
    }

    let scrapsReady = Promise.resolve();   // 내 스크랩 목록 로드 완료 시점
    const scrapInFlight = new Set();       // 요청 진행 중인 article_id (연타 차단)

    async function toggleScrap(btn) {
      if (!session) {
        if (confirm('스크랩은 로그인하면 쓸 수 있어요. 로그인 페이지로 이동할까요?'))
          window.location.href = 'login.html';
        return;
      }
      const id = btn.dataset.id;
      if (scrapInFlight.has(id)) return;
      scrapInFlight.add(id);
      btn.disabled = true;
      try {
        await scrapsReady;                       // 상태를 모르는 채로 판정하지 않는다
        const was = scrapByArticle.has(id);
        setScrapBtn(btn, !was);                  // 낙관적 반영
        if (was) {
          const { error } = await MONC.sb.from('news_scraps').delete()
            .eq('member_id', session.user.id).eq('article_id', id);
          if (error) setScrapBtn(btn, true);     // 실패 → 스크랩 유지 상태로 원복
          else {
            scrapByArticle.delete(id);
            // 되돌리기: 스크랩 탭이면 목록이 다시 그려져 btn 이 떨어져 나가므로 재조회까지 함께
            showToast('스크랩에서 뺐어요', async () => {
              await toggleScrap(btn);
              if (curTab === 'scraps') renderScraps();
            });
          }
        } else {
          const { data, error } = await MONC.sb.from('news_scraps')
            .insert({ member_id: session.user.id, article_id: id }).select('id, note, tag').single();
          if (!error) {
            scrapByArticle.set(id, data);
            showToast('내 스크랩에 담았어요', () => toggleScrap(btn));
            return;
          }
          // 23505 = unique(member_id, article_id) 위반 → 이미 스크랩된 기사였다.
          // 실패로 처리해 버튼을 끄면 DB 와 화면이 어긋나므로, 실제 행을 읽어 맞춘다.
          const { data: row } = await MONC.sb.from('news_scraps')
            .select('id, note, tag').eq('member_id', session.user.id).eq('article_id', id).maybeSingle();
          if (row) { scrapByArticle.set(id, row); setScrapBtn(btn, true); }
          else setScrapBtn(btn, false);
        }
      } finally {
        scrapInFlight.delete(id);
        btn.disabled = false;
      }
    }

    // ⚠️ 스크롤하다 손을 떼면 브라우저가 그 자리에 click 을 쏜다. 목록이 길고 스크랩 버튼이
    //    카드마다 있어서, 스크롤을 멈추려고 화면을 짚은 것만으로 스크랩이 되곤 했다
    //    (2026-07-24 오너: "스크랩 안 한 기사가 들어가 있다"). 눌렀다 뗀 지점이
    //    10px 넘게 움직였으면 탭이 아니라 스크롤로 본다 — 히어로 캐러셀과 같은 가드.
    let tapStart = null;
    document.body.addEventListener('pointerdown', e => { tapStart = { x: e.clientX, y: e.clientY }; }, { passive: true });
    function wasDrag(e) {
      if (!tapStart) return false;
      return Math.abs(e.clientX - tapStart.x) > 10 || Math.abs(e.clientY - tapStart.y) > 10;
    }

    document.body.addEventListener('click', e => {
      if (e.target.closest('#nwScrapView')) return;   // 스크랩 뷰는 자체 핸들러가 처리
      const bm = e.target.closest('.nw-bm');
      if (bm && !wasDrag(e)) toggleScrap(bm);
    });

    // ── 토글 알림 + 되돌리기 ──
    const toastEl = document.getElementById('nwToast');
    const toastMsgEl = document.getElementById('nwToastMsg');
    const toastUndoEl = document.getElementById('nwToastUndo');
    let toastTimer = null, undoAction = null;
    function hideToast() {
      clearTimeout(toastTimer); undoAction = null;
      toastEl.classList.remove('show');
      setTimeout(() => { if (!toastEl.classList.contains('show')) toastEl.hidden = true; }, 200);
    }
    function showToast(msg, undo) {
      clearTimeout(toastTimer);
      toastMsgEl.textContent = msg;
      undoAction = undo || null;
      toastUndoEl.hidden = !undo;
      toastEl.hidden = false;
      void toastEl.offsetWidth;
      toastEl.classList.add('show');
      toastTimer = setTimeout(hideToast, 4000);
    }
    toastUndoEl.addEventListener('click', async () => {
      const fn = undoAction; hideToast();
      if (fn) await fn();
    });
    moreBtn.addEventListener('click', loadMore);

    // ── 내 스크랩 로드(로그인 시) — 스크랩 버튼 상태 표시용 ──
    async function loadMyScraps() {
      const { data, error } = await MONC.sb.from('news_scraps').select('id, article_id, note, tag');
      if (error) return;                               // 테이블 미생성 → 스크랩 기능만 조용히 비활성
      scrapByArticle = new Map((data || []).map(r => [r.article_id, { id: r.id, note: r.note, tag: r.tag }]));
      document.getElementById('nwScrapTab').hidden = false;
      // 이미 렌더된 카드에 스크랩 상태 반영
      listEl.querySelectorAll('.nw-bm').forEach(b => {
        const on = scrapByArticle.has(b.dataset.id);
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));
      });
    }

    // ── 탭 전환: 전체 뉴스 ↔ 내 스크랩 ──
    const scrapView = document.getElementById('nwScrapView');
    // ⚠️ filtersEl 은 여기 없다 — 필터바는 두 탭이 공유하므로 탭 전환에 숨기지 않는다.
    const allView = [countEl, listEl, emptyEl, moreBtn.parentElement, skelEl];
    function switchTab(tab) {
      curTab = tab;
      document.querySelectorAll('.nw-tab').forEach(b => {
        const on = b.dataset.tab === tab;
        b.classList.toggle('active', on); b.setAttribute('aria-selected', String(on));
      });
      searchEl.placeholder = tab === 'scraps'
        ? '내 스크랩 검색 — 제목·메모·태그'
        : '제목 검색 — 예: 유니폼, 채용설명회, 인천공항';
      if (tab === 'scraps') {
        allView.forEach(el => { el.hidden = true; });
        scrapView.hidden = false;
        renderScraps();
      } else {
        scrapView.hidden = true;
        allView.forEach(el => { el.hidden = false; });
        skelEl.hidden = true;
        moreBtn.hidden = exhausted;
        if (!offset) emptyEl.hidden = false; else emptyEl.hidden = true;
        syncPickerVisibility();
        // 스크랩 탭에서 필터를 건드렸으면 전체 목록도 새 조건으로 다시 받는다
        if (filterDirty) { filterDirty = false; resetAndLoad(); }
        // 스크랩 탭에서 해제/추가한 상태를 전체 목록 버튼에 반영(안 하면 낡은 원색이 남는다)
        listEl.querySelectorAll('.nw-bm').forEach(b => {
          const on = scrapByArticle.has(b.dataset.id);
          b.classList.toggle('on', on);
          b.setAttribute('aria-pressed', String(on));
          b.setAttribute('aria-label', on ? '스크랩 해제' : '스크랩');
        });
      }
    }
    document.querySelectorAll('.nw-tab').forEach(b =>
      b.addEventListener('click', () => switchTab(b.dataset.tab)));

    // ── 내 스크랩 렌더 — 항공사별 그룹핑(스펙 §5) + 내 태그 필터(2026-07-22) ──
    let scrapRows = [];   // 마지막 조회 결과(필터 전환은 재조회 없이 이걸로 다시 그림)
    let fTag = 'all';
    let curTab = 'all';   // 현재 탭 — 필터 적용 대상을 가른다

    async function renderScraps() {
      const { data, error } = await MONC.sb.from('news_scraps')
        .select('id, note, tag, created_at, news_articles(id, title, url, source, published_at, airline, topic)')
        .order('created_at', { ascending: false });
      if (error) { scrapRows = []; computeScrapOpts(); drawScraps(); return; }
      scrapRows = (data || []).filter(r => r.news_articles);
      computeScrapOpts();
      drawScraps();
    }

    function drawScraps() {
      const wrap = document.getElementById('nwScrapGroups');
      const empty = document.getElementById('nwScrapEmpty');
      const tagRow = document.getElementById('nwTagRow');

      // 내 태그 필터칩 — 존재하는 태그만, 하나도 없으면 줄 자체를 숨김(빈 기능으로 안 보이게)
      const tags = [...new Set(scrapRows.map(r => r.tag).filter(Boolean))];
      if (!tags.includes(fTag) && fTag !== 'all') fTag = 'all';
      tagRow.hidden = !tags.length;
      tagRow.querySelectorAll('.nw-chip').forEach(n => n.remove());
      if (tags.length) {
        const mk = (label, val) => {
          const b = document.createElement('button');
          b.className = 'nw-chip' + (fTag === val ? ' active' : '');
          b.type = 'button'; b.dataset.val = val; b.textContent = label;
          b.addEventListener('click', () => { fTag = val; drawScraps(); });
          return b;
        };
        tagRow.appendChild(mk('전체', 'all'));
        tags.forEach(t => tagRow.appendChild(mk('#' + t, t)));
      }

      // 태그 + 항공사 + 주제 + 검색(제목·메모·태그)을 AND 로 건다.
      const term = fSearch.trim().toLowerCase();
      const rows = scrapRows.filter(r => {
        const a = r.news_articles;
        if (fTag !== 'all' && r.tag !== fTag) return false;
        if (fAirline !== 'all' && a.airline !== fAirline) return false;
        if (fTopic !== 'all' && a.topic !== fTopic) return false;
        if (!term) return true;
        // 스크랩은 '내 재료함'이라 제목뿐 아니라 내가 남긴 메모·태그로도 찾을 수 있어야 한다
        return (a.title || '').toLowerCase().indexOf(term) >= 0
          || (r.note || '').toLowerCase().indexOf(term) >= 0
          || (r.tag || '').toLowerCase().indexOf(term) >= 0;
      });

      document.getElementById('nwClearAll').hidden = !scrapRows.length;

      // 건수 — 필터가 걸렸으면 '전체 중 몇 건'인지 같이 보여준다
      countEl.hidden = !scrapRows.length;
      countEl.textContent = !scrapRows.length ? ''
        : (rows.length === scrapRows.length ? `${scrapRows.length}건`
          : `${rows.length}건 / 전체 ${scrapRows.length}건`);

      if (!rows.length) {
        wrap.innerHTML = ''; empty.hidden = false;
        if (scrapRows.length) empty.firstChild.textContent = '이 조건에 맞는 스크랩이 없어요. ';
        return;
      }
      empty.hidden = true;

      // 항공사별 그룹(고정 순서), 미분류는 '기타'로 맨 뒤
      const groups = new Map();
      for (const r of rows) {
        const key = r.news_articles.airline || '_etc';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      }
      const order = [...AIRLINE_ORDER.filter(k => groups.has(k)), ...(groups.has('_etc') ? ['_etc'] : [])];

      wrap.innerHTML = order.map(key => {
        const list = groups.get(key);
        const name = key === '_etc' ? '기타' : (AIRLINE_LABEL[key] || key);
        const cards = list.map(r => {
          const a = r.news_articles;
          const chips = a.topic ? `<span class="nw-tag nw-tag-topic">${esc(TOPIC_LABEL[a.topic] || a.topic)}</span>` : '';
          const tagBit = r.tag
            ? `<span class="nw-mytag">#${esc(r.tag)}</span><button class="nw-tag-btn" type="button" data-scrap="${esc(r.id)}">태그 수정</button>`
            : `<button class="nw-tag-btn" type="button" data-scrap="${esc(r.id)}">+ 태그 붙이기</button>`;
          const note = r.note
            ? `<div class="nw-note" data-scrap="${esc(r.id)}">${esc(r.note)}</div>
               <button class="nw-note-btn" type="button" data-scrap="${esc(r.id)}">메모 수정</button>`
            : `<button class="nw-note-btn" type="button" data-scrap="${esc(r.id)}">+ 활용 메모 남기기</button>`;
          return `<li class="nw-card" data-id="${esc(a.id)}">
            <a class="nw-link" href="${esc(a.url)}" target="_blank" rel="noopener">
              <div class="nw-card-title">${esc(a.title)}</div>
              <div class="nw-card-meta">${chips}<span>${esc(a.source || '')}</span><span>${fmtDate(a.published_at)}</span>
                <span class="nw-scrapped-at">${fmtDate(r.created_at)} 담음</span></div>
            </a>
            <div class="nw-extras">${tagBit}</div>
            ${note}
            <button class="nw-bm on" type="button" data-id="${esc(a.id)}" aria-label="스크랩 해제" aria-pressed="true">${BM_SVG}</button>
          </li>`;
        }).join('');
        return `<div class="nw-group-h"><span class="nw-group-name">${esc(name)}</span><span class="nw-group-n">${list.length}건</span></div>
          <ul class="nw-list">${cards}</ul>`;
      }).join('');
    }

    // ── 전체 비우기 — 잘못 담긴 게 쌓였을 때 하나씩 지우지 않고 한 번에 정리 ──
    document.getElementById('nwClearAll').addEventListener('click', async () => {
      if (!session || !scrapRows.length) return;
      if (!confirm('스크랩 ' + scrapRows.length + '건을 모두 지울까요?\n남긴 메모와 태그도 함께 사라지고, 되돌릴 수 없어요.')) return;
      const { error } = await MONC.sb.from('news_scraps').delete().eq('member_id', session.user.id);
      if (error) { alert('삭제에 실패했어요. 잠시 후 다시 시도해주세요.'); return; }
      scrapByArticle.clear();
      listEl.querySelectorAll('.nw-bm').forEach(b => setScrapBtn(b, false));   // 전체 목록 버튼도 끄기
      await renderScraps();
      showToast('스크랩을 모두 비웠어요');
    });

    // ── 활용 메모·태그 인라인 편집 + 스크랩 해제 ──
    function updateLocal(scrapId, patch) {
      scrapRows = scrapRows.map(r => (r.id === scrapId ? { ...r, ...patch } : r));
      for (const [aid, row] of scrapByArticle)
        if (row.id === scrapId) scrapByArticle.set(aid, { ...row, ...patch });
    }

    scrapView.addEventListener('click', async e => {
      // 메모 편집
      const noteBtn = e.target.closest('.nw-note-btn');
      if (noteBtn) {
        const scrapId = noteBtn.dataset.scrap;
        const noteEl = scrapView.querySelector(`.nw-note[data-scrap="${scrapId}"]`);
        const current = noteEl ? noteEl.textContent : '';
        const editor = document.createElement('div');
        editor.className = 'nw-edit';
        editor.innerHTML = `<textarea maxlength="500" placeholder="예: 신규 취항 소식 → 지원동기에 연결">${esc(current)}</textarea>
          <div class="row"><button class="nw-save" type="button">저장</button><button class="nw-cancel" type="button">취소</button></div>`;
        if (noteEl) noteEl.hidden = true;
        noteBtn.hidden = true;
        noteBtn.insertAdjacentElement('afterend', editor);
        const ta = editor.querySelector('textarea'); ta.focus();
        editor.querySelector('.nw-cancel').addEventListener('click', () => {
          editor.remove(); noteBtn.hidden = false; if (noteEl) noteEl.hidden = false;
        });
        editor.querySelector('.nw-save').addEventListener('click', async () => {
          const val = ta.value.trim() || null;
          const { error } = await MONC.sb.from('news_scraps').update({ note: val }).eq('id', scrapId);
          if (error) { alert('메모 저장에 실패했어요. 잠시 후 다시 시도해주세요.'); return; }
          updateLocal(scrapId, { note: val });
          drawScraps();
        });
        return;
      }
      // 태그 편집(자유 입력 + 추천 예시 + 내가 쓴 태그 재노출 — 표기 흔들림 방지)
      const tagBtn = e.target.closest('.nw-tag-btn');
      if (tagBtn) {
        const scrapId = tagBtn.dataset.scrap;
        const row = scrapRows.find(r => r.id === scrapId);
        const current = (row && row.tag) || '';
        const mine = [...new Set(scrapRows.map(r => r.tag).filter(Boolean))];
        const sugs = [...new Set([...mine, ...TAG_SUGGEST])].filter(t => t !== current).slice(0, 8);
        const holder = tagBtn.closest('.nw-extras');
        const editor = document.createElement('div');
        editor.className = 'nw-edit';
        editor.innerHTML = `<input type="text" maxlength="20" placeholder="예: 지원동기 재료" value="${esc(current)}" />
          <div class="sug">${sugs.map(t => `<button type="button" data-t="${esc(t)}">#${esc(t)}</button>`).join('')}</div>
          <div class="row"><button class="nw-save" type="button">저장</button>${current ? '<button class="nw-del nw-cancel" type="button">태그 지우기</button>' : ''}<button class="nw-cancel nw-close" type="button">취소</button></div>`;
        holder.hidden = true;
        holder.insertAdjacentElement('afterend', editor);
        const input = editor.querySelector('input'); input.focus();
        editor.querySelector('.sug').addEventListener('click', ev => {
          const s = ev.target.closest('button[data-t]');
          if (s) input.value = s.dataset.t;
        });
        const saveTag = async val => {
          const { error } = await MONC.sb.from('news_scraps').update({ tag: val }).eq('id', scrapId);
          if (error) { alert('태그 저장에 실패했어요. 잠시 후 다시 시도해주세요.'); return; }
          updateLocal(scrapId, { tag: val });
          drawScraps();
        };
        editor.querySelector('.nw-close').addEventListener('click', () => { editor.remove(); holder.hidden = false; });
        const del = editor.querySelector('.nw-del');
        if (del) del.addEventListener('click', () => saveTag(null));
        editor.querySelector('.nw-save').addEventListener('click', () => {
          const val = input.value.trim();
          if (!val) { input.focus(); return; }
          saveTag(val);
        });
        return;
      }
      // 스크랩 해제 → 목록에서 제거(재조회). 스크롤 오터치는 여기서도 무시.
      const bm = e.target.closest('.nw-bm');
      if (bm && !wasDrag(e)) { await toggleScrap(bm); renderScraps(); }
    });

    // 뒤로가기(bfcache)는 떠날 때 화면을 그대로 되살린다 — 입력값 없는 화면 공통 규칙대로
    // 통째로 새로고침한다(스크랩 상태 갱신도 이걸로 해결 · 자리는 scroll-keep.js 가 지킨다).
    // ?tab=scraps 는 주소에 있어 새로고침에도 보던 탭이 유지된다.
    window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

    (async () => {
      session = await MONC.getSession();
      buildFilters();
      // 스크랩 상태 조회를 목록보다 먼저 띄운다(둘은 병렬). toggleScrap 은 scrapsReady 를
      // 기다리므로, 목록이 먼저 그려져도 상태를 모르는 채 판정하는 일이 없다.
      if (session) scrapsReady = loadMyScraps();
      resetAndLoad();
      if (session) {
        await scrapsReady;
        // mypage '전체 보기'에서 진입 시 스크랩 탭 바로 열기
        if (new URLSearchParams(location.search).get('tab') === 'scraps'
            && !document.getElementById('nwScrapTab').hidden) switchTab('scraps');
      }
    })();
  })();
  </script>
</body>
</html>
