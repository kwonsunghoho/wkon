<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스터디·활동 모바일 시안 — MONC</title><style>
@font-face{font-family:P;src:url('../fonts/classroom/PretendardVariable.woff2')}*{box-sizing:border-box}body{margin:0;color:#1e2229;background:white;font:15px/1.55 P,sans-serif;word-break:keep-all}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #7295c7;outline-offset:3px}button{border:0;background:none;color:inherit}a{color:#1b3a6b}header{height:62px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e3e8ef;padding:0 20px}.logo{font-size:25px;letter-spacing:3px;font-weight:500;color:#1b3a6b}.small{font-size:12px;color:#5f6874}.preview{font-size:11px;letter-spacing:.04em;border:1px solid #dce3ee;border-radius:4px;padding:3px 7px;color:#545c68}main{max-width:600px;margin:auto;padding:26px 20px 110px}h1{font-size:27px;letter-spacing:-1px;line-height:1.3;margin:8px 0;color:#1c2a3a}h2{font-size:19px;line-height:1.4;margin:0 0 10px;color:#1c2a3a}h3{font-size:17px;line-height:1.5;margin:8px 0}.muted{color:#545c68;font-size:14px}p{margin:7px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tabs{display:flex;gap:17px;border-bottom:1px solid #dce3ee;margin-top:23px}.tabs button{font-size:14px;font-weight:650;padding:13px 0;white-space:nowrap;border-bottom:3px solid transparent}.tabs button[aria-pressed=true]{color:#1b3a6b;border-bottom-color:#1b3a6b}.search{display:flex;align-items:center;border:1px solid #d8dfe9;border-radius:9px;margin:19px 0 15px;padding:0 12px;gap:8px}.search input{border:0;min-width:0;margin:0;height:45px;outline:0}.search span{font-size:22px;color:#545c68}.toolbar{font-size:13px;color:#545c68;margin:15px 0 0}.entry{padding:23px 0;border-bottom:1px solid #e0e6ef}.eyebrow{font-size:12px;font-weight:650;color:#1b3a6b}.state{font-size:12px;color:#267052;margin-left:10px}.meta{display:grid;grid-template-columns:36px 1fr;gap:4px 10px;font-size:13px;color:#545c68;margin-top:12px}.meta dt{color:#657080}.meta dd{margin:0}.entryfooter{display:flex;justify-content:space-between;font-size:12px;color:#657080;margin-top:17px}.entryfooter strong{color:#1b3a6b}.primary{background:#1b3a6b;color:white;border:1px solid #1b3a6b;border-radius:8px;padding:13px 16px;font-weight:650;min-height:48px}.outline{border:1px solid #bdcadd;border-radius:8px;padding:11px 14px;font-weight:600;color:#1b3a6b;min-height:44px}.full{width:100%}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:auto;background:#fffffff5;border-top:1px solid #e0e6ef;padding:13px 20px 18px;z-index:2}.intro{margin:0 0 25px}.back{font-size:14px;padding:0;min-height:30px;color:#545c68}.section{border-top:1px solid #dce3ee;padding:24px 0;margin-top:23px}.section:first-of-type{margin-top:20px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.seg button{border:1px solid #d8dfe9;border-radius:7px;min-height:46px;font-size:13px}.seg button[aria-pressed=true]{color:#1b3a6b;border-color:#1b3a6b;background:#f4f7fc;font-weight:700}label{display:block;font-size:14px;font-weight:600;margin:18px 0 7px}input,select,textarea{width:100%;border:1px solid #cdd6e3;border-radius:7px;background:white;padding:11px 12px;font-size:16px;color:#1e2229;min-width:0}textarea{min-height:110px;resize:vertical}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.source{border:1px solid #c4d0e2;border-left:3px solid #1b3a6b;border-radius:0 8px 8px 0;padding:17px;margin:16px 0}.source p{font-size:13px;color:#545c68}.source strong{font-size:16px;display:block;margin:7px 0}.note{font-size:13px;line-height:1.65;color:#545c68;margin:12px 0}.result{padding:23px 0;border-bottom:1px solid #dce3ee}.date{font-size:13px;font-weight:650;color:#1b3a6b}.result h2{margin:9px 0;font-size:18px}.result .outline{margin-top:15px}.help{padding:15px 0;border-bottom:1px solid #dce3ee;color:#545c68;font-size:13px}.weekdays{display:flex;gap:6px}.weekdays button{flex:1;border:1px solid #dce3ee;border-radius:6px;min-height:40px}.weekdays button[aria-pressed=true]{background:#1b3a6b;color:white}.notice{padding:16px;border:1px solid #cdd6e3;border-radius:8px;margin-top:22px}#toast{position:fixed;bottom:90px;left:20px;right:20px;max-width:560px;margin:auto;background:#1c2a3a;color:#fff;padding:14px;border-radius:8px;font-size:14px;z-index:5}#toast:empty{display:none}summary{cursor:pointer;font-weight:600;font-size:14px;padding:10px 0}.textbutton{color:#1b3a6b;text-decoration:underline;font-size:13px;padding:8px 0}.chips{font-size:12px;color:#5f6874;margin-top:12px}@media(min-width:700px){header{max-width:600px;margin:auto}main{border-left:1px solid #eef1f5;border-right:1px solid #eef1f5;min-height:90vh}}
</style></head><body><header><span class="logo">MONC</span><span class="preview">모바일 시안 · 예시 데이터</span></header><main id="app"></main><div id="bottom" class="bottom"></div><div id="toast" role="status"></div><script>
const app=document.getElementById('app'),bottom=document.getElementById('bottom');
const cats=['면접 준비','어학 스터디','봉사활동'];let filter='전체',category='봉사활동',selected=false,repeat=false,previewScreen='list';const draft={};
const items=[['면접 준비','대한항공 모의면접 함께 준비해요','매주 화·목 · 19:00–21:00','서울 강남 · 오프라인','경험답변 · 모의면접','3','4'],['어학 스터디','영어로 하루 30분, 함께 말해요','매주 월·수 · 20:00–20:30','온라인 · 화상 모임','영어회화 · 초보환영','2','4'],['봉사활동','토요일, 하천 정화 봉사 같이 가요','11. 21. (토) · 09:00–12:00','서울 마포 · 오프라인','1365 공고 연결 · 동행 모집','2','5']];
function footer(label,fn){bottom.innerHTML=`<button class="primary full" onclick="${fn}">${label}</button>`}function scrollStart(){window.scrollTo(0,0)}function toast(t){document.getElementById('toast').textContent=t;setTimeout(()=>document.getElementById('toast').textContent='',4000)}
function list(){previewScreen='list';app.innerHTML=`<h1>스터디·활동</h1><p class="muted">면접부터 봉사까지, 함께할 사람을 찾아요.</p><div class="tabs" aria-label="카테고리">${['전체',...cats].map(c=>`<button aria-pressed="${filter===c}" onclick="filter='${c}';list()">${c}</button>`).join('')}</div><div class="search"><span aria-hidden="true">⌕</span><input aria-label="모임 검색" placeholder="관심 있는 모임을 검색해 보세요" oninput="searchList(this.value)"></div>${filter==='봉사활동'?'<button class="outline full" onclick="picker()">1365 봉사 공고 찾기 →</button>':''}<div class="row toolbar"><span>모집 중인 모임 <b id="count">${items.filter(i=>filter==='전체'||i[0]===filter).length}</b></span><span>최근 모집순</span></div><div id="entries">${items.filter(i=>filter==='전체'||i[0]===filter).map(i=>`<article class="entry" data-title="${i.join(' ')}"><div class="eyebrow">${i[0]}<span class="state">모집 중</span></div><h3>${i[1]}</h3><dl class="meta"><dt>일정</dt><dd>${i[2]}</dd><dt>장소</dt><dd>${i[3]}</dd></dl><p class="chips">${i[4]}</p><div class="entryfooter"><span>예시 모임</span><span>참여 <strong>${i[5]}</strong> / ${i[6]}명</span></div></article>`).join('')}</div>`;footer('＋ 모임 모집하기',"renderForm()");scrollStart()}
function searchList(q){let n=0;document.querySelectorAll('.entry').forEach(el=>{el.hidden=!el.dataset.title.includes(q);if(!el.hidden)n++});document.getElementById('count').textContent=n}
function saveDraft(){app.querySelectorAll('input,textarea,select').forEach(el=>{if(el.id)draft[el.id]=el.value})}
function changeCategory(c){saveDraft();category=c;renderForm()}
function renderForm(){previewScreen='form';const vol=category==='봉사활동';app.innerHTML=`<button class="back" onclick="saveDraft();list()">← 모임 목록</button><h1>함께할 사람 모집하기</h1><p class="muted">어떤 활동을 함께하고 싶으세요?</p><section class="section"><h2>모임 종류</h2><div class="seg">${cats.map(c=>`<button aria-pressed="${category===c}" onclick="changeCategory('${c}')">${c}</button>`).join('')}</div></section>${vol?`<section class="section" style="margin-top:0"><div class="row"><h2>함께할 봉사활동</h2><span class="small">선택</span></div>${selected?`<div class="source"><span class="eyebrow">1365 연결 · 예시 공고</span><strong>${selected===2?'복지관 점심 배식 도움':'주말 하천 환경정화 활동'}</strong><p>11. 21. (토) · ${selected===2?'10:00–13:00':'09:00–12:00'}<br>${selected===2?'서울 서대문':'서울 마포'} · 예시 봉사기관</p><button class="textbutton" onclick="saveDraft();picker()">다른 공고 선택</button></div>`:`<p class="muted">공고를 고르면 활동 정보가 채워져요.</p><button class="outline full" onclick="saveDraft();picker()">1365 봉사 공고 찾아보기 →</button><p class="note">공고 없이 직접 활동을 입력해도 괜찮아요.</p>`}</section>`:''}<section class="section" style="margin-top:0"><h2>모집 내용</h2><label for="title">모임 이름</label><input id="title" placeholder="${vol?'예: 토요일 봉사 같이 가요':'예: 함께 준비하는 주말 스터디'}" value=""><label for="goal">${vol?'활동 내용':category==='어학 스터디'?'학습 언어·목표':'목표 항공사·면접'} <span class="small">선택</span></label><input id="goal" placeholder="${vol?'어떤 활동을 함께하나요?':category==='어학 스터디'?'예: 영어 회화 · 오픽 IH':'예: 대한항공 · 모의면접'}"><label for="capacity">함께할 인원 <span class="small">모집자 포함</span></label><select id="capacity"><option>4명</option><option>5명</option><option>6명</option></select>${vol?'<p class="note">기관의 모집 정원과 별개인 몬크 동행 인원이에요.</p>':''}</section><section class="section" style="margin-top:0"><h2>언제, 어디서 만날까요?</h2><div class="seg" style="grid-template-columns:1fr 1fr"><button aria-pressed="${!repeat}" onclick="saveDraft();repeat=false;renderForm()">특정 날짜</button><button aria-pressed="${repeat}" onclick="saveDraft();repeat=true;renderForm()">매주 반복</button></div>${repeat?'<label>모임 요일</label><div class="weekdays">'+[...'월화수목금토일'].map(d=>`<button type="button" aria-pressed="false" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true')">${d}</button>`).join('')+'</div>':'<label for="date">활동 날짜</label><input id="date" type="date" value="2026-11-21">'}<div class="pair"><div><label for="start">시작 시간</label><input id="start" type="time" value="09:00"></div><div><label for="end">종료 시간</label><input id="end" type="time" value="12:00"></div></div><label for="place">${vol?'활동 장소':'모임 장소·진행 방식'}</label><input id="place" placeholder="예: 서울 마포 또는 온라인"><label for="description">함께할 분에게 전할 말</label><textarea id="description" placeholder="진행 방법, 준비물, 만날 장소 등을 알려주세요."></textarea></section><details><summary>태그·참여 조건 추가 (선택)</summary><label for="tags">태그</label><input id="tags" placeholder="예: 초보환영, 주말"><label for="conditions">참여 조건</label><input id="conditions" placeholder="함께할 분에게 바라는 점">${category==='면접 준비'?'<p class="note">면접 경험 인증·몬크 실력 레벨 조건은 기존 설정을 사용합니다.</p>':''}</details>${vol?'<div class="notice"><strong>봉사기관 신청도 확인해 주세요</strong><p class="note">몬크에서는 함께 갈 사람을 모집해요. 기관 참가 신청과 봉사시간 인정은 해당 기관의 안내를 따라야 해요.</p></div>':''}`;Object.entries(draft).forEach(([k,v])=>{const el=document.getElementById(k);if(el)el.value=v});footer('모집 내용 미리보기',"review()");scrollStart()}
function picker(){previewScreen='picker';app.innerHTML=`<button class="back" onclick="renderForm()">← 모집 작성</button><h1>함께할 봉사 찾기</h1><p class="muted">지역과 날짜로 공고를 찾아 연결하세요.</p><div class="pair"><div><label for="region">지역</label><select id="region"><option>서울</option><option>경기</option></select></div><div><label for="when">활동 날짜</label><input id="when" type="date" value="2026-11-21"></div></div><div class="search"><input id="keyword" aria-label="봉사 검색어" placeholder="환경정화, 배식, 돌봄…"><button onclick="filterResults()" style="white-space:nowrap;color:#1b3a6b">검색</button></div><p class="help">1365 연동 화면 시안입니다.<br>아래는 실제 모집 중인 공고가 아닌 예시입니다.</p><div class="row toolbar"><span id="resultcount">예시 공고 2건</span><span>활동일순</span></div><article class="result" data-region="서울" data-date="2026-11-21" data-key="환경정화 하천"><div class="date">11. 21. 토요일 <span class="state">모집 중 · 예시</span></div><h2>주말 하천 환경정화 활동</h2><p class="muted">서울 마포 · 예시 봉사기관</p><dl class="meta"><dt>시간</dt><dd>09:00–12:00</dd><dt>대상</dt><dd>성인 · 참여 조건 확인 필요</dd></dl><button class="outline full" onclick="pick()">이 활동으로 동행 모집</button></article><article class="result" data-region="서울" data-date="2026-11-21" data-key="배식 복지관"><div class="date">11. 21. 토요일 <span class="state">모집 중 · 예시</span></div><h2>복지관 점심 배식 도움</h2><p class="muted">서울 서대문 · 예시 봉사기관</p><dl class="meta"><dt>시간</dt><dd>10:00–13:00</dd><dt>대상</dt><dd>성인 · 참여 조건 확인 필요</dd></dl><button class="outline full" onclick="pick(true)">이 활동으로 동행 모집</button></article><p id="empty" class="note" hidden>조건에 맞는 예시 공고가 없어요. 지역·날짜·검색어를 바꿔 주세요.</p>`;footer('공고 없이 직접 입력하기',"selected=false;renderForm()");scrollStart()}
function filterResults(){let n=0;document.querySelectorAll('.result').forEach(el=>{el.hidden=el.dataset.region!==document.getElementById('region').value||el.dataset.date!==document.getElementById('when').value||!el.dataset.key.includes(document.getElementById('keyword').value.trim());if(!el.hidden)n++});document.getElementById('resultcount').textContent='예시 공고 '+n+'건';document.getElementById('empty').hidden=!!n}
function pick(second=false){selected=second?2:1;category='봉사활동';repeat=false;draft.title=second?'점심 배식 봉사 함께 가요':'토요일 하천 정화 봉사 같이 가요';draft.goal=second?'복지관 배식 도움':'하천 주변 쓰레기 수거와 환경정화';draft.place=second?'서울 서대문':'서울 마포';draft.start=second?'10:00':'09:00';draft.end=second?'13:00':'12:00';draft.date='2026-11-21';renderForm();if(second){document.querySelector('.source strong').textContent='복지관 점심 배식 도움';document.querySelector('.source p').innerHTML='11. 21. (토) · 10:00–13:00<br>서울 서대문 · 예시 봉사기관'}toast('예시 공고의 활동 정보를 불러왔어요.')}
function review(){saveDraft();if(!draft.title?.trim()){document.getElementById('title').focus();toast('모임 이름을 입력해 주세요.');return}app.innerHTML='<button class="back" onclick="renderForm()">← 작성 내용 수정</button><h1>모집 내용 미리보기</h1><div class="section"><div class="eyebrow" id="reviewcat"></div><h2 id="reviewtitle"></h2><p class="muted" id="reviewgoal"></p><p id="reviewdate"></p><p id="reviewplace"></p></div><p class="note">시안에서는 게시하거나 기관에 신청하지 않습니다.</p>';document.getElementById('reviewcat').textContent=category;document.getElementById('reviewtitle').textContent=draft.title;document.getElementById('reviewgoal').textContent=draft.goal;document.getElementById('reviewdate').textContent=(repeat?'매주 선택한 요일':draft.date)+' · '+draft.start+'–'+draft.end;document.getElementById('reviewplace').textContent=draft.place;footer('시안 확인 완료',"toast('모바일 시안입니다. 실제 모집글은 등록되지 않았어요.')");scrollStart()}
list();
</script></body></html>
