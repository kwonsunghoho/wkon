<!DOCTYPE html>
<html lang="ko">

<title>KE20 후기 쓰기 — 목업</title>
<!-- ══════════════════════════════════════════════════════════════════════════
     KE20 후기 쓰기 화면 목업 — 2026-09-29
     오너: "KE20 후기칸도 만들어줘 · 닉네임을 따로 작성할 수 있도록 · 후기 작성하는 링크도 ·
           목업으로 먼저 · 후기작성 UXUI를 신경썼으면 좋겠어"
     2차: "500자 말고 1500자로 · 후기 내용은 저거 뭐야? 클릭하면 태그처럼 달리는건가?
           저런것들을 좀 더 추가하면 어떨까" → 글자 수 1,500 · 단추 3개 → 6개.
     3차: "첫마디 6개 뭔가 소제목처럼 딱 알아볼 수 있게 하면 더 좋지않을까? 보는 사람들 기준으로"
           → 문장 첫마디('가장 도움이 된 건 …')를 버리고 **소제목**으로 바꿨다. 단추를 누르면
             내용 칸에 [가장 도움이 된 점] 한 줄이 들어가고, 후기 카드에서는 그 줄이 굵은 남색
             소제목으로 보인다. 글은 여전히 한 덩어리 글자다(칸을 새로 만들지 않는다).

     실제로는 review-write.html?ch=ke20 이 그릴 화면이다(파일을 새로 만들지 않는다).
     이 목업은 눌러 볼 수 있다 — 닉네임·내용을 쓰면 아래 미리보기가 따라 바뀌고,
     제출을 누르면 완료 화면으로 넘어간다. ⚠️ 저장은 하지 않는다(서버 호출 없음).

     보드(ke20-review-mockup.html)가 상태별로 찍을 때 쓰는 훅: ?state=typing|error|done
     ⚠️ 채워 둔 닉네임·후기 문장은 목업용으로 지은 예시다 — 실제 후기가 아니다.
     ══════════════════════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="../tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'SUIT Variable', SUIT, 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6;
    -webkit-font-smoothing: antialiased; word-break: keep-all; }
  button { font: inherit; }

  /* 상단 바 자리 — 라이브는 nav.js 가 심는다(모바일 57px · 로고 26px · 햄버거) */
  .fakenav { position: sticky; top: 0; z-index: 10; height: 57px; padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(20,32,52,.1); }
  .fakenav img { height: 26px; width: auto; display: block; }
  .fakenav .ham { display: flex; flex-direction: column; gap: 5px; padding: 8px; }
  .fakenav .ham i { display: block; width: 22px; height: 2px; background: var(--primary); border-radius: 2px; }

  .wrap { max-width: 620px; margin: 0 auto; padding: 24px 20px 56px; }
  .pg-eye { font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--accent-ink); }
  .pg-h { margin: 4px 0 4px; font-family: var(--serif); font-size: 24px; font-weight: 800;
    letter-spacing: -.02em; line-height: 1.3; color: var(--ink); }
  .pg-s { font-size: 14px; color: var(--text-muted); }

  .card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px 18px; margin-top: 16px; }

  /* 칸 하나 = 이름표 줄 + 입력 + 아래 한 줄 */
  .fld + .fld { margin-top: 24px; }
  .lb-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .lb { font-size: 14px; font-weight: 800; color: var(--text); }
  .lb-opt { font-size: 12px; font-weight: 700; color: var(--text-dim); }
  /* 입력칸 — 16px(iOS 확대 방지) · 경계선은 3:1 짜리 --border-strong(선 하나가 유일한 표식) */
  .inp { display: block; width: 100%; min-height: 48px; padding: 11px 12px;
    border: 1px solid var(--border-strong); border-radius: var(--radius-xs);
    background: var(--surface); color: var(--text); font-family: inherit; font-size: 16px; line-height: 1.5; }
  .inp::placeholder, .ed textarea::placeholder { color: var(--text-dim); }
  .inp:focus { outline: 2px solid var(--action); outline-offset: -1px; border-color: var(--action); }
  .under { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: 6px; min-height: 20px; }
  .hint { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
  .msg-err { font-size: 14px; font-weight: 700; color: #B3261E; line-height: 1.45; }
  .cnt { flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .cnt.ok { color: var(--accent-ink); }

  /* 내용 칸 — 소제목 판 + 글 쓰는 자리 + 글자 수가 한 상자다.
     글이 길어지면 상자가 같이 자란다(안쪽 스크롤 없음). */
  .ed { border: 1px solid var(--border-strong); border-radius: var(--radius-xs); background: var(--surface); overflow: hidden; }
  .ed:has(textarea:focus) { outline: 2px solid var(--action); outline-offset: -1px; border-color: var(--action); }
  .ed.bad { border-color: #B3261E; }
  .ed.bad:has(textarea:focus) { outline-color: #B3261E; }
  /* 소제목 단추 — 누르면 [소제목] 한 줄이 내용 칸에 들어간다(태그가 아니라 글의 일부다).
     쓴 소제목은 더하기 자리가 체크로 바뀐다 — 아이콘 폭이 같아 단추가 움직이지 않는다. */
  .ed-seed { padding: 10px 10px 12px; border-bottom: 1px solid var(--border-soft); }
  .ed-seed-h { margin: 0 2px 8px; font-size: 12px; font-weight: 800; color: var(--text-dim); }
  .ed-seed-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .ed-seed-grid button { display: flex; align-items: center; justify-content: space-between; gap: 4px; min-height: 44px; padding: 4px 8px 4px 10px;
    border: 1px solid transparent; border-radius: var(--radius-xs); background: var(--action-tint);
    color: var(--accent-ink); font-size: 14px; font-weight: 700; line-height: 1.3; text-align: left; cursor: pointer; }
  .ed-seed-grid button:hover { background: var(--bg3); }
  .ed-seed-grid button:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
  .ed-seed-grid .g { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; }
  .ed-seed-grid .g svg { width: 12px; height: 12px; }
  .ed-seed-grid button.used { background: transparent; border: 1px dashed var(--border-strong); color: var(--text-dim); }
  .ed textarea { display: block; width: 100%; min-height: 160px; padding: 12px 12px 4px; border: 0; outline: 0; resize: none;
    overflow: hidden; background: transparent; color: var(--text); font-family: inherit; font-size: 16px; line-height: 1.65; }
  .ed-foot { display: flex; justify-content: flex-end; padding: 0 12px 8px; }

  /* 사진(선택) */
  .ph-add { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px;
    border: 1px dashed var(--border-strong); border-radius: var(--radius-xs); background: var(--bg2);
    color: var(--text-muted); font-size: 14px; font-weight: 700; cursor: pointer; }
  .ph-add:hover { border-color: var(--action); color: var(--accent-ink); }
  .ph-add:focus-visible, .ph-sub:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
  .ph-add svg { width: 20px; height: 20px; flex-shrink: 0; }
  .ph-has { display: flex; align-items: stretch; gap: 12px; }
  .ph-has img { width: 84px; height: 112px; object-fit: cover; border-radius: var(--radius-xs);
    border: 1px solid var(--border-soft); display: block; background: var(--surface2); flex-shrink: 0; }
  .ph-acts { display: flex; flex-direction: column; justify-content: center; gap: 8px; flex: 1; min-width: 0; }
  .ph-sub { min-height: 44px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-xs);
    background: var(--surface); color: var(--text-muted); font-size: 14px; font-weight: 700; cursor: pointer; }

  /* 미리보기 — 후기 목록(reviews-list.html)의 카드 규격 그대로.
     · 소제목 없는 짧은 글(80자 이하 한 단락)은 한줄평 활자(굵게)
     · 그 밖에는 읽는 활자 — [소제목] 줄은 굵은 남색 소제목으로, 길면 232px(약 8줄)에서 접는다 */
  .pv { margin-top: 24px; }
  .pv-h { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 8px; }
  .pv-h b { font-size: 14px; font-weight: 800; color: var(--text); }
  .pv-h span { font-size: 12px; color: var(--text-dim); }
  .rv-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    overflow: hidden; box-shadow: 0 2px 10px rgba(23,42,71,.06); }
  .rv-body { padding: 20px 18px 16px; display: flex; flex-direction: column; }
  .rv-verify { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; font-size: 12px; font-weight: 800;
    color: #2F6B42; background: rgba(47,107,66,.12); border-radius: 999px; padding: 4px 10px; margin-bottom: 13px; }
  .rv-verify svg { width: 12px; height: 12px; flex-shrink: 0; }
  .rv-quote { font-family: var(--serif); font-size: 18px; font-weight: 700; line-height: 1.55; color: var(--text);
    letter-spacing: -.2px; white-space: pre-line; overflow-wrap: anywhere; }
  .rv-quote.is-empty { color: var(--text-dim); font-weight: 400; font-size: 16px; }
  .rv-rich { position: relative; }
  .rv-rich.is-clamp { max-height: 232px; overflow: hidden; }
  .rv-rich.is-clamp::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; pointer-events: none;
    background: linear-gradient(to bottom, rgba(255,255,255,0), var(--surface)); }
  .rv-part + .rv-part { margin-top: 18px; }
  /* 소제목 — 본문(16px 보통)과 굵기·색·왼쪽 막대 셋으로 갈린다. 카드 한 장만 잘라 봐도 단락 이름이 읽힌다 */
  .rv-part-h { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; font-size: 15px; font-weight: 800;
    line-height: 1.4; letter-spacing: -.01em; color: var(--accent-ink); }
  .rv-part-h::before { content: ''; flex: none; width: 3px; height: 14px; border-radius: 2px; background: var(--accent-ink); }
  .rv-part-p { font-size: 16px; font-weight: 400; line-height: 1.75; color: var(--text); white-space: pre-line; overflow-wrap: anywhere; }
  .rv-part-p.is-empty { color: var(--text-dim); }
  .rv-more { align-self: flex-start; min-height: 44px; margin: 4px 0 -12px; padding: 0 2px; border: 0; background: none;
    color: var(--accent-ink); font-size: 14px; font-weight: 800; cursor: pointer; }
  .rv-more:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; border-radius: 4px; }
  .rv-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    margin-top: 16px; padding: 12px 16px 13px; border-top: 1px solid var(--border-soft); }
  .rv-who { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; }
  .rv-name { font-family: var(--serif); font-size: 15px; font-weight: 800; color: var(--text); overflow-wrap: anywhere; }
  .rv-tag { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: rgba(27,58,107,.10); color: var(--accent-ink); }
  .rv-src { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; font-size: 14px; font-weight: 800; color: var(--accent-ink); padding: 5px 2px; }
  .rv-src svg { width: 12px; height: 12px; }

  .submit { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px;
    margin-top: 20px; border: 0; border-radius: var(--radius-sm); background: var(--action);
    color: var(--action-ink); font-size: 16px; font-weight: 800; cursor: pointer; }
  .submit:hover { background: var(--action-hover); }
  .submit:focus-visible { outline: 3px solid var(--action); outline-offset: 3px; }
  .submit[disabled] { opacity: .6; cursor: default; }
  .foot-note { margin-top: 12px; font-size: 12px; color: var(--text-dim); text-align: center; line-height: 1.6; }

  /* 완료 화면 */
  .done { text-align: center; padding-top: 12px; }
  .done .ic { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%; background: var(--action-tint);
    color: var(--action); display: flex; align-items: center; justify-content: center; }
  .done .ic svg { width: 28px; height: 28px; }
  .done h2 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; color: var(--ink); }
  .done h2:focus { outline: none; }   /* 낭독기용으로 스크립트가 옮긴 포커스 — 누르는 요소가 아니라 링을 그리지 않는다 */
  .done > p { margin-top: 8px; font-size: 14px; color: var(--text-muted); }
  .done .pv { text-align: left; }
  .links { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .links a { display: flex; align-items: center; justify-content: center; min-height: 52px;
    border-radius: var(--radius-sm); text-decoration: none; font-size: 16px; font-weight: 800; }
  .links a.main { background: var(--action); color: var(--action-ink); }
  .links a.sub { border: 1px solid var(--border-strong); color: var(--text-muted); font-size: 14px; min-height: 48px; }
  .links a:focus-visible { outline: 3px solid var(--action); outline-offset: 3px; }

  [hidden] { display: none !important; }
  @media (min-width: 760px) { .wrap { padding-top: 36px; } }
</style>
</head>
<body>
  <div class="fakenav" aria-hidden="true">
    <img src="../images/MONC_Logo_Full_Package/assets/web/monc-logo-transparent-640.webp" alt="">
    <span class="ham"><i></i><i></i><i></i></span>
  </div>

  <main class="wrap">
    <!-- ── 쓰는 화면 ─────────────────────────────────────────── -->
    <section id="vForm">
      <p class="pg-eye">대한항공 대비 프로젝트</p>
      <h1 class="pg-h">KE20 후기 쓰기</h1>
      <p class="pg-s">KE20을 마친 소감을 남겨 주세요.</p>

      <div class="card">
        <div class="fld">
          <div class="lb-row">
            <label class="lb" for="rwName">닉네임</label>
            <span class="lb-opt">선택</span>
          </div>
          <input class="inp" id="rwName" type="text" maxlength="20" autocomplete="off"
                 enterkeyhint="next" placeholder="예: 하늘준비생">
          <div class="under"><p class="hint">후기에 이 이름으로 보여요. 비우면 이름 없이 올라가요.</p></div>
        </div>

        <div class="fld">
          <div class="lb-row">
            <label class="lb" for="rwQuote">후기 내용</label>
          </div>
          <div class="ed" id="edBox">
            <div class="ed-seed">
              <p class="ed-seed-h" id="seedH">소제목 넣기</p>
              <div class="ed-seed-grid" id="seedGrid" role="group" aria-labelledby="seedH"></div>
            </div>
            <textarea id="rwQuote" maxlength="1500" aria-describedby="rwMsg rwCnt"
                      placeholder="소제목을 눌러 나눠 쓰거나, 자유롭게 적어 주세요."></textarea>
            <div class="ed-foot"><span class="cnt" id="rwCnt">0 / 1,500자</span></div>
          </div>
          <div class="under"><p class="hint" id="rwMsg" role="status">10자 이상 적어 주세요.</p></div>
        </div>

        <div class="fld">
          <div class="lb-row">
            <span class="lb" id="phLb">사진</span>
            <span class="lb-opt">선택</span>
          </div>
          <div id="phBox"></div>
          <div class="under"><p class="hint">전화번호·이름이 찍힌 사진은 올리지 말아 주세요.</p></div>
        </div>
      </div>

      <div class="pv" aria-label="미리보기">
        <div class="pv-h"><b>미리보기</b><span>후기 페이지에 이렇게 올라가요</span></div>
        <div id="pvSlot"></div>
      </div>

      <button type="button" class="submit" id="rwSubmit">후기 제출하기</button>
      <p class="foot-note">제출한 후기는 검토 뒤 후기 페이지에 올라가요.</p>
    </section>

    <!-- ── 제출 완료 ─────────────────────────────────────────── -->
    <section id="vDone" class="done" hidden>
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
      <h2 tabindex="-1" id="doneH">후기가 제출됐어요</h2>
      <p>검토가 끝나면 후기 페이지에 올라갑니다.</p>
      <div class="pv">
        <div class="pv-h"><b>제출한 후기</b></div>
        <div id="pvDone"></div>
      </div>
      <div class="links">
        <a class="main" href="ke20-review-pages-mockup.html?s=hub">후기 모아보기</a>
        <a class="sub" href="#">홈으로</a>
      </div>
    </section>
  </main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const MIN = 10, MAX = 1500;
  const SHORT = 80;       // 소제목 없이 이 길이 이하 한 단락이면 한줄평 활자(굵게)
  const CLAMP = 232;      // 카드에서 글을 접는 높이(약 8줄) — CSS .rv-rich.is-clamp 와 한 벌
  /* 소제목 — 단추 글씨 = 내용 칸에 [ ] 로 들어가는 글씨 = 후기 카드에 보이는 소제목.
     순서는 후기 한 편이 흘러가는 차례: 계기 → 과정(도움·기억·힘든 점) → 결과 → 추천 */
  const TOPICS = ['신청 계기', '가장 도움이 된 점', '기억에 남는 것', '힘들었던 점', '달라진 점', '추천하고 싶은 분'];
  /* 줄 맨 앞의 [소제목] 을 소제목으로 읽는다. 뒤에 글이 붙어 있어도(줄바꿈을 지워 버린 경우) 읽는다 —
     그러지 않으면 대괄호가 글자 그대로 후기에 나간다. 직접 친 [제목] 도 같은 규칙으로 소제목이 된다. */
  const HEAD_RE = /^\s*\[([^\[\]\n]{1,20})\]\s*(.*)$/;
  const nameEl = $('rwName'), quoteEl = $('rwQuote'), msgEl = $('rwMsg'), cntEl = $('rwCnt');
  let photoUrl = '';      // 고른 사진의 미리보기 주소(목업 — 올리지 않는다)
  let tried = false;      // 제출을 한 번이라도 눌렀나 — 그 뒤로는 부족하면 빨갛게 알린다
  let pvOpen = false;     // 미리보기의 '더 보기'를 펼쳐 뒀나(쓰는 동안 다시 접히지 않게)

  const VERIFY = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M5 8.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const OUT = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3h7v7M13 3 4 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.2-2h6.6L16.5 7h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg>';
  const CHECK = '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 6.4l2.6 2.6L10 3.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const PLUS = '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 2v8M2 6h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

  /* 글 → 단락 목록 [{h: 소제목(없으면 ''), text}] */
  function parse(text) {
    const parts = []; let cur = { h: '', lines: [] };
    String(text || '').replace(/\r/g, '').split('\n').forEach(line => {
      const m = line.match(HEAD_RE);
      if (m) { parts.push(cur); cur = { h: m[1].trim(), lines: m[2] ? [m[2]] : [] }; }
      else cur.lines.push(line);
    });
    parts.push(cur);
    return parts.map(p => ({ h: p.h, text: p.lines.join('\n').trim() })).filter(p => p.h || p.text);
  }
  // 소제목을 뺀 본문 글자 수 — 소제목만 눌러 놓고 제출하는 것을 막는다
  const bodyLen = text => parse(text).reduce((n, p) => n + p.text.length, 0);

  /* 후기 목록 카드와 같은 마크업 — 이름이 없으면 꼬리표(KE20)만 남는다(목록과 같은 규칙).
     live=쓰는 중 미리보기: 아직 본문이 없는 소제목도 자리를 보여 준다. 올라가는 후기에서는 빈 소제목을 뺀다. */
  function cardHtml(live) {
    const name = nameEl.value.trim();
    const parts = parse(quoteEl.value).filter(p => live || p.text);
    let body;
    if (!parts.length) {
      body = `<p class="rv-quote is-empty">후기 내용이 여기에 보여요.</p>`;
    } else if (parts.length === 1 && !parts[0].h && parts[0].text.length <= SHORT && parts[0].text.indexOf('\n') < 0) {
      body = `<p class="rv-quote">${esc(parts[0].text)}</p>`;
    } else {
      body = `<div class="rv-rich">` + parts.map(p => `<div class="rv-part">
          ${p.h ? `<p class="rv-part-h">${esc(p.h)}</p>` : ''}
          ${p.text ? `<p class="rv-part-p">${esc(p.text)}</p>` : `<p class="rv-part-p is-empty">내용을 적으면 여기에 보여요.</p>`}
        </div>`).join('') + `</div><button type="button" class="rv-more" aria-expanded="false" hidden>더 보기</button>`;
    }
    return `<figure class="rv-card">
      <div class="rv-body"><span class="rv-verify">${VERIFY}실제 후기</span>${body}</div>
      <div class="rv-foot">
        <div class="rv-who">${name ? `<span class="rv-name">${esc(name)}</span>` : ''}<span class="rv-tag">KE20</span></div>
        ${photoUrl ? `<span class="rv-src">사진 보기 ${OUT}</span>` : ''}
      </div>
    </figure>`;
  }
  /* 긴 글 접기 — 접는 높이를 40px 넘게 넘칠 때만 접는다(두세 줄 가리자고 단추를 달지 않는다) */
  function wireMore(root, keepOpen) {
    const box = root.querySelector('.rv-rich'), btn = root.querySelector('.rv-more');
    if (!box || !btn) return;
    const over = box.scrollHeight > CLAMP + 40;
    btn.hidden = !over;
    if (!over) return;
    const set = open => {
      box.classList.toggle('is-clamp', !open);
      btn.setAttribute('aria-expanded', String(open));
      btn.textContent = open ? '접기' : '더 보기';
    };
    set(!!keepOpen);
    btn.addEventListener('click', () => {
      const open = btn.getAttribute('aria-expanded') !== 'true';
      set(open);
      if (root.id === 'pvSlot') pvOpen = open;
      tellParent();
    });
  }

  const headRe = t => new RegExp('(^|\\n)[ \\t]*\\[' + escRe(t) + '\\]');
  function renderSeeds() {
    const v = quoteEl.value;
    $('seedGrid').innerHTML = TOPICS.map((t, i) => {
      const used = headRe(t).test(v);
      return `<button type="button" data-i="${i}" class="${used ? 'used' : ''}"${used ? ' aria-label="' + esc(t) + ' — 넣었어요"' : ''}>
        <span>${esc(t)}</span><span class="g" aria-hidden="true">${used ? CHECK : PLUS}</span></button>`;
    }).join('');
  }

  function sync() {
    const v = quoteEl.value;
    const n = bodyLen(v);
    cntEl.textContent = v.trim().length.toLocaleString() + ' / ' + MAX.toLocaleString() + '자';
    cntEl.classList.toggle('ok', n >= MIN);
    const bad = tried && n < MIN;
    $('edBox').classList.toggle('bad', bad);
    if (bad) { msgEl.className = 'msg-err'; msgEl.textContent = '10자 이상 적어 주세요. 지금 ' + n + '자예요.'; }
    else { msgEl.className = 'hint'; msgEl.textContent = n >= MIN ? '' : '10자 이상 적어 주세요.'; }
    // 글이 길어지면 칸이 같이 자란다 — 칸 안에서 따로 스크롤하지 않게
    quoteEl.style.height = 'auto';
    quoteEl.style.height = Math.max(160, quoteEl.scrollHeight) + 'px';
    $('pvSlot').innerHTML = cardHtml(true);
    wireMore($('pvSlot'), pvOpen);
  }

  function renderPhoto() {
    const box = $('phBox');
    if (!photoUrl) {
      box.innerHTML = `<button type="button" class="ph-add" id="phPick" aria-describedby="phLb">${CAM}사진 고르기</button>`;
    } else {
      box.innerHTML = `<div class="ph-has"><img src="${photoUrl}" alt="고른 사진 미리보기">
        <div class="ph-acts">
          <button type="button" class="ph-sub" id="phPick">다시 고르기</button>
          <button type="button" class="ph-sub" id="phDel">빼기</button>
        </div></div>`;
      $('phDel').addEventListener('click', () => { photoUrl = ''; renderPhoto(); sync(); $('phPick').focus(); });
    }
    $('phPick').addEventListener('click', pickPhoto);
  }
  function pickPhoto() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.addEventListener('change', () => {
      const f = input.files && input.files[0];
      if (!f) return;
      photoUrl = URL.createObjectURL(f);
      renderPhoto(); sync();
    });
    input.click();
  }

  /* 소제목 단추 — 아직 안 넣은 것은 글 끝에 새 단락으로 [소제목] 줄을 붙이고, 이미 넣은 것은
     그 단락 끝으로 커서를 옮긴다. 어느 쪽이든 바로 쓸 수 있게 내용 칸에 포커스를 준다. */
  $('seedGrid').addEventListener('click', e => {
    const b = e.target.closest('button[data-i]'); if (!b) return;
    const t = TOPICS[Number(b.dataset.i)];
    let cur = quoteEl.value, at;
    const m = headRe(t).exec(cur);
    if (m) {
      const start = m.index + m[0].length;                              // 소제목 줄 바로 뒤
      const next = cur.slice(start).search(/\n[ \t]*\[[^\[\]\n]{1,20}\]/);   // 다음 소제목
      const end = next < 0 ? cur.length : start + next;
      at = start + cur.slice(start, end).replace(/\s+$/, '').length;
      if (at === start) {                                               // 본문이 아직 없다 — 소제목 다음 줄에 커서를
        if (cur.charAt(start) !== '\n') { cur = cur.slice(0, start) + '\n' + cur.slice(start); quoteEl.value = cur; }
        at = start + 1;
      }
    } else {
      const head = cur.replace(/\s+$/, '');
      quoteEl.value = ((head ? head + '\n\n' : '') + '[' + t + ']\n').slice(0, MAX);
      at = quoteEl.value.length;
    }
    quoteEl.focus();
    quoteEl.setSelectionRange(at, at);
    renderSeeds(); sync();
  });

  nameEl.addEventListener('input', sync);
  nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); quoteEl.focus(); } });
  quoteEl.addEventListener('input', () => { renderSeeds(); sync(); });

  function showDone() {
    $('vForm').hidden = true; $('vDone').hidden = false;
    $('pvDone').innerHTML = cardHtml(false);
    wireMore($('pvDone'), false);
    window.scrollTo(0, 0);
    $('doneH').focus({ preventScroll: true });
    tellParent();
  }

  /* 제출 — 버튼은 늘 살아 있다. 부족하면 누른 순간 그 칸으로 데려가 알려 준다 */
  $('rwSubmit').addEventListener('click', () => {
    tried = true; sync();
    if (bodyLen(quoteEl.value) < MIN) {
      quoteEl.focus({ preventScroll: true });
      quoteEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
      tellParent();
      return;
    }
    const btn = $('rwSubmit');
    btn.disabled = true; btn.textContent = '제출 중…';
    setTimeout(showDone, 500);      // 목업 — 실제로는 서버 응답을 기다린다
  });

  /* 보드(iframe)가 높이를 맞출 수 있게 화면이 바뀔 때마다 알린다 */
  function tellParent() {
    if (window.parent === window) return;
    requestAnimationFrame(() => window.parent.postMessage({ mockHeight: document.documentElement.scrollHeight }, '*'));
  }

  renderSeeds(); renderPhoto(); sync();

  /* ── 보드용 상태 훅 — ?state=typing|error|done ───────────────────────── */
  const state = new URLSearchParams(location.search).get('state');
  // 사진 자리 예시 — 실제 사진이 아니라 회색 판(목업에 사람 사진을 넣지 않는다)
  const SAMPLE_PHOTO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 224"><rect width="168" height="224" fill="#E4EBF5"/>' +
    '<path d="M0 176l48-54 34 36 30-30 56 60v36H0z" fill="#C5D2E6"/><circle cx="118" cy="66" r="18" fill="#C5D2E6"/></svg>');
  if (state === 'typing' || state === 'done') {
    nameEl.value = '하늘준비생';
    quoteEl.value = '[가장 도움이 된 점]\n답변을 외우지 않고 제 경험에서 꺼내는 연습이었어요. 꼬리 질문이 나와도 당황하지 않게 됐습니다.\n\n'
      + '[추천하고 싶은 분]\n준비는 하는데 방향이 맞는지 확신이 없는 분께 추천해요.';
    photoUrl = SAMPLE_PHOTO;
    renderSeeds(); renderPhoto(); sync();
    if (state === 'done') showDone();
  } else if (state === 'error') {
    $('rwSubmit').click();
    quoteEl.blur();
  }
  window.addEventListener('load', () => { sync(); tellParent(); });
})();
</script>
</body>
</html>
