<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>승준 도구 허브 — 노트 승격 3안 (2026-09-23)</title>
<link rel="stylesheet" href="../tokens.css">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   승준 도구 허브(tools.html) — '나만의 승준노트'를 허브의 중심으로 (2026-09-23 오너 요청)

   오너: "승준도구에서 승준노트가 사실상 대시보드가 되는건데 밑에 구성처럼 깔려있잖아 …
          아카이브로 지원자들의 노트를 제공하는건데 제일 중요한거고"
   현행(2026-08-27 3안): 같은 크기 종이 카드 5장 — 노트가 4번째 줄. 도구와 아카이브가 같은 급.

   세 안 모두 공통: 노트가 맨 위 한 판, 그 아래 '노트를 채우는 도구 4가지'(소재 발굴 → 답변 첨삭 → 뉴스 → 게임).
     A 사진 포스터 — 홈 '네 개의 문' 1번(챌린지 포스터) 문법 그대로. 사진은 홈 승준 도구 문의 door-briefing.webp.
     B 네이비 판   — 사진 없이 브랜드 네이비 한 판 + 흰 선 아이콘. 다크 위 CTA 는 흰 알약 + 네이비 글씨.
     C 종이 카드 확대 — 현행 카드 결 그대로, 크기·활자·CTA 만 키운다(변화 최소).
   허브 공통 규칙 유지: 회원별 상태 문구·금액·근거 없는 표시 없음(정적 사실만).
   활자 12/13/14/15/17/22 · 굵기 400/700/800 · 라운드 토큰(22 는 현행 카드값).
   ══════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
body { font-family: 'SUIT Variable', SUIT, 'Apple SD Gothic Neo', -apple-system, sans-serif;
  background: #DDE3EC; color: var(--text); line-height: 1.6; padding: 28px 20px 40px; word-break: keep-all; }
.board { display: flex; gap: 28px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
.col { width: 375px; flex: 0 0 375px; }
.cap { font-size: 13px; font-weight: 800; color: #3B4657; letter-spacing: .04em; margin: 0 0 8px 4px; }
.phone { width: 375px; background: var(--bg); border-radius: 22px; overflow: hidden;
  box-shadow: 0 10px 40px rgba(20,32,52,.18); border: 1px solid rgba(23,42,71,.18); }
.mnav { height: 57px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  border-bottom: 1px solid var(--border-soft); background: #fff; }
.mnav .logo { font-weight: 800; font-size: 22px; letter-spacing: .02em; color: #1B3A6B; }
.mnav .burger { width: 22px; height: 14px; border-top: 2px solid #1E2229; border-bottom: 2px solid #1E2229; position: relative; }
.mnav .burger::after { content: ''; position: absolute; left: 0; right: 0; top: 4px; border-top: 2px solid #1E2229; }
.wrap { padding: 0 20px 28px; }

/* 머리 — 현행 tools.html 그대로 */
.bf-head { padding: 34px 0 4px; text-align: center; }
.bf-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .24em; color: var(--accent-ink); }
.bf-title { font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: -.6px; margin-top: 10px; }
.bf-sub { font-size: 15px; color: var(--text); opacity: .72; margin-top: 12px; }
.bf-sub b { color: var(--action); font-weight: 800; white-space: nowrap; }

/* 절 제목 — 현행 .sec-t */
.sec-t { margin: 26px 0 0; text-align: center; }
.sec-t b { font-size: 17px; font-weight: 800; }
.sec-t span { display: block; font-size: 13px; color: var(--text-muted); margin-top: 3px; }

/* 도구 카드 — 현행 tools.html .tl-card 그대로 */
.tl-list { display: flex; flex-direction: column; gap: 12px; margin: 16px auto 0; }
.tl-card { display: flex; align-items: center; gap: 14px; border-radius: 22px; padding: 16px;
  background: linear-gradient(180deg, #FCFDFF, #EBF1F8); border: 1px solid var(--border);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), var(--shadow); color: var(--text); }
.tl-ic { flex: 0 0 auto; width: 58px; height: 58px; border-radius: 18px; background: var(--accent-tint);
  border: 1px solid rgba(27,58,107,.14); display: flex; align-items: center; justify-content: center; color: var(--accent-ink); }
.tl-ic svg { width: 32px; height: 32px; stroke-width: 1.2; }
.tl-tx { flex: 1 1 auto; min-width: 0; }
.tl-tx b { display: flex; align-items: center; gap: 7px; font-size: 17px; font-weight: 800; color: var(--ink); letter-spacing: -.2px; line-height: 1.35; }
.tl-tx b i { font-style: normal; font-size: 12px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 6px; padding: 1px 7px; flex: none; }
.tl-tx small { display: block; font-size: 13px; font-weight: 400; color: var(--text-muted); margin-top: 2px; line-height: 1.45; }
.tl-pill { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; background: var(--action); color: #fff;
  display: flex; align-items: center; justify-content: center; }
.tl-pill svg { width: 18px; height: 18px; stroke-width: 2.4; }

/* ── A 사진 포스터(홈 .door-poster 문법) ── */
.poster { position: relative; display: block; overflow: hidden; margin-top: 22px; min-height: 300px;
  border-radius: 22px; border: 1px solid var(--border-soft); box-shadow: 0 2px 10px rgba(23,42,71,.05); }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 30%; display: block; }
.poster::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to top, rgba(18,28,46,.96) 0%, rgba(18,28,46,.72) 30%, rgba(18,28,46,0) 62%); }
.dp-chip { position: absolute; top: 12px; left: 14px; z-index: 2; font-size: 12px; font-weight: 700; color: #fff;
  background: rgba(20,32,52,.58); padding: 5px 11px; border-radius: 999px; }
.dp-chip::before { content: '— '; color: #A8C7F0; }
.dp-tx { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 2; display: block; }
.dp-label { display: block; font-size: 12px; font-weight: 800; letter-spacing: .1em; color: #A8C7F0; }
.dp-label::before { content: '— '; }
.dp-title { display: block; font-family: var(--serif); font-weight: 800; font-size: 22px; line-height: 1.35; margin: 6px 0 0; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
.dp-ds { display: block; margin-top: 6px; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,.86); }
.dp-cta { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; min-height: 44px; padding: 0 18px;
  border-radius: 999px; background: #fff; color: var(--accent-ink); font-size: 14px; font-weight: 700; }

/* ── B 네이비 판 ── */
.navy { display: block; position: relative; margin-top: 22px; padding: 22px 20px 20px; border-radius: 22px;
  background: linear-gradient(160deg, #1F457F, #14305C); color: #fff; box-shadow: var(--shadow); overflow: hidden; }
.navy::before { content: ''; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%;
  background: rgba(168,199,240,.10); }
.nv-ic { width: 64px; height: 64px; border-radius: 20px; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18);
  display: flex; align-items: center; justify-content: center; color: #fff; }
.nv-ic svg { width: 36px; height: 36px; stroke-width: 1.1; }
.nv-label { margin-top: 16px; font-size: 12px; font-weight: 800; letter-spacing: .1em; color: #A8C7F0; }
.nv-label::before { content: '— '; }
.nv-title { font-family: var(--serif); font-weight: 800; font-size: 22px; line-height: 1.35; margin-top: 6px; color: #fff; }
.nv-ds { margin-top: 6px; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,.84); }
.nv-cta { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; min-height: 44px; padding: 0 18px;
  border-radius: 999px; background: #fff; color: var(--accent-ink); font-size: 14px; font-weight: 700; }

/* ── C 종이 카드 확대(현행 결) ── */
.big { display: block; margin-top: 22px; padding: 20px; border-radius: 22px;
  background: linear-gradient(180deg, #FCFDFF, #EBF1F8); border: 1px solid var(--border);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), var(--shadow); color: var(--text); }
.bg-top { display: flex; align-items: center; gap: 14px; }
.bg-ic { flex: none; width: 72px; height: 72px; border-radius: 22px; background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center; }
.bg-ic svg { width: 40px; height: 40px; stroke-width: 1.1; }
.bg-label { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--accent-ink); }
.bg-label::before { content: '— '; }
.bg-title { font-family: var(--serif); font-weight: 800; font-size: 22px; line-height: 1.3; margin-top: 4px; color: var(--ink); }
.bg-ds { margin-top: 12px; font-size: 14px; line-height: 1.55; color: var(--text-muted); }
.bg-cta { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 14px; min-height: 48px;
  border-radius: 999px; background: var(--action); color: #fff; font-size: 15px; font-weight: 800; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="tn-news" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8.5V17a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17V7a2.5 2.5 0 0 1 2.5-2.5H16A2.5 2.5 0 0 1 18.5 7"/><path d="M18.5 7v10.2a1.3 1.3 0 1 0 2.6 0V8.5h-2.6"/><rect x="7" y="7.8" width="4.6" height="3.6" rx=".7"/><path d="M14 8.4h2M14 11h2M7 14.6h9M7 17h6"/></symbol>
  <symbol id="tn-dig" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 10V6.8L13.7 3.5H7A2 2 0 0 0 5 5.5v13A2 2 0 0 0 7 20.5h4"/><path d="M13.5 3.7V7h3.3"/><path d="M8 9h5M8 12h3.4"/><circle cx="15.7" cy="15.2" r="3.4"/><path d="M18.2 17.7 20.5 20"/></symbol>
  <symbol id="tn-fix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 20.5H6A2 2 0 0 1 4 18.5v-13A2 2 0 0 1 6 3.5h9A2 2 0 0 1 17 5.5V9"/><path d="M7.5 7.5h6M7.5 10.5h4"/><path d="m13.2 19.9 6.3-6.3a1.6 1.6 0 0 0-2.3-2.3l-6.3 6.3-.8 3.1Z"/><path d="m15.7 12.6 2.3 2.3"/></symbol>
  <symbol id="tn-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 5.5A2 2 0 0 1 7.5 3.5h9a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2Z"/><path d="M8.7 3.5v17"/><path d="M13.6 3.6v5l1.8-1.4 1.8 1.4v-5"/><path d="M11.6 13h4.6M11.6 16h3"/></symbol>
  <symbol id="tn-game" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><circle cx="16.5" cy="16.5" r="3.6"/></symbol>
  <symbol id="tn-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</defs></svg>

<div class="board">
  <!-- 공통 조각을 세 번 쓰기 위해 JS 로 찍는다 -->
  <template id="tpl-head">
    <div class="mnav"><span class="logo">MONC</span><span class="burger"></span></div>
    <div class="wrap">
      <header class="bf-head">
        <div class="bf-eyebrow">MONC TOOLS</div>
        <h1 class="bf-title">승준 도구</h1>
        <p class="bf-sub">쓴 답변은 전부 <b>나만의 승준노트</b>에 모여요.<br>도구 4가지가 그 노트를 채워요.</p>
      </header>
      <div data-slot></div>
      <div class="sec-t"><b>노트를 채우는 도구 4가지</b><span>필요한 것만 골라 바로 쓰세요</span></div>
      <div class="tl-list">
        <a class="tl-card" href="#"><span class="tl-ic"><svg viewBox="0 0 24 24"><use href="#tn-dig"/></svg></span><span class="tl-tx"><b>소재 발굴</b><small>내 경험에서 답변 소재를 찾아요</small></span><span class="tl-pill"><svg viewBox="0 0 24 24"><use href="#tn-go"/></svg></span></a>
        <a class="tl-card" href="#"><span class="tl-ic"><svg viewBox="0 0 24 24"><use href="#tn-fix"/></svg></span><span class="tl-tx"><b>답변 첨삭 <i>고치기</i></b><small>문장을 고쳐 드려요</small></span><span class="tl-pill"><svg viewBox="0 0 24 24"><use href="#tn-go"/></svg></span></a>
        <a class="tl-card" href="#"><span class="tl-ic"><svg viewBox="0 0 24 24"><use href="#tn-news"/></svg></span><span class="tl-tx"><b>뉴스 스크랩</b><small>항공 뉴스를 요약으로 읽고 담아요</small></span><span class="tl-pill"><svg viewBox="0 0 24 24"><use href="#tn-go"/></svg></span></a>
        <a class="tl-card" href="#"><span class="tl-ic"><svg viewBox="0 0 24 24"><use href="#tn-game"/></svg></span><span class="tl-tx"><b>역량검사 게임</b><small>검사 유형을 게임으로 연습해요</small></span><span class="tl-pill"><svg viewBox="0 0 24 24"><use href="#tn-go"/></svg></span></a>
      </div>
    </div>
  </template>

  <template id="tpl-a">
    <a class="poster" href="#">
      <img src="../images/door-briefing.webp" alt="">
      <span class="dp-chip">면접 답변 · 자소서 아카이브</span>
      <span class="dp-tx">
        <span class="dp-label">MY NOTE</span>
        <span class="dp-title">나만의 승준노트</span>
        <span class="dp-ds">쓴 답변이 전부 여기 모여요. 고치고, 첨삭받고, 면접 전날 다시 읽어요.</span>
        <span class="dp-cta">노트 열기 →</span>
      </span>
    </a>
  </template>

  <template id="tpl-b">
    <a class="navy" href="#">
      <span class="nv-ic"><svg viewBox="0 0 24 24"><use href="#tn-note"/></svg></span>
      <div class="nv-label">MY NOTE</div>
      <div class="nv-title">나만의 승준노트</div>
      <p class="nv-ds">쓴 답변이 전부 여기 모여요. 고치고, 첨삭받고, 면접 전날 다시 읽어요.</p>
      <span class="nv-cta">노트 열기 →</span>
    </a>
  </template>

  <template id="tpl-c">
    <a class="big" href="#">
      <div class="bg-top">
        <span class="bg-ic"><svg viewBox="0 0 24 24"><use href="#tn-note"/></svg></span>
        <div><div class="bg-label">MY NOTE</div><div class="bg-title">나만의 승준노트</div></div>
      </div>
      <p class="bg-ds">쓴 답변이 전부 여기 모여요. 고치고, 첨삭받고, 면접 전날 다시 읽어요.</p>
      <span class="bg-cta">노트 열기 →</span>
    </a>
  </template>

  <div class="col"><p class="cap">A · 사진 포스터(홈 챌린지 문 문법)</p><div class="phone" data-v="a"></div></div>
  <div class="col"><p class="cap">B · 네이비 판</p><div class="phone" data-v="b"></div></div>
  <div class="col"><p class="cap">C · 종이 카드 확대(현행 결)</p><div class="phone" data-v="c"></div></div>
</div>
<script>
  document.querySelectorAll('.phone').forEach(function (ph) {
    ph.appendChild(document.getElementById('tpl-head').content.cloneNode(true));
    ph.querySelector('[data-slot]').replaceWith(document.getElementById('tpl-' + ph.dataset.v).content.cloneNode(true));
  });
</script>
</body>
</html>
