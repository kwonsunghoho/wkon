<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>승준 코스 줄 — 데스크톱 크기 비교(480 / 600 / 720)</title>
<!-- 2026-08-07 오너 "아직도 좀 작은거같은데" — 데스크톱 줄 크기 3안 비교.
     실제 사이트 팔레트·폰트·사진을 그대로 쓴다(../tokens.css · ../images/course-*.webp).
     비율은 모바일과 같게 두고(정사각 · 실전만 2:3) 값만 세트로 곱했다. -->
<link rel="stylesheet" href="../tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'SUIT Variable', SUIT,'Apple SD Gothic Neo',-apple-system,sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; word-break: keep-all; padding: 40px 0 80px; }
  .lab { max-width: 760px; margin: 0 auto 12px; padding: 0 20px; }
  .lab b { font-size: 17px; font-weight: 800; color: var(--accent); }
  .lab span { font-size: 13px; color: var(--text-muted); margin-left: 8px; }
  .gap { height: 44px; }

  /* ── 공통(briefing.html 의 .cs-* 규칙 그대로) ── */
  .cs-list { display: flex; flex-direction: column; gap: 8px; margin: 0 auto; }
  .cs-row { appearance: none; font-family: inherit; text-align: left; cursor: pointer;
    position: relative; display: block; overflow: hidden; width: 100%;
    background: var(--action); border: 1px solid var(--border-soft); border-radius: 14px;
    padding: 0; box-shadow: 0 2px 10px rgba(23,42,71,.05); }
  .cs-ph { position: absolute; top: 0; right: 0; height: 100%; object-fit: cover; display: block; }
  .cs-row::after { content: ""; position: absolute; top: 0; bottom: 0;
    background: linear-gradient(to right, var(--action) 0%, rgba(27,58,107,0) 100%); pointer-events: none; }
  .cs-tx { position: absolute; z-index: 2; top: 50%; transform: translateY(-50%); }
  .cs-lv { display: inline-block; font-weight: 800; letter-spacing: .12em; color: var(--action-on-dark); }
  .cs-tx b { display: block; font-family: var(--serif); font-weight: 800;
    line-height: 1.35; letter-spacing: -.01em; margin-top: 5px; color: #fff; word-break: keep-all; }
  .cs-ds { display: block; color: rgba(255,255,255,.88); line-height: 1.5; word-break: keep-all; }
  .cs-row > i { font-style: normal; position: absolute; z-index: 2; border-radius: 50%;
    background: rgba(27,58,107,.72); display: flex; align-items: center; justify-content: center; color: #fff; }
  .cs-row.ph-l .cs-ph { right: auto; left: 0; }
  .cs-row.ph-l::after { right: auto;
    background: linear-gradient(to left, var(--action) 0%, rgba(27,58,107,0) 100%); }

  /* ── A안 · 현재 480(모바일 1.43배) ── */
  .s480 .cs-list { max-width: 480px; }
  .s480 .cs-row { height: 200px; }
  .s480 .cs-ph { width: 200px; }
  .s480 .cs-row::after { right: 137px; width: 63px; }
  .s480 .cs-tx { left: 22px; right: 216px; }
  .s480 .cs-lv { font-size: 13px; }
  .s480 .cs-tx b { font-size: 21px; }
  .s480 .cs-ds { font-size: 14px; margin-top: 6px; }
  .s480 .cs-row > i { width: 30px; height: 30px; right: 12px; bottom: 12px; font-size: 14px; }
  .s480 .cs-row.ph-l::after { left: 137px; }
  .s480 .cs-row.ph-l .cs-tx { left: 216px; right: 22px; }
  .s480 .cs-row[data-code="practical"] { height: 272px; }
  .s480 .cs-row[data-code="practical"] .cs-ph { width: 181px; }
  .s480 .cs-row[data-code="practical"]::after { right: 118px; }
  .s480 .cs-row[data-code="practical"] .cs-tx { right: 197px; }

  /* ── B안 · 600(현재 ×1.25, 페이지의 다른 열과 같은 폭) ── */
  .s600 .cs-list { max-width: 600px; gap: 10px; }
  .s600 .cs-row { height: 250px; border-radius: 16px; }
  .s600 .cs-ph { width: 250px; }
  .s600 .cs-row::after { right: 171px; width: 79px; }
  .s600 .cs-tx { left: 28px; right: 270px; }
  .s600 .cs-lv { font-size: 16px; }
  .s600 .cs-tx b { font-size: 26px; }
  .s600 .cs-ds { font-size: 17px; margin-top: 8px; }
  .s600 .cs-row > i { width: 38px; height: 38px; right: 15px; bottom: 15px; font-size: 17px; }
  .s600 .cs-row.ph-l::after { left: 171px; }
  .s600 .cs-row.ph-l .cs-tx { left: 270px; right: 28px; }
  .s600 .cs-row[data-code="practical"] { height: 340px; }
  .s600 .cs-row[data-code="practical"] .cs-ph { width: 226px; }
  .s600 .cs-row[data-code="practical"]::after { right: 147px; }
  .s600 .cs-row[data-code="practical"] .cs-tx { right: 246px; }

  /* ── C안 · 720(현재 ×1.5, 컨테이너 안쪽 폭 꽉) ── */
  .s720 .cs-list { max-width: 720px; gap: 12px; }
  .s720 .cs-row { height: 300px; border-radius: 18px; }
  .s720 .cs-ph { width: 300px; }
  .s720 .cs-row::after { right: 205px; width: 95px; }
  .s720 .cs-tx { left: 33px; right: 324px; }
  .s720 .cs-lv { font-size: 19px; }
  .s720 .cs-tx b { font-size: 32px; }
  .s720 .cs-ds { font-size: 20px; margin-top: 10px; }
  .s720 .cs-row > i { width: 45px; height: 45px; right: 18px; bottom: 18px; font-size: 21px; }
  .s720 .cs-row.ph-l::after { left: 205px; }
  .s720 .cs-row.ph-l .cs-tx { left: 324px; right: 33px; }
  .s720 .cs-row[data-code="practical"] { height: 408px; }
  .s720 .cs-row[data-code="practical"] .cs-ph { width: 272px; }
  .s720 .cs-row[data-code="practical"]::after { right: 177px; }
  .s720 .cs-row[data-code="practical"] .cs-tx { right: 296px; }
</style>
</head>
<body>

<div class="lab"><b>A안 — 현재(열 480 · 줄 200)</b><span>1512px 창에서 폭의 32%</span></div>
<div class="s480">
  <div class="cs-list">
    <button class="cs-row ph-l" data-code="basic" type="button">
      <img class="cs-ph" src="../images/course-basic.webp" alt="">
      <span class="cs-tx"><span class="cs-lv">초급</span><b>승무원 준비가 처음이라면</b>
        <span class="cs-ds">답변, 보이스, 이미지메이킹부터 잡고가세요!</span></span><i>▾</i>
    </button>
    <button class="cs-row" data-code="practical" type="button">
      <img class="cs-ph" src="../images/course-practical.webp" alt="">
      <span class="cs-tx"><span class="cs-lv">실전</span><b>면접이 당장 코앞이라면</b>
        <span class="cs-ds">지원 항공사 뉴스부터 답변 점검까지 몰아서 하세요!</span></span><i>▾</i>
    </button>
  </div>
</div>

<div class="gap"></div>
<div class="lab"><b>B안 — 열 600 · 줄 250</b><span>현재 ×1.25 · 페이지의 다른 열(오늘 이어서·푸터)과 같은 폭</span></div>
<div class="s600">
  <div class="cs-list">
    <button class="cs-row ph-l" data-code="basic" type="button">
      <img class="cs-ph" src="../images/course-basic.webp" alt="">
      <span class="cs-tx"><span class="cs-lv">초급</span><b>승무원 준비가 처음이라면</b>
        <span class="cs-ds">답변, 보이스, 이미지메이킹부터 잡고가세요!</span></span><i>▾</i>
    </button>
    <button class="cs-row" data-code="practical" type="button">
      <img class="cs-ph" src="../images/course-practical.webp" alt="">
      <span class="cs-tx"><span class="cs-lv">실전</span><b>면접이 당장 코앞이라면</b>
        <span class="cs-ds">지원 항공사 뉴스부터 답변 점검까지 몰아서 하세요!</span></span><i>▾</i>
    </button>
  </div>
</div>

<div class="gap"></div>
<div class="lab"><b>C안 — 열 720 · 줄 300</b><span>현재 ×1.5 · 컨테이너(760) 안쪽 폭 꽉</span></div>
<div class="s720">
  <div class="cs-list">
    <button class="cs-row ph-l" data-code="basic" type="button">
      <img class="cs-ph" src="../images/course-basic.webp" alt="">
      <span class="cs-tx"><span class="cs-lv">초급</span><b>승무원 준비가 처음이라면</b>
        <span class="cs-ds">답변, 보이스, 이미지메이킹부터 잡고가세요!</span></span><i>▾</i>
    </button>
    <button class="cs-row" data-code="practical" type="button">
      <img class="cs-ph" src="../images/course-practical.webp" alt="">
      <span class="cs-tx"><span class="cs-lv">실전</span><b>면접이 당장 코앞이라면</b>
        <span class="cs-ds">지원 항공사 뉴스부터 답변 점검까지 몰아서 하세요!</span></span><i>▾</i>
    </button>
  </div>
</div>

</body>
</html>
