<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코스 카드 B안 확정형 — 상황(메인) + 안내(서브)</title>
<!-- 실제 사이트 폰트(SUIT Variable)·팔레트를 그대로 쓴다. 폰트 파일 경로가
     tokens.css 기준 상대라 ../tokens.css 로 링크하면 그대로 잡힌다. -->
<link rel="stylesheet" href="../tokens.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'SUIT Variable',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  .wrap{max-width:600px;margin:0 auto;padding:20px 0 60px}
  .lead{font-size:14px;line-height:1.6;color:var(--text-muted);margin:0 0 4px;padding:0 20px}
  .lead b{color:var(--text)}

  .phone{width:375px;max-width:100%;margin:20px auto 0;padding:16px 20px 22px;
    border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft)}
  .sec-t{margin:0 0 16px;text-align:center}
  .sec-t b{font-size:19px;font-weight:800}
  .sec-t span{display:block;font-size:15px;color:var(--text-muted);margin-top:5px}

  button{appearance:none;font-family:inherit;text-align:left;cursor:pointer;padding:0;
    background:var(--surface);border:1px solid var(--border-soft);
    -webkit-tap-highlight-color:transparent}
  button:focus-visible{outline:3px solid var(--action);outline-offset:2px}

  /* B안 확정형 — 칩(단계) + 상황(메인) + 안내(서브) */
  .b-list{display:flex;flex-direction:column;gap:8px}
  .b-row{display:flex;align-items:center;gap:12px;width:100%;
    border-radius:14px;padding:12px 12px 12px 10px;box-shadow:0 2px 10px rgba(38,34,28,.05)}
  .b-lv{flex:0 0 62px;align-self:stretch;min-height:56px;border-radius:10px;
    background:var(--accent-tint);display:flex;align-items:center;justify-content:center;
    font-size:21px;font-weight:800;letter-spacing:.04em;color:var(--accent-ink)}
  .b-tx{flex:1;min-width:0}
  .b-tx b{display:block;font-size:15px;font-weight:800;line-height:1.4}
  .b-tx span{display:block;font-size:12.5px;color:var(--text-muted);margin-top:3px;line-height:1.45}
  .b-row i{font-style:normal;color:var(--accent-ink);font-size:14px;flex:0 0 auto}
  .b-row[aria-expanded="true"]{border-color:var(--action);
    box-shadow:0 0 0 1px var(--action) inset,0 2px 10px rgba(38,34,28,.05)}
  .b-row[aria-expanded="true"] .b-lv{background:var(--action);color:var(--action-ink)}

  /* 펼친 카드 아래 — 넘버링 스텝(하나씩 순서대로) */
  .b-panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;
    padding:6px 14px;box-shadow:0 2px 10px rgba(38,34,28,.05)}
  .b-step{display:flex;gap:11px;align-items:center;padding:12px 2px;text-decoration:none;
    color:var(--text);border-bottom:1px solid var(--border-soft)}
  .b-step:last-of-type{border-bottom:0}
  .b-step > b{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--accent-tint);
    color:var(--accent-ink);font-size:13px;font-weight:800;
    display:flex;align-items:center;justify-content:center}
  .b-step > span{flex:1 1 auto;min-width:0}
  .b-step em{display:block;font-style:normal;font-size:15px;font-weight:700}
  .b-step small{display:block;font-size:13px;color:var(--text-muted);margin-top:1px}
  .b-step > u{flex:0 0 auto;text-decoration:none;color:var(--accent-ink);opacity:.6}
  /* 챌린지 스텝 표시 — 상시 도구와 구분. 모집 여부는 단정하지 않는다 */
  .b-tag{display:inline-block;vertical-align:2px;margin-left:6px;padding:2px 7px;border-radius:999px;
    background:var(--accent-tint);color:var(--accent-ink);font-size:12px;font-weight:800}
  .b-pfoot{padding:10px 2px 8px;font-size:12px;color:var(--text-muted);
    border-top:1px solid var(--border-soft)}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead"><b>B안 확정형 — 칩(단계) + 상황(메인) + 안내(서브) + 넘버링 스텝</b></p>
  <p class="lead">폰트는 실제 사이트의 SUIT Variable. 초급을 펼치면 바로 아래에 1→2→3 스텝이 나온다(한 번에 다 보여주지 않고 순서로 안내). 문구·스텝 구성은 맨 마지막에 확정.</p>

  <div class="phone">
    <div class="sec-t"><b>연구진이 추천하는 코스예요</b><span>지금 상황에 맞는 길부터 골라 보세요</span></div>
    <div class="b-list" id="list"></div>
  </div>
</div>

<script>
/* 초급 문구는 오너 제시 원문. 나머지 셋과 스텝 구성은 가안 — 맨 마지막에 확정.
   ch:true = 챌린지 스텝(2주 기수제). 초급 서브의 답변·보이스·이미지메이킹이
   그대로 승자각·보신각·영합각이다. 모집 여부는 여기서 단정하지 않는다. */
var LEVELS = [
  { big:'초급', main:'승무원 준비가 처음이라면',
    sub:'답변, 보이스, 이미지메이킹부터 잡고가세요!',
    steps:[
      { t:'답변 소재 발굴',    d:'내 경험에서 답변 소재부터 찾아요' },
      { t:'승.자.각 챌린지',   d:'뻔한 답변 → 나만 할 수 있는 답변', ch:true },
      { t:'보.신.각 챌린지',   d:'떨리는 목소리 → 신뢰가 실리는 목소리', ch:true },
      { t:'영.합.각 챌린지',   d:'굳은 표정 → 카메라 앞에서도 자연스럽게', ch:true }
    ] },
  { big:'중급', main:'기출 답변을 쌓아갈 시기라면',
    sub:'소재 발굴로 내 경험을 답변으로 만들어 보세요!', steps:[] },
  { big:'고급', main:'답변 완성도를 올리고 싶다면',
    sub:'첨삭과 AI킬러로 문장을 다듬어 보세요!', steps:[] },
  { big:'실전', main:'면접이 당장 코앞이라면',
    sub:'뉴스 스크랩과 기출 점검으로 마무리하세요!', steps:[] }
];
document.getElementById('list').innerHTML = LEVELS.map(function(c,i){
  var row = '<button class="b-row" type="button" aria-expanded="'+(i===0)+'">'
    + '<span class="b-lv">'+c.big+'</span>'
    + '<span class="b-tx"><b>'+c.main+'</b><span>'+c.sub+'</span></span>'
    + '<i aria-hidden="true">▾</i>'
    + '</button>';
  /* 펼친 카드 바로 아래에 넘버링 스텝 — 한 번에 다 보여주지 않고 순서로 안내 */
  if (i === 0 && c.steps.length) {
    row += '<div class="b-panel">' + c.steps.map(function(s,n){
      return '<a class="b-step" href="#">'
        + '<b>'+(n+1)+'</b>'
        + '<span><em>'+s.t+(s.ch?'<span class="b-tag">2주 챌린지</span>':'')+'</em>'
        + '<small>'+s.d+'</small></span>'
        + '<u aria-hidden="true">→</u>'
        + '</a>';
    }).join('')
    + '<div class="b-pfoot">챌린지는 기수제예요 — 모집 일정은 챌린지 페이지에서 확인해요</div>'
    + '</div>';
  }
  return row;
}).join('');
</script>
</body>
</html>
