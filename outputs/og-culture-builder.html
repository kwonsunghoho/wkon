<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og:image 만들기 — 대.문.각</title>
<!--
  images/og/challenge-culture.jpg 를 뽑는 판(2026-09-04).
  ⚠️ 화면에 올라가는 페이지가 아니다 — 헤드리스 크롬으로 1200×630 을 찍어 jpg 로 굽는 용도다.
     찍는 법: wkon-static 으로 서빙한 뒤
     chrome --headless=new --window-size=1200,630 --screenshot=<파일> <이 주소>
  ⚠️ 카드 바탕 #F4F1EA 는 **먼저 만든 og 4장과 같은 값**이다(challenge-answer.jpg 실측).
     사이트 팔레트는 2026-08-05 순백으로 갔지만, 카톡 미리보기는 넉 장이 한 세트로 보이므로
     여기서는 형제들과 맞춘다 — 사이트 CSS 에 이 색을 되살리라는 뜻이 아니다.
  ⚠️ 사진이 세로형이라(899×1124) 다른 넷처럼 전체 폭에 깔면 인물이 카드 뒤로 숨는다.
     그래서 흐린 사진을 바탕에 깔고, 또렷한 사진은 오른쪽 판에만 둔다.
-->
<link rel="stylesheet" href="../tokens.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0E1F3C}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;
      font-family:'SUIT Variable',SUIT,'Apple SD Gothic Neo',-apple-system,sans-serif}
  /* 바탕 — 같은 사진을 크게 흐리고 어둡게 */
  .bg{position:absolute;inset:0;background:url('../images/hero-culture.webp') center 28%/cover no-repeat;
      filter:blur(26px) brightness(.62) saturate(.9);transform:scale(1.12)}
  /* 오른쪽 또렷한 사진 판 */
  .shot{position:absolute;right:0;top:0;width:560px;height:630px;
        background:url('../images/hero-culture.webp') 50% 25%/cover no-repeat}
  .shot::after{content:'';position:absolute;inset:0;
        background:linear-gradient(90deg,rgba(14,31,60,.55),rgba(14,31,60,0) 42%)}
  /* 왼쪽 카드 — 좌표는 challenge-answer.jpg 실측(x44~604 · y44~586) */
  .card{position:absolute;left:44px;top:44px;width:560px;height:542px;
        background:#F4F1EA;border-radius:22px;padding:40px 44px;
        display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(9,20,40,.38)}
  .logo{height:auto;width:148px;display:block;margin-bottom:36px}
  .name{font-size:56px;font-weight:800;letter-spacing:-.02em;color:#1B3A6B;line-height:1.1}
  .sub{margin-top:12px;font-size:17px;font-weight:600;color:#545C68}
  .rule{margin:26px 0;height:1px;background:rgba(28,42,58,.16)}
  .ba{font-size:20px;font-weight:700;color:#1C2A3A;line-height:1.55;word-break:keep-all}
  .ba b{display:block;font-weight:800;color:#1B3A6B}
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;
        font-size:15px;font-weight:700;color:#545C68}
</style>
</head>
<body>
<div class="og">
  <div class="bg"></div>
  <div class="shot"></div>
  <div class="card">
    <img class="logo" src="../images/MONC_Logo_Full_Package/assets/web/monc-logo-transparent-640.webp" alt="MONC">
    <div class="name">대.문.각</div>
    <div class="sub">대한항공 문화이해 각</div>
    <div class="rule"></div>
    <div class="ba">대한항공을 아는 답변 →<b>함께 일할 사람으로 보이는 답변</b></div>
    <div class="foot"><span>2주 챌린지</span><span>monc.ai.kr</span></div>
  </div>
</div>
</body>
</html>
