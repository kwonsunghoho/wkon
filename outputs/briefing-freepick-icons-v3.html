<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도구 아이콘 — 가는 선 리디자인</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'SUIT Variable',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  .wrap{max-width:600px;margin:0 auto;padding:20px 0 60px}
  .lead{font-size:14px;line-height:1.6;color:var(--text-muted);margin:0 0 4px;padding:0 20px}
  .lead b{color:var(--text)}
  .case{margin-top:36px}
  .case-h{display:flex;align-items:baseline;gap:8px;padding:0 20px}
  .case-h b{font-size:17px;font-weight:800}
  .case-h span{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--accent-ink);
    background:var(--accent-tint);border-radius:999px;padding:3px 9px}
  .case-note{font-size:13px;line-height:1.6;color:var(--text-muted);margin:6px 0 0;padding:0 20px}
  .phone{width:375px;max-width:100%;margin:14px auto 0;padding:16px 20px 22px;
    border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft)}
  .sec-t{margin:0 0 16px;text-align:center}
  .sec-t b{font-size:19px;font-weight:800}
  .sec-t span{display:block;font-size:15px;color:var(--text-muted);margin-top:5px}
  a{color:inherit;text-decoration:none}

  /* 큰 확대 — 그림 자체 평가용 */
  .big-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;padding:0 20px}
  .big-c{display:flex;flex-direction:column;align-items:center;gap:8px;
    font-size:12.5px;font-weight:700;color:var(--text-muted)}
  .big-c .ic{color:var(--accent-ink)}

  /* 구 아이콘(1.8 뭉툭) 비교용 */
  .old .ic{color:var(--text-dim)}

  /* 적용 예 — 엠보스 원판(직전 확정 후보 결) */
  .emb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;padding:4px 0}
  .emb-c{display:flex;flex-direction:column;align-items:center;gap:10px;
    font-size:12.5px;font-weight:700;line-height:1.3;text-align:center;padding:4px 2px}
  .emb{width:62px;height:62px;border-radius:50%;background:#FFFFFF;
    display:flex;align-items:center;justify-content:center;color:var(--accent-ink);
    box-shadow:0 6px 14px rgba(38,34,28,.10), 0 1px 3px rgba(38,34,28,.06),
      inset 0 -2px 4px rgba(38,34,28,.04), inset 0 2px 3px rgba(255,255,255,.9)}
</style>
</head>
<body>

<!-- ══ 새 아이콘 6종 — 레퍼런스 결: 가는 선(1.3) + 겹침 한 겹(문서+돋보기처럼
     두 사물을 포개는 구성). viewBox 24, 둥근 끝. ══ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 뉴스 스크랩 — 신문: 제목 칸 + 기사 줄 + 세로 단 -->
    <symbol id="tn-news" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 8.5V17a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17V7a2.5 2.5 0 0 1 2.5-2.5H16A2.5 2.5 0 0 1 18.5 7"/>
      <path d="M18.5 7v10.2a1.3 1.3 0 1 0 2.6 0V8.5h-2.6"/>
      <rect x="7" y="7.8" width="4.6" height="3.6" rx=".7"/>
      <path d="M14 8.4h2M14 11h2M7 14.6h9M7 17h6"/>
    </symbol>
    <!-- 소재 발굴 — 문서 + 돋보기(레퍼런스의 겹침 구성) -->
    <symbol id="tn-dig" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 10V6.8L13.7 3.5H7A2 2 0 0 0 5 5.5v13A2 2 0 0 0 7 20.5h4"/>
      <path d="M13.5 3.7V7h3.3"/>
      <path d="M8 9h5M8 12h3.4"/>
      <circle cx="15.7" cy="15.2" r="3.4"/>
      <path d="M18.2 17.7 20.5 20"/>
    </symbol>
    <!-- 답변 첨삭 — 종이 위 만년필 촉 -->
    <symbol id="tn-fix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 20.5H6A2 2 0 0 1 4 18.5v-13A2 2 0 0 1 6 3.5h9A2 2 0 0 1 17 5.5V9"/>
      <path d="M7.5 7.5h6M7.5 10.5h4"/>
      <path d="m13.2 19.9 6.3-6.3a1.6 1.6 0 0 0-2.3-2.3l-6.3 6.3-.8 3.1Z"/>
      <path d="m15.7 12.6 2.3 2.3"/>
    </symbol>
    <!-- AI킬러 — 문장 표적: 십자선 원 + 중심 점 -->
    <symbol id="tn-kill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="6.2"/>
      <path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3"/>
      <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
    </symbol>
    <!-- 필수 기출 — 말풍선 + 물음표 -->
    <symbol id="tn-quiz" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.8a8.2 8.2 0 0 1 0 16.4c-1.2 0-2.4-.26-3.4-.72L4.2 20.5l1.1-4A8.2 8.2 0 0 1 12 3.8Z"/>
      <path d="M9.9 9.8a2.15 2.15 0 1 1 3.1 2.25c-.7.36-1 .8-1 1.55"/>
      <path d="M12 16.4h.01" stroke-width="1.8"/>
    </symbol>
    <!-- 나만의 노트 — 노트 + 갈피 리본 -->
    <symbol id="tn-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.5 5.5A2 2 0 0 1 7.5 3.5h9a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2Z"/>
      <path d="M8.7 3.5v17"/>
      <path d="M13.6 3.6v5l1.8-1.4 1.8 1.4v-5"/>
      <path d="M11.6 13h4.6M11.6 16h3"/>
    </symbol>

    <!-- 구 아이콘(직전 안 · 1.8 뭉툭) — 비교용 -->
    <symbol id="li-news" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M7.5 9h9M7.5 12.5h9M7.5 16h5"/>
    </symbol>
    <symbol id="li-dig" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 4.5 11.6 8.9 16 10.5 11.6 12.1 10 16.5 8.4 12.1 4 10.5 8.4 8.9Z"/>
      <path d="M17.5 14.5l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9Z"/>
    </symbol>
    <symbol id="li-fix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 5.5l4 4L9 19H5v-4Z"/><path d="M4.5 21.5h15"/>
    </symbol>
    <symbol id="li-kill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8V6.5A2.5 2.5 0 0 1 6.5 4H8M16 4h1.5A2.5 2.5 0 0 1 20 6.5V8M20 16v1.5a2.5 2.5 0 0 1-2.5 2.5H16M8 20H6.5A2.5 2.5 0 0 1 4 17.5V16"/><path d="M7.5 12h9"/>
    </symbol>
    <symbol id="li-quiz" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4a8 8 0 1 1-7 11.9L4 20l4.1-1A8 8 0 0 1 12 4Z"/>
      <path d="M10.2 10.2a1.9 1.9 0 1 1 2.7 2c-.6.5-.9.9-.9 1.6"/><path d="M12 16.8h.01"/>
    </symbol>
    <symbol id="li-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5.5" y="3.5" width="13" height="17" rx="2.5"/><path d="M9.5 3.5v17M12.5 8.5h3M12.5 12h3"/>
    </symbol>
  </defs>
</svg>

<div class="wrap">
  <p class="lead"><b>도구 아이콘 리디자인 — 레퍼런스 결(가는 선 1.3 + 겹침 구성)</b></p>
  <p class="lead">그림 자체를 다시 그렸다. 굵기 1.8 → 1.3, 사물 하나 → 두 사물 겹침(문서+돋보기식)으로 디테일을 한 겹 올렸다.</p>

  <!-- 새 그림 확대 -->
  <section class="case">
    <div class="case-h"><b>새 아이콘 6종</b><span>48px 확대</span></div>
    <p class="case-note">뉴스=신문(제목 칸+단) · 소재=문서+돋보기 · 첨삭=종이+만년필 · AI킬러=문장 표적 · 기출=말풍선 물음표 · 노트=갈피 리본 노트</p>
    <div class="phone">
      <div class="big-row" id="rowNew"></div>
    </div>
  </section>

  <!-- 구 그림 비교 -->
  <section class="case old">
    <div class="case-h"><b>직전 안(뭉툭한 1.8)</b><span>비교용</span></div>
    <div class="phone">
      <div class="big-row" id="rowOld"></div>
    </div>
  </section>

  <!-- 적용 예 -->
  <section class="case">
    <div class="case-h"><b>적용 예 — 엠보스 원판에 얹으면</b><span>실크기</span></div>
    <div class="phone">
      <div class="sec-t"><b>내 입맛대로 골라서 준비해요</b><span>코스 없이 필요한 도구만 바로</span></div>
      <div class="emb-grid" id="grid"></div>
    </div>
  </section>
</div>

<script>
var TOOLS = [
  { nu:'tn-news', ol:'li-news', name:'뉴스 스크랩' },
  { nu:'tn-dig',  ol:'li-dig',  name:'소재 발굴' },
  { nu:'tn-fix',  ol:'li-fix',  name:'답변 첨삭' },
  { nu:'tn-kill', ol:'li-kill', name:'AI킬러' },
  { nu:'tn-quiz', ol:'li-quiz', name:'필수 기출' },
  { nu:'tn-note', ol:'li-note', name:'나만의 노트' }
];
function svg(id,s){ return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#'+id+'"/></svg>'; }

document.getElementById('rowNew').innerHTML = TOOLS.map(function(t){
  return '<div class="big-c"><span class="ic">'+svg(t.nu,48)+'</span>'+t.name+'</div>';
}).join('');
document.getElementById('rowOld').innerHTML = TOOLS.map(function(t){
  return '<div class="big-c"><span class="ic">'+svg(t.ol,48)+'</span>'+t.name+'</div>';
}).join('');
document.getElementById('grid').innerHTML = TOOLS.map(function(t){
  return '<a class="emb-c" href="#"><span class="emb">'+svg(t.nu,30)+'</span>'+t.name+'</a>';
}).join('');
</script>
</body>
</html>
