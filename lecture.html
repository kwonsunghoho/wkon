    let _payRestore = null;   // 결제 중 '버튼 되돌리기'를 담아둔다 — 결제사 페이지에서 뒤로 왔을 때 쓴다(pageshow)

    /* ── 로드 & 렌더 ── */
    async function load() {
      if (!LECTURE_ID) { renderNotFound(); return; }
      if (!window.MONC || !window.MONC.sb) { renderNotFound('특강 정보를 불러오지 못했어요.'); return; }
      const { data, error } = await window.MONC.sb
        .from('special_lectures').select('*').eq('id', LECTURE_ID).eq('visible', true).single();
      if (error || !data) { renderNotFound(); return; }
      LECTURE = data;
      SLOTS = await fetchSlots();
      await rerender(data);
      Promise.resolve(handlePayReturn()).finally(function () { if (window.moncPayDone) moncPayDone(); });
    }

    /* 시간대 조회. lecture_slots 마이그레이션(20260724160000) 미적용이면 조용히 빈 배열
       → 지금까지처럼 '일정 하나짜리 특강'으로 그려진다(graceful degrade). */
    async function fetchSlots() {
      try {
        const { data, error } = await window.MONC.sb
          .from('lecture_slots').select('*').eq('lecture_id', LECTURE_ID);
        if (error || !data) return [];
        return LEC.sortSlots(data);
      } catch (e) { return []; }
    }

    function descHtml(text) {
      if (!text) return '';
      return String(text).split(/\n{2,}/).map(p =>
        '<p>' + LEC.esc(p).replace(/\n/g, '<br>') + '</p>'
      ).join('');
    }

    function render(l) {
      // 항공사 브랜드 액센트를 이 페이지 전체에 지정(카드의 --lx-accent와 동일 소스)
      const air = LEC.airline(l.airline);
      root.style.setProperty('--lx-accent', l.airline ? 'var(--air-' + l.airline + ')' : 'var(--lx-navy)');

      const rawSt = LEC.status(l.recruit_start, l.recruit_end);
      // 시간대가 있으면 '모든 타임이 찼을 때'가 품절이다(한 타임만 차면 그 타임만 막힌다)
      const soldOut = SLOTS.length ? SLOTS.every(LEC.slotFull) : l.seats_left === 0;
      const st = soldOut ? 'closed' : rawSt;          // 품절이면 마감으로 취급(신청 차단)
      const badge = st === 'open'
        ? '<span class="lc-badge open">신청 중' + (LEC.ddaySuffix(l.recruit_end) || '') + '</span>'
        : st === 'upcoming' ? '<span class="lc-badge soon">신청 예정</span>'
        // 자리가 다 찬 것과 기간이 끝난 것은 다른 사정이라 문구를 나눈다
        : '<span class="lc-badge closed">' + (soldOut ? '정원 마감' : '신청 마감') + '</span>';

      // 일시 — 시간대가 하나면 그 타임을 그대로, 여럿이면 요약(자세한 건 아래 선택 목록에서)
      const dateStr = LEC.fmtDate(l.lecture_date);
      let when;
      if (SLOTS.length === 1) {
        when = [LEC.slotWhen(SLOTS[0]), l.schedule_text].filter(Boolean).join(' · ');
      } else if (SLOTS.length > 1) {
        const oneDay = SLOTS.every(s => String(s.slot_date) === String(SLOTS[0].slot_date));
        when = LEC.fmtDate(SLOTS[0].slot_date) + (oneDay ? '' : ' 외') + ' · ' + SLOTS.length + '개 타임';
      } else {
        when = [dateStr, l.schedule_text].filter(Boolean).join(' · ');
      }
      when = when || '추후 안내';
      const recruitPeriod = LEC.fmtPeriod(l.recruit_start, l.recruit_end);
      const priceStr = l.price > 0 ? Number(l.price).toLocaleString() + '원' : '무료';

      const facts = [];
      facts.push(fact('일시', when));
      if (l.instructor) facts.push(fact('강사', l.instructor));
      if (recruitPeriod) facts.push(fact('신청 기간', recruitPeriod));
      // 잔여석은 DB 트리거가 '정원 − 신청건수'로 자동 계산한 값(20260724150000 마이그레이션).
      // 시간대가 있으면 이 값은 모든 타임의 합계다(타임별 잔여석은 아래 선택 목록에 나온다).
      if (l.seats_left != null) {
        facts.push(fact(SLOTS.length > 1 ? '전체 잔여석' : '잔여석', soldOut ? '마감'
          : l.seats_left + '석' + (l.capacity ? ' / 정원 ' + l.capacity + '명' : '')));
      } else if (l.capacity) facts.push(fact('정원', l.capacity + '명'));
      facts.push(fact('참가비', priceStr, true));

      const highlights = Array.isArray(l.highlights) ? l.highlights.filter(Boolean) : [];

      root.innerHTML =
        '<header class="lc-hero"><div class="container">'
        + badge
        + (air ? '<div class="lc-eyebrow">' + LEC.esc(air.en) + '</div>' : '')
        + '<h1 class="lc-title">' + LEC.esc(l.title) + '</h1>'
        + (l.subtitle ? '<p class="lc-sub">' + LEC.esc(l.subtitle) + '</p>' : '')
        + (l.thumb_url ? '<img class="lc-cover" src="' + LEC.esc(l.thumb_url) + '" alt="">' : '')
        + '<div class="lc-facts">' + facts.join('') + '</div>'
        + '</div></header>'
        + '<div class="container">'
        + (l.description ? '<section class="lc-sec lc-desc"><h2>특강 소개</h2>' + descHtml(l.description) + '</section>' : '')
        + (highlights.length ? '<section class="lc-sec"><h2>이런 걸 얻어가요</h2><ul class="lc-high">'
            + highlights.map(h => '<li>' + LEC.esc(h) + '</li>').join('') + '</ul></section>' : '')
        // 신청이 열려 있으면 시간대는 아래 신청 폼에서 고른다. 닫혀 있을 땐(예정·마감)
        // 폼이 없어 시간대를 볼 데가 사라지므로 여기서 안내만 한다.
        + (st !== 'open' && SLOTS.length ? '<section class="lc-sec"><h2>시간대</h2>'
            + '<div class="lc-slots">' + SLOTS.map(s => slotRowHtml(s, true)).join('') + '</div></section>' : '')
        + applyBoxHtml(l, st, priceStr)
        + '</div>'
        + bankModalHtml(priceStr)
        + stickyHtml(l, st, priceStr);

      wireApply(st, l.price);
    }

    function fact(k, v, isPrice) {
      return '<div class="lc-fact"><div class="k">' + LEC.esc(k) + '</div><div class="v' + (isPrice ? ' price' : '') + '">' + LEC.esc(v) + '</div></div>';
    }

    /* 시간대 한 줄. readOnly면 라디오 없이 안내용으로만 그린다(신청 예정·마감 상태). */
    function slotRowHtml(s, readOnly) {
      const full = LEC.slotFull(s);
      const seat = full ? '정원 마감' : (s.seats_left != null ? '잔여 ' + s.seats_left + '석' : '');
      const low = !full && s.seats_left != null && s.seats_left <= 5;
      const body = '<span class="txt"><span class="when">' + LEC.esc(LEC.slotWhen(s)) + '</span>'
        + (seat ? '<span class="seat' + (low || full ? ' low' : '') + '">' + LEC.esc(seat) + '</span>' : '')
        + '</span>';
      if (readOnly) return '<div class="lc-slot' + (full ? ' is-full' : '') + '">' + body + '</div>';
      return '<label class="lc-slot' + (full ? ' is-full' : '') + '">'
        + '<input type="radio" name="lcSlot" value="' + LEC.esc(s.id) + '"' + (full ? ' disabled' : '') + '>'
        + '<span class="dot"></span>' + body + '</label>';
    }

    function applyBoxHtml(l, st, priceStr) {

        const msg = st === 'upcoming' ? '아직 신청 기간이 아니에요. 곧 열려요!'

          : '신청이 마감된 특강이에요.';
        return '<section class="lc-apply" id="applyBox"><div class="lc-closednote">' + msg + '</div></section>';
      }
      const free = !(l.price > 0);
      // 카카오페이 버튼은 채널 키가 채워져 있을 때만 그린다(pay-methods.js · 2026-08-19)
      const kakaoOn = window.moncPay && window.moncPay.kakaoReady();
      const payButtons = free
        ? '<button type="button" class="btn-free" id="freeBtn">무료로 신청하기</button>'

          + (kakaoOn ? '<button type="button" class="btn-kakao" id="kakaoBtn">카카오페이로 결제하고 신청하기</button>' : '')
          + '<button type="button" class="btn-bank" id="bankBtn">계좌이체로 신청하기</button>';
      // 시간대는 정원·마감이 타임마다 따로라, 이름·연락처보다 먼저 고르게 둔다
      const slotPicker = SLOTS.length
        ? '<div class="lc-slots" id="slotPicker"><span class="cap">시간대 선택</span>'

      return '<section class="lc-apply" id="applyBox">'

        + '<p class="hint">' + (SLOTS.length ? '원하는 시간대를 고르고 ' : '') + '이름·연락처를 남기면 신청이 접수돼요.</p>'
        + '<div class="member-badge" id="memberBadge"><span data-name></span>님, 회원으로 신청해요. (마이페이지에서 내역 확인)</div>'
        + slotPicker
        + '<div class="lc-field" id="rowName"><label>이름</label><input type="text" id="appName" class="inp" placeholder="홍길동" autocomplete="name" maxlength="20" aria-describedby="lcErrName"><p class="lc-err" id="lcErrName"></p></div>'
        + '<div class="lc-field" id="rowPhone"><label>연락처</label><input type="tel" id="appPhone" class="inp" placeholder="010-0000-0000" autocomplete="tel" inputmode="numeric" maxlength="20" aria-describedby="lcErrPhone"><p class="lc-err" id="lcErrPhone"></p></div>'
        + '<label class="consent" for="appConsent"><input type="checkbox" id="appConsent"><span>(필수) 만 14세 이상이며, 신청 접수를 위한 <a href="privacy.html" target="_blank" rel="noopener">개인정보 수집·이용</a>에 동의합니다.</span></label>'
        + '<p class="lc-err" id="lcErrConsent"></p>'
        + (free ? '' : '<div class="pay-total"><span class="l">참가비</span><span class="a">' + LEC.esc(priceStr) + '</span></div>')
        + payButtons
        + '<a class="kakao-ask" href="https://pf.kakao.com/_iajxnX/chat" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 3C6.9 3 2.8 6.2 2.8 10.2c0 2.5 1.7 4.7 4.2 6l-1 3.6c-.1.3.3.6.6.4l4.3-2.8c.4 0 .7.1 1.1.1 5.1 0 9.2-3.2 9.2-7.2S17.1 3 12 3z"/></svg>궁금한 점은 카카오톡으로 물어보세요</a>'
        + '<p class="lc-refund">신청 후 환불은 「콘텐츠 이용자 보호지침」에 따릅니다. 특강 시작 전 취소는 전액 환불되며, 자세한 내용은 <a href="terms.html" target="_blank" rel="noopener">이용약관</a>을 참고해 주세요.</p>'
        + '</section>';

    function bankModalHtml(priceStr) {
      return '<div class="bt-modal" id="bankModal" aria-hidden="true">'
        + '<div class="bt-dim" data-close></div>'
        + '<div class="bt-sheet" role="dialog" aria-modal="true">'
        + '<div class="bt-handle"></div>'
        + '<div class="bt-head"><div class="bt-title">계좌이체로 입금</div><button type="button" class="bt-close" data-close aria-label="닫기">&times;</button></div>'
        + '<div class="bt-amount"><span class="l">입금하실 금액</span><span class="v">' + LEC.esc(priceStr) + '</span></div>'
        + '<div class="bank"><div class="h">입금 계좌</div><div class="line">'
        +   '<div>은행: 하나</div>'
        +   '<div class="acct"><span>계좌: <strong id="acctNum">332-910697-07707</strong></span><button type="button" class="copy-btn" id="copyBtn">복사</button></div>'
        +   '<div>예금주: 박새암(몬크)</div>'
        + '</div><div class="note">위 계좌로 입금하신 뒤 아래 버튼을 눌러주세요. 확인 후 안내드리겠습니다.</div></div>'
        + '<button type="button" class="bt-confirm" id="btConfirm">입금 완료 · 신청하기</button>'
        + '</div></div>';
    }

    function stickyHtml(l, st, priceStr) {
      const disabled = st !== 'open';
      const label = st === 'upcoming' ? '신청 예정'
        : st === 'closed' ? (l.seats_left === 0 ? '정원 마감' : '신청 마감')
        : '신청하기';
      return '<div class="lc-sticky"><div class="lc-sticky-in">'
        + '<div class="info"><div class="p">' + LEC.esc(priceStr) + '</div><div class="s">' + LEC.esc(l.title) + '</div></div>'
        + '<button type="button" class="go" id="stickyGo"' + (disabled ? ' disabled' : '') + '>' + label + '</button>'
        + '</div></div>';
    }

    /* ── 이벤트 연결 ── */
    /* iOS Safari 접히는 툴바 보정 — position:fixed;bottom:0 은 레이아웃 뷰포트 기준이라
       툴바가 접힌 동안 바 아랫부분이 툴바 뒤로 들어가 잘린다(2026-08-02 실사고).
       ⚠️ 데스크톱 크로미움에서는 절대 재현되지 않는다. 하단 고정 요소엔 항상 같이 단다.
       ⚠️ challenge-sticky.js 의 place() 와 같은 계산·같은 규칙이다 — 한쪽만 고치지 말 것.
       ⚠️⚠️ 프레임마다 쫓아가지 말 것(2026-08-02 밤 성능 사고) — 스크롤마다 rAF 로 재면
          폰에서 스크롤이 끊기고 바가 떨린다. 멈추고 120ms 뒤 한 번만, 값이 바뀔 때만,
          bottom 대신 transform 변수(--vv-gap)로 쓴다(합성 단계 — 레이아웃 계산 없음). */
    let lastGap = 0;
    function placeSticky() {
      const el = document.querySelector('.lc-sticky');
      const vv = window.visualViewport;
      if (!el || !vv) return;
      const gap = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      /* 재렌더 직후엔 인라인 --vv-gap 이 지워져 있으니 값이 같아도 다시 쓴다 */
      if (gap === lastGap && el.style.getPropertyValue('--vv-gap')) return;
      lastGap = gap;
      el.style.setProperty('--vv-gap', gap + 'px');
    }
    (function watchSticky() {
      let t = null;
      const settle = () => { clearTimeout(t); t = setTimeout(placeSticky, 120); };
      placeSticky();
      window.addEventListener('resize', settle);
      window.addEventListener('scroll', settle, { passive: true });
      window.addEventListener('pageshow', settle);   // 뒤로가기 복귀 — 뷰포트 상태가 다를 수 있다
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', settle);
        window.visualViewport.addEventListener('scroll', settle);
      }
    })();

    function wireApply(st, price) {
      placeSticky();   // 바가 방금 그려졌으니 위치를 한 번 맞춘다
      const sticky = document.getElementById('stickyGo');
      if (sticky) sticky.addEventListener('click', () => {
        // 로그인 게이트 상태면 폼이 없다 — 스크롤 대신 바로 로그인으로
        if (_loginGated) { location.href = window.moncLoginHref ? window.moncLoginHref() : 'login.html'; return; }
        document.getElementById('applyBox').scrollIntoView({ behavior: 'smooth' });
        setTimeout(() => { const n = document.getElementById('appName'); if (n) n.focus(); }, 400);
      });
      if (st !== 'open') return;
      wireSlots();

      const toss = document.getElementById('tossBtn');
      const kakao = document.getElementById('kakaoBtn');
      const bank = document.getElementById('bankBtn');
      const free = document.getElementById('freeBtn');
      if (toss) toss.addEventListener('click', () => payEasy('toss'));
      if (kakao) kakao.addEventListener('click', () => payEasy('kakao'));
      if (bank) bank.addEventListener('click', openBankModal);
      if (free) free.addEventListener('click', submitFree);

      const modal = document.getElementById('bankModal');
      modal.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeBankModal));
      document.getElementById('btConfirm').addEventListener('click', confirmBankTransfer);
      document.getElementById('copyBtn').addEventListener('click', copyAccount);
    }

    // ⚠️ document 리스너는 render() 가 다시 돌 때마다 쌓이므로 여기서 딱 한 번만 건다
    // (잔여석 갱신으로 재렌더가 잦아졌다). 나머지는 새로 만든 요소에 붙어 누적되지 않는다.
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBankModal(); });

    /* ── 시간대 선택 ── */
    function wireSlots() {
      const box = document.getElementById('slotPicker');
      if (!box) { _slotId = null; return; }

      // 고를 게 하나뿐이면 미리 골라둔다(선택이랄 게 없다). 여럿이면 직접 고르게 —
      // 시간대는 되돌리기 어려운 선택이라 임의로 찍어두지 않는다.
      const open = SLOTS.filter(s => !LEC.slotFull(s));
      if (!open.some(s => s.id === _slotId)) _slotId = (open.length === 1 ? open[0].id : null);

      box.querySelectorAll('input[name="lcSlot"]').forEach(input => {
        input.checked = (input.value === _slotId);
        input.addEventListener('change', () => {
          if (!input.checked) return;
          _slotId = input.value;
          paintSlots();
        });
      });
      paintSlots();
    }

    function paintSlots() {
      const box = document.getElementById('slotPicker');
      if (!box) return;
      box.querySelectorAll('.lc-slot').forEach(row => {
        const input = row.querySelector('input');
        row.classList.toggle('is-on', !!input && input.value === _slotId);
      });
    }

    function currentSlot() { return SLOTS.find(s => s.id === _slotId) || null; }

    /* ── 회원 연동 ── */
    async function initMember() {
      _loginGated = false;
      let profile = null;
      try { profile = await window.MONC.getMyProfile(); } catch (e) {}
      if (profile && profile.id) {
        _memberId = profile.id;
        _profileHadPhone = !!profile.phone;
        const badge = document.getElementById('memberBadge');
        if (badge) { badge.querySelector('[data-name]').textContent = profile.name || '회원'; badge.style.display = 'block'; }
        if (profile.name)  { const n = document.getElementById('appName');  if (n) { n.value = profile.name;  document.getElementById('rowName').style.display = 'none'; } }
        if (profile.phone) { const p = document.getElementById('appPhone'); if (p) { p.value = profile.phone; document.getElementById('rowPhone').style.display = 'none'; } }
      } else {
        showLoginGate();
      }
      await markAlreadyApplied();
    }

    /* ── 로그인 게이트(2026-08-05 오너 확정 — 특강 신청은 로그인 필수) ──
       화면 잠금은 안내일 뿐, 최종 방어는 RLS(20260805140000)와 verify-payment 다.
       ⚠️ 열린 신청 폼일 때만 바꾼다 — 마감·예정 안내(lc-closednote)를 덮으면 안 된다. */
    let _loginGated = false;
    function showLoginGate() {
      const box = document.getElementById('applyBox');
      if (!box || !box.querySelector('#appConsent')) return;
      _loginGated = true;
      const href = window.moncLoginHref ? window.moncLoginHref() : 'login.html';
      box.innerHTML = '<h2>신청하기</h2>'
        + '<div class="lc-logingate"><p class="t">특강 신청은 로그인 후 이용할 수 있어요.<br>신청 내역이 계정에 남아 마이페이지에서 확인할 수 있어요.</p>'
        + '<a class="lc-loginbtn" href="' + href + '">로그인하고 신청하기</a></div>';
      const sticky = document.getElementById('stickyGo');
      if (sticky) sticky.textContent = '로그인하고 신청하기';
    }

    /* ── 중복 신청 차단 ──
       최종 방어는 DB 트리거(마이그레이션 20260725120000)다. ⚠️ 시간대가 달라도 같은 특강은
       한 번만 신청할 수 있다(시간대는 '같은 내용을 여는 다른 타임'이라 두 번 들을 이유가 없다).
       ⚠️ 비회원은 RLS 로 사전 조회가 불가능하다(전화번호로 신청 여부를 캐낼 수 있게 열 수 없다)
          → 비회원 중복은 트리거가 막고, 결제까지 끝난 건은 verify-payment 가 전액 환불한다. */
    let _appliedKeys = null, _appliedReq = null;

    function loadAppliedKeys() {
      if (_appliedKeys) return Promise.resolve(_appliedKeys);
      // ⚠️ 비회원 결과(null)는 캐시하지 않는다 — initMember 가 늦게 끝나는 순서가 있어서,
      //    캐시하면 회원인데도 영영 검사를 안 하게 된다.
      if (!_memberId || !window.MONC.myAppliedPrograms) return Promise.resolve(null);
      if (!_appliedReq) _appliedReq = window.MONC.myAppliedPrograms(_memberId);
      return _appliedReq;
    }

    async function alreadyApplied() {
      const keys = await loadAppliedKeys();
      return !!keys && keys.has('lecture:' + LECTURE_ID);
    }

    /* 이미 신청한 특강이면 신청 폼을 안내문으로 바꾼다(결제까지 가서 막히지 않게). */
    async function markAlreadyApplied() {
      if (!(await alreadyApplied())) return;
      const box = document.getElementById('applyBox');
      if (box) {
        box.innerHTML = '<div class="lc-closednote">이미 신청하신 특강이에요.'
          + ' 같은 특강을 두 번 신청할 수는 없어요.<br>신청 내역은 '
          + '<a href="mypage.html">마이페이지</a>에서 확인할 수 있어요.</div>';
      }
      const sticky = document.getElementById('stickyGo');
      if (sticky) { sticky.disabled = true; sticky.textContent = '신청 완료'; }
    }

    /* 접수 성공·트리거 차단 후 — 이 특강을 '신청함'으로 기억한다(비회원도 이 세션 동안) */
    function noteApplied() {
      if (!_appliedKeys) _appliedKeys = new Set();
      _appliedKeys.add('lecture:' + LECTURE_ID);
    }
    async function rememberApplied() { noteApplied(); await markAlreadyApplied(); }

    /* DB 트리거가 막은 중복인지 (마이그레이션 20260725120000 의 errcode MC002) */
    function isDuplicate(e) { return window.MONC.isDuplicateError(e); }

    /* 신청 직전 마지막 확인. 중복이면 안내하고 true. */
    async function dupBlocked() {
      if (!(await alreadyApplied())) return false;
      hideBankModal();
      alert('이미 신청하신 특강이에요.\n같은 특강을 두 번 신청할 수는 없어요.'
        + '\n신청 내역은 마이페이지에서 확인할 수 있어요.');
      await markAlreadyApplied();
      return true;
    }

    /* ── 입력 검증(공통) ── */
    /* 칸이 아니라 묶음(시간대·동의)에 붙는 오류 — apply.html 의 setBlockErr 와 같은 규칙.
       ⚠️ 두 파일은 같은 결제 흐름이다. 한쪽만 고치지 말 것. */
    function setBlockErr(id, message) {
      const e = document.getElementById(id);
      if (!e) return;
      e.textContent = message || '';
      e.classList.toggle('on', !!message);
    }
    function readApplicant() {
      // 특강 신청은 로그인 필수(2026-08-05) — 게이트가 그려지기 전의 클릭도 여기서 막는다
      if (!_memberId) {
        alert('특강 신청은 로그인 후 이용할 수 있어요.');
        location.href = window.moncLoginHref ? window.moncLoginHref() : 'login.html';
        return null;
      }
      // 시간대가 있는 특강은 반드시 하나를 골라야 한다(정원·마감이 타임마다 따로라서)
      if (SLOTS.length && !_slotId) {
        // 오류는 고를 대상 바로 아래 인라인 — alert 은 닫으면 문구가 사라진다(진단 D-6)
        setBlockErr('lcErrSlot', '신청할 시간대를 골라주세요.');
        const box = document.getElementById('slotPicker');
        if (box) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return null;
      }
      setBlockErr('lcErrSlot', '');
      const name = (document.getElementById('appName') || {}).value?.trim() || '';
      const phone = (document.getElementById('appPhone') || {}).value?.trim() || '';
      /* 규칙은 phone-check.js 한 곳 — 가입·챌린지·특강·오픈알림이 같은 번호를 받는다.
         오류는 alert 이 아니라 틀린 칸 바로 아래에 띄운다(2026-08-02). */
      const setErr = (inputId, errId, m) => {
        const i = document.getElementById(inputId), e = document.getElementById(errId);
        if (i) i.classList.toggle('is-err', !!m);
        if (e) { e.textContent = m || ''; e.classList.toggle('on', !!m); }
      };
      const nc = window.MONC_PHONE ? MONC_PHONE.checkName(name) : { ok: !!name, message: '이름을 입력해 주세요.' };
      const pc = window.MONC_PHONE ? MONC_PHONE.check(phone) : { ok: !!phone, message: '연락처를 입력해 주세요.' };
      setErr('appName', 'lcErrName', nc.ok ? '' : nc.message);
      setErr('appPhone', 'lcErrPhone', pc.ok ? '' : pc.message);
      if (!nc.ok || !pc.ok) {
        const bad = document.getElementById(nc.ok ? 'appPhone' : 'appName');
        if (bad) { bad.scrollIntoView({ behavior: 'smooth', block: 'center' }); bad.focus({ preventScroll: true }); }
        return null;
      }
      const agreed = document.getElementById('appConsent').checked;
      setBlockErr('lcErrConsent', agreed ? '' : '개인정보 수집·이용에 동의해야 신청할 수 있어요.');
      if (!agreed) {
        const c = document.getElementById('appConsent');
        c.scrollIntoView({ behavior: 'smooth', block: 'center' });
        c.focus({ preventScroll: true });
        return null;
      }
      const applicant = { name, phone };
      if (_memberId) applicant.member_id = _memberId;
      return applicant;
    }

    function lectureChallengeEntry() {
      const entry = { type: 'lecture', lecture_id: LECTURE.id, name: LECTURE.title, price: LECTURE.price || 0 };
      // 관리자 신청자 현황이 challenges 만 보고도 어느 타임인지 알 수 있게 같이 담는다
      const s = currentSlot();
      if (s) { entry.slot_id = s.id; entry.slot = LEC.slotShort(s); }
      return [entry];
    }

    /* ── 잔여석 재확인 ──
       잔여석은 신청이 들어올 때마다 DB 트리거가 다시 센다. 사용자가 페이지를 열어둔
       사이에 남은 자리가 나갈 수 있으므로, 결제창을 띄우기 전에 최신값을 한 번 더 읽어
       마감이면 결제 자체를 시작하지 않는다. 그래도 동시에 뚫린 신청은 DB 트리거가 막고,
       결제까지 끝난 경우엔 verify-payment 가 전액 자동 환불한다. */
    async function fetchLecture() {
      try {
        const { data, error } = await window.MONC.sb
          .from('special_lectures').select('*').eq('id', LECTURE_ID).eq('visible', true).single();
        return error ? null : data;
      } catch (e) { return null; }
    }

    async function ensureSeatOpen() {
      const fresh = await fetchLecture();
      if (!fresh) return true;   // 조회 실패로 신청을 막지 않는다(최종 방어는 DB 트리거)
      LECTURE = fresh;
      if (SLOTS.length) SLOTS = await fetchSlots();

      const st = LEC.status(fresh.recruit_start, fresh.recruit_end);
      const soldOut = SLOTS.length ? SLOTS.every(LEC.slotFull) : fresh.seats_left === 0;
      const picked = currentSlot();

      let msg = null;
      if (st !== 'open') msg = '신청 기간이 종료되었어요.';
      else if (soldOut) msg = '아쉽게도 방금 정원이 모두 찼어요.\n다음 특강을 기다려 주세요.';
      else if (SLOTS.length && (!picked || LEC.slotFull(picked))) {
        // 특강 전체는 자리가 남았지만 '고른 타임'만 찬 경우 — 다른 타임을 고르면 된다
        msg = '아쉽게도 방금 이 시간대의 정원이 모두 찼어요.\n남은 시간대를 확인해 주세요.';
        _slotId = null;
      }
      if (!msg) return true;

      hideBankModal();
      alert(msg);
      await rerender(fresh);
      return false;
    }

    /* ⚠️ render() 는 신청 폼까지 통째로 다시 만들므로 회원 자동입력이 날아간다.
       화면을 다시 그릴 땐 반드시 이 함수로(= initMember 재실행). */
    async function rerender(l) {
      render(l);
      await initMember();
    }

    /* 최신 잔여석으로 화면을 다시 그린다(신청 접수·마감 후) */
    async function refreshLecture() {
      const fresh = await fetchLecture();
      if (!fresh) return;
      LECTURE = fresh;
      if (SLOTS.length) SLOTS = await fetchSlots();
      await rerender(fresh);
    }

    /* 정원 마감으로 DB 가 막은 신청인지 (마이그레이션 20260724150000 의 errcode) */
    function isLectureFull(e) {
      return !!e && (e.code === 'MC001' || String(e.message || '').includes('lecture_full'));
    }

    /* ── 무료 신청(직접 접수) ── */
    async function submitFree() {
      if (_busy) return;
      const applicant = readApplicant(); if (!applicant) return;
      _busy = true;
      const btn = document.getElementById('freeBtn'); const orig = btn.textContent;
      btn.disabled = true; btn.textContent = '신청 중…';
      const ok = !(await dupBlocked()) && (await ensureSeatOpen()) && await insertApplication(applicant);
      _busy = false;
      restoreBtn(btn, orig);
      if (ok) afterApplied('무료 신청이 접수되었습니다! 확인 후 안내드릴게요.');
    }

    /* 마감으로 화면을 다시 그렸으면 버튼이 떨어져 나갔을 수 있다 */
    function restoreBtn(btn, text) {
      if (!btn || !document.body.contains(btn)) return;
      btn.disabled = false; btn.textContent = text;
    }

    /* ── 계좌이체 ── */
    async function openBankModal() {
      if (!readApplicant()) return;
      // 접수될 수 없는 신청에 입금 계좌를 먼저 보여주면 안 된다(입금부터 하고 막히는 사고)
      if (await dupBlocked()) return;
      const m = document.getElementById('bankModal');
      m.classList.add('open'); m.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden';
    }
    // 실제 닫기 동작. closeBankModal 은 신청 처리 중(_busy) 사용자가 닫는 걸 막지만,
    // 정원 마감처럼 코드가 강제로 닫아야 하는 경우엔 이쪽을 직접 부른다.
    function hideBankModal() {
      const m = document.getElementById('bankModal');
      if (!m) return;
      m.classList.remove('open'); m.setAttribute('aria-hidden', 'true'); document.body.style.overflow = '';
    }
    function closeBankModal() {
      if (_busy) return;
      hideBankModal();
    }
    async function confirmBankTransfer() {
      if (_busy) return;
      const applicant = readApplicant(); if (!applicant) return;
      _busy = true;
      const btn = document.getElementById('btConfirm'); const orig = btn.textContent;
      btn.disabled = true; btn.textContent = '신청 중…'; btn.style.opacity = '.7';
      const ok = !(await dupBlocked()) && (await ensureSeatOpen()) && await insertApplication(applicant);
      _busy = false;
      restoreBtn(btn, orig);
      if (btn && document.body.contains(btn)) btn.style.opacity = '1';
      if (ok) { hideBankModal(); afterApplied('신청이 접수되었습니다! 입금 확인 후 안내드리겠습니다.'); }
    }

    /* applications 직접 insert (무료·계좌이체 공통). paid=false(기본) → 관리자 확인. */
    async function insertApplication(applicant) {
      const payload = {
        name: applicant.name, phone: applicant.phone,
        challenges: lectureChallengeEntry(),
        total_price: LECTURE.price || 0,
        lecture_id: LECTURE.id,
      };
      if (_slotId) payload.slot_id = _slotId;
      if (applicant.member_id) payload.member_id = applicant.member_id;
      try {
        const { error } = await window.MONC.sb.from('applications').insert(payload);
        if (error) throw error;
        await maybeSavePhone(applicant);
        await rememberApplied();   // 같은 특강을 또 넣지 못하게 화면 잠금
        return true;
      } catch (e) {
        // 마지막 한 자리를 동시에 노린 경우 — DB 트리거가 막는다(결제 전이라 손해 없음)
        if (isLectureFull(e)) {
          hideBankModal();
          alert('아쉽게도 방금 정원이 모두 찼어요.\n결제 전이라 빠져나간 금액은 없습니다.');
          await refreshLecture();
          return false;
        }
        // 같은 특강 중복 — 사전 검사로 못 잡은 경우(비회원·동시 신청)를 트리거가 막았다.
        // 무료·계좌이체는 결제 전이라 돈이 나가지 않았으므로 안내만 한다.
        if (isDuplicate(e)) {
          hideBankModal();
          alert('이미 신청하신 특강이에요.\n같은 특강을 두 번 신청할 수는 없어요.'
            + '\n문의는 고객센터(070-4032-0015)로 연락 주세요.');
          await rememberApplied();
          return false;
        }
        // RLS 가 막은 경우(세션 만료 등 비로그인) — 20260805140000 특강 로그인 필수
        if (e && (e.code === '42501' || String(e.message || '').includes('row-level security'))) {
          hideBankModal();
          alert('로그인이 만료되어 신청이 접수되지 않았어요.\n로그인 후 다시 신청해 주세요.');
          location.href = window.moncLoginHref ? window.moncLoginHref() : 'login.html';
          return false;
        }
        console.error('신청 저장 실패', e);
        alert('오류가 발생했어요. 다시 시도해주세요.');
        return false;
      }
    }

    /* ── 간편결제(토스페이·카카오페이) → verify-payment(특강 금액 서버검증) → 접수 ──
       provider = 'toss' | 'kakao' — 채널 키만 다르고 흐름은 같다(pay-methods.js). */
    async function payEasy(provider) {
      if (_busy) return;
      const applicant = readApplicant(); if (!applicant) return;
      if (!window.PortOne || !window.moncPay) { alert('결제 모듈을 불러오지 못했어요. 새로고침 후 다시 시도해주세요.'); return; }
      _busy = true;
      const btn = document.getElementById(provider === 'kakao' ? 'kakaoBtn' : 'tossBtn'); const orig = btn.innerHTML;
      btn.disabled = true; btn.textContent = '결제 진행 중…';
      _payRestore = () => { _busy = false; if (document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = orig; } };
      // 결제창을 띄우기 전에 중복·잔여석을 확인 — 결제 후 막혀 환불하는 상황을 줄인다
      if ((await dupBlocked()) || !(await ensureSeatOpen())) {
        _payRestore = null;
        _busy = false;
        if (document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = orig; }
        return;
      }
      try {
        const total = LECTURE.price;
        const paymentId = 'monc-lec-' + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
        // 미결 기록은 결제창을 열기 전에 남기고 확답 전엔 지우지 않는다(pay-pending.js —
        // sessionStorage 는 탭 단위라 인앱 복귀에서 유실돼 돈만 나가는 사고가 났다).
        moncPends.add('monc_pending_lecture_pay', { paymentId, applicant, lectureId: LECTURE.id, slotId: _slotId });
        if (window.moncBeacon) moncBeacon('pay_open', { k: 'lecture' }); // 결제 시도 계측(퍼널)
        const rp = new URLSearchParams(location.search); rp.set('payresult', '1');
        const redirectUrl = location.origin + location.pathname + '?' + rp.toString();

        const res = await window.PortOne.requestPayment({
          storeId: window.moncPay.storeId,
          channelKey: window.moncPay.channels[provider] || window.moncPay.channels.toss,
          paymentId, orderName: '몬크 특강 · ' + LECTURE.title,
          totalAmount: total, currency: 'CURRENCY_KRW', payMethod: 'EASY_PAY',
          customer: { fullName: applicant.name, phoneNumber: applicant.phone },
          // 주문 맥락 — 웹훅(portone-webhook)이 브라우저 없이도 접수를 끝내는 데 쓴다.
          customData: JSON.stringify({ k: 'lecture', uid: applicant.member_id || _memberId || null, lid: LECTURE.id, slot: _slotId || null, name: applicant.name, phone: applicant.phone }),
          redirectUrl,
        });
        // 여기부터 PC(팝업) 경로. 모바일은 위에서 페이지가 떠나 도달하지 않는다.
        if (res && res.code) {
          // 결제 자체가 안 됐다(취소·실패) — 미결 아님, 기록을 지운다.
          moncPends.drop('monc_pending_lecture_pay', paymentId);
          alert('결제가 완료되지 않았어요.\n' + (res.message || res.code)); return;
        }
        btn.textContent = '결제 확인 중…';
        const ok = await completePayment(paymentId, applicant, _slotId);
        if (ok) afterApplied(null, true);
      } catch (e) {
        console.error('결제 오류', e);
        alert('결제 중 오류가 발생했어요: ' + (e && e.message ? e.message : e));
      } finally {
        _payRestore = null;
        _busy = false; btn.disabled = false; btn.innerHTML = orig;
      }
    }

    /* ⚠️ 결제사 페이지에서 뒤로가기로 돌아오면(bfcache) 이 문서가 얼렸던 그대로 되살아난다.
       모바일은 리다이렉트 방식이라 requestPayment 의 promise 가 끝나지 않아 위 finally 가 돌지 못한다
       → 버튼이 '결제 진행 중' 인 채 비활성으로 굳어 새로고침 전까지 결제를 다시 못 한다.
       입력해 둔 이름·전화는 살려야 하므로 reload 가 아니라 버튼만 되돌린다. */
    window.addEventListener('pageshow', (e) => {
      if (!e.persisted || !_payRestore) return;
      const restore = _payRestore; _payRestore = null;   // 한 번 쓰고 버린다
      restore();
    });

    /* quiet = 자가 회복 경로 — 결제 직후가 아니므로 '확인 실패' 알림·로그인 이동은 하지 않는다.
       확답(200 본문)일 때만 미결 기록을 지운다(pay-pending.js 규칙).
       ⚠️ lectureId 는 기록의 것을 쓴다 — 다른 특강 화면에서 회복해도 맞는 특강에 접수되게. */
    async function completePayment(paymentId, applicant, slotId, lectureId, quiet) {
      // 시도 표시(n)를 먼저 남긴다 — 서버가 접수한 뒤 응답만 유실되면, 다음 확인이
      // '재확인'으로 취급돼 appsRetrySafe() 가드를 타야 한다(구버전 서버의 MC002 오환불 방지).
      const _rec = moncPends.load('monc_pending_lecture_pay').filter(r => r.paymentId === paymentId)[0];
      if (_rec) { _rec.n = (_rec.n || 0) + 1; moncPends.drop('monc_pending_lecture_pay', paymentId); moncPends.add('monc_pending_lecture_pay', _rec); }
      const { data, error } = await window.MONC.sb.functions.invoke('verify-payment', {
        body: { paymentId, lectureId: lectureId || LECTURE_ID, slotId: slotId || null, applicant },
      });
      if (data) moncPends.drop('monc_pending_lecture_pay', paymentId);
      // 로그인 없이 결제까지 간 경우(결제 도중 세션 만료 등) — 서버가 전액 자동 환불한다
      if (data && data.error === 'login_required') {
        if (!quiet) {
          alert('로그인이 만료되어 신청이 접수되지 않았어요.\n\n' + (data.refunded
            ? '결제하신 금액은 전액 자동 환불 처리했습니다.\n(카드사에 따라 3~5영업일 정도 걸릴 수 있어요)'
            : '환불 처리에 문제가 생겼어요. 고객센터(070-4032-0015)로 연락 주시면 바로 처리해 드릴게요.'));
          location.href = window.moncLoginHref ? window.moncLoginHref() : 'login.html';
        }
        return false;
      }
      // 결제 승인과 신청 저장 사이에 중복이 확인된 경우 — 서버가 전액 자동 환불한다
      if (data && data.error === 'duplicate_application') {
        alert('이미 신청하신 특강이에요.\n\n' + (data.refunded
          ? '중복 접수가 되지 않아 결제 금액은 전액 자동 환불 처리했습니다.\n(카드사에 따라 3~5영업일 정도 걸릴 수 있어요)'
          : '환불 처리에 문제가 생겼어요. 고객센터(070-4032-0015)로 연락 주시면 바로 처리해 드릴게요.'));
        await rememberApplied();
        return false;
      }
      // 결제 승인과 신청 저장 사이에 마지막 자리가 나간 경우 — 서버가 전액 자동 환불한다
      if (data && data.error === 'lecture_full') {
        alert('아쉽게도 결제하시는 사이에 정원이 모두 찼어요.\n\n' + (data.refunded
          ? '결제하신 금액은 전액 자동 환불 처리했습니다.\n(카드사에 따라 3~5영업일 정도 걸릴 수 있어요)'
          : '환불 처리에 문제가 생겼어요. 고객센터(070-4032-0015)로 연락 주시면 바로 처리해 드릴게요.'));
        await refreshLecture();
        return false;
      }
      if (error || !data || !data.ok) {
        console.error('결제 검증 실패', error, data);
        if (!quiet) alert('결제는 완료됐지만 신청 확인에 문제가 생겼어요.\n고객센터(070-4032-0015)로 연락 주시면 바로 처리해 드릴게요.');
        return false;
      }
      await maybeSavePhone(applicant);
      alert('결제가 완료되어 신청이 정상 접수되었습니다! 🎉\n시작 안내를 곧 보내드릴게요.' + (applicant.member_id ? '\n마이페이지에서 신청 내역을 확인할 수 있어요.' : ''));
      return true;
    }

    /* 모바일 결제 복귀 + 자가 회복 — 미결 기록(pay-pending.js) 전부를 확인한다.
       ⚠️ 주문정보(이름·전화·시간대)는 주소로 복원할 수 없다(개인정보를 주소에 싣지 않는다) —
          기록이 localStorage 인 이유. **재확인은 appsRetrySafe() 가 true 일 때만** —
          구버전 서버는 재확인을 중복신청(MC002)으로 읽어 정상 결제를 환불한다.
       ⚠️ 조용한 회복은 로그인 상태에서만 — 로그아웃 확인은 서버가 '비로그인 결제'로 보고
          미접수 결제를 환불해 버린다. 로그인한 방문에서 잇는 쪽이 맞다. */
    async function handlePayReturn() {
      const p = new URLSearchParams(location.search);
      const came = p.get('payresult') === '1';
      const code = p.get('code'), message = p.get('message');
      const urlPid = p.get('paymentId');
      if (came) {
        ['payresult', 'paymentId', 'code', 'message', 'pgCode', 'pgMessage', 'transactionType', 'txId'].forEach(k => p.delete(k));
        history.replaceState(null, '', location.origin + location.pathname + (p.toString() ? '?' + p.toString() : ''));
        if (code) {
          if (urlPid) moncPends.drop('monc_pending_lecture_pay', urlPid);
          alert('결제가 완료되지 않았어요.\n' + (message || code)); return;
        }
      }
      const pends = moncPends.load('monc_pending_lecture_pay');
      if (!pends.length) return;
      let retryOk = null, hasSession = null;   // 프로브·세션 확인은 필요할 때 한 번만
      for (const rec of pends) {
        const loud = came && (!urlPid || rec.paymentId === urlPid);
        if (!loud) {
          if (hasSession === null) hasSession = !!(await window.MONC.getSession().catch(() => null));
          if (!hasSession) continue;
        }
        if (rec.n) {   // 이미 한 번 보낸 결제 — 재확인 가드(시도 표시는 completePayment 가 남긴다)
          if (retryOk === null) retryOk = await moncPends.appsRetrySafe();
          if (!retryOk) continue;   // 서버가 아직 구버전 — 기록은 남겨 두고 다음에 본다
        }
        // 모바일은 결제사 페이지를 다녀오며 페이지가 새로 뜨므로 시간대도 보관해 둔 값을 쓴다
        const ok = await completePayment(rec.paymentId, rec.applicant, rec.slotId, rec.lectureId, !loud);
        if (ok && (!rec.lectureId || rec.lectureId === LECTURE_ID)) afterApplied(null, true);
      }
    }

    async function maybeSavePhone(applicant) {
      if (applicant.member_id && !_profileHadPhone && applicant.phone) {
        try { await window.MONC.sb.from('members').update({ phone: applicant.phone }).eq('id', applicant.member_id); _profileHadPhone = true; } catch (e) {}
      }
    }

    async function afterApplied(msg, isPaid) {
      if (msg) alert(msg);
      noteApplied();   // 방금 신청한 특강 → 아래 재렌더에서 신청 폼이 '이미 신청' 안내로 바뀐다
      window.scrollTo({ top: 0, behavior: 'smooth' });
      // 방금 줄어든 잔여석을 바로 보여준다 — 화면을 다시 그리면서 폼도 초기화된다
      const fresh = await fetchLecture();
      if (fresh) {
        LECTURE = fresh;
        if (SLOTS.length) SLOTS = await fetchSlots();
        _slotId = null;               // 접수 끝 — 시간대 선택도 처음 상태로
        await rerender(fresh);
        return;
      }
      // 조회 실패 시엔 폼만 손으로 정리(잔여석은 다음 방문에 맞춰진다)
      const c = document.getElementById('appConsent'); if (c) c.checked = false;
      if (!_memberId) { const n = document.getElementById('appName'), ph = document.getElementById('appPhone'); if (n) n.value = ''; if (ph) ph.value = ''; }
      await markAlreadyApplied();   // 재렌더를 못 했으니 여기서 폼을 잠근다
    }

    function copyAccount() {
      const num = document.getElementById('acctNum').textContent.trim();
      const done = () => { const b = document.getElementById('copyBtn'); const o = b.textContent; b.textContent = '복사됨'; setTimeout(() => b.textContent = o, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(num).then(done).catch(done);
      else { const t = document.createElement('textarea'); t.value = num; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(t); done(); }
    }

    function renderNotFound(msg) {
      root.innerHTML = '<div class="lc-notfound"><div class="em">특강을 찾을 수 없어요</div>'
        + (msg || '주소가 바뀌었거나 마감된 특강일 수 있어요.')
        + '<br><a href="lectures.html">특강 목록 보기</a></div>';
    }

    load();
  </script>
</body>
