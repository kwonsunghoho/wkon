<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로필 완성 — MONC 몬크</title>
  <meta name="description" content="MONC 몬크 프로필 완성 — 준비 상황을 알려주시면 필요한 도구를 안내해 드려요." />
  <!-- Open Graph / SNS 공유 — 크롤러는 JS 를 안 돌리므로 여기에 직접 둔다 -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://monc.ai.kr/onboarding.html" />
  <meta property="og:title"       content="프로필 완성 — MONC 몬크" />
  <meta property="og:description" content="MONC 몬크 프로필 완성 — 준비 상황을 알려주시면 필요한 도구를 안내해 드려요." />
  <meta property="og:image"       content="https://monc.ai.kr/images/og-image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale"      content="ko_KR" />
  <meta property="og:site_name"   content="MONC 몬크" />
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="프로필 완성 — MONC 몬크" />
  <meta name="twitter:description" content="MONC 몬크 프로필 완성 — 준비 상황을 알려주시면 필요한 도구를 안내해 드려요." />
  <meta name="twitter:image"       content="https://monc.ai.kr/images/og-image.png" />
  <!-- 파비콘 -->
  <link rel="icon" href="images/MONC_Logo_Full_Package/assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="images/MONC_Logo_Full_Package/assets/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/MONC_Logo_Full_Package/assets/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/MONC_Logo_Full_Package/assets/favicon/apple-touch-icon.png">
  <link rel="mask-icon" href="images/MONC_Logo_Full_Package/assets/favicon/safari-pinned-tab.svg" color="#102B56">
  <link rel="manifest" href="images/MONC_Logo_Full_Package/assets/favicon/site.webmanifest">
  <meta name="theme-color" content="#102B56">
  <link rel="stylesheet" href="tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'SUIT Variable', SUIT, 'Apple SD Gothic Neo', -apple-system, sans-serif;
      background: linear-gradient(160deg, var(--bg) 0%, var(--bg3) 100%);
      color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
      width: 100%; max-width: 420px; padding: 40px 30px; text-align: center;
    }
    .logo { display: flex; align-items: center; justify-content: center; }
    .logo img { height: 28px; width: auto; display: block; }
    h1 { font-size: 20px; font-weight: 900; margin-top: 16px; color: var(--action); }
    .sub { margin-top: 8px; color: var(--text-muted); font-size: 14px; line-height: 1.6; }
    form { margin-top: 24px; text-align: left; }
    .field-label { font-size: 13px; font-weight: 800; margin: 14px 0 6px; }
    .field-label:first-child { margin-top: 0; }
    .field-label .opt { font-weight: 600; color: var(--text-dim); font-size: 12px; }
    /* ⚠️ font-size 16px 하한 — iOS 는 15px 이하 입력칸에 포커스가 가면 화면을 확대하고
       blur 해도 안 되돌린다(2026-08-02 진단). apply.html .inp 과 같은 규칙. */
    .inp {
      width: 100%; padding: 13px 14px; border: 1.5px solid var(--border-strong);
      border-radius: 10px; font-size: 16px; font-family: inherit; background: #fff; color: var(--text);
    }
    .inp.is-err { border-color: #C0392B; }
    .inp:focus { outline: none; border-color: var(--action); box-shadow: 0 0 0 3px var(--action-tint); }
    .save-btn {
      width: 100%; margin-top: 22px; padding: 15px; border: none; border-radius: 12px;
      background: var(--action); color: var(--action-ink); font-size: 16px; font-weight: 900;
      font-family: inherit; cursor: pointer; transition: background .2s, transform .1s;
    }
    .save-btn:hover { background: var(--action-hover); }
    .save-btn:active { transform: scale(.99); }
    .save-btn:disabled { opacity: .6; cursor: default; }
    .status { margin-top: 14px; font-size: 13px; color: var(--text-muted); min-height: 18px; }
    .status.err { color: var(--action-dark); }
    /* 휴대폰 본인인증(2026-08-26) — 인증 모드에서 이름·전화 입력 대신 보이는 단 */
    .idv-btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px; min-height: 48px;
      background: var(--action); color: var(--action-ink); font-size: 16px; font-weight: 900;
      font-family: inherit; cursor: pointer;
    }
    .idv-btn:hover { background: var(--action-hover); }
    .idv-btn:disabled { opacity: .6; cursor: default; }
    .idv-note { margin-top: 8px; font-size: 12px; color: var(--text-dim); line-height: 1.6; word-break: keep-all; }
    /* 확인된 값 표시 — 입력칸과 같은 자리·크기지만 누를 수 없음이 보이게 옅은 판(--bg2 는 흰 카드 안 전용) */
    .idv-val {
      padding: 13px 14px; border: 1.5px solid var(--border-soft); border-radius: 10px;
      font-size: 16px; background: var(--bg2); color: var(--text);
    }
    /* 중복 번호 선택 강제(2026-08-20) — login.html #dupChoice 와 같은 원칙:
       안내문+버튼이 아니라, 답하기 전엔 입력 폼이 안 보이는 구조("안 읽는다" — 오너) */
    #dupView .dup-t { font-size: 19px; font-weight: 900; margin-top: 18px; color: var(--ink); }
    #dupView .dup-sub { margin-top: 10px; font-size: 14px; color: var(--text-muted); line-height: 1.65; word-break: keep-all; }
    #dupView .dup-sub b { color: var(--text); }
    .dup-alt {
      width: 100%; margin-top: 10px; padding: 14px; border: 1.5px solid var(--border-strong);
      border-radius: 12px; background: #fff; color: var(--text); font-size: 15px; font-weight: 800;
      font-family: inherit; cursor: pointer; min-height: 44px;
    }
    .dup-alt:disabled { opacity: .6; cursor: default; }
    #dupView .dup-note { margin-top: 12px; font-size: 12px; color: var(--text-dim); line-height: 1.6; word-break: keep-all; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="images/MONC_Logo_Full_Package/assets/web/monc-logo-transparent-640.webp" alt="MONC" /></div>
    <h1>환영해요! 프로필을 완성해주세요</h1>
    <p class="sub">신청과 2주 성장 기록을 매끄럽게 연결하려면<br>몇 가지만 알려주세요.</p>

    <form id="onboardForm" onsubmit="return false;">
      <!-- 휴대폰 본인인증(2026-08-26 · KG이니시스 통합인증, 포트원 경유) — 채널 키·SDK·
           verify-identity 프로브가 전부 확인되면 JS 가 이 단을 켜고 직접 입력을 끈다.
           하나라도 빠지면 아래 직접 입력 폼이 그대로다(전화번호 필수·중복 차단 폴백). -->
      <div id="idvStage" hidden>
        <div class="field-label">이름·전화번호</div>
        <button type="button" class="idv-btn" id="idvBtn">휴대폰 본인인증</button>
        <p class="idv-note">인증창에서 확인된 실명과 번호가 그대로 저장돼요.</p>
      </div>
      <div id="idvDone" hidden>
        <div class="field-label">이름</div>
        <div class="idv-val" id="idvName"></div>
        <div class="field-label">전화번호</div>
        <div class="idv-val" id="idvPhone"></div>
        <p class="idv-note">휴대폰 본인인증으로 확인된 정보예요.</p>
      </div>
      <div id="manualFields">
        <div class="field-label">이름</div>
        <input type="text" id="obName" class="inp" placeholder="홍길동" autocomplete="name">
        <div class="field-label">전화번호</div>
        <input type="tel" id="obPhone" class="inp" placeholder="010-0000-0000" autocomplete="tel" inputmode="numeric">
      </div>
      <div class="field-label">전공 <span class="opt">(선택)</span></div>
      <input type="text" id="obMajor" class="inp" placeholder="예: 항공서비스학과, 영어영문학과">

      <button type="button" class="save-btn" id="saveBtn">저장하고 시작하기</button>
    </form>
    <!-- ⚠️ '나중에 할게요'(건너뛰기)는 2026-08-20 오너 확정으로 폐지 — 되살리지 말 것.
         전화번호는 구글·카카오 이중 가입을 잡는 유일한 공통 식별자라, 건너뛰기가 있으면
         중복 차단(save_my_profile)이 통째로 우회된다. 회원 페이지 쪽은 requireConsent 가
         번호 없는 계정을 이리로 보낸다(supabase-config.js 가입 완성 가드). -->

    <!-- 같은 번호의 다른 계정 발견 시 — 선택 강제(입력 폼을 감춘다). login.html #dupChoice 와 같은 원칙. -->
    <div id="dupView" hidden>
      <p class="dup-t">이미 가입된 번호예요</p>
      <p class="dup-sub" id="dupSub"></p>
      <button type="button" class="save-btn" id="dupGo">기존 계정으로 로그인하기</button>
      <button type="button" class="dup-alt" id="dupRetry">번호를 잘못 입력했어요</button>
      <p class="dup-note" id="dupNote" hidden>이 번호를 지금 계정으로 옮기려면 moveownnextcreate@gmail.com 으로 알려주세요.</p>
    </div>
    <div class="status" id="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <!-- 전화번호·이름 검증 공용(2026-08-02) — 규칙은 phone-check.js 한 곳에만 둔다. -->
  <script src="phone-check.js"></script>
  <!-- 인앱 판정·안내 공용(2026-08-27 합류) — 인스타·카톡 인앱 웹뷰는 본인인증 창의
       PASS·간편인증 앱 전환이 막혀 "화면이 안 넘어간다"(2026-08-27 신고). MONC_INAPP
       플래그로 인증 모드를 끄고 직접 입력 폼으로 폴백한다. 배너·탈출 인텐트도 이 파일. -->
  <script src="inapp.js?v=10" defer></script>
  <!-- 포트원 V2 SDK + 채널 키 공용 창구 — 본인인증(2026-08-26). 키는 pay-methods.js 한 곳. -->
  <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
  <script src="pay-methods.js?v=3"></script>
  <script>
    const statusEl = document.getElementById('status');
    const setStatus = (t, err) => { statusEl.textContent = t || ''; statusEl.classList.toggle('err', !!err); };
    const nameEl = document.getElementById('obName');
    const phoneEl = document.getElementById('obPhone');
    const majorEl = document.getElementById('obMajor');
    const saveBtn = document.getElementById('saveBtn');
    const formEl = document.getElementById('onboardForm');
    const titleEl = document.querySelector('h1');
    const subEl = document.querySelector('.sub');
    const dupView = document.getElementById('dupView');
    const dupSub = document.getElementById('dupSub');
    const dupGo = document.getElementById('dupGo');
    const dupRetry = document.getElementById('dupRetry');
    const dupNote = document.getElementById('dupNote');
    const idvStage = document.getElementById('idvStage');
    const idvDone = document.getElementById('idvDone');
    const idvBtn = document.getElementById('idvBtn');
    const idvNameEl = document.getElementById('idvName');
    const idvPhoneEl = document.getElementById('idvPhone');
    const manualFields = document.getElementById('manualFields');
    // 열린 리다이렉트 방지 — login.html safeReturnTo 와 같은 규칙('파일명.html' 만, 자기 자신 제외)
    const safeReturnTo = v => {
      v = String(v || '');
      return (/^[a-z0-9-]+\.html([?#][^\s]*)?$/i.test(v) && !/^(login|onboarding)\.html/i.test(v)) ? v : '';
    };
    const returnTo = () => safeReturnTo(new URLSearchParams(location.search).get('returnTo'));
    const nextPage = () => returnTo() || 'mypage.html';
    /* 인증 전용 모드(2026-08-26) — requireVerified 게이트·마이페이지 버튼이 ?verify=1 로 보낸다.
       가입 온보딩이 아니라 '기존 회원의 본인인증 한 번'이라 제목·버튼 문구만 바꾼다(흐름 동일). */
    const verifyOnly = new URLSearchParams(location.search).get('verify') === '1';
    if (verifyOnly) {
      titleEl.textContent = '휴대폰 본인인증';
      subEl.innerHTML = '안전한 이용을 위해<br>한 번만 본인인증이 필요해요.';
    }
    // 로그인으로 되보낼 때도 가려던 화면(returnTo)을 이어 준다
    const loginHref = () => {
      const rt = returnTo();
      return 'login.html' + (rt ? '?returnTo=' + encodeURIComponent(rt) : '');
    };

    /* 같은 번호의 다른 계정 발견 — 선택 강제 화면(입력 폼을 감춘다).
       fresh(방금 60분 내 만들어진 계정) = 방금 계정을 지우고 기존 계정으로 로그인하는 흐름.
       fresh 아님(예전에 번호 없이 가입해 쓰던 계정) = 삭제 없이 로그아웃만 — 몇 달치
       기록이 있을 수 있는 계정을 지우면 사고다. 판정은 서버(save_my_profile)가 준다. */
    let dupFresh = false;
    function providerName(p) { return p === 'google' ? '구글' : (p === 'kakao' ? '카카오' : ''); }
    function showDup(provider, fresh) {
      dupFresh = !!fresh;
      const pn = providerName(provider);
      /* 줄은 <br> 로 고정한다(.sub 와 같은 방식) — 폰트 폴백 환경에서 어중간한 자리에서 꺾이지 않게 */
      dupSub.innerHTML = (pn ? '이 번호는 <b>' + pn + ' 로그인</b>으로<br>가입된 계정이 있어요.'
                             : '이 번호로 가입된 계정이 있어요.')
        + (dupFresh ? '' : '<br>지금 로그인한 계정은 지워지지 않아요.');
      dupNote.hidden = dupFresh;
      titleEl.hidden = true; subEl.hidden = true; formEl.hidden = true;
      dupView.hidden = false;
    }
    function hideDup() {
      dupView.hidden = true;
      titleEl.hidden = false; subEl.hidden = false; formEl.hidden = false;
      phoneEl.classList.add('is-err'); phoneEl.focus();
    }

    (async () => {
      /* 인증창 복귀 쿼리는 세션 확인보다 먼저 보관한다(2026-08-26 "본인인증 뒤 로그인이 안 된다").
         PASS 앱을 다녀오는 사이 세션이 끊긴 채 돌아오면 requireSession 이 login 으로 보내는데,
         login 의 safeReturnTo 는 onboarding 을 제외해 쿼리의 인증 건이 통째로 유실됐다 —
         재로그인해도 "또 인증하라"가 반복된다. 보관해 두면 재로그인 뒤 이 페이지로 다시 왔을 때
         이어서 확정한다(같은 계정 재확정은 서버 RPC 가 멱등 통과, 다른 계정은 verification_used). */
      const IDV_BACK_KEY = 'monc_idv_back';
      const idvBackQuery = (() => {
        const q = new URLSearchParams(location.search).get('identityVerificationId') || '';
        return /^identity-verification-[0-9a-fA-F-]{36}$/.test(q) ? q : '';
      })();
      if (idvBackQuery) { try { sessionStorage.setItem(IDV_BACK_KEY, idvBackQuery); } catch (e) {} }
      /* 인앱 판정(MONC_INAPP)은 defer 인 inapp.js 가 넣는다 — defer 는 DOMContentLoaded
         전에 반드시 실행되므로, 여기서 DOM 준비를 기다리면 아래 판정 시점엔 플래그가
         확정돼 있다(스텁 실측 2026-08-27: 안 기다리면 인라인이 먼저 돌아 플래그를 놓친다). */
      if (document.readyState === 'loading') {
        await new Promise(r => document.addEventListener('DOMContentLoaded', r, { once: true }));
      }
      if (!window.MONC) { setStatus('로그인 모듈 로드 실패. 새로고침 해주세요.', true); return; }
      const session = await MONC.requireSession(); // 미로그인 시 login.html 로 보냄
      if (!session) return;
      // 약관 동의(가입 시 1회)가 없으면 로그인 페이지의 동의 게이트로 — 온보딩보다 동의가 먼저
      if (!(await MONC.requireConsent())) return;
      const me = session.user.id;

      const profile = await MONC.getMyProfile();
      if (profile) {
        if (profile.name)  nameEl.value  = profile.name;
        if (profile.phone) phoneEl.value = profile.phone;
      }
      // 전공은 공용 getMyProfile 셀렉트에 없어(컬럼 미생성 대비) 별도로 방어적 조회
      try {
        const { data } = await MONC.sb.from('members').select('major').eq('id', me).single();
        if (data && data.major) majorEl.value = data.major;
      } catch (e) {}

      /* ── 휴대폰 본인인증(2026-08-26 · KG이니시스 통합인증, 포트원 경유) ──────────
         켜는 조건 넷: ① pay-methods 의 identityChannel ② 포트원 SDK 로드
         ③ verify-identity 프로브(배포 확인) ④ 인앱 브라우저가 아닐 것(2026-08-27 —
         인스타·카톡 인앱 웹뷰는 인증창의 PASS·간편인증 앱 전환이 막혀 완주가 안 된다.
         함수 Logs 실측도 실패 기록 0 = 서버까지 도달 못 함). 하나라도 빠지면 아무것도
         바꾸지 않는다 — 직접 입력 폼(전화번호 필수·중복 차단)이 그대로 폴백이다.
         단 인증창 복귀 확정(backId)은 인앱이어도 그대로 처리한다(완주했으면 저장해야 한다).
         서버가 포트원 API 로 결과를 재조회해 저장하므로 브라우저는 인증 건 id 만 보낸다. */
      let idvMode = false, idvVerified = false, idvBusy = false;
      const idvChannel = (window.moncPay && window.moncPay.identityChannel) || '';
      function idvOn() {
        idvMode = true;
        manualFields.hidden = true; idvStage.hidden = false; idvDone.hidden = true;
        saveBtn.hidden = true;   // 인증 전엔 저장할 것이 없다 — 행동은 인증 버튼 하나
      }
      function idvOff(msg) {     // 폴백 — 직접 입력 폼으로 되돌린다
        idvMode = false; idvVerified = false;
        idvStage.hidden = true; idvDone.hidden = true; manualFields.hidden = false;
        saveBtn.hidden = false;
        if (msg) setStatus(msg, true);
      }
      function idvShowVerified(name, phone) {
        idvMode = true; idvVerified = true;
        idvStage.hidden = true; manualFields.hidden = true; idvDone.hidden = false;
        idvNameEl.textContent = name || '—';
        idvPhoneEl.textContent = phone || '—';
        saveBtn.textContent = verifyOnly ? '완료하고 돌아가기' : '저장하고 시작하기';
        saveBtn.hidden = false;
      }
      /* 인증 전용 모드인데 지금 인증을 못 띄운다(프로브 실패·SDK 미로드·not_ready) —
         게이트가 같은 세션에서 다시 막지 않게 통과 티켓을 끊고 가려던 화면으로 돌려보낸다.
         인프라가 살아나면 다음 세션부터 다시 막힌다(fail-open — 게이트로 사이트를 잠그지 않는다). */
      function idvPass() {
        try { sessionStorage.setItem('monc_idv_pass', '1'); } catch (e) {}
        location.replace(nextPage());
      }
      // 인증 결과를 서버로 확정한다 — 이름·번호는 서버가 포트원에서 받아 온다
      async function idvFinish(vid) {
        if (idvBusy) return; idvBusy = true;
        idvBtn.disabled = true; setStatus('인증 결과를 확인하는 중…');
        let r = null;
        try {
          const { data, error } = await MONC.sb.functions.invoke('verify-identity',
            { body: { identityVerificationId: vid } });
          if (error) throw error;
          r = data || {};
        } catch (e) {
          idvBusy = false; idvBtn.disabled = false;
          /* 실패 이유를 괄호에 같이 보여 준다(2026-08-26 실사고 — "인증 확인에 실패했어요"만
             떠서 학생 캡처로는 원인을 좁힐 수 없었다). supabase-js 는 non-2xx 면 본문을
             감추고 error.context(Response)에만 남긴다 — 상태·코드를 꺼내 붙인다. */
          let detail = '';
          try {
            if (e && e.context && typeof e.context.status === 'number') detail = 'HTTP ' + e.context.status;
            const b = (e && e.context && e.context.json) ? await e.context.json() : null;
            if (b && b.code) detail = (detail ? detail + ' · ' : '') + b.code;
          } catch (e2) {}
          if (!detail && e && e.message) detail = String(e.message).slice(0, 80);
          setStatus('인증 확인에 실패했어요. 잠시 후 다시 시도해 주세요.'
            + (detail ? ' (' + detail + ')' : ''), true);
          return;
        }
        idvBusy = false;
        // 서버가 답을 준 인증 건은 보관을 지운다(성공이든 실패 코드든 끝난 건 — 네트워크
        // 실패는 위 catch 가 보관을 남겨 다음 방문에 재확정한다)
        try { sessionStorage.removeItem(IDV_BACK_KEY); } catch (e) {}
        if (r.ok) { idvShowVerified(r.name, r.phone); setStatus('본인인증이 완료됐어요.'); return; }
        idvBtn.disabled = false;
        if (r.code === 'dup_phone') { setStatus(''); showDup(r.provider, r.me_fresh); return; }
        if (r.code === 'verification_used') { setStatus('이 인증은 이미 다른 계정에서 사용됐어요. 다시 시도해 주세요.', true); return; }
        if (r.code === 'not_verified') { setStatus('인증이 완료되지 않았어요. 다시 시도해 주세요.', true); return; }
        if (r.code === 'not_ready') {
          if (verifyOnly) { idvPass(); return; }   // 인증 전용 모드 — 직접 입력 폼은 의미가 없다
          idvOff('지금은 본인인증을 쓸 수 없어요. 번호를 직접 입력해 주세요.'); return;
        }
        /* 인증사가 휴대전화 번호를 안 준 경우(통합인증 창에서 카드·인증서 방식을 고르면
           번호가 빠질 수 있다) — 휴대폰 인증으로 다시 하라고 정확히 안내한다 */
        if (r.code === 'bad_phone') { setStatus('휴대전화 번호가 확인되지 않았어요. 인증창에서 휴대폰(통신사) 인증으로 진행해 주세요.', true); return; }
        // 남은 실패(error·member_not_found 등)는 코드·메시지를 그대로 보여 원인 추적을 돕는다
        setStatus('인증 확인에 실패했어요. 잠시 후 다시 시도해 주세요. ('
          + (r.code || '?') + (r.message ? ' · ' + String(r.message).slice(0, 120) : '') + ')', true);
      }
      /* 인증창으로 나갔다 뒤로 돌아온 문서(bfcache) — 얼어붙은 '여는 중…' 상태를 되살린다
         (apply 의 _payRestore 원칙 — idvBusy 가 IIFE 안이라 복원 훅을 밖에 내준다) */
      window._idvRestore = () => { idvBusy = false; };
      idvBtn.addEventListener('click', async () => {
        if (idvBusy) return;
        /* 인앱 레이스 방어 — inapp.js(defer)가 판정보다 늦게 실행돼 버튼이 켜졌더라도,
           클릭 시점엔 플래그가 항상 있다(login 구글 버튼과 같은 전제). 인증창은 못 여는
           환경이므로 여기서도 같은 폴백을 태운다. */
        if (window.MONC_INAPP) {
          if (verifyOnly) { idvPass(); return; }
          idvOff('이 앱 안에서는 본인인증 창이 열리지 않아요. 번호를 직접 입력해 주세요.');
          return;
        }
        const vid = 'identity-verification-' + (crypto.randomUUID ? crypto.randomUUID()
          : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
              const n = Math.random() * 16 | 0; return (c === 'x' ? n : (n & 3 | 8)).toString(16);
            }));
        idvBtn.disabled = true; setStatus('인증창을 여는 중…');
        // 모바일은 페이지 리다이렉트로 복귀한다 — 포트원이 identityVerificationId 쿼리를 붙여 준다.
        // ⚠️ verify=1(인증 전용 모드)도 복귀 주소에 실어야 한다 — 빠지면 복귀가 가입 온보딩
        //    모드로 돌아, not_ready 폴백이 기존 회원에게 직접 입력 폼을 보여 준다(게이트 루프).
        const rt = returnTo();
        const qs = [];
        if (verifyOnly) qs.push('verify=1');
        if (rt) qs.push('returnTo=' + encodeURIComponent(rt));
        const redirectUrl = location.origin + location.pathname + (qs.length ? '?' + qs.join('&') : '');
        let resp = null;
        try {
          resp = await PortOne.requestIdentityVerification({
            storeId: window.moncPay.storeId,
            channelKey: idvChannel,
            identityVerificationId: vid,
            redirectUrl: redirectUrl,
          });
        } catch (e) { resp = { code: 'SDK_ERROR', message: String(e && e.message || e) }; }
        if (!resp || resp.code != null) {
          // 취소·실패 — 조용히 버튼만 되살린다(취소는 흔한 일이라 빨간 줄을 띄우지 않는다)
          idvBtn.disabled = false; setStatus('');
          return;
        }
        idvFinish(resp.identityVerificationId || vid);
      });

      // 모바일 리다이렉트 복귀 — 포트원이 복귀 주소에 붙여 준 인증 건 쿼리를 서버로 확정.
      // 쿼리가 없으면 보관분(위 IDV_BACK_KEY — 복귀 때 세션이 끊겨 재로그인한 경우)을 잇는다.
      const backId = idvBackQuery || (() => {
        let s = '';
        try { s = sessionStorage.getItem(IDV_BACK_KEY) || ''; } catch (e) {}
        return /^identity-verification-[0-9a-fA-F-]{36}$/.test(s) ? s : '';
      })();
      if (backId) {
        // 복귀 주소의 인증 쿼리는 지운다 — 새로고침 때 같은 건을 다시 확인하지 않게
        try {
          const u = new URL(location.href);
          u.searchParams.delete('identityVerificationId');
          history.replaceState(null, '', u.pathname + (u.search || '') + (u.hash || ''));
        } catch (e) {}
        idvOn();
        idvFinish(backId);
      } else {
        // 이미 인증을 마친 회원(재방문) — 다시 시키지 않는다. 컬럼 미생성 환경 대비 방어 조회.
        let already = false;
        try {
          const { data } = await MONC.sb.from('members').select('verified_at').eq('id', me).single();
          already = !!(data && data.verified_at);
        } catch (e) {}
        if (already) {
          // 이미 인증된 회원이 게이트·버튼으로 오면 볼 일이 없다 — 가려던 화면으로
          if (verifyOnly) { location.replace(nextPage()); return; }
          idvShowVerified(profile && profile.name, profile && profile.phone);
        } else if (idvChannel && window.PortOne && !window.MONC_INAPP) {
          // 배포 프로브 — 함수가 아직 없으면 켜지 않는다(죽은 버튼 금지)
          try {
            const { data } = await MONC.sb.functions.invoke('verify-identity', { body: { probe: true } });
            if (data && data.ok) idvOn();
            else if (verifyOnly) { idvPass(); return; }
          } catch (e) { if (verifyOnly) { idvPass(); return; } /* 프로브 실패 = 폴백 유지 */ }
        } else if (verifyOnly) {
          idvPass(); return;   // 채널 키·SDK 가 없거나 인앱 — 인증 전용 모드는 여기 세울 수 없다
        }
      }

      saveBtn.addEventListener('click', async () => {
        /* 인증 모드 — 실명·번호는 서버가 인증으로 이미 저장했다. 남은 건 전공뿐.
           save_my_profile 은 verified 회원의 name·phone 입력을 무시한다(잠금). */
        if (idvMode) {
          if (!idvVerified) { setStatus('휴대폰 본인인증을 먼저 진행해 주세요.', true); return; }
          saveBtn.disabled = true; setStatus('저장 중…');
          const r0 = await MONC.saveMyProfile({ major: majorEl.value.trim() }) || {};
          if (r0.ok) { location.replace(nextPage()); return; }
          saveBtn.disabled = false;
          setStatus('저장 실패: ' + (r0.message || '잠시 후 다시 시도해 주세요.'), true);
          return;
        }
        const name = nameEl.value.trim(), phone = phoneEl.value.trim(), major = majorEl.value.trim();
        /* 규칙은 phone-check.js 한 곳 (2026-08-02 오너 "전화번호 양식이 다를 시 가입 또는
           신청 안 되게"). 여기가 '가입' 쪽 관문이다 — 챌린지·특강·오픈알림과 같은 규칙을 쓴다.
           ⚠️ 이 화면은 상태 줄(setStatus) 하나로 말하므로 인라인 오류 대신 그것을 쓴다. */
        const nc = window.MONC_PHONE ? MONC_PHONE.checkName(name) : { ok: !!name, message: '이름을 입력해주세요.' };
        if (!nc.ok) { setStatus(nc.message, true); nameEl.focus(); return; }
        const pc = window.MONC_PHONE ? MONC_PHONE.check(phone) : { ok: !!phone, message: '전화번호를 입력해주세요.' };
        if (!pc.ok) { setStatus(pc.message, true); phoneEl.classList.add('is-err'); phoneEl.focus(); return; }
        phoneEl.classList.remove('is-err');
        saveBtn.disabled = true; setStatus('저장 중…');

        /* 저장은 하이픈 표준형(010-1234-5678)으로 통일 — 서버 중복 대조(숫자 정규화)와
           표시·문자 발송이 한 형으로 맞는다. +82 붙여넣기도 여기서 국내형이 된다. */
        const canonical = (window.MONC_PHONE && pc.digits) ? MONC_PHONE.format(pc.digits) : phone;
        /* 중복 가입 차단(2026-08-20) — 저장은 서버 RPC 한 곳(supabase-config.js saveMyProfile).
           같은 번호의 다른 계정(구글↔카카오 이중 가입)이 있으면 서버가 막는다. */
        const r = await MONC.saveMyProfile({ name, phone: canonical, major }) || {};
        if (r.ok) { location.replace(nextPage()); return; }
        saveBtn.disabled = false;
        if (r.code === 'dup_phone') { setStatus(''); showDup(r.provider, r.me_fresh); return; }
        if (r.code === 'rate_limited') { setStatus('시도가 너무 많았어요. 24시간 뒤에 다시 시도해 주세요.', true); return; }
        if (r.code === 'bad_phone') { setStatus('휴대전화번호 형식이 맞지 않아요. 예) 010-1234-5678', true); phoneEl.classList.add('is-err'); phoneEl.focus(); return; }
        if (r.code === 'no_session') { location.replace(loginHref()); return; }
        setStatus('저장 실패: ' + (r.message || '잠시 후 다시 시도해 주세요.'), true);
      });

      /* '기존 계정으로 로그인하기' —
         방금 만든 계정(fresh): login.html #dupGoogle 흐름과 같은 정리 — deleteMyAccount()
           재사용(두 벌 금지). 결제·신청 기록은 member_id 가 set null 이라 남는다.
         쓰던 계정: 삭제 없이 세션만 끝낸다. */
      dupGo.addEventListener('click', async () => {
        const msg = dupFresh
          ? '방금 만들어진 이 계정을 정리(삭제)하고, 기존 계정으로 다시 로그인할까요?\n\n기존 계정의 기록은 그대로 남아 있어요.'
          : '로그아웃하고 기존 계정으로 다시 로그인할까요?\n\n지금 계정은 지워지지 않아요.';
        if (!window.confirm(msg)) return;
        dupGo.disabled = true; dupRetry.disabled = true;
        if (dupFresh) {
          setStatus('방금 만들어진 계정을 정리하는 중…');
          const dr = await MONC.deleteMyAccount();
          if (dr === 'failed') {
            setStatus('계정 정리에 실패했어요. 잠시 후 다시 시도해 주세요.', true);
            dupGo.disabled = false; dupRetry.disabled = false;
            return;
          }
        } else {
          setStatus('로그아웃하는 중…');
        }
        /* MONC.signOut() 금지 — 홈으로 가 버린다. 곧장 다시 로그인해야 하므로 세션만 끝낸다(login.html dupGoogle 과 동일). */
        await MONC.sb.auth.signOut();
        location.replace(loginHref());
      });

      dupRetry.addEventListener('click', hideDup);
    })();

    /* 뒤로가기 복원(bfcache) — '정리하는 중…'·'인증창을 여는 중…' 채로 얼어붙은 버튼을 되살린다.
       입력값(이름·번호)이 있는 화면이라 통째 reload 는 하지 않는다(버튼만 복원 — apply 와 같은 규칙). */
    window.addEventListener('pageshow', (e) => {
      if (!e.persisted) return;
      saveBtn.disabled = false; dupGo.disabled = false; dupRetry.disabled = false;
      idvBtn.disabled = false;
      if (window._idvRestore) window._idvRestore();
      setStatus('');
    });
  </script>
</body>
</html>
