  <style>
    /* ══════════════════════════════════════════════════════════════
       매일 기출 허브 — 항공사별 프로그램 목록 (2026-07-30)
       briefing.html 카드 문법을 따른다. 375px 우선.
       ══════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'SUIT Variable', SUIT,'Apple SD Gothic Neo',-apple-system,sans-serif;
           background: var(--bg); color: var(--text); line-height: 1.6;
           -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word;
           padding-bottom: 70px; }
    .container { max-width: 720px; margin: 0 auto; padding: 0 20px; }
    a { color: inherit; }

    .hero { padding: 104px 0 8px; text-align: center; }
    .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .24em; color: var(--accent-ink); }
    .title { font-family: var(--serif); font-size: clamp(28px, 5vw, 42px); font-weight: 700;
             color: var(--accent); letter-spacing: -.6px; margin-top: 10px; }
    .sub { font-size: 15px; color: var(--text); opacity: .74; margin-top: 12px;
           max-width: 34em; margin-left: auto; margin-right: auto; text-wrap: balance; }
    .sub b { color: var(--action); font-weight: 800; white-space: nowrap; }

    /* 3단 요약 — 이 상품이 무엇인지(대필이 아니라는 것) 먼저 말한다 */
    .how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 22px 0 6px; }
    .how div { background: var(--surface); border: 1px solid var(--border-soft);
               border-radius: var(--radius-sm); padding: 12px 10px; text-align: center; }
    .how b { display: block; font-size: 14px; font-weight: 800; color: var(--accent-ink); }
    .how span { display: block; margin-top: 4px; font-size: 12px; color: var(--text-muted); line-height: 1.5; }

    .list { display: flex; flex-direction: column; gap: 14px; padding: 18px 0 8px; }
    .p-card { display: block; background: var(--surface); border: 1px solid var(--border-soft);
              border-radius: var(--radius-md); padding: 20px; text-decoration: none;
              box-shadow: 0 2px 10px rgba(38,34,28,.06); }
    .p-air { font-size: 13px; font-weight: 800; letter-spacing: .1em; color: var(--accent-ink); }
    .p-title { font-family: var(--serif); font-size: 20px; font-weight: 700; margin-top: 6px; }
    .p-sub { font-size: 14px; color: var(--text-muted); margin-top: 6px; line-height: 1.6; }
    .p-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px;
              font-size: 14px; color: var(--text-muted); }
    .p-meta b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
    /* 진행 바 — 등록자에게만 */
    .p-prog { margin-top: 12px; }
    .p-bar { height: 6px; border-radius: 3px; background: var(--bg2); overflow: hidden; }
    .p-bar i { display: block; height: 100%; background: var(--action); border-radius: 3px; }
    .p-prog span { display: block; margin-top: 6px; font-size: 13px; color: var(--text-muted);
                   font-variant-numeric: tabular-nums; }
    .p-cta { margin-top: 14px; display: flex; align-items: center; justify-content: center;
             min-height: 48px; border-radius: 999px; font-size: 15px; font-weight: 800;
             background: var(--action); color: var(--action-ink); }
    .p-cta.ghost { background: var(--surface); color: var(--text);
                   border: 1.5px solid var(--border); }
    .p-cta.dim { background: var(--bg2); color: var(--text-dim); }

    .notice { margin-top: 16px; padding: 14px; border-radius: var(--radius-sm);
              background: var(--bg2); border: 1px solid var(--border-soft);
              font-size: 14px; color: var(--text-muted); line-height: 1.7; }
    .notice b { color: var(--text); }
    .notice a { color: var(--accent-ink); font-weight: 800; }

    /* 데모 배너 — 체험 모드임을 항상 보이게(진짜 데이터로 오해 금지) */
    .demo-bar { position: sticky; top: 66px; z-index: 50; margin-top: 10px;
                display: flex; align-items: center; gap: 10px; padding: 10px 14px;
                background: var(--accent); color: #fff; border-radius: var(--radius-sm);
                font-size: 13px; font-weight: 700; }
    .demo-bar button { margin-left: auto; min-height: 32px; padding: 0 12px; border: 1px solid rgba(255,255,255,.5);
                       background: transparent; color: #fff; border-radius: 999px; font: inherit;
                       font-size: 12px; font-weight: 800; cursor: pointer; }
    @media (max-width: 768px) { .demo-bar { top: 57px; } }

    .foot-links { margin: 26px 0 10px; display: flex; flex-direction: column; gap: 8px; }
    .foot-links a { display: flex; align-items: center; min-height: 44px; padding: 0 16px;
                    background: var(--surface); border: 1px solid var(--border-soft);
                    border-radius: var(--radius-sm); font-size: 14px; font-weight: 700;
                    text-decoration: none; }
    .foot-links a span { margin-left: auto; opacity: .5; }
    .demo-entry { margin: 8px 0 0; text-align: center; font-size: 13px; color: var(--text-dim); }
    .demo-entry a { color: var(--accent-ink); font-weight: 800; }
    .loading { padding: 30px 0; text-align: center; color: var(--text-dim); font-size: 14px; }

<body>
  <header class="hero">
    <div class="container">
      <div class="eyebrow">MONC DAILY</div>
      <h1 class="title">필수 기출 하루 한 개</h1>
      <p class="sub">하루 한 개씩, <b>내 경험으로</b> 완성하는 항공사 면접답변 프로그램.<br>
        AI가 대신 써 주지 않아요 — 내 이야기를 찾고, 내가 쓰고, 근거 있게 다듬어요.</p>
    </div>
  </header>

  <main class="container">
    <div id="demoBar"></div>

    <div class="how" aria-label="진행 방식">
      <div><b>1. 내 경험 찾기</b><span>경험 창고에서 고르고<br>부족한 사실은 질문으로</span></div>
      <div><b>2. 직접 쓰기</b><span>오늘의 기출에<br>내 초안을 먼저 써요</span></div>
      <div><b>3. 근거 있게 다듬기</b><span>내가 준 사실만으로<br>AI·연구원이 다듬어요</span></div>
    </div>

    <div id="list" class="list"><div class="loading">불러오는 중…</div></div>
    <div id="notice"></div>

    <div class="foot-links">
      <a href="experiences.html">내 경험 창고 열기 <span>→</span></a>
      <a href="briefing.html">승준노트로 돌아가기 <span>→</span></a>
    </div>
    <p class="demo-entry" id="demoEntry"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="program-common.js"></script>
  <script>
  (function () {
    'use strict';
    var esc = AP.esc;
    var $ = function (id) { return document.getElementById(id); };

    function demoBanner() {
      if (!AP.demoOn()) { $('demoBar').innerHTML = ''; return; }
      $('demoBar').innerHTML =
        '<div class="demo-bar">체험 모드 — 예시 데이터로 흐름만 보여드려요.' +
        '<button id="demoOff" type="button">체험 종료</button></div>';
      $('demoOff').addEventListener('click', function () {
        AP.demoReset();
        try { localStorage.removeItem('ap_demo_v1'); } catch (e) {}
        location.href = 'programs.html';
      });
    }

    function cardHtml(item, user) {
      var p = item.program, e = item.enrollment;
      var air = AP.AIRLINES[p.airline] || p.airline || '전 항공사 공통';
      // 체험판 없음(2026-07-30 오너) — 가격 양수만 판매, null 은 오픈 준비 중.
      var priceLine = p.price > 0 ? Number(p.price).toLocaleString() + '원' : '오픈 준비 중';
      var cta, prog = '';
      if (e && e.status === 'active') {
        var max = AP.unlockedMax(p.reveal_policy, p.total_days, e.started_at);
        var pct = Math.round(max / p.total_days * 100);
        prog = '<div class="p-prog"><div class="p-bar"><i style="width:' + pct + '%"></i></div>' +
               '<span>오늘 <b>' + max + '일차</b> / 전체 ' + p.total_days + '일</span></div>';
        cta = '<span class="p-cta">오늘 문제 풀러 가기</span>';
      } else if (!user) {
        cta = '<span class="p-cta ghost">로그인하고 시작하기</span>';
      } else if (p.price > 0) {
        cta = '<span class="p-cta">자세히 보고 시작하기</span>';
      } else {
        cta = '<span class="p-cta dim">오픈 준비 중</span>';
      }
      return '<a class="p-card" data-id="' + esc(p.id) + '" data-enrolled="' + (e ? '1' : '') +
        '" data-price="' + (p.price == null ? '' : p.price) + '" href="program.html?p=' + encodeURIComponent(p.id) + '">' +
        '<div class="p-air">' + esc(air) + '</div>' +
        '<div class="p-title">' + esc(p.title) + '</div>' +
        (p.subtitle ? '<div class="p-sub">' + esc(p.subtitle) + '</div>' : '') +
        '<div class="p-meta"><span>총 <b>' + p.total_days + '일</b> · 하루 한 문제</span>' +
        '<span>' + esc(priceLine) + '</span></div>' +
        prog + cta + '</a>';
    }

    (async function init() {
      demoBanner();
      var st = await AP.init();
      var listEl = $('list');
      AP.logEvent('ap_hub_view');

      var items = await AP.store.listPrograms();
      // ⚠️ 공개 화면에 '체험 모드' 진입을 노출하지 않는다(체험판 없이 유료 — 오너).
      //    ?demo=1 은 내부 QA 전용 경로로만 남는다.
      if (items && items.notReady) {
        listEl.innerHTML = '';
        $('notice').innerHTML = '<div class="notice"><b>준비 중이에요.</b> 곧 열려요.</div>';
        return;
      }
      if (!items.length) {
        listEl.innerHTML = '';
        $('notice').innerHTML = '<div class="notice">아직 공개된 프로그램이 없어요. 곧 열려요.</div>';
        return;
      }
      listEl.innerHTML = items.map(function (it) { return cardHtml(it, st.user); }).join('');

      // 카드 클릭 — 미로그인만 로그인으로. 구매·안내는 program.html 이 담당한다.
      listEl.querySelectorAll('.p-card').forEach(function (card) {
        card.addEventListener('click', function (ev) {
          if (card.dataset.enrolled === '1') return;
          if (!st.user && !AP.demoOn()) { ev.preventDefault(); location.href = 'login.html'; }
        });
      });
    })();
  })();
  </script>
</body>
