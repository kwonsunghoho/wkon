  <!-- Microsoft Clarity — 방문자 행동 분석(세션 녹화·히트맵·이탈 지점). 프로젝트 xlu6nkv2uh -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};

        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);

  </script>

  <!-- 파비콘 -->
  <link rel="icon" href="images/MONC_Logo_Full_Package/assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="images/MONC_Logo_Full_Package/assets/favicon/favicon-16x16.png">

  <link rel="apple-touch-icon" sizes="180x180" href="images/MONC_Logo_Full_Package/assets/favicon/apple-touch-icon.png">
  <link rel="mask-icon" href="images/MONC_Logo_Full_Package/assets/favicon/safari-pinned-tab.svg" color="#102B56">
  <link rel="manifest" href="images/MONC_Logo_Full_Package/assets/favicon/site.webmanifest">
  <meta name="theme-color" content="#102B56">
  <link rel="stylesheet" href="tokens.css">
  <!-- 공용 상단 메뉴(2026-07-30) — 마크업은 nav.js 가 심는다. 여기에 nav 를 복사해 넣지 말 것. -->
  <link rel="stylesheet" href="nav.css">
  <script src="nav.js" defer></script>
  <!-- 인앱 브라우저(인스타·카톡) 탈출 안내 — 파일 받기·로그인이 막히는 자리 -->
  <script src="inapp.js?v=7" defer></script>
  <!-- 뒤로 왔을 때 보던 자리로 되돌리기 — 위 bfcache 새로고침이 스크롤을 버리는 걸 메운다 -->
  <script src="scroll-keep.js?v=3"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'SUIT Variable', SUIT,'Apple SD Gothic Neo',-apple-system,sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    .container { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
    a { color: inherit; }

    /* ⚠️ 보조 텍스트는 opacity 로 흐리지 말 것 — opacity:.6 은 베이지 위에서 3.89:1 로
       9대원칙 4번(4.5:1)에 미달한다. 확정 색(#5D5851 = 5.55:1)을 직접 쓴다. */
    :root { --rv-dim: #5D5851; }

    /* HERO */
    .rv-hero { padding: 92px 0 6px; text-align: center; }
    .rv-eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .24em; color: var(--accent-ink); }
    .rv-title { font-family: var(--serif); font-size: clamp(28px, 5vw, 42px); font-weight: 700; color: var(--accent); letter-spacing: -.6px; margin-top: 10px; }
    .rv-lede { font-size: 15px; color: var(--rv-dim); margin-top: 10px; word-break: keep-all; }

    /* 전체 합계 한 줄 — 종류별로 흩어지기 전에 '얼마나 쌓였나'를 먼저 답한다 */
    .rv-total { margin: 22px auto 0; max-width: 1120px; padding: 0 20px; }
    .rv-total-box { display: flex; align-items: baseline; justify-content: center; gap: 9px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 15px 20px; }
    .rv-total-n { font-family: var(--serif); font-size: 30px; font-weight: 700; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; }
    .rv-total-l { font-size: 15px; color: var(--rv-dim); }

    /* ── 종류 카드 ──────────────────────────────────────────────
       ⚠️ 데이터가 0건인 종류는 카드를 아예 그리지 않는다(hub 렌더러의 filter).
          '준비 중' 빈 칸을 두지 않는 건 오너 확정 방침이다 — 스피닝 비포&애프터의
          빈 인용 자리표시자를 삭제한 것과 같은 기준("올릴 내용 없으면 칸 자체를 삭제"). */
    .rv-hub { display: grid; gap: 16px; padding: 26px 0 8px; }
    @media (min-width: 900px) { .rv-hub { grid-template-columns: repeat(3, 1fr); align-items: start; } }

    .rv-sec {
      display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm); overflow: hidden;
      box-shadow: 0 2px 10px rgba(38,34,28,.06);
      transition: box-shadow .2s, transform .2s;
    }
    .rv-sec:hover { box-shadow: 0 10px 30px rgba(38,34,28,.14); transform: translateY(-2px); }
    .rv-sec-head { padding: 20px 18px 14px; border-bottom: 1px solid var(--border-soft); }
    .rv-sec-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .rv-sec-title { font-family: var(--serif); font-size: 21px; font-weight: 700; color: var(--accent); letter-spacing: -.3px; }
    .rv-sec-n { flex-shrink: 0; font-size: 13px; font-weight: 800; color: var(--accent-ink); background: var(--action-tint); border-radius: 999px; padding: 4px 11px; font-variant-numeric: tabular-nums; }
    .rv-sec-desc { font-size: 14px; color: var(--rv-dim); margin-top: 7px; word-break: keep-all; }

    /* 미리보기 — 종류마다 최신 몇 개. 허브가 빈 이정표로 보이지 않게 하는 층이다 */
    .rv-prev { display: flex; flex-direction: column; gap: 12px; padding: 16px 18px 4px; flex: 1; }
    .rv-prev-item { display: flex; flex-direction: column; gap: 5px; }
    .rv-prev-item + .rv-prev-item { border-top: 1px solid var(--border-soft); padding-top: 12px; }
    .rv-prev-q {
      font-family: var(--serif); font-size: 15px; font-weight: 700; line-height: 1.5;
      color: var(--text); letter-spacing: -.1px; word-break: keep-all; margin: 0;
      /* 미리보기라 두 줄에서 끊는다 — 길면 카드 세 장의 키가 제각각이 된다 */
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .rv-prev-meta { font-size: 12px; font-weight: 700; color: var(--rv-dim); }
    /* 한줄평이 없는 후기(마이그레이션 전 환경)는 스크린샷 조각으로 대신한다 */
    .rv-prev-shot { width: 100%; height: 92px; object-fit: cover; object-position: top; border-radius: var(--radius-xs); background: var(--surface2); display: block; }

    .rv-sec-go {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin: 14px 14px 14px; min-height: 46px; padding: 11px 16px;
      border-radius: 999px; background: var(--action-tint); color: var(--accent-ink);
      font-size: 14.5px; font-weight: 800; text-decoration: none;
    }
    .rv-sec-go:hover { background: var(--action); color: var(--action-ink); }
    .rv-sec-go svg { width: 15px; height: 15px; flex-shrink: 0; }

    .rv-skeleton { border-radius: var(--radius-sm); background: var(--surface2); height: 260px; }
    .rv-empty { text-align: center; padding: 60px 20px; color: var(--rv-dim); font-size: 15px; }

    /* CTA 하단 */
    .rv-foot-cta { text-align: center; padding: 26px 0 72px; }
    .rv-foot-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 15px 34px; border-radius: 999px; background: var(--action); color: var(--action-ink); font-size: 16px; font-weight: 800; text-decoration: none; box-shadow: 0 10px 28px rgba(27,58,107,.28); transition: transform .2s; }
    .rv-foot-btn:hover { transform: translateY(-2px); }

    @media (max-width: 560px) {
      .rv-hero { padding: 86px 0 4px; }
      .rv-total-n { font-size: 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rv-sec, .rv-foot-btn { transition: none; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

  <header class="rv-hero">
    <div class="container">
      <div class="rv-eyebrow">REAL REVIEWS</div>
      <h1 class="rv-title">실제 후기</h1>
      <p class="rv-lede">챌린지를 끝낸 사람, 상담을 받은 사람, 합격한 사람이 직접 남긴 기록입니다.</p>
    </div>
  </header>

  <div class="rv-total" id="rvTotal" hidden>
    <div class="rv-total-box">
      <span class="rv-total-n" id="rvTotalN">—</span>
      <span class="rv-total-l" id="rvTotalL">개의 기록</span>
    </div>
  </div>

  <main class="container">
    <div class="rv-hub" id="rvHub">
      <div class="rv-skeleton"></div>
      <div class="rv-skeleton"></div>
      <div class="rv-skeleton"></div>
    </div>
    <div class="rv-empty" id="rvEmpty" hidden>아직 올라온 후기가 없어요.</div>

    <div class="rv-foot-cta">
      <a class="rv-foot-btn" href="apply.html">나도 도전하기 →</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
  (function () {
    const hub = document.getElementById('rvHub');
    const emptyEl = document.getElementById('rvEmpty');
    const totalEl = document.getElementById('rvTotal');
    const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const PREVIEW_N = 3;                 // 종류당 미리보기 개수
    const ARROW = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function imgUrl(path) { return MONC.sb.storage.from('reviews').getPublicUrl(path).data.publicUrl; }
    function ym(d) { const m = String(d || '').match(/^(\d{4})-(\d{2})/); return m ? `${m[1]}.${m[2]}` : ''; }

    /* reviews(챌린지·상담)를 한 번에 읽고 kind 로 가른다.
       ⚠️ select('*') — .eq('kind', …) 로 서버에서 거르면 kind 컬럼 마이그레이션
          (20260801180000) 미적용 환경에서 400 이 난다. 미적용이면 전부 challenge 로 떨어진다. */
    async function loadReviews() {
      if (!window.MONC || !window.MONC.sb) return null;
      const { data, error } = await MONC.sb.from('reviews').select('*').eq('visible', true);
      if (error) { console.warn('후기 로드 실패:', error); return null; }
      return (data || []).map(r => ({
        kind: r.kind || 'challenge',
        url: r.image_path ? imgUrl(r.image_path) : '',
        challenge: r.challenge || null,
        cohort: (r.cohort != null && r.cohort !== 0) ? Number(r.cohort) : null,
        name: r.reviewer_name || '',
        date: r.review_date || r.created_at || '',
        quote: (r.quote || '').trim(),
      })).filter(i => i.url || i.quote);
    }

    /* 합격 수기 — 표가 아직 없으면(PGRST205) 조용히 빈 목록.
       ⚠️ 42P01 이 아니라 PGRST205 가 '표 없음' 판정이다(PostgREST 스키마 캐시). */
    async function loadStories() {
      if (!window.MONC || !window.MONC.sb) return [];
      const { data, error } = await MONC.sb.from('success_stories').select('*').eq('visible', true);
      if (error) {
        if (error.code !== 'PGRST205') console.warn('합격 수기 로드 실패:', error);
        return [];
      }
      return (data || []).sort((a, b) =>
        (b.sort_order || 0) - (a.sort_order || 0) ||
        String(b.published_at || b.created_at || '').localeCompare(String(a.published_at || a.created_at || ''))
      );
    }

    /* 미리보기 고르기 — 한줄평이 있는 것을 먼저 쓴다. 훑을 수 있는 글이 앞면에 와야
       허브가 '이정표'가 아니라 '내용'으로 읽힌다. 없으면 스크린샷 조각으로 대신한다. */
    function pickPreview(list, n) {
      const withQuote = list.filter(i => i.quote);
      const rest = list.filter(i => !i.quote);
      return withQuote.concat(rest).slice(0, n);
    }

    /* 발신자 줄 — 챌린지와 기수는 한 덩어리로 붙인다('보신각 1기').
       ' · '로 갈라 놓으면 '1기'가 홀로 떠서 무엇의 기수인지 안 읽힌다(2026-08-02 오너 지적).
       이름이 없는 건은 '참여자'를 붙여 숫자만 남지 않게 한다. */
    function whoLine(i) {
      const co = i.cohort != null ? [i.challenge, i.cohort + '기'].filter(Boolean).join(' ') : (i.challenge || '');
      if (i.name && co) return i.name + ' · ' + co;
      if (co) return i.cohort != null ? co + ' 참여자' : co;
      return i.name || '';
    }

    function prevItemHtml(i, showName) {
      const meta = showName ? whoLine(i) : ym(i.date);
      const metaEl = meta ? `<span class="rv-prev-meta">${esc(meta)}</span>` : '';
      const bodyEl = i.quote
        ? `<p class="rv-prev-q">${esc(i.quote)}</p>`
        : `<img class="rv-prev-shot" src="${esc(i.url)}" alt="" loading="lazy">`;
      return `<div class="rv-prev-item">${bodyEl}${metaEl}</div>`;
    }

    function storyItemHtml(s) {
      // 항공사 이름만 두면 '합격'인지 '재직'인지 안 읽힌다 — stories.html 칩과 같은 규칙.
      const meta = [s.author_name || '', s.airline ? s.airline + ' 합격' : ''].filter(Boolean).join(' · ');
      return `<div class="rv-prev-item">
        <p class="rv-prev-q">${esc(s.title)}</p>
        ${meta ? `<span class="rv-prev-meta">${esc(meta)}</span>` : ''}
      </div>`;
    }

    function secHtml(sec) {
      return `<section class="rv-sec">
        <div class="rv-sec-head">
          <div class="rv-sec-top">
            <h2 class="rv-sec-title">${esc(sec.title)}</h2>
            <span class="rv-sec-n">${sec.count}개</span>
          </div>
          <p class="rv-sec-desc">${esc(sec.desc)}</p>
        </div>
        <div class="rv-prev">${sec.preview}</div>
        <a class="rv-sec-go" href="${sec.href}">${esc(sec.go)}${ARROW}</a>
      </section>`;
    }

    async function init() {
      const [reviews, stories] = await Promise.all([loadReviews(), loadStories()]);
      if (reviews === null) {
        hub.innerHTML = ''; emptyEl.hidden = false; emptyEl.textContent = '후기를 불러오지 못했어요.';
        return;
      }
      const challenge = reviews.filter(i => i.kind === 'challenge')
        .sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const consult = reviews.filter(i => i.kind === 'consult')
        .sort((a, b) => String(b.date).localeCompare(String(a.date)));

      const secs = [];
      if (challenge.length) secs.push({
        title: '챌린지 후기', count: challenge.length,
        desc: '2주 챌린지를 끝낸 참여자들이 직접 남긴 후기입니다.',
        preview: pickPreview(challenge, PREVIEW_N).map(i => prevItemHtml(i, true)).join(''),
        href: 'reviews-list.html?kind=challenge', go: '챌린지 후기 전체 보기',
      });
      if (consult.length) secs.push({
        title: '상담 후기', count: consult.length,
        desc: '1:1 상담을 받은 분들이 남긴 후기입니다.',
        preview: pickPreview(consult, PREVIEW_N).map(i => prevItemHtml(i, false)).join(''),
        href: 'reviews-list.html?kind=consult', go: '상담 후기 전체 보기',
      });
      if (stories.length) secs.push({
        title: '합격 수기', count: stories.length,
        desc: '합격까지의 과정을 처음부터 끝까지 쓴 긴 글입니다.',
        preview: stories.slice(0, PREVIEW_N).map(storyItemHtml).join(''),
        href: 'stories.html', go: '합격 수기 전체 보기',
      });

      // 한 종류도 없으면 카드를 그리지 않는다 — 빈 카드 세 장보다 문장 하나가 정직하다
      if (!secs.length) { hub.innerHTML = ''; emptyEl.hidden = false; return; }

      hub.innerHTML = secs.map(secHtml).join('');
      const total = challenge.length + consult.length + stories.length;
      totalEl.hidden = false;
      document.getElementById('rvTotalN').textContent = total;
      document.getElementById('rvTotalL').textContent =
        '개의 기록' + (secs.length > 1 ? ` · ${secs.length}가지` : '');
    }

    init();
  })();
  </script>

<script>
/* bfcache — 뒤로/앞으로 오면 크롬은 떠날 때 그리던 화면을 그대로 되살린다(파일을 새로 받지 않는다).
   배포 전에 열어 둔 탭·기록이 있으면 옛 화면이 그대로 뜬다(2026-08-03 오너 지적).
   입력값이 없는 화면이라 통째로 다시 받는다 — lab·answers·mypage 와 같은 규칙(CLAUDE.md).
   ⚠️ 홈(index.html)은 일부러 뺀다 — 뒤로 올 때마다 히어로 애니메이션이 처음부터 다시 돌아 오너가 기각했다. */
window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
</script>
</body>
</html>
