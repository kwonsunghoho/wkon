  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'SUIT Variable', SUIT,'Apple SD Gothic Neo',-apple-system,sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; }
    .container { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    a { color: inherit; }

    /* ══════════════════════════════════════════════════════════════════════
       승준 도구 허브(2026-08-06 신설) — 승준 코스(briefing.html)에서 분리.
       2026-08-27 오너 확정 3안으로 틴트 박스 격자 → 종이 카드 리스트 개편
       ("너무 밋밋해서 다른 허브들이랑 같은 결로" — 비교 목업
        outputs/tools-hub-flavor-mockup.html 5안 중 3안 채택).
       결은 연구실 허브(lab.html)의 카드 문법: 종이 그라데이션(#FCFDFF→#EBF1F8) +
       네이비 원판 화살표. 아이콘 확정값(가는 선 + 두 사물 겹침)은 그대로 쓴다
       (결정 이력: docs/notes/briefing.md — 기각 목록 포함).
       ⚠️ 카드에 회원별 상태 문구·금액·근거 없는 표시('인기'·'NEW') 금지 — 허브 공통 규칙.
          역할 한 줄(small)은 도구가 하는 일의 정적 사실만 적는다.
       ══════════════════════════════════════════════════════════════════════ */
    .bf-head { padding: 104px 0 4px; text-align: center; }
    .bf-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .24em; color: var(--accent-ink); }
    .bf-title { font-size: clamp(28px, 5vw, 42px); font-weight: 800; color: var(--accent); letter-spacing: -.6px; margin-top: 10px; }
    .bf-sub { font-size: 15px; color: var(--text); opacity: .72; margin-top: 12px; max-width: 34em; margin-left: auto; margin-right: auto; text-wrap: balance; }
    .bf-sub b { color: var(--action); font-weight: 800; white-space: nowrap; }

    /* 데스크톱 열 폭 — briefing.html 과 같은 값(카드 리스트가 이 폭을 그대로 채운다) */
    main.container > section { max-width: 600px; margin-left: auto; margin-right: auto; }

    .sec-t { margin: 30px 0 0; text-align: center; }
    .sec-t b { font-size: 19px; font-weight: 800; }
    .sec-t span { display: block; font-size: var(--fs-body-sm, 15px); color: var(--text-muted); margin-top: 5px; }

    /* ── 도구 리스트 — 종이 카드 줄 + 화살표 원판(2026-08-27 오너 확정 3안) ──
       구 틴트 박스 격자(.fr-grid, 2026-08-06 확정)를 대체한다.
       ⚠️ **아이콘을 키울 때 선 굵기를 같이 키우지 말 것.** 이 결이 사는 이유는 큰 게 아니라
          '크면서 선이 얇은' 것이다. 화면 선두께 = stroke-width × (렌더크기 ÷ 24) 이므로
          32px 에서 1.6px 이 되게 1.2 를 쓴다. 크기를 바꾸면 이 값도 다시 계산한다.
       ⚠️ **굵기는 심볼이 아니라 여기(바깥 svg)에서 준다** — 심볼에 stroke-width 를 적어 두면
          use 그림자 트리에서 그 값이 이겨 CSS 조절이 안 먹는다(실측 확인).
       ⚠️ 아이콘 판은 **흰색이 아니라 틴트**다 — 종이 카드 위에서도 흰 판은 묻힌다. */
    .tl-list { display: flex; flex-direction: column; gap: 12px; margin: 24px auto 0; }
    .tl-card { display: flex; align-items: center; gap: 14px; border-radius: 22px; padding: 16px;
      background: linear-gradient(180deg, #FCFDFF, #EBF1F8); border: 1px solid var(--border);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), var(--shadow);
      text-decoration: none; color: var(--text);
      transition: transform .18s ease, box-shadow .18s ease; }
    @media (hover: hover) { .tl-card:hover { transform: translateY(-2px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), var(--shadow-lg); } }
    @media (prefers-reduced-motion: reduce) { .tl-card { transition: none; } }
    .tl-card:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .tl-ic { flex: 0 0 auto; width: 58px; height: 58px; border-radius: 18px;
      background: var(--accent-tint); border: 1px solid rgba(27,58,107,.14);
      display: flex; align-items: center; justify-content: center; color: var(--accent-ink); }
    .tl-ic svg { stroke-width: 1.2; }
    .tl-tx { flex: 1 1 auto; min-width: 0; }
    .tl-tx b { display: flex; align-items: center; gap: 7px; font-size: 17px; font-weight: 800;
      color: var(--ink); letter-spacing: -.2px; line-height: 1.35; }
    /* 킬러·첨삭 짝 표시 — 이름 옆 말 꼬리표('검사'/'고치기'). 격자 시절 .fr-tag 의 후신.
       ⚠️ 번호 배지(1·2)로 되돌리지 말 것 — "해야 할 개수처럼 보인다"로 오너 기각. */
    .tl-tx b i { font-style: normal; font-size: 12px; font-weight: 800; color: #fff;
      background: var(--accent); border-radius: 6px; padding: 1px 7px; flex: none; }
    .tl-tx small { display: block; font-size: 13px; font-weight: 400; color: var(--text-muted);
      margin-top: 2px; line-height: 1.45; }
    .tl-pill { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
      background: var(--action); color: var(--action-ink);
      display: flex; align-items: center; justify-content: center; }
    .tl-pill svg { width: 18px; height: 18px; stroke-width: 2.4; }

    /* ── 승준 코스 안내 줄 — 뭐부터 할지 모르는 사람을 코스로 보낸다(분리하며 신설).
       회원별 상태·금액 없는 정적 안내라 허브 카드 금지 규칙과 무관하다. ── */
    .to-course { display: flex; align-items: center; gap: 8px; margin: 24px auto 0; padding: 12px 16px;
      max-width: 420px; background: var(--accent-tint); border-radius: 12px;
      text-decoration: none; color: var(--text); }
    .to-course:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .to-course > span { flex: 1 1 auto; min-width: 0; }
    .to-course em { display: block; font-style: normal; font-size: 12px; font-weight: 800;
      letter-spacing: .06em; color: var(--accent-ink); }
    .to-course b { display: block; font-size: 14px; font-weight: 700; margin-top: 4px; line-height: 1.4; }
    .to-course > u { flex: 0 0 auto; text-decoration: none; color: var(--accent-ink); font-weight: 800; font-size: 14px; }

    .bf-foot { max-width: 600px; margin: 0 auto; padding: 0 0 80px; }

    /* 320px 실측 대응 — 활자는 12px 하한이라 못 줄이므로 여백만 좁힌다 */
    @media (max-width: 360px) {
      .container { padding: 0 12px; }
      .tl-list { gap: 10px; }
      .tl-card { padding: 14px; gap: 12px; }
    }
  </style>
</head>
