  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'SUIT Variable', SUIT,'Apple SD Gothic Neo',-apple-system,sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; }
    .container { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    a { color: inherit; }

    /* ══════════════════════════════════════════════════════════════════════
       승준노트 허브 — 코스형(2026-08-05 전면 개편)
       설계: docs/superpowers/specs/2026-08-05-briefing-course-hub-design.md
       기록: docs/notes/briefing.md

       구 화면(매거진 목차 6줄 `.ix-item` + 루트맵 룰렛 `.d-route`, 2026-07-31)은
       폐기했다. 2026-08-06 오너 지시로 2×2 카드를 **세로 리스트(B안)**로 바꿨다:
       칩(초급~실전 큰 글자) + 상황(메인) + 안내(서브), 펼친 줄 아래에 아코디언 패널.
         · 화면 A(코스 선택 전) = 히어로 → 코스 줄 4개(+펼친 줄 아래 패널) → 자유 선택 서클
         · 화면 B(선택 후)      = 개인화 헤더 → '오늘 이어서' → (서클·맛보기는 A와 동일)
       ⚠️ 코스 상세는 **패널 하나를 재사용**한다 — 펼친 줄 바로 아래로 옮겨 다닌다
          (4개 세로 나열 금지 — 모바일 길이).
       ⚠️ 카드·서클에 **회원별 상태 문구('첫 1회 무료' 등)·근거 없는 표시('인기'·'NEW')를
          달지 말 것**(2026-07-25·07-31 오너 기각). 무료 안내는 각 도구 페이지가 잔액을 읽어 말한다.
       ⚠️ 스텝은 **상시 도구만**(2026-08-06 오너 확정 — 코스가 모집 대기에 막히면 안 된다).
          챌린지는 스텝이 아니라 패널 하단 **추천 칸 하나**(.cs-reco)로만 — 모집 여부를
          단정하지 않고 challenges.html 로 보낸다(판단은 그 페이지가 한다).
       ══════════════════════════════════════════════════════════════════════ */

    /* ── 머리 영역(A·B 공통 여백) ── */
    .bf-head { padding: 104px 0 4px; text-align: center; }
    .bf-eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .24em; color: var(--accent-ink); }
    .bf-title { font-size: clamp(28px, 5vw, 42px); font-weight: 800; color: var(--accent); letter-spacing: -.6px; margin-top: 10px; }
    .bf-sub { font-size: 15px; color: var(--text); opacity: .72; margin-top: 12px; max-width: 34em; margin-left: auto; margin-right: auto; text-wrap: balance; }
    .bf-sub b { color: var(--action); font-weight: 800; white-space: nowrap; }

    /* B 헤더 — '박새암 님은 비기너 코스를 선택하셨어요' */
    /* 칩·링크를 뺀 뒤 제목과 카드가 24px 로 붙어서 아래 여백을 다시 잡았다(A 화면과 같은 34px:
       머리 아래 14 + .today margin-top 20). #heroMine 은 B 에서만 보여 A 에 영향이 없다. */
    #heroMine { padding-bottom: 14px; }
    .me-title { font-size: clamp(21px, 4.6vw, 28px); font-weight: 800; letter-spacing: -.4px; margin-top: 10px; line-height: 1.45; }
    .me-title i { font-style: normal; color: var(--accent-ink); }
    /* ⚠️ 기록 숫자 칩(답변·대화 중·스크랩)과 '마이페이지에서 자세히' 링크를 여기 다시 넣지
       말 것(2026-08-06 오너 지시로 삭제). 이 화면이 시키는 일은 '오늘 이어서' 하나다 —
       누를 수도 없는 숫자와 페이지 밖으로 빼는 링크가 머리에 있으면 뭘 눌러야 할지 흐려진다.
       기록의 원장은 마이페이지고, 거기로 가는 길은 nav 오른쪽 알약이 이미 갖고 있다. */

    /* 데스크톱 열 폭 — 안 잡으면 760px 열에서 카드 355px·서클 233px 로 부푼다(실측).
       구 화면의 `.ix-wrap { max-width:600px }` 와 같은 값을 이어받는다. */
    main.container > section,
    .today { max-width: 600px; margin-left: auto; margin-right: auto; }
    /* 서클은 600px 열에서도 193px 이 되어 따로 더 좁힌다(실측 → 약 133px) */
    .fr-grid { max-width: 420px; }

    /* ── 섹션 제목 ── */
    .sec-t { margin: 30px 0 0; text-align: center; }
    .sec-t b { font-size: 19px; font-weight: 800; }
    .sec-t span { display: block; font-size: var(--fs-body-sm, 15px); color: var(--text-muted); margin-top: 5px; }

    /* ── 코스 줄 4개(세로 리스트 · 2026-08-06 B안) ──
       칩(큰 글자) + 상황(메인) + 안내(서브). 사진 자리는 폐지 — 한글 칩이 구분을 맡는다. */
    .cs-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .cs-row { appearance: none; font-family: inherit; text-align: left; cursor: pointer;
      display: flex; align-items: center; gap: 12px; width: 100%;
      background: var(--surface); border: 1px solid var(--border-soft); border-radius: 14px;
      padding: 12px 12px 12px 10px; box-shadow: 0 2px 10px rgba(23,42,71,.05);
      -webkit-tap-highlight-color: transparent; }
    .cs-row:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .cs-lv { flex: 0 0 62px; align-self: stretch; min-height: 56px; border-radius: 10px;
      background: var(--accent-tint); display: flex; align-items: center; justify-content: center;
      font-size: 21px; font-weight: 800; letter-spacing: .04em; color: var(--accent-ink); }
    .cs-tx { flex: 1 1 auto; min-width: 0; }
    .cs-tx b { display: block; font-size: 15px; font-weight: 800; line-height: 1.4; }
    .cs-tx span { display: block; font-size: 12.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.45; }
    .cs-row > i { font-style: normal; color: var(--accent-ink); font-size: 14px; flex: 0 0 auto;
      transition: transform .2s ease; }
    .cs-row[aria-expanded="true"] { border-color: var(--action);
      box-shadow: 0 0 0 1px var(--action) inset, 0 2px 10px rgba(23,42,71,.05); }
    .cs-row[aria-expanded="true"] .cs-lv { background: var(--action); color: var(--action-ink); }
    .cs-row[aria-expanded="true"] > i { transform: rotate(180deg); }

    /* ── 코스 상세 패널(하나를 재사용) — 펼친 줄 바로 아래로 옮겨 다닌다(아코디언) ── */
    .cs-detail { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 14px;
      padding: 6px 14px 14px; box-shadow: 0 2px 12px rgba(23,42,71,.06); }
    .cs-detail:focus { outline: none; }
    .cs-step { display: flex; gap: 11px; align-items: center; padding: 12px 2px; text-decoration: none;
      color: var(--text); }
    /* 구분선은 **스텝과 스텝 사이에만** 긋는다.
       ⚠️ `border-bottom` + `:last-of-type{border:0}` 으로 되돌리지 말 것(2026-08-06 감사) —
          코스 상세 패널은 스텝 뒤에 챌린지 추천 칸(.cs-reco)이 붙는데 그것도 <a> 라서,
          `:last-of-type` 이 마지막 스텝이 아니라 추천 칸에 걸린다. 그래서 스텝 셋 다 밑줄이
          남아 추천 칸 위에 줄이 하나 더 그어졌다(추천 칸이 없는 '오늘 이어서' 카드에서는
          같은 규칙이 정상 동작해서, 같은 부품이 두 자리에서 다르게 보였다). */
    .cs-step + .cs-step { border-top: 1px solid var(--border-soft); }
    .cs-step:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; border-radius: 10px; }
    .cs-step > b { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; background: var(--accent-tint);
      color: var(--accent-ink); font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .cs-step > span { flex: 1 1 auto; min-width: 0; }
    .cs-step em { display: block; font-style: normal; font-size: var(--fs-body-sm, 15px); font-weight: 700; }
    .cs-step small { display: block; font-size: 13px; color: var(--text-dim); margin-top: 1px; }
    .cs-step > u { flex: 0 0 auto; text-decoration: none; color: var(--accent-dark); opacity: .6; }
    /* 챌린지 추천 칸 — 스텝(번호)과 구분되는 별도 자리(2026-08-06 오너 확정: 추천 형식).
       ⚠️ CTA 는 '모집 일정' — 신청을 약속하지 않는다. 모집 여부 판단은 챌린지 페이지가 한다. */
    .cs-reco { display: flex; align-items: center; gap: 11px; margin-top: 8px; padding: 12px;
      background: var(--accent-tint); border-radius: 12px; text-decoration: none; color: var(--text); }
    .cs-reco:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .cs-reco > span { flex: 1 1 auto; min-width: 0; }
    .cs-reco em { display: block; font-style: normal; font-size: 12px; font-weight: 800;
      letter-spacing: .06em; color: var(--accent-ink); }
    .cs-reco b { display: block; font-size: 14px; font-weight: 700; margin-top: 3px; line-height: 1.4; }
    .cs-reco small { display: block; font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
    .cs-reco > u { flex: 0 0 auto; text-decoration: none; color: var(--accent-ink); font-weight: 800; font-size: 13px; }
    /* ⚠️ 시간만 적는다 — 금액을 여기 적지 말 것(2026-08-05 오너 확정). 단가·잔액은 각 도구
       페이지가 말한다. 여기에 숫자를 적으면 단가·팩 가격이 바뀔 때마다 두 곳이 어긋난다. */
    .cs-meta { margin-top: 10px; padding: 10px 12px; background: var(--accent-tint); border-radius: 12px;
      font-size: 13px; font-weight: 700; color: var(--accent-ink); }
    .cs-cta { display: block; width: 100%; margin-top: 12px; padding: 14px 0; border: 0; border-radius: 999px;
      background: var(--action); color: var(--action-ink); font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer; }
    .cs-cta:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 3px; }
    .cs-note { margin-top: 8px; text-align: center; font-size: 12px; color: var(--text-dim); }
    .cs-err { margin-top: 8px; text-align: center; font-size: 13px; font-weight: 700; color: #B3261E; }

    /* ── 자유 선택 — 큰 사각 버튼 박스 + 라인 아이콘(2026-08-06 오너 확정) ──
       구 글자 원형은 "허접하다"로 기각, 엠보스 원판도 기각("동그라미 말고 사각형").
       판을 없앤 안(C)도 기각 — 오너가 원한 건 **네모 버튼 박스를 키우는 것**이다.
       박스는 칸 폭을 꽉 채우되 98px 을 넘지 않는다(데스크톱 열에서 부푸는 걸 막는다).
       ⚠️ **아이콘을 키울 때 선 굵기를 같이 키우지 말 것.** 이 결이 사는 이유는 큰 게 아니라
          '크면서 선이 얇은' 것이다. 화면 선두께 = stroke-width × (렌더크기 ÷ 24) 이므로
          52px 에서 1.6px 이 되게 0.74 를 쓴다. 크기를 바꾸면 이 값도 다시 계산한다.
       ⚠️ **굵기는 심볼이 아니라 여기(바깥 svg)에서 준다** — 심볼에 stroke-width 를 적어 두면
          use 그림자 트리에서 그 값이 이겨 CSS 조절이 안 먹는다(실측 확인).
       ⚠️ 카드 안에 넣지 말 것(흰 카드 안 흰 박스는 그림자가 겹친다) · 긴 대각 그림자 금지. */
    .fr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 8px; margin: 16px auto 0; }
    .fr-c { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 0 4px;
      font-size: 12.5px; font-weight: 700; line-height: 1.3; text-align: center;
      text-decoration: none; color: var(--text); }
    .fr-c:focus-visible { outline: 3px solid var(--action); outline-offset: 3px; border-radius: 26px; }
    /* ⚠️ 박스 면은 **흰색이 아니라 틴트**다 — 2026-08-06 배경이 웜 페이퍼에서 순백으로
       바뀌면서(팔레트 개편) 흰 박스가 흰 배경에 묻혀 사라졌다. 배경색을 다시 손대면
       이 면도 같이 확인할 것(면이 배경과 같은 색이면 박스가 없는 것과 같다). */
    .fr-ic { width: 100%; max-width: 98px; aspect-ratio: 1 / 1; border-radius: 26px;
      background: var(--accent-tint); border: 1px solid rgba(27,58,107,.14); flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center; color: var(--accent-ink);
      box-shadow: 0 4px 12px rgba(23,42,71,.07); }
    .fr-ic svg { stroke-width: .74; }
    /* 킬러·첨삭 짝 표시(2026-08-06) — 번호 배지 + 역할 한 줄. 배지가 박스 밖으로 나가므로
       .fr-ic 에 relative 를 준다. 역할 줄은 12px 하한 준수, 회원별 상태·금액 금지 그대로. */
    .fr-ic { position: relative; }
    .fr-n { position: absolute; top: -7px; left: -7px; width: 24px; height: 24px; border-radius: 50%;
            background: var(--accent); color: #fff; font-style: normal; font-size: 12.5px; font-weight: 800;
            display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg);
            box-shadow: 0 2px 6px rgba(23,42,71,.18); }
    .fr-c small { font-size: 12px; font-weight: 500; color: var(--text-muted); line-height: 1.4;
                  margin-top: -4px; }

    /* ── B: '오늘 이어서' 카드 ── */

      padding: 16px; margin-top: 20px; box-shadow: 0 2px 12px rgba(23,42,71,.06); }

       눌렀고 그대로 사이트를 빠져나갔다). 테두리 있는 알약이라야 '누르는 것'으로 읽힌다.
       ⚠️ line-height 를 적어야 44px 이 된다 — 버튼은 body 행간을 물려받지 않아
          기본값(약 16px)으로 계산되면 40px 에서 멈춘다(실측). */
    .today-hd button { appearance: none; font-family: inherit; cursor: pointer;
      background: var(--surface); border: 1px solid var(--action); border-radius: 999px;
      font-size: 13px; line-height: 20px; font-weight: 800; color: var(--action);
      padding: 11px 14px; white-space: nowrap; }
    .today-hd button:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }

    .today-sub { margin-top: 4px; font-size: 13px; color: var(--text-muted); }
    .today-sub b { font-weight: 800; color: var(--accent-ink); }

    /* '하다 만 대화' — 소재 발굴 스텝에 딸린 줄(2026-08-06 오너 확정 B안).
       ⚠️ 번호 목록 **위**로 올리지 말 것(A안 기각) — 이 카드의 규칙은 '번호 순서대로 하나씩'
          이라, 번호 없는 줄이 1번 위에 오면 순서가 깨져 '0번'처럼 읽힌다. 스텝 안의 갈래로 둔다.
       ⚠️ 0개·조회 실패면 줄 자체를 안 그린다(빈 껍데기 금지).
       .st-wrap 이 스텝과 딸린 줄을 한 덩어리로 묶고 밑줄을 대신 갖는다. */
    .st-wrap { border-bottom: 1px solid var(--border-soft); }
    .st-wrap .cs-step { border-bottom: 0; }
    /* margin-left 39px = 번호 칸 26 + 간격 11 — 스텝 제목과 왼쪽이 맞는다.
       padding 13 + line-height 18 = 44px(터치 하한). 9px 로 줄이면 36px 이 된다. */
    .rs-sub { display: flex; align-items: center; gap: 8px; margin: 0 2px 12px 39px;
      padding: 13px 12px; background: var(--accent-tint); border-radius: 10px;
      text-decoration: none; color: var(--accent-ink); font-size: 13px; font-weight: 800; line-height: 18px; }

       이때 마지막 스텝은 `.cs-step:last-of-type` 이 안 걸려 밑줄이 남는데, 번호 목록과
       이 줄을 가르는 구분선이 되므로 그대로 둔다(없애려고 손대지 말 것). */
    .rs-sub.is-loose { margin: 12px 2px 0 2px; }
    .rs-sub i { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: var(--action); }
    .rs-sub b { flex: 1 1 auto; min-width: 0; font-weight: 800; }
    .rs-sub u { flex: 0 0 auto; text-decoration: none; opacity: .75; }
    .rs-sub:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }

    .bf-foot { max-width: 600px; margin: 0 auto; padding: 0 0 80px; }

    /* ══ 상태 전환 — 기본은 A(코스 선택 전). B 요소는 감춰 두고 클래스로 켠다.
       ⚠️ 첫 그리기는 아래 <body> 직후의 '기기 기억'이 정한다(nav.js 와 같은 수법) —
          서버 확인을 기다렸다가 켜면 A→B 로 화면이 한 번 뒤집혀 깜빡인다. ══ */
    #heroMine, #todayCard { display: none; }
    /* ⚠️⚠️ 아래 has-course 규칙에는 전부 `:not(.pick-mode)` 가 붙어 있다 — 떼지 말 것.
       2026-08-06 실측 사고: `body.has-course.course-ready #pickSection{display:none}` 은
       클래스가 둘이라 `body.pick-mode #pickSection{display:block}`(클래스 하나)을 이긴다.
       CSS 는 뒤에 썼다고 이기는 게 아니라 특이도가 높은 쪽이 이긴다. 그래서 '코스 바꾸기'로
       허브로 넘어가도 **코스 목록이 안 뜨고 내 코스 카드만 남아 있었다**(허브로 안 감).
       두 규칙을 특이도로 겨루게 두지 말고, 허브 모드에서는 아예 안 걸리게 만든다. */
    body.has-course:not(.pick-mode) #heroPublic { display: none; }
    body.has-course:not(.pick-mode) #heroMine { display: block; }
    /* ⚠️ '오늘 이어서' 카드는 **내용이 채워진 뒤에만** 보인다(`.course-ready`).
       기기 기억은 화면 배치만 정할 뿐 데이터가 아니라서, 서버 조회가 실패하면
       제목·스텝·CTA 가 전부 빈 카드가 그대로 남았다(2026-08-06 오너 신고). */
    body.has-course.course-ready:not(.pick-mode) #todayCard { display: block; }
    /* 코스를 고른 뒤에는 **내 코스만 남긴다**(2026-08-06 오너 확정) — 다른 코스 목록과
       '내 입맛대로' 도구는 감춘다. 화면에 길이 여러 개면 뭘 눌러야 할지 헷갈린다.
       ⚠️ 다만 **돌아갈 길이 반드시 있어야 한다** — '코스 바꾸기'와 뒤로가기가 `pick-mode` 를
          켜서 아래 규칙으로 허브(고르는 화면)를 되살린다. 이 두 규칙은 한 쌍이다.
          한쪽만 지우면 코스를 바꿀 길이 사라진다(같은 사고를 이미 냈다). */
    body.has-course.course-ready:not(.pick-mode) #pickSection,
    body.has-course.course-ready:not(.pick-mode) #freeSection { display: none; }

    /* ── 허브 모드(`briefing.html?pick=1`) — 코스를 고른 사람이 '코스 바꾸기'로 들어온다.
       저장된 코스가 있어도 고르는 화면 전체를 보여 준다. 뒤로가기를 누르면 내 코스 화면. ── */
    body.pick-mode #heroMine, body.pick-mode #todayCard { display: none; }
    body.pick-mode #heroPublic { display: block; }
    body.pick-mode #pickSection, body.pick-mode #freeSection { display: block; }

    /* 320px 실측 대응 — 활자는 12px 하한이라 못 줄이므로 여백만 좁힌다 */
    @media (max-width: 360px) {

      .fr-c { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { .cs-row > i { transition: none; } }

<script>
/* 기기 기억으로 '첫 화면'을 정한다 — nav.js 의 로그인 기억(monc_nav_auth_v1)과 같은 수법.
   서버 확인(0.3~1초)을 기다려 켜면 코스를 고른 회원이 매번 A→B 뒤집힘을 본다.
   ⚠️ 이 기억은 그리기용일 뿐 권한이 아니다 — 진짜 값은 아래 boot() 가 members 에서 읽어 바로잡는다.
   ⚠️ supabase 토큰이 기기에 없으면(로그아웃) 기억도 지운다. */
(function () {
  try {
    var hasToken = false;
    for (var i = 0; i < localStorage.length; i++) {
      if (/^sb-[a-z0-9]+-auth-token$/.test(localStorage.key(i) || '')) { hasToken = true; break; }
    }
    if (!hasToken) { localStorage.removeItem('monc_course_v1'); return; }
    var h = JSON.parse(localStorage.getItem('monc_course_v1') || 'null');
    if (h && h.course) document.body.classList.add('has-course');
  } catch (e) {}
})();
</script>

/* ══ 어느 화면으로 열 것인가 — **방문 기록(history.state)** 이 정한다 ═══════════
   ⚠️⚠️ **승준노트를 눌러 새로 들어오면 언제나 허브(코스 목록)다.** 코스를 골라 뒀다고
   내 코스 화면으로 열지 말 것(2026-08-06 오너 확정 — *"내가 초급을 선택했다고 승준노트
   눌렀을때 초급코스가 보이는걸 하지말라는거야. 그 화면에 있으면 안된다고"*).

   다만 **도구에서 뒤로 돌아오는 것은 다르다** — 그때는 보던 화면(내 코스)으로 돌아와야 한다.
   둘을 가르는 표식이 `history.state.bf` 다. 주소로 가르지 않는 이유는 두 화면의 주소가
   같아야 하기 때문이다(`?pick=1` 은 이 판에서 폐지 — 주소에 화면 상태를 실으면 그 주소가
   공유·새로고침으로 되살아나 "왜 내 코스가 안 뜨냐"가 다시 생긴다).

   - 새로 들어옴(nav·링크·주소창) → `history.state` 없음 → **허브**
   - 코스 선택 → `pushState({bf:'mine'})` → 내 코스 화면. **뒤로가기 = 허브**
   - 도구에 갔다 뒤로 → 그 기록 칸의 state 가 `{bf:'mine'}` → **내 코스 화면으로 복귀**
     (state 는 새로고침을 넘어 살아남으므로 맨 아래 bfcache reload 뒤에도 유지된다) ══ */
var VIEW = (function () {
  var s = null;
  try { s = history.state; } catch (e) {}
  var v = (s && s.bf === 'mine') ? 'mine' : 'hub';
  /* 표식이 없는 칸(새로 들어옴)에도 'hub' 를 박아 둔다 — popstate 가 돌아올 자리를 알게. */
  if (!s || !s.bf) { try { history.replaceState({ bf: v }, ''); } catch (e) {} }
  return v;
})();
var PICK_MODE = (VIEW !== 'mine');     /* true = 허브(고르는 화면)를 보여 준다 */
if (PICK_MODE) document.body.classList.add('pick-mode');

/* 기기에 저장된 supabase 토큰에서 회원 id 를 바로 읽는다(동기 — 기다림 없음).
   ⚠️ getSession() 은 탭 간 잠금(navigator.locks) 이 꼬이면 응답 없이 매달릴 수 있다 —
      '저장 중…' 멈춤의 유력 원인. 저장은 어차피 요청에 실린 토큰(JWT)으로 서버(RLS)가
      본인 여부를 판정하므로, id 는 로컬 토큰에서 읽어도 안전하다(권한이 아니라 주소일 뿐). */
function localUid() {
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i) || '';
      if (/^sb-[a-z0-9]+-auth-token$/.test(k)) {
        var t = JSON.parse(localStorage.getItem(k) || 'null');
        if (t && t.user && t.user.id) return t.user.id;
      }
    }
  } catch (e) {}
  return null;
}

function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

/* ── 코스 상세 패널(하나를 재사용 — 펼친 줄 바로 아래로 옮긴다) ──
   ⚠️ 처음엔 넷 다 접혀 있다(2026-08-06 오너 확정). picked=null 이 '접힘' 상태다.

function stepRows(c) {

/* 챌린지 추천 칸 — CTA 는 '모집 일정'(신청을 약속하지 않는다 — 모집 0인 기간이 있다) */
function recoRow(c) {
  if (!c.reco) return '';
  return '<a class="cs-reco" href="challenges.html">' +

/* 접기 — 패널을 비우고 감춘다(줄 넷은 모두 aria-expanded=false) */
function collapseDetail() {
  picked = null;
  var panel = document.getElementById('csDetail');
  panel.hidden = true;
  panel.innerHTML = '';
  [].forEach.call(document.querySelectorAll('.cs-row'), function (b) {
    b.setAttribute('aria-expanded', 'false');
  });
}

function paintDetail(code) {
  var c = COURSE_BY[code]; if (!c) return;
  picked = code;
  var panel = document.getElementById('csDetail');
  panel.hidden = false;
  panel.innerHTML =
    stepRows(c) +
    recoRow(c) +
    '<div class="cs-meta">' + esc(c.time) + '</div>' +
    '<button class="cs-cta" type="button" id="btnStart">이 코스로 시작하기</button>' +
    /* ⚠️ 여기에 판 번호(BF_VER)를 다시 붙이지 말 것 — 2026-08-06 오너 지시로 뺐다.
       학생에게는 뜻 없는 글자이고, 값만 남은 꼬리표는 오타로 읽힌다(design-principles
       '값에는 그것이 무엇인지 붙이기'). 배포 확인은 `<body data-bf>` 로 한다. */
    '<p class="cs-note">코스는 계정에 저장돼요 · 언제든 바꿀 수 있어요</p>' +
    '<p class="cs-err" id="startErr" hidden></p>';
  var rows = document.querySelectorAll('.cs-row');
  [].forEach.call(rows, function (b) {
    b.setAttribute('aria-expanded', String(b.dataset.code === code));
  });

  var cur = document.querySelector('.cs-row[data-code="' + code + '"]');

  document.getElementById('btnStart').addEventListener('click', function () { startCourse(code); });
}

document.getElementById('csList').addEventListener('click', function (e) {

  if (btn.dataset.code === picked) {
    collapseDetail();
    btn.focus({ preventScroll: true });
    return;
  }
  paintDetail(btn.dataset.code);
  /* 화면 낭독기·키보드 사용자가 '내용이 바뀐 곳'으로 따라가게 초점을 옮긴다 */
  document.getElementById('csDetail').focus({ preventScroll: true });

/* ── 코스 저장 ─────────────────────────────────────────────────────────────
   ⚠️ 실패를 조용히 넘기지 않는다 — 마이그레이션 미적용이면 화면에 말하고 그 자리에 머문다.
      (성공한 척 B로 넘어가면 다음 방문에 코스가 사라져 있다) */
function showStartErr(msg, progress) {
  var el = document.getElementById('startErr');
  if (!el) return;
  el.textContent = msg; el.hidden = false;
  /* 진행 안내는 빨강이 아니라 회색으로 — 오류처럼 읽히면 안 된다 */
  el.style.color = progress ? 'var(--text-muted)' : '';
}

/* 응답이 안 오면 기다리다 굳는다 — 단계마다 시간 상한을 둔다.
   ⚠️ 2026-08-06 오너 신고: 버튼이 '저장 중…' 에서 멈춘 채 화면이 안 넘어갔다.
      세션 조회(supabase-js 의 잠금 대기)나 저장 요청이 응답을 안 주면 이 함수가
      영영 안 끝나서, 성공도 실패도 아닌 상태로 남는다. 반드시 상한을 건다. */
function withTimeout(p, ms, tag) {
  return Promise.race([
    p,
    new Promise(function (_, rej) {
      setTimeout(function () { rej(new Error('timeout:' + tag)); }, ms);
    })
  ]);
}

async function startCourse(code) {
  var btn = document.getElementById('btnStart');
  if (btn) { btn.disabled = true; btn.textContent = '저장 중…'; }
  /* 누르자마자 화면에 진행 글자를 남긴다 — '아무 일도 안 일어난' 상태를 없앤다.
     이 글자조차 안 뜨면 이 코드가 아예 안 도는 것(캐시된 옛 파일)이다. */
  showStartErr('저장하고 있어요…', true);
  /* 어떤 갈래로 끝나든 버튼은 반드시 되돌린다 */
  var restore = function () {
    if (btn) { btn.disabled = false; btn.textContent = '이 코스로 시작하기'; }
  };
  try {
    /* id 는 로컬 토큰에서 바로(기다림 없음). 없을 때만 getSession 을 6초 상한으로 시도. */
    var uid = localUid();
    if (!uid && window.MONC) {
      try {
        var session = await withTimeout(MONC.getSession(), 6000, 'session');
        if (session && session.user) uid = session.user.id;
      } catch (e2) { /* 아래 비회원 갈래로 */ }
    }
    if (!uid) {
      /* 비회원 — 고른 코스를 **주소에 실어** 로그인하러 보낸다(브라우저에 아무것도 저장하지
         않는다 — 위 WANT_COURSE 주석 참조). 돌아오면 그 코스가 펼쳐진 채로 뜨고,
         저장은 학생이 버튼을 다시 눌러야 일어난다. */
      window.location.href = 'login.html?returnTo=' + encodeURIComponent('briefing.html?c=' + code);
      return;
    }
    var row = await saveCourse(uid, code);
    if (!row) { showStartErr(lastSaveErr); restore(); return; }
    /* ⚠️ 저장 뒤 페이지를 다시 부르지 않는다(2026-08-06 오너 신고 "그냥 그대로
       새로고침된다"). 다시 부르면 화면이 다시 서버를 읽어야 하고, 그 읽기가 실패하면
       새로고침만 되고 화면은 그대로다. 방금 저장된 행을 그대로 받아서 바로 그린다. */
    /* 허브 → 내 코스 화면. **기록을 한 칸 쌓는다**(pushState) — 그래야 뒤로가기가 허브다.
       ⚠️ replaceState 로 되돌리지 말 것(2026-08-06 오너 신고) — 화면은 넘어갔는데 기록이
          안 쌓이면 뒤로가기가 승준노트 밖으로 나가 버린다.
       ⚠️ **주소는 그대로 둔다**(세 번째 인자 없음). 두 화면은 주소가 같고, 어느 화면인지는
          state 가 말한다 — 주소에 실으면 그 주소가 공유·새로고침으로 되살아난다. */
    PICK_MODE = false;
    document.body.classList.remove('pick-mode');
    try { history.pushState({ bf: 'mine' }, ''); } catch (e) {}
    paintMine(row.name, row.course || code);
    loadOpenChat(uid);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  } catch (e) {
    if (e && String(e.message || '').indexOf('timeout:') === 0) {
      showStartErr('서버 응답이 없어요. 통신 상태를 확인하고 다시 눌러 주세요. (' + e.message + ')');
    } else {
      showStartErr(lastSaveErr);
    }
    restore();
    return;
  }
}

/* 실패 이유를 화면에 다르게 적는다 — 폰에서는 콘솔을 못 보므로, 원인을 글자로 남겨야
   "왜 안 되냐"를 추적할 수 있다(2026-08-06). 기본값은 일시적 장애 문구다. */
var lastSaveErr = '지금은 코스 저장이 안 돼요. 잠시 뒤 다시 눌러 주세요.';

/* 저장하고 **바뀐 행을 돌려준다**(실패면 null).
   ⚠️ `.select()` 를 빼지 말 것 — 없으면 한 행도 안 바뀌어도 오류가 없어서 성공으로 읽힌다
      (RLS 로 남의 행이 가려졌거나 내 행이 없을 때). 2026-08-06 실사고: 저장은 '성공'인데
      화면은 그대로였다. 바뀐 행이 실제로 돌아오는지로 판정한다. */
async function saveCourse(uid, code) {
  lastSaveErr = '지금은 코스 저장이 안 돼요. 잠시 뒤 다시 눌러 주세요.';
  try {
    /* ⚠️ 여기도 상한이 필요하다 — 요청이 응답 없이 매달리면 버튼이 '저장 중…' 에서 굳는다 */
    var res = await withTimeout(
      MONC.sb.from('members').update({ course: code }).eq('id', uid).select('id, name, course'),
      8000, 'save');
    if (res.error) {
      var c = res.error.code || '';
      if (c === '23514')      lastSaveErr = '코스 설정이 아직 서버에 반영되지 않았어요. (코드 23514)';
      else if (c === '42501') lastSaveErr = '로그인이 풀렸어요. 다시 로그인한 뒤 눌러 주세요. (코드 42501)';
      else if (c === '42703' || c === 'PGRST204') lastSaveErr = '서버에 코스 칸이 아직 없어요. (코드 ' + c + ')';
      else if (c)             lastSaveErr = '지금은 코스 저장이 안 돼요. (코드 ' + c + ')';
      console.warn('코스 저장 실패', res.error);
      return null;
    }
    /* 오류는 없는데 바뀐 행도 없다 = 내 행을 못 찾았다(로그인 계정과 회원 행이 안 맞거나 RLS) */
    if (!res.data || !res.data.length) {
      lastSaveErr = '계정 정보를 못 찾았어요. 로그아웃 후 다시 로그인해 주세요. (코드 no_row)';
      console.warn('코스 저장: 바뀐 행 0개', uid);
      return null;
    }
    try { localStorage.setItem(HINT_KEY, JSON.stringify({ uid: uid, course: code })); } catch (e) {}
    return res.data[0];
  } catch (e) {
    if (e && String(e.message || '').indexOf('timeout:') === 0) {
      lastSaveErr = '서버 응답이 없어요. 통신 상태를 확인하고 다시 눌러 주세요. (timeout:save)';
    }
    console.warn('코스 저장 실패', e);
    return null;
  }
}

/* ── B 화면 채우기 ────────────────────────────────────────────────────────── */
var myCourse = null;              /* 계정에 저장된 코스 — '코스 바꾸기'가 여기서 시작한다 */

function paintMine(name, code) {
  var c = COURSE_BY[code]; if (!c) return;
  myCourse = code;
  document.getElementById('meTitle').innerHTML =
    esc(name || '회원') + ' 님은<br><i>‘' + esc(c.name) + '’</i>를 선택하셨어요.';
  document.getElementById('todaySub').innerHTML =
    '<b>' + esc(c.name) + '</b> · 번호 순서대로 하나씩 하면 돼요';
  /* 허브 모드에서는 지금 쓰는 코스가 무엇인지 목록 위에 적어 준다.
     ⚠️ `PICK_MODE` 조건을 다시 걸지 말 것(2026-08-06 감사에서 실측) — 이 줄은 고르는 화면에서만
        보이지만, **코스를 저장하는 순간에는 이미 PICK_MODE 가 false 다**(내 코스 화면으로 넘긴
        뒤에 paintMine 이 돈다). 조건을 걸면 뒤로가기로 고르는 화면에 돌아왔을 때 이 줄만
        이전 코스 이름으로 남아, 한 화면에서 위아래가 서로 다른 코스를 말한다.
        안 보이는 동안에도 값은 맞춰 둔다. */
  var ps = document.getElementById('pickSub');
  if (ps) ps.innerHTML = '지금은 <b>' + esc(c.name) + '</b>예요 · 다른 코스를 눌러 바꿀 수 있어요';
  document.getElementById('todaySteps').innerHTML = stepRows(c);
  var cta = document.getElementById('todayCta');
  cta.href = c.cta.href;
  /* 아래 네이비 바는 '1번 스텝을 지금 시작'이라는 뜻이다 — 번호를 적어 스텝과 이어 준다
     (2026-08-06 오너 신고: 바가 뭔지 몰라 헷갈렸다) */
  cta.textContent = '1번부터 시작하기 · ' + c.cta.label;
  /* 코스를 고른 뒤엔 아래 도구 섹션이 '코스 말고 다른 것'이라는 걸 말해 준다 */
  var fs = document.getElementById('freeSub');
  if (fs) fs.textContent = '코스 순서 말고 다른 게 필요할 때';
  document.body.classList.add('has-course');
  document.body.classList.add('course-ready');   /* 내용이 채워졌다 — 이제 카드를 보여도 된다 */
  /* ⚠️ **여기서 화면을 내 코스로 넘기지 말 것.** 이 함수는 허브에 있을 때도 돈다(내용만
     미리 채워 둔다 — 나중에 넘어갈 때 즉시 그려지게). 어느 화면을 볼지는 오직 `VIEW`
     (방문 기록)가 정한다. 전에는 여기서 '늦게 성공한 조회'를 이유로 화면을 넘겼는데,
     그 때문에 승준노트를 새로 눌러도 내 코스 화면이 떴다(오너 신고). */
}

/* 코스 화면을 포기하고 '고르기'로 되돌린다 — 서버 값을 못 읽었을 때의 안전망.
   ⚠️ 빈 카드를 남기느니 고르는 화면을 보여 준다(2026-08-06 오너 신고: 이름·스텝·버튼이
      전부 빈 카드가 떠 있었고, 승준노트를 다시 눌러도 같은 화면이었다 — 기기 기억 때문). */
function fallbackToPick(dropHint) {
  if (dropHint) { try { localStorage.removeItem(HINT_KEY); } catch (e) {} }
  document.body.classList.remove('has-course', 'course-ready');
  /* 지금 칸의 표식도 허브로 맞춘다(기록은 안 쌓는다 — 넘어온 화면이 아니라 첫 화면이다).
     안 맞추면 새로고침·뒤로 복귀 때 이 칸이 다시 '내 코스'로 열린다. */
  if (!PICK_MODE) {
    PICK_MODE = true;
    document.body.classList.add('pick-mode');
    try { history.replaceState({ bf: 'hub' }, ''); } catch (e) {}
  }
  /* 로그인하고 돌아온 사람이 고른 코스를 펴 준다 — **펴 주기만 한다.**
     저장은 [이 코스로 시작하기] 를 눌러야 일어난다(위 WANT_COURSE 주석). 한 번 쓰고 비운다. */
  if (WANT_COURSE) { paintDetail(WANT_COURSE); WANT_COURSE = null; }
}

/* '코스 바꾸기' — 허브로 넘어간다. 저장된 코스는 새 코스의 [시작하기]를 누를 때만 바뀐다
   (안 고르고 떠나면 그대로). 기록을 한 칸 쌓으므로 **뒤로가기로 내 코스 화면에 돌아온다.**
   ⚠️ 페이지를 다시 부르지 않는다(구 `location.href='briefing.html?pick=1'`) — 다시 부르면
      서버를 또 읽고, 느린 회선에서 그 사이 화면이 한 번 비었다. 화면 전환만 하면 된다.
   ⚠️ 카드 아래에 목록을 딸려 내보내는 방식으로 되돌리지 말 것 — "허브로 안 간다"는 신고가
      났던 자리다. 여기서는 카드를 감추고 목록만 남긴다(pick-mode). */
document.getElementById('btnChange').addEventListener('click', function () {
  try { history.pushState({ bf: 'hub' }, ''); } catch (e) {}
  PICK_MODE = true;
  document.body.classList.add('pick-mode');
  if (myCourse) paintDetail(myCourse);          /* 뭘 바꾸는지 보이게 지금 코스를 펴 준다 */
  window.scrollTo({ top: 0, behavior: 'instant' });
});

/* 뒤로/앞으로 — 주소를 다시 읽어 화면을 맞춘다.
   같은 문서 안에서 쌓은 기록(위 pushState)은 새로고침 없이 이 이벤트만 온다.
   ⚠️ 다른 페이지에서 뒤로 들어오는 경우는 여기가 아니라 맨 아래 bfcache 새로고침이 맡는다
      — 그때는 파일을 다시 받아 주소대로 처음부터 그린다. */
window.addEventListener('popstate', function (e) {
  /* ⚠️ 주소가 아니라 **그 기록 칸의 표식**을 본다 — 두 화면은 주소가 같다. */
  var wantPick = !(e.state && e.state.bf === 'mine');
  if (wantPick === PICK_MODE) return;
  PICK_MODE = wantPick;
  document.body.classList.toggle('pick-mode', wantPick);
  /* 고르는 화면으로 돌아왔으면 지금 쓰는 코스를 펴 준다 — 뭘 바꾸는지 보이게(허브와 같은 규칙) */
  if (wantPick) { if (myCourse) paintDetail(myCourse); }
  else collapseDetail();
});

/* ⚠️ 기록 숫자를 세던 loadStats() 는 2026-08-06 삭제했다(칩·링크와 한 벌).
   같은 숫자가 필요하면 마이페이지에서 본다 — 이 화면에 다시 붙이지 말 것. */

/* ── 하다 만 대화 ─────────────────────────────────────────────────────────────
   소재 발굴에서 되묻기만 하고 답변까지 안 간 문제. **누를 수 있는 줄로만** 보여 준다 —
   숫자만 띄우는 칩으로 되돌리지 말 것(그래서 지운 자리다).
   ⚠️ '하다 만'의 정의는 마이페이지와 같아야 한다: `discovery_sessions.stage !== 'done'`
      **그리고** `answers` 에 없는 문제. 한쪽만 고치면 두 화면의 숫자가 어긋난다. */
async function loadOpenChat(uid) {
  try {
    var a = await MONC.sb.from('answers').select('question_id').eq('member_id', uid);
    if (a.error || !a.data) return;                 /* 조회 실패 — 아무것도 안 그린다 */
    var answered = {};
    a.data.forEach(function (r) { if (r.question_id) answered[r.question_id] = 1; });

    var s = await MONC.sb.from('discovery_sessions')
      .select('question_id, stage, updated_at')
      .eq('member_id', uid).order('updated_at', { ascending: false });
    if (s.error || !s.data) return;

    var open = s.data.filter(function (r) {
      return r.stage !== 'done' && r.question_id && !answered[r.question_id];
    });
    if (!open.length) return;                       /* 0개 — 줄을 안 그린다 */
    paintOpenChat(open.length, open[0].question_id);
  } catch (e) {}
}

/* 줄을 소재 발굴 스텝 아래에 끼운다. 여러 개면 **가장 최근에 하던 것**으로 바로 들어간다
   (목록을 한 겹 더 두면 이 화면의 할 일이 둘이 된다). 주소는 마이페이지와 같은 sojae.html?q=. */
function paintOpenChat(n, qid) {
  var box = document.getElementById('todaySteps');
  if (!box || box.querySelector('.rs-sub')) return;              /* 두 번 그리지 않는다 */
  var row = '<a class="rs-sub" href="sojae.html?q=' + encodeURIComponent(qid) + '">' +
              '<i aria-hidden="true"></i><b>하다 만 대화 ' + n + '개 이어서 하기</b>' +
              '<u aria-hidden="true">→</u></a>';

  /* 소재 발굴로 가는 첫 스텝을 찾는다 — 대화가 거기서 생긴 것이라 그 자리가 제집이다 */
  var steps = box.querySelectorAll('.cs-step'), target = null;
  for (var i = 0; i < steps.length; i++) {
    if ((steps[i].getAttribute('href') || '').indexOf('sojae.html') === 0) { target = steps[i]; break; }
  }
  if (!target) {                                                 /* 실전 코스엔 소재 스텝이 없다 */
    box.insertAdjacentHTML('beforeend', row.replace('rs-sub', 'rs-sub is-loose'));
    return;
  }
  var wrap = document.createElement('div');
  wrap.className = 'st-wrap';
  target.parentNode.insertBefore(wrap, target);
  wrap.appendChild(target);
  wrap.insertAdjacentHTML('beforeend', row);
}

/* ── 부팅 ──────────────────────────────────────────────────────────────────
   기기 기억으로 이미 A/B 를 그려 놨다. 여기서 서버 값으로 바로잡는다.
   ⚠️ **어느 갈래로 빠지든 빈 카드를 남기지 않는다** — 못 채우면 fallbackToPick() 으로
      고르는 화면을 보여 준다(2026-08-06 오너 신고). 예전엔 실패 경로가 그냥 return 이라
      기기 기억이 그려 둔 빈 껍데기가 영영 남았고, 다시 들어와도 같은 화면이었다. */
(function bootGuard() {
  /* 스크립트가 아예 못 도는 경우(라이브러리 차단·네트워크 지연)까지 덮는 안전망.
     4초 안에 카드가 안 채워지면 고르는 화면으로 되돌린다. 기억은 지우지 않는다 —
     일시적 장애일 수 있고, 다음 방문에 서버 값을 다시 읽으면 복구된다. */
  setTimeout(function () {
    if (!document.body.classList.contains('course-ready')) fallbackToPick(false);
  }, 4000);
})();

(async function boot() {
  if (!window.MONC || !MONC.getSession) { fallbackToPick(false); return; }
  var session = null;
  try { session = await MONC.getSession(); } catch (e) { fallbackToPick(false); return; }

  if (!session) { fallbackToPick(true); return; }
  var uid = session.user.id;

  /* ⚠️ select('*') — course 컬럼 미적용 환경에서도 조회가 깨지지 않게(사이트 관례).
        공용 getMyProfile() 셀렉트에는 course 를 넣지 않는다(major·agreed_at 전례). */
  var row = null;
  try {
    var r = await MONC.sb.from('members').select('*').eq('id', uid).single();
    if (!r.error) row = r.data;
  } catch (e) {}

  var code = row && row.course;
  if (code && COURSE_BY[code]) {
    try { localStorage.setItem(HINT_KEY, JSON.stringify({ uid: uid, course: code })); } catch (e) {}
    paintMine(row.name, code);
    /* 허브 모드에서는 카드가 안 보이니 조회도 하지 않는다(쓸데없는 요청 2개) */
    if (!PICK_MODE) loadOpenChat(uid);
    /* 허브 모드로 들어왔으면 지금 쓰는 코스를 펴 놓는다 — 뭘 바꾸는지 보이게 */
    if (PICK_MODE) paintDetail(code);
  } else if (row) {
    /* 계정에 코스가 없다(또는 모르는 코드다) — 기억을 지우고 고르는 화면으로 */
    fallbackToPick(true);
  } else {
    /* 조회 자체가 실패했다 — 코스가 없다고 단정하지 않는다(기억은 남기고 화면만 되돌린다) */
    fallbackToPick(false);
  }
})();
</script>
