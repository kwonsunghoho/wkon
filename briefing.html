  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'SUIT Variable', SUIT,'Apple SD Gothic Neo',-apple-system,sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; }
    .container { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    a { color: inherit; }

    /* ══════════════════════════════════════════════════════════════════════
       승준노트 허브 — 코스형(2026-08-05 전면 개편)
       설계: docs/superpowers/specs/2026-08-05-briefing-course-hub-design.md
       기록: docs/notes/briefing.md

       구 화면(매거진 목차 6줄 `.ix-item` + 루트맵 룰렛 `.d-route`, 2026-07-31)은
       폐기했다. 2026-08-06 오너 지시로 2×2 카드를 **세로 리스트(B안)**로 바꿨다:
       칩(초급~실전 큰 글자) + 상황(메인) + 안내(서브), 펼친 줄 아래에 아코디언 패널.
         · 화면 A(코스 선택 전) = 히어로 → 코스 줄 4개(+펼친 줄 아래 패널) → 자유 선택 서클
         · 화면 B(선택 후)      = 개인화 헤더 → '오늘 이어서' → (서클·맛보기는 A와 동일)
       ⚠️ 코스 상세는 **패널 하나를 재사용**한다 — 펼친 줄 바로 아래로 옮겨 다닌다
          (4개 세로 나열 금지 — 모바일 길이).
       ⚠️ 카드·서클에 **회원별 상태 문구('첫 1회 무료' 등)·근거 없는 표시('인기'·'NEW')를
          달지 말 것**(2026-07-25·07-31 오너 기각). 무료 안내는 각 도구 페이지가 잔액을 읽어 말한다.
       ⚠️ 스텝은 **상시 도구만**(2026-08-06 오너 확정 — 코스가 모집 대기에 막히면 안 된다).
          챌린지는 스텝이 아니라 패널 하단 **추천 칸 하나**(.cs-reco)로만 — 모집 여부를
          단정하지 않고 challenges.html 로 보낸다(판단은 그 페이지가 한다).
       ══════════════════════════════════════════════════════════════════════ */

    /* ── 머리 영역(A·B 공통 여백) ── */
    .bf-head { padding: 104px 0 4px; text-align: center; }
    .bf-eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .24em; color: var(--accent-ink); }
    .bf-title { font-size: clamp(28px, 5vw, 42px); font-weight: 800; color: var(--accent); letter-spacing: -.6px; margin-top: 10px; }
    .bf-sub { font-size: 15px; color: var(--text); opacity: .72; margin-top: 12px; max-width: 34em; margin-left: auto; margin-right: auto; text-wrap: balance; }
    .bf-sub b { color: var(--action); font-weight: 800; white-space: nowrap; }

    /* B 헤더 — '박새암 님은 비기너 코스를 선택하셨어요' */
    .me-title { font-size: clamp(21px, 4.6vw, 28px); font-weight: 800; letter-spacing: -.4px; margin-top: 10px; line-height: 1.45; }
    .me-title i { font-style: normal; color: var(--accent-ink); }
    /* 값 칩 — ⚠️ 숫자만 두지 말 것(원칙: 값에는 그것이 무엇인지 붙이기). 0건·조회 실패인
       항목은 아예 안 그린다(빈 껍데기 금지 — 마이페이지와 같은 규칙). */
    .me-stats { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    .me-stats b { background: var(--accent-tint); color: var(--accent-ink); border-radius: 10px;
      padding: 7px 11px; font-size: 13px; font-weight: 800; }
    .me-stats b i { font-style: normal; font-weight: 700; color: var(--text-dim); margin-right: 5px; }
    .me-more { display: inline-block; margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--accent-ink); padding: 6px 8px; }

    /* 데스크톱 열 폭 — 안 잡으면 760px 열에서 카드 355px·서클 233px 로 부푼다(실측).
       구 화면의 `.ix-wrap { max-width:600px }` 와 같은 값을 이어받는다. */
    main.container > section, main.container > #quickfix-mount,
    .today { max-width: 600px; margin-left: auto; margin-right: auto; }
    /* 서클은 600px 열에서도 193px 이 되어 따로 더 좁힌다(실측 → 약 133px) */
    .fr-grid { max-width: 420px; }

    /* ── 섹션 제목 ── */
    .sec-t { margin: 30px 0 0; text-align: center; }
    .sec-t b { font-size: 19px; font-weight: 800; }
    .sec-t span { display: block; font-size: var(--fs-body-sm, 15px); color: var(--text-muted); margin-top: 5px; }

    /* ── 코스 줄 4개(세로 리스트 · 2026-08-06 B안) ──
       칩(큰 글자) + 상황(메인) + 안내(서브). 사진 자리는 폐지 — 한글 칩이 구분을 맡는다. */
    .cs-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .cs-row { appearance: none; font-family: inherit; text-align: left; cursor: pointer;
      display: flex; align-items: center; gap: 12px; width: 100%;
      background: var(--surface); border: 1px solid var(--border-soft); border-radius: 14px;
      padding: 12px 12px 12px 10px; box-shadow: 0 2px 10px rgba(23,42,71,.05);
      -webkit-tap-highlight-color: transparent; }
    .cs-row:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .cs-lv { flex: 0 0 62px; align-self: stretch; min-height: 56px; border-radius: 10px;
      background: var(--accent-tint); display: flex; align-items: center; justify-content: center;
      font-size: 21px; font-weight: 800; letter-spacing: .04em; color: var(--accent-ink); }
    .cs-tx { flex: 1 1 auto; min-width: 0; }
    .cs-tx b { display: block; font-size: 15px; font-weight: 800; line-height: 1.4; }
    .cs-tx span { display: block; font-size: 12.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.45; }
    .cs-row > i { font-style: normal; color: var(--accent-ink); font-size: 14px; flex: 0 0 auto;
      transition: transform .2s ease; }
    .cs-row[aria-expanded="true"] { border-color: var(--action);
      box-shadow: 0 0 0 1px var(--action) inset, 0 2px 10px rgba(23,42,71,.05); }
    .cs-row[aria-expanded="true"] .cs-lv { background: var(--action); color: var(--action-ink); }
    .cs-row[aria-expanded="true"] > i { transform: rotate(180deg); }

    /* ── 코스 상세 패널(하나를 재사용) — 펼친 줄 바로 아래로 옮겨 다닌다(아코디언) ── */
    .cs-detail { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 14px;
      padding: 6px 14px 14px; box-shadow: 0 2px 12px rgba(23,42,71,.06); }
    .cs-detail:focus { outline: none; }
    .cs-step { display: flex; gap: 11px; align-items: center; padding: 12px 2px; text-decoration: none;
      color: var(--text); border-bottom: 1px solid var(--border-soft); }
    .cs-step:last-of-type { border-bottom: 0; }
    .cs-step:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; border-radius: 10px; }
    .cs-step > b { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; background: var(--accent-tint);
      color: var(--accent-ink); font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .cs-step > span { flex: 1 1 auto; min-width: 0; }
    .cs-step em { display: block; font-style: normal; font-size: var(--fs-body-sm, 15px); font-weight: 700; }
    .cs-step small { display: block; font-size: 13px; color: var(--text-dim); margin-top: 1px; }
    .cs-step > u { flex: 0 0 auto; text-decoration: none; color: var(--accent-dark); opacity: .6; }
    /* 챌린지 추천 칸 — 스텝(번호)과 구분되는 별도 자리(2026-08-06 오너 확정: 추천 형식).
       ⚠️ CTA 는 '모집 일정' — 신청을 약속하지 않는다. 모집 여부 판단은 챌린지 페이지가 한다. */
    .cs-reco { display: flex; align-items: center; gap: 11px; margin-top: 8px; padding: 12px;
      background: var(--accent-tint); border-radius: 12px; text-decoration: none; color: var(--text); }
    .cs-reco:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .cs-reco > span { flex: 1 1 auto; min-width: 0; }
    .cs-reco em { display: block; font-style: normal; font-size: 12px; font-weight: 800;
      letter-spacing: .06em; color: var(--accent-ink); }
    .cs-reco b { display: block; font-size: 14px; font-weight: 700; margin-top: 3px; line-height: 1.4; }
    .cs-reco small { display: block; font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
    .cs-reco > u { flex: 0 0 auto; text-decoration: none; color: var(--accent-ink); font-weight: 800; font-size: 13px; }
    /* ⚠️ 시간만 적는다 — 금액을 여기 적지 말 것(2026-08-05 오너 확정). 단가·잔액은 각 도구
       페이지가 말한다. 여기에 숫자를 적으면 단가·팩 가격이 바뀔 때마다 두 곳이 어긋난다. */
    .cs-meta { margin-top: 10px; padding: 10px 12px; background: var(--accent-tint); border-radius: 12px;
      font-size: 13px; font-weight: 700; color: var(--accent-ink); }
    .cs-cta { display: block; width: 100%; margin-top: 12px; padding: 14px 0; border: 0; border-radius: 999px;
      background: var(--action); color: var(--action-ink); font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer; }
    .cs-cta:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 3px; }
    .cs-note { margin-top: 8px; text-align: center; font-size: 12px; color: var(--text-dim); }
    .cs-err { margin-top: 8px; text-align: center; font-size: 13px; font-weight: 700; color: #B3261E; }

    /* ── 자유 선택 — 큰 사각 버튼 박스 + 라인 아이콘(2026-08-06 오너 확정) ──
       구 글자 원형은 "허접하다"로 기각, 엠보스 원판도 기각("동그라미 말고 사각형").
       판을 없앤 안(C)도 기각 — 오너가 원한 건 **네모 버튼 박스를 키우는 것**이다.
       박스는 칸 폭을 꽉 채우되 98px 을 넘지 않는다(데스크톱 열에서 부푸는 걸 막는다).
       ⚠️ **아이콘을 키울 때 선 굵기를 같이 키우지 말 것.** 이 결이 사는 이유는 큰 게 아니라
          '크면서 선이 얇은' 것이다. 화면 선두께 = stroke-width × (렌더크기 ÷ 24) 이므로
          52px 에서 1.6px 이 되게 0.74 를 쓴다. 크기를 바꾸면 이 값도 다시 계산한다.
       ⚠️ **굵기는 심볼이 아니라 여기(바깥 svg)에서 준다** — 심볼에 stroke-width 를 적어 두면
          use 그림자 트리에서 그 값이 이겨 CSS 조절이 안 먹는다(실측 확인).
       ⚠️ 카드 안에 넣지 말 것(흰 카드 안 흰 박스는 그림자가 겹친다) · 긴 대각 그림자 금지. */
    .fr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 8px; margin: 16px auto 0; }
    .fr-c { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 0 4px;
      font-size: 12.5px; font-weight: 700; line-height: 1.3; text-align: center;
      text-decoration: none; color: var(--text); }
    .fr-c:focus-visible { outline: 3px solid var(--action); outline-offset: 3px; border-radius: 26px; }
    .fr-ic { width: 100%; max-width: 98px; aspect-ratio: 1 / 1; border-radius: 26px;
      background: #FFFFFF; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center; color: var(--accent-ink);
      box-shadow: 0 6px 14px rgba(23,42,71,.10), 0 1px 3px rgba(23,42,71,.06),
        inset 0 -2px 4px rgba(23,42,71,.04), inset 0 2px 3px rgba(255,255,255,.9); }
    .fr-ic svg { stroke-width: .74; }
    @media (hover: hover) { .fr-c:hover .fr-ic {
      box-shadow: 0 9px 20px rgba(23,42,71,.15), 0 1px 3px rgba(23,42,71,.07),
        inset 0 -2px 4px rgba(23,42,71,.04), inset 0 2px 3px rgba(255,255,255,.9); } }

    /* ── B: '오늘 이어서' 카드 ── */
    .today { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 18px;
      padding: 16px; margin-top: 20px; box-shadow: 0 2px 12px rgba(23,42,71,.06); }
    .today-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .today-hd b { font-size: 15px; font-weight: 800; }
    /* 글자는 작게 두되 누를 자리는 넓힌다(음수 마진으로 보이는 크기는 그대로).
       ⚠️ line-height 를 적어야 44px 이 된다 — 버튼은 body 의 행간을 물려받지 않아
          기본값(약 16px)으로 계산되면 40px 에서 멈춘다(실측). */
    .today-hd button { appearance: none; background: none; border: 0; font-family: inherit; cursor: pointer;
      font-size: 13px; line-height: 20px; font-weight: 700; color: var(--text-dim); text-decoration: underline;
      padding: 12px 8px; margin: -12px -8px; }
    .today-hd button:focus-visible { outline: 3px solid var(--action); outline-offset: 0; border-radius: 8px; }

    .bf-foot { max-width: 600px; margin: 0 auto; padding: 0 0 80px; }

    /* ══ 상태 전환 — 기본은 A(코스 선택 전). B 요소는 감춰 두고 클래스로 켠다.
       ⚠️ 첫 그리기는 아래 <body> 직후의 '기기 기억'이 정한다(nav.js 와 같은 수법) —
          서버 확인을 기다렸다가 켜면 A→B 로 화면이 한 번 뒤집혀 깜빡인다. ══ */
    #heroMine, #todayCard { display: none; }
    body.has-course #heroPublic { display: none; }
    body.has-course #heroMine, body.has-course #todayCard { display: block; }
    body.has-course #pickSection { display: none; }
    body.has-course.changing #pickSection { display: block; }

    /* 320px 실측 대응 — 활자는 12px 하한이라 못 줄이므로 여백만 좁힌다 */
    @media (max-width: 360px) {
      .container { padding: 0 12px; }
      .fr-grid { gap: 8px; }
      .cs-row { gap: 10px; padding: 10px 10px 10px 8px; }
      .cs-lv { flex-basis: 56px; font-size: 19px; }
      .cs-tx b { font-size: 14px; }
      .fr-c { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { .cs-row > i { transition: none; } }
  </style>
</head>

<script>
/* 기기 기억으로 '첫 화면'을 정한다 — nav.js 의 로그인 기억(monc_nav_auth_v1)과 같은 수법.
   서버 확인(0.3~1초)을 기다려 켜면 코스를 고른 회원이 매번 A→B 뒤집힘을 본다.
   ⚠️ 이 기억은 그리기용일 뿐 권한이 아니다 — 진짜 값은 아래 boot() 가 members 에서 읽어 바로잡는다.
   ⚠️ supabase 토큰이 기기에 없으면(로그아웃) 기억도 지운다. */
(function () {
  try {
    var hasToken = false;
    for (var i = 0; i < localStorage.length; i++) {
      if (/^sb-[a-z0-9]+-auth-token$/.test(localStorage.key(i) || '')) { hasToken = true; break; }
    }
    if (!hasToken) { localStorage.removeItem('monc_course_v1'); return; }
    var h = JSON.parse(localStorage.getItem('monc_course_v1') || 'null');
    if (h && h.course) document.body.classList.add('has-course');
  } catch (e) {}
})();

var COURSE_BY = {};
COURSES.forEach(function (c) { COURSE_BY[c.code] = c; });

var HINT_KEY    = 'monc_course_v1';          /* 그리기용 기기 기억(권한 아님) */
var PENDING_KEY = 'monc_pending_course';     /* 로그인하러 갔다 오는 동안만 — sessionStorage */

function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

/* ── 코스 줄 4개 ── */
(function paintRows() {
  document.getElementById('csList').innerHTML = COURSES.map(function (c, i) {
    return '<button class="cs-row" type="button" data-code="' + c.code + '"' +
             ' aria-expanded="false" aria-controls="csDetail">' +
             '<span class="cs-lv" aria-hidden="true">' + esc(c.big) + '</span>' +
             '<span class="cs-tx"><b>' + esc(c.main) + '</b><span>' + esc(c.sub) + '</span></span>' +
             '<i aria-hidden="true">▾</i>' +
           '</button>';
  }).join('');
})();

/* ── 코스 상세 패널(하나를 재사용 — 펼친 줄 바로 아래로 옮긴다) ──
   ⚠️ 처음엔 넷 다 접혀 있다(2026-08-06 오너 확정). picked=null 이 '접힘' 상태다.
      기본으로 하나를 펴 두면 그 코스가 추천처럼 읽히고, 첫 화면에서 리스트가 잘린다. */
var picked = null;                /* 지금 펼친 코스. null = 넷 다 접힘 */

function stepRows(c) {
  return c.steps.map(function (s, i) {
    return '<a class="cs-step" href="' + esc(s[2]) + '">' +
             '<b>' + (i + 1) + '</b>' +
             '<span><em>' + esc(s[0]) + '</em><small>' + esc(s[1]) + '</small></span>' +
             '<u aria-hidden="true">→</u>' +
           '</a>';
  }).join('');
}

/* 챌린지 추천 칸 — CTA 는 '모집 일정'(신청을 약속하지 않는다 — 모집 0인 기간이 있다) */
function recoRow(c) {
  if (!c.reco) return '';
  return '<a class="cs-reco" href="challenges.html">' +
           '<span><em>함께하면 좋은 챌린지</em>' +
           '<b>' + esc(c.reco.names) + '</b>' +
           '<small>' + esc(c.reco.desc) + '</small></span>' +
           '<u aria-hidden="true">모집 일정 →</u>' +
         '</a>';
}

/* 접기 — 패널을 비우고 감춘다(줄 넷은 모두 aria-expanded=false) */
function collapseDetail() {
  picked = null;
  var panel = document.getElementById('csDetail');
  panel.hidden = true;
  panel.innerHTML = '';
  [].forEach.call(document.querySelectorAll('.cs-row'), function (b) {
    b.setAttribute('aria-expanded', 'false');
  });
}

function paintDetail(code) {
  var c = COURSE_BY[code]; if (!c) return;
  picked = code;
  var panel = document.getElementById('csDetail');
  panel.hidden = false;
  panel.innerHTML =
    stepRows(c) +
    recoRow(c) +
    '<div class="cs-meta">' + esc(c.time) + '</div>' +
    '<button class="cs-cta" type="button" id="btnStart">이 코스로 시작하기</button>' +
    '<p class="cs-note">코스는 계정에 저장돼요 · 언제든 바꿀 수 있어요</p>' +
    '<p class="cs-err" id="startErr" hidden></p>';
  var rows = document.querySelectorAll('.cs-row');
  [].forEach.call(rows, function (b) {
    b.setAttribute('aria-expanded', String(b.dataset.code === code));
  });
  /* 패널을 펼친 줄 바로 아래로 — 리스트의 gap 이 위아래 간격을 맡는다 */
  var cur = document.querySelector('.cs-row[data-code="' + code + '"]');
  if (cur) cur.insertAdjacentElement('afterend', panel);
  document.getElementById('btnStart').addEventListener('click', function () { startCourse(code); });
}

document.getElementById('csList').addEventListener('click', function (e) {
  var btn = e.target.closest('.cs-row'); if (!btn) return;
  /* 펼쳐 둔 줄을 다시 누르면 접는다 — 초점은 누른 줄에 남긴다(패널이 사라지므로) */
  if (btn.dataset.code === picked) {
    collapseDetail();
    btn.focus({ preventScroll: true });
    return;
  }
  paintDetail(btn.dataset.code);
  /* 화면 낭독기·키보드 사용자가 '내용이 바뀐 곳'으로 따라가게 초점을 옮긴다 */
  document.getElementById('csDetail').focus({ preventScroll: true });
});

/* ── 코스 저장 ─────────────────────────────────────────────────────────────

      (성공한 척 B로 넘어가면 다음 방문에 코스가 사라져 있다) */
function showStartErr(msg) {
  var el = document.getElementById('startErr');
  if (!el) return;
  el.textContent = msg; el.hidden = false;
}

async function startCourse(code) {
  var btn = document.getElementById('btnStart');
  if (btn) { btn.disabled = true; btn.textContent = '저장 중…'; }
  try {
    var session = window.MONC ? await MONC.getSession() : null;
    if (!session) {
      /* 비회원 — 고른 코스를 들고 로그인하러 갔다 온다. sessionStorage 고정(공용 기기). */
      try { sessionStorage.setItem(PENDING_KEY, code); } catch (e) {}
      window.location.href = 'login.html?returnTo=' + encodeURIComponent('briefing.html');
      return;
    }
    var ok = await saveCourse(session.user.id, code);
    if (!ok) {
      showStartErr('지금은 코스 저장이 안 돼요. 잠시 뒤 다시 눌러 주세요.');
      if (btn) { btn.disabled = false; btn.textContent = '이 코스로 시작하기'; }
      return;
    }
    /* 상태 분기를 단순하게 — 저장 뒤엔 통째로 다시 그린다(입력값 없는 화면이라 부작용 없음) */
    window.location.reload();
  } catch (e) {
    showStartErr('지금은 코스 저장이 안 돼요. 잠시 뒤 다시 눌러 주세요.');
    if (btn) { btn.disabled = false; btn.textContent = '이 코스로 시작하기'; }
  }
}

async function saveCourse(uid, code) {
  try {
    var res = await MONC.sb.from('members').update({ course: code }).eq('id', uid);
    if (res.error) { console.warn('코스 저장 실패(마이그레이션 미적용?)', res.error.message); return false; }
    try { localStorage.setItem(HINT_KEY, JSON.stringify({ uid: uid, course: code })); } catch (e) {}
    return true;
  } catch (e) { return false; }
}

/* ── B 화면 채우기 ────────────────────────────────────────────────────────── */
var myCourse = null;              /* 계정에 저장된 코스 — '코스 바꾸기'가 여기서 시작한다 */

function paintMine(name, code) {
  var c = COURSE_BY[code]; if (!c) return;
  myCourse = code;
  document.getElementById('meTitle').innerHTML =
    esc(name || '회원') + ' 님은<br><i>‘' + esc(c.name) + '’</i>를 선택하셨어요.';
  document.getElementById('todaySteps').innerHTML = stepRows(c);
  var cta = document.getElementById('todayCta');
  cta.href = c.cta.href;
  cta.textContent = '오늘 이어서: ' + c.cta.label;
  document.body.classList.add('has-course');
  document.body.classList.remove('changing');
}

/* '코스 바꾸기' — 고르는 화면을 다시 펴 준다. 저장된 코스는 새 코스의 [시작하기]를
   누를 때만 바뀐다(안 고르고 떠나면 그대로). */
document.getElementById('btnChange').addEventListener('click', function () {
  document.body.classList.add('changing');
  /* 지금 쓰는 코스를 펴 놓고 시작한다 — 남의 코스(기본값)부터 보여 주면 뭘 바꾸는지 헷갈린다 */
  if (myCourse) paintDetail(myCourse);
  var sec = document.getElementById('pickSection');
  sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  var cur = sec.querySelector('.cs-row[aria-expanded="true"]') || sec.querySelector('.cs-row');
  if (cur) cur.focus({ preventScroll: true });
});

/* ── 내 기록 숫자 ──────────────────────────────────────────────────────────
   ⚠️ 사이트가 아는 사실만 센다. 0건·조회 실패인 항목은 칩을 안 그린다(빈 껍데기 금지).
   ⚠️ '대화 중'의 정의는 마이페이지와 같아야 한다 — 되묻기만 하고 답변 행이 없는 문제
      (discovery_sessions stage≠done, answers 에 있는 문제는 제외). 한쪽만 고치지 말 것. */
async function loadStats(uid) {
  var answers = null, chats = null, scraps = null;
  try {
    var a = await MONC.sb.from('answers').select('question_id').eq('member_id', uid);
    if (!a.error && a.data) {
      answers = a.data.length;
      var answered = new Set(a.data.filter(function (r) { return r.question_id; })
                                   .map(function (r) { return r.question_id; }));
      try {
        var s = await MONC.sb.from('discovery_sessions').select('question_id, stage').eq('member_id', uid);
        if (!s.error && s.data) {
          chats = s.data.filter(function (r) {
            return r.stage !== 'done' && !answered.has(r.question_id);
          }).length;
        }
      } catch (e) {}
    }
  } catch (e) {}
  try {
    var n = await MONC.sb.from('news_scraps').select('id', { count: 'exact', head: true });
    if (!n.error) scraps = n.count || 0;
  } catch (e) {}

  var chips = [['답변', answers], ['대화 중', chats], ['스크랩', scraps]]
    .filter(function (p) { return p[1]; })          /* null(조회 실패)·0 은 안 그린다 */
    .map(function (p) { return '<b><i>' + p[0] + '</i>' + p[1] + '</b>'; }).join('');
  document.getElementById('meStats').innerHTML = chips;
}

/* ── 부팅 ──────────────────────────────────────────────────────────────────
   기기 기억으로 이미 A/B 를 그려 놨다. 여기서 서버 값으로 바로잡는다. */
(async function boot() {
  if (!window.MONC || !MONC.getSession) return;
  var session = null;
  try { session = await MONC.getSession(); } catch (e) { return; }

  if (!session) {
    try { localStorage.removeItem(HINT_KEY); } catch (e) {}
    document.body.classList.remove('has-course');
    return;
  }
  var uid = session.user.id;

  /* 로그인하러 갔다 온 사람 — 들고 간 코스를 지금 저장한다 */
  var pending = null;
  try { pending = sessionStorage.getItem(PENDING_KEY); } catch (e) {}
  if (pending && COURSE_BY[pending]) {
    var saved = await saveCourse(uid, pending);
    try { sessionStorage.removeItem(PENDING_KEY); } catch (e) {}
    if (!saved) { paintDetail(pending); showStartErr('지금은 코스 저장이 안 돼요. 잠시 뒤 다시 눌러 주세요.'); }
  }

  /* ⚠️ select('*') — course 컬럼 미적용 환경에서도 조회가 깨지지 않게(사이트 관례).
        공용 getMyProfile() 셀렉트에는 course 를 넣지 않는다(major·agreed_at 전례). */
  var row = null;
  try {
    var r = await MONC.sb.from('members').select('*').eq('id', uid).single();
    if (!r.error) row = r.data;
  } catch (e) {}

  var code = row && row.course;
  if (code && COURSE_BY[code]) {
    try { localStorage.setItem(HINT_KEY, JSON.stringify({ uid: uid, course: code })); } catch (e) {}
    paintMine(row.name, code);
    loadStats(uid);
  } else {
    try { localStorage.removeItem(HINT_KEY); } catch (e) {}
    document.body.classList.remove('has-course');
  }
})();
</script>

<script>
/* bfcache — 뒤로/앞으로 오면 크롬은 떠날 때 그리던 화면을 그대로 되살린다(파일을 새로 받지 않는다).
   배포 전에 열어 둔 탭·기록이 있으면 옛 화면이 그대로 뜬다(2026-08-03 오너 지적).
   입력값이 없는 화면이라 통째로 다시 받는다 — lab·answers·mypage 와 같은 규칙(CLAUDE.md).
   ⚠️ 홈(index.html)은 일부러 뺀다 — 뒤로 올 때마다 히어로 애니메이션이 처음부터 다시 돌아 오너가 기각했다. */
window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
</script>
