  <style>
  /* ══════════════════════════════════════════════════════════════════════════
     몬크 연구실 허브 — '출발 안내판' 한 벌 (2026-09-23 오너 확정 "이대로 구현")

     구조는 그대로다(2026-07-31 오너 "간결하게 연구실 / 연구진 이렇게 두개 카드만 딱 나와야지"):
     이 페이지(허브) → 연구실 카드(취업 자료실 lab-shelf.html) / 연구진 카드(researchers.html).

     표면은 2026-09-23 전면 교체. 오너 "지금 너무 밋밋하고 허접해보여" → 1차 3안(사진 자리) →
     "더 고도화되고 차별화된 디자인" → 2차 3안(안내판·서류철·에디토리얼) → "4안이 제일 좋긴한데
     100%는 아니야" + 부족한 점 넷(히어로 밋밋 · 안내판 완성도 · 연구진 카드 약함 · 사진 필요) →
     ④+ 한 벌로 확정. 목업: outputs/lab-hub-revamp-mockup.html(1차) · lab-hub-revamp2-mockup.html(2차) ·
     lab-hub-revamp3-mockup.html(④+ 확정본). 경과·기각안은 docs/notes/lab.md '허브 = 출발 안내판'.

     한 벌의 네 조각 — 리듬은 다크(사진) → 밝음(계기) → 다크(안내판) → 밝음(연구진):
     ① 마스트헤드: 기내 창문 사진(images/cd-outro.webp · 사람 없는 생성 이미지) 위 다크 상자.
        ⚠️ 상자 안이다 — 전체 폭 밴드가 아니다(design-principles '전체 폭 밴드 금지').
        ⚠️ 다크 위 제목은 색을 명시한다(tokens.css h1 기본값 --ink 가 상속되면 제목이 사라진다).
     ② 계기 3칸: 자료·항공사·연구원 — 숫자는 플립 타일(한 자리 = 타일 하나, 가운데 이음선).
     ③ 연구실 카드 = 안내판: 머리 띠 + 코드 타일 · 항공사 · 자료 수 · 갱신일 · NEW(7일 안).
     ④ 연구진 카드 = 같은 언어: 머리 띠 + 얼굴 6장 + 직함 타일.
     ⚠️ 화면 숫자·날짜·NEW 는 전부 실데이터(lab_resource_list). 마크업에 항공사 이름·숫자를 적지 말 것 —
        자료가 빠지면 그 줄이 거짓말이 된다. 조회가 실패하면 안내판 대신 설명 한 줄이 남고 계기는 '—'.

     카드 규격은 2026-08-01 오너 지시 1.5배 한 벌 — padding 28 · 제목 32px · 알약 52px(화살표 24) ·
     설명 16px · 발치 14px. 하나만 되돌리지 말 것.
     ══════════════════════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: clip; touch-action: manipulation; }
  body {
    font-family: 'SUIT Variable', SUIT, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  a { text-decoration: none; color: inherit; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }
  /* 소문자 대문자 라벨 — 활자 하한 12px(design-principles) */
  .caps { font-size: 12px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; }

  /* 상단 여백 104px 는 고정 nav 를 피하는 전 페이지 공통값 */
  .wrap { max-width: 560px; margin: 0 auto; padding: 104px 20px 56px; }

  /* ── 플립 타일 — 숫자 한 자리 = 타일 하나. 가운데 이음선이 전광판 표식.
        role="img"+aria-label 로 낭독기는 숫자를 한 덩어리로 읽는다(자리별 <i> 는 장식). ── */
  .flap { display: inline-flex; gap: 2px; vertical-align: middle; }
  .flap i {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 32px; border-radius: 5px; background: #0E1F3D; color: #FFFFFF;
    font-style: normal; font-weight: 800; font-size: 18px; line-height: 1;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14), 0 1px 0 rgba(0,0,0,0.35);
  }
  .flap i::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,0.6); }
  .flap.lt i { background: var(--action); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 1px 0 rgba(20,32,52,0.25); }
  .flap.lg i { width: 30px; height: 40px; font-size: 22px; border-radius: 6px; }
  .flap.sm i { width: 20px; height: 26px; font-size: 14px; border-radius: 4px; }
  /* 값을 아직 모를 때의 자리 — 숫자 대신 '—' 한 타일(거짓 숫자를 두지 않는다) */
  .flap i.na { color: rgba(241,244,248,0.45); }

  /* ── ① 마스트헤드 = 창문 사진 위 다크 상자 ── */
  .mast {
    position: relative; border-radius: 26px; overflow: hidden; padding: 26px 24px 24px; color: #FFFFFF;
    background: #142C52 url('images/cd-outro.webp') center 38% / cover no-repeat; box-shadow: var(--shadow);
  }
  .mast::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,44,82,0.30) 0%, rgba(20,44,82,0.72) 55%, rgba(14,31,61,0.94) 100%);
  }
  .mast > * { position: relative; }
  .mast-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: rgba(241,244,248,0.85); }
  .mast-x { display: none; }                       /* 'Research board' 꼬리는 넓은 화면에서만 */
  .live-t { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .live-t[hidden] { display: none; }
  .mast h1 { font-family: var(--serif); font-size: 34px; font-weight: 800; line-height: 1.22; letter-spacing: -0.01em; color: #FFFFFF; margin-top: 64px; }
  .mast .sub { font-size: 15px; line-height: 1.62; color: rgba(241,244,248,0.86); margin-top: 10px; max-width: 300px; }
  .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--action-on-dark); }
  @media (prefers-reduced-motion: no-preference) { .live { animation: livePulse 2.6s ease-in-out infinite; } }
  @keyframes livePulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.42; transform: scale(0.8); } }

  /* ── ② 계기 3칸 — 밝은 판 위 네이비 플립 타일 ── */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { padding: 14px 12px 12px; border: 1px solid var(--border-soft); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
  .stat .v { display: flex; align-items: baseline; gap: 5px; }
  .stat .v > span:last-child { font-size: 13px; font-weight: 800; color: var(--text-muted); }
  .stat small { display: block; margin-top: 9px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em; color: var(--text-dim); }

  /* ── 카드 두 장 ── */
  .hub-grid { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
  .hub-card {
    position: relative; display: block; border-radius: 26px; padding: 0 28px 22px; overflow: hidden;
    background: linear-gradient(180deg, #FCFDFF, #EBF1F8);
    border: 1px solid var(--border);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55), var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  @media (hover: hover) {
    .hub-card:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55), var(--shadow-lg); }
  }
  .hub-card:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .hub-card { transition: none; } }
  .card-lab {
    background: linear-gradient(180deg, #1E4079, #142C52);
    border-color: rgba(255,255,255,0.14);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), var(--shadow);
  }
  @media (hover: hover) {
    .card-lab:hover { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), var(--shadow-lg); }
  }
  .card-lab:focus-visible { outline-color: #FFFFFF; }
  /* 머리 띠 — 안내판 상단 레일. 카드 padding 바깥까지 붙여 '판'으로 읽힌다 */
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 -28px; padding: 12px 28px; }
  .card-lab .bar { background: rgba(8,18,38,0.55); color: rgba(241,244,248,0.85); border-bottom: 1px solid rgba(241,244,248,0.12); }
  .hub-card:not(.card-lab) .bar { background: var(--bg3); color: var(--accent-ink); border-bottom: 1px solid var(--border-soft); }
  .bar .r { font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .hub-top { display: flex; align-items: center; gap: 10px; margin-top: 22px; }
  .hub-name { font-family: var(--serif); font-size: 32px; font-weight: 800; letter-spacing: -0.01em; }
  .card-lab .hub-name { color: #FFFFFF; }
  .hub-desc { font-size: 16px; font-weight: 400; line-height: 1.58; color: var(--text-muted); margin-top: 9px; }
  /* ⚠️ 다크 콘솔 위 설명 줄(조회 실패 시 폴백) — 기본 --text-muted 는 이 면에서 대비가 안 나온다 */
  .card-lab .hub-desc { color: rgba(241,244,248,0.86); }
  /* 화살표 알약 — 두 카드 같은 규격(52px 원 + 24px 화살표).
     ⚠️ margin-left:auto 는 알약에만 준다 — 알약 '안'의 svg 에 걸리면 화살표가 원 오른쪽 끝으로
        밀려 가운데가 어긋난다(2026-08-01 실측). 밝은 카드 = 네이비 원 + 흰 화살표 / 다크 = 흰 원 + 네이비. */
  .pill {
    margin-left: auto; flex: none; width: 52px; height: 52px; border-radius: 50%;
    background: var(--action); color: var(--action-ink);
    display: flex; align-items: center; justify-content: center;
  }
  .pill svg { width: 24px; height: 24px; }
  .card-lab .pill { background: #FFFFFF; color: var(--action); }
  .hub-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 20px; padding-top: 16px;
    border-top: 1px dashed rgba(23,42,71,0.22);
    font-size: 14px; font-weight: 700; color: var(--text-dim);
  }
  .hub-meta b { font-weight: 800; color: var(--text); }
  /* ⚠️ 위 display:flex 가 UA 의 [hidden]{display:none} 을 이긴다 — 이 줄이 없으면
     조회가 끝나기 전·실패 시 발치가 빈 채로 뜬다(2026-08-17 실측). */
  .hub-meta[hidden], .board[hidden] { display: none; }
  .card-lab .hub-meta { border-color: rgba(241,244,248,0.3); color: rgba(241,244,248,0.78); }
  .card-lab .hub-meta b { color: #FFFFFF; }

  /* ── ③ 안내판 표 — 코드 · 항공사 · 자료 · 갱신 ──
        ⚠️ 375px 에서 카드 안쪽은 277px 뿐이다. 칸 폭(40·44·42 + 간격 8×3 = 150)을 빼면 이름 칸이 127px 라
           '트리니티항공'(96px) 옆에 NEW 배지(40px)가 들어가지 않는다(실측 — 배지가 자료 칸을 밀었다).
           그래서 좁은 화면은 배지 대신 **갱신일을 밝히고 이름 뒤에 점**을 찍는다. 배지는 ≥760px 에서만. */
  .board { margin-top: 16px; }
  .board-h { display: grid; grid-template-columns: 40px 1fr 44px 42px; gap: 8px; padding: 0 0 8px; color: rgba(241,244,248,0.5); }
  .board-h span:nth-child(3), .board-h span:nth-child(4), .brow .b-n, .brow .b-d { text-align: right; justify-self: end; }
  .brow { display: grid; grid-template-columns: 40px 1fr 44px 42px; gap: 8px; align-items: center; min-height: 50px; border-top: 1px solid rgba(241,244,248,0.12); }
  .b-code {
    display: inline-flex; align-items: center; justify-content: center; height: 28px; width: 40px; border-radius: 5px;
    font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #FFFFFF; background: #0E1F3D;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); position: relative;
  }
  .b-code::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,0.5); }
  .b-code.dim { color: rgba(241,244,248,0.6); }
  /* 이름은 320px 에서 두 줄로 접힐 수 있다(잘리는 것보다 낫다).
     ⚠️ body 의 word-break:keep-all 은 '트리니티항공'을 한 단어로 봐서 못 접는다 — 여기서만 풀어 준다(실측 320px 넘침). */
  .b-name { font-size: 16px; font-weight: 700; line-height: 1.3; color: rgba(241,244,248,0.95); display: flex; align-items: center; gap: 6px; min-width: 0;
    word-break: normal; overflow-wrap: anywhere; }
  .b-name.dim { color: rgba(241,244,248,0.72); }
  .b-new { display: none; flex: none; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; padding: 2px 6px; border-radius: 4px; background: var(--action-on-dark); color: #142C52; font-style: normal; }
  .b-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--action-on-dark); }
  .b-n { display: inline-flex; align-items: baseline; gap: 3px; }
  .b-n > span:last-child { font-size: 12px; font-weight: 700; color: rgba(241,244,248,0.7); }
  .b-d { font-size: 13px; font-weight: 700; color: rgba(241,244,248,0.62); }
  .b-d.new { color: var(--action-on-dark); font-weight: 800; }
  .bar-x { display: none; }                        /* 머리 띠 꼬리 '· 항공사별'은 넓은 화면에서만 */

  /* ── ④ 연구진 카드 — 사진 6장 3열 2행 + 직함 타일.
        2026-08-01 오너 확정: 이름은 빼고 사진을 키운다, 모양은 세로 4:5(researchers.html .mi-photo 와 같은 비율).
        ⚠️ 한 줄 6장으로 되돌리지 말 것 — 375px 에서 카드 안쪽이 293px 라 사진이 41px 로 주저앉는다(실측).
        ⚠️ 사진 초점(object-position)은 researchers-data.js 의 photoPos 가 원본. ── */
  .ppl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
  .ppl img {
    width: 100%; aspect-ratio: 4/5; border-radius: 14px; display: block;
    object-fit: cover; object-position: center 18%; background: var(--accent-tint);
  }
  .roles { gap: 14px; }
  .role { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--text-muted); }

  .foot-note { margin-top: 40px; text-align: center; font-size: 12px; font-weight: 400; color: var(--text-dim); }

  /* ══ 넓은 화면 = 좌우 2단 (2026-08-02 오너 "위아래 보다는 좌우로 보여지게") ══
     마스트헤드는 제목(왼쪽) + 설명(오른쪽 아래), 카드 두 장은 나란히 6:4(연구실 넓게 —
     자료가 주인공이라는 위계를 폭으로 말한다. 5안 비교 후 "C안으로 가자").
     ⚠️ 375px 는 위아래 그대로 — 폰에서 두 장을 나란히 두면 얼굴 3열이 41px 로 주저앉는다.
     ⚠️ 연구진 카드의 min-width:332px 를 내리지 말 것 — 이 폭이라야 얼굴 3열이 84px(375px 폰과 같은
        크기, 문서의 하한)로 나온다. 40% 만 주면 760px 에서 카드가 288px 로 좁아져 얼굴이 68px 가 된다.
     ⚠️ 2단으로 바꾼다고 카드 규격(padding 28·제목 32px·알약 52px)을 줄이지 말 것. */
  @media (min-width: 760px) {
    .wrap { max-width: 920px; }
    .mast { padding: 30px 34px 30px; display: grid; grid-template-columns: 1fr auto; align-items: end; column-gap: 40px; }
    .mast-bar { grid-column: 1 / -1; }
    .mast-x { display: inline; }
    .mast h1 { margin-top: 56px; font-size: 40px; }
    .mast .sub { grid-column: 2; grid-row: 2; align-self: end; max-width: 360px; margin: 0 0 6px; }
    .stats { max-width: 560px; }
    .hub-grid { flex-direction: row; align-items: stretch; }
    .hub-card { min-width: 0; display: flex; flex-direction: column; }
    .card-lab { flex: 1 1 0; }
    .hub-card:not(.card-lab) { flex: 0 1 40%; min-width: 332px; }
    .ppl { margin-bottom: 20px; }
    .hub-meta { margin-top: auto; }
    /* 안내판은 회사 수만큼 줄이 선다 — 남는 높이는 줄 간격이 아니라 발치 위 여백으로 간다 */
    .board-h, .brow { grid-template-columns: 52px 1fr 70px 60px; gap: 10px; }
    .brow { min-height: 54px; }
    .b-code { width: 52px; }
    .b-new { display: inline-block; }              /* 넓은 화면은 배지, 점은 숨긴다 */
    .b-dot { display: none; }
    .bar-x { display: inline; }
  }
  </style>
</head>
<body>

<main class="wrap">

  <!-- ① 마스트헤드 — 오른쪽 '갱신 N일 전'은 실데이터가 온 뒤에만 켠다 -->
  <header class="mast">
    <div class="mast-bar">
      <span class="caps">MONC LAB<span class="mast-x"> · Research board</span></span>
      <span class="live-t num" id="labLive" hidden><i class="live"></i><span id="labLiveT"></span></span>
    </div>
    <h1>몬크 연구실 &amp; 연구진</h1>
    <p class="sub">항공사별 자료와 기출문제까지 — 연구진이 모아 정리합니다.</p>
  </header>

  <!-- ② 계기 3칸 — 값은 JS 가 채운다. 채우기 전엔 '—' 타일(거짓 숫자를 두지 않는다) -->
  <div class="stats num">
    <div class="stat"><div class="v"><span class="flap lt lg" id="stDocs" role="img" aria-label="자료 수 확인 중"><i class="na">—</i></span><span>건</span></div><small>자료</small></div>
    <div class="stat"><div class="v"><span class="flap lt lg" id="stAir" role="img" aria-label="항공사 수 확인 중"><i class="na">—</i></span><span>곳</span></div><small>항공사</small></div>
    <div class="stat"><div class="v"><span class="flap lt lg" id="stPpl" role="img" aria-label="연구원 수 확인 중"><i class="na">—</i></span><span>명</span></div><small>연구원</small></div>
  </div>

  <div class="hub-grid">

    <!-- ③ 연구실 = 안내판. 2026-09-22 서가 접기로 학생 화면 서가가 '취업 자료실' 하나라 원장(lab-archive.html)을
         건너뛰고 자료 목록으로 바로 보낸다(원문 href="lab-archive.html" · docs/notes/lab.md '서가 접기'). -->
    <a class="hub-card card-lab" href="lab-shelf.html?shelf=airline">
      <div class="bar"><span class="caps">Research board<span class="bar-x"> · 항공사별</span></span><span class="r"><i class="live"></i>연구 진행 중</span></div>
      <div class="hub-top">
        <h2 class="hub-name">연구실</h2>
        <span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </div>
      <!-- ⚠️ 줄·숫자·날짜는 JS 가 실데이터로 채운다 — 마크업에 항공사 이름을 적지 말 것.
           채우기 전·실패 시에는 아래 설명 줄이 남는다. -->
      <div class="board num" id="labBoard" hidden></div>
      <p class="hub-desc" id="labDesc">항공사별 자료와 기출을 연구진이 모아 정리합니다.</p>
      <p class="hub-meta num" id="labMeta" hidden></p>
    </a>

    <!-- ④ 연구진 — 얼굴·인원수·직함 구성은 researchers-data.js 에서 JS 로 생성(페이지에 복사 금지) -->
    <a class="hub-card" href="researchers.html">
      <div class="bar"><span class="caps">Researchers</span><span class="r num" id="labPplN">연구원</span></div>
      <div class="hub-top">
        <h2 class="hub-name">연구진</h2>
        <span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </div>
      <p class="hub-desc">자료를 만들고 검수하는 사람들 — 이력과 전문 분야를 소개합니다.</p>
      <div class="ppl" id="labPpl"></div>
      <div class="hub-meta num roles" id="labPplMeta"></div>
    </a>

  </div>

  <p class="foot-note" id="labFoot" hidden></p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
/* ══ 안내판·계기 — lab_resource_list(airline·question) 실데이터 (2026-09-23) ══════════
   자료실은 DB shelf 두 값(airline·question)이 한 서가다 — 둘을 합쳐 센다.
   항공사별 자료 수·최신 갱신일을 내고, 7일 안에 올라온 회사엔 NEW 를 붙인다.
   ⚠️ 항공사가 없는 자료(전 항공사 공통)는 회사로 세지 않는다 — 맨 아래 'ALL' 한 줄.
   ⚠️ 조회가 실패하면 안내판을 그리지 않고 설명 줄(#labDesc)이 남는다. 계기는 '—' 그대로. */
(function () {
  'use strict';
  var AIRLINE = {
    kal:       { name: '대한항공',     code: 'KE' },
    asiana:    { name: '아시아나항공', code: 'OZ' },
    jinair:    { name: '진에어',       code: 'LJ' },
    jejuair:   { name: '제주항공',     code: '7C' },
    twayair:   { name: '트리니티항공', code: 'TW' },
    airbusan:  { name: '에어부산',     code: 'BX' },
    airseoul:  { name: '에어서울',     code: 'RS' },
    eastarjet: { name: '이스타항공',   code: 'ZE' },
    airpremia: { name: '에어프레미아', code: 'YP' },
    aerok:     { name: '에어로케이',   code: 'RF' }
  };
  var NEW_DAYS = 7;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function relTime(iso) {
    var h = Math.floor((Date.now() - new Date(iso).getTime()) / 36e5);
    if (h < 1) return '방금';
    if (h < 24) return h + '시간 전';
    var d = Math.floor(h / 24);
    return d < 30 ? d + '일 전' : new Date(iso).toISOString().slice(5, 10).replace('-', '.');
  }
  function mmdd(iso) { var d = new Date(iso); return String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0'); }
  /* 플립 타일 — 숫자 한 자리가 타일 하나 */
  function tiles(n) { return String(n).split('').map(function (c) { return '<i>' + c + '</i>'; }).join(''); }
  function setStat(id, n, unit) {
    var el = document.getElementById(id);
    el.innerHTML = tiles(n);
    el.setAttribute('aria-label', n + unit);
  }

  if (!window.MONC || !window.MONC.sb) return;
  Promise.all(['airline', 'question'].map(function (s) {
    return window.MONC.sb.rpc('lab_resource_list', { p_shelf: s, p_airline: null });
  })).then(function (reses) {
    if (reses.some(function (r) { return r.error; })) return;
    var rows = [];
    reses.forEach(function (r) { rows = rows.concat(r.data || []); });
    if (!rows.length) {
      var f = document.getElementById('labFoot');
      f.textContent = '자료는 준비되는 대로 채워집니다.';
      f.hidden = false;
      return;
    }

    var by = {}, last = null;
    rows.forEach(function (d) {
      var k = (d.airline && AIRLINE[d.airline]) ? d.airline : '_';
      if (!by[k]) by[k] = { n: 0, last: null };
      by[k].n += 1;
      var t = d.published_at || d.created_at || null;
      if (t && (!by[k].last || t > by[k].last)) by[k].last = t;
      if (t && (!last || t > last)) last = t;
    });
    var slugs = Object.keys(by).filter(function (k) { return k !== '_'; })
      .sort(function (a, b) { return (by[b].n - by[a].n) || String(by[b].last).localeCompare(String(by[a].last)); });

    /* 계기: 자료 수 · 항공사 수. 연구원 수는 researchers-data.js 쪽 스크립트가 채운다. */
    setStat('stDocs', rows.length, '건');
    setStat('stAir', slugs.length, '곳');

    /* 마스트헤드 오른쪽 — 마지막 갱신 */
    if (last) {
      document.getElementById('labLiveT').textContent = '갱신 ' + relTime(last);
      document.getElementById('labLive').hidden = false;
    }

    /* 안내판 */
    var fresh = Date.now() - NEW_DAYS * 864e5;
    /* NEW 표식은 둘이 한 벌 — 넓은 화면은 배지, 좁은 화면은 이름 뒤 점 + 밝힌 갱신일(CSS 가 폭에 따라 고른다) */
    function row(code, name, n, at, dim) {
      var isNew = at && new Date(at).getTime() >= fresh;
      return '<div class="brow">'
        + '<span class="b-code' + (dim ? ' dim' : '') + '">' + esc(code) + '</span>'
        + '<span class="b-name' + (dim ? ' dim' : '') + '">' + esc(name)
          + (isNew ? '<i class="b-new">NEW</i><i class="b-dot" aria-hidden="true"></i>' : '') + '</span>'
        + '<span class="b-n"><span class="flap sm" role="img" aria-label="' + n + '건">' + tiles(n) + '</span><span>건</span></span>'
        + '<span class="b-d' + (isNew ? ' new' : '') + '">' + (at ? mmdd(at) : '—') + '</span>'
        + '</div>';
    }
    var html = '<div class="board-h caps"><span>코드</span><span>항공사</span><span>자료</span><span>갱신</span></div>'
      + slugs.map(function (k) { return row(AIRLINE[k].code, AIRLINE[k].name, by[k].n, by[k].last, false); }).join('')
      + (by._ ? row('ALL', '공통', by._.n, by._.last, true) : '');   // 항공사 없는 자료 — 짧게 '공통'(375px 이름 칸 127px)
    var board = document.getElementById('labBoard');
    board.innerHTML = html;
    board.hidden = false;
    document.getElementById('labDesc').hidden = true;   // 안내판이 서면 설명은 물러난다

    var meta = document.getElementById('labMeta');
    meta.innerHTML = '자료 <b>' + rows.length + '</b>건 · 항공사 <b>' + slugs.length + '</b>곳' + (last ? ' · 갱신 ' + relTime(last) : '');
    meta.hidden = false;
  }).catch(function () {});
})();
</script>

<script src="researchers-data.js" defer></script>
<script>
/* 연구진 얼굴·인원수·직함 구성은 researchers-data.js 단일 원본에서 생성 — 페이지에
   복사 금지(연구원이 바뀌면 카드도 같이 바뀌어야 한다).
   ⚠️ 카드에 쓰는 문구는 배열에서 셀 수 있는 사실만. 출신 항공사·경력 연수처럼
      position 문자열을 파싱해야 나오는 값은 넣지 말 것(데이터가 바뀌면 조용히 틀어진다).
   스크립트가 못 돌면 얼굴 줄·직함 타일이 비고 머리 띠의 '연구원'만 남는다. */
document.addEventListener('DOMContentLoaded', function () {
  var list = window.MONC_RESEARCHERS || [];
  var box = document.getElementById('labPpl');
  if (!box || !list.length) return;

  list.forEach(function (r) {
    var img = document.createElement('img');
    /* ⚠️ loading:'lazy' 금지 — 첫 화면 카드라 이득이 없고, 프리뷰(숨김 탭)에서
       영영 로드되지 않아 검증이 막힌다(전례 기록: docs/notes/lab.md). */
    img.src = r.photo;
    // 이름을 화면에 쓰지 않으므로 alt 가 유일한 설명이다(빈 alt 로 두지 말 것)
    img.alt = r.name;
    if (r.photoPos) img.style.objectPosition = r.photoPos;
    box.appendChild(img);
  });

  function tiles(n) { return String(n).split('').map(function (c) { return '<i>' + c + '</i>'; }).join(''); }

  /* 인원수 — 머리 띠 + 계기 3칸의 '연구원' */
  document.getElementById('labPplN').textContent = '연구원 ' + list.length + '명';
  var st = document.getElementById('stPpl');
  st.innerHTML = tiles(list.length);
  st.setAttribute('aria-label', list.length + '명');

  /* 직함 구성 — '수석 연구원' 같은 role 문자열에서 '연구원'을 떼어 묶는다 → 직함 타일 */
  var rank = {};
  list.forEach(function (r) {
    var k = String(r.role || '').replace(/\s*연구원\s*$/, '').trim();
    if (k) rank[k] = (rank[k] || 0) + 1;
  });
  var meta = document.getElementById('labPplMeta');
  meta.innerHTML = Object.keys(rank).map(function (k) {
    return '<span class="role"><span class="flap lt sm" role="img" aria-label="' + k + ' ' + rank[k] + '명">' + tiles(rank[k]) + '</span>' + k + '</span>';
  }).join('');
});
</script>

<script>
/* bfcache — 뒤로/앞으로 가면 크롬이 **떠날 때 그리던 화면을 그대로 되살린다**(새로 받지 않는다).
   배포 전에 열어 둔 탭이 있으면 옛 화면이 그대로 떠서 "고쳤는데 왜 옛 화면이 깜빡이냐"가
   된다(2026-08-03 오너 지적). 입력값이 없는 화면이라 통째로 다시 받는다 — CLAUDE.md 규칙. */
window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
</script>
