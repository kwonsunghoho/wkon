  <style>
  /* ══════════════════════════════════════════════════════════════════════════
     몬크 연구실 허브 — 카드 두 장(2026-07-31 오너 확정) + ②안 '콘솔' 표면
     ("뭔가 밋밋하지않냐" → 3안 목업 outputs/lab-hub-flavor-mockup.html 중
      ② 채택 — "2안이 좋어보인다")

     오너: "간결하게 연구실 / 연구진 이렇게 두개 카드만 딱 나와야지 그게 허브 아니냐고."
     구조: 이 페이지(허브) → 연구실 카드(lab-archive.html 원장) / 연구진 카드(researchers.html).

     ②안 콘솔 = 도구와 사람의 대비:
     - 연구실 카드: 다크 네이비 콘솔(#1E4079→#142C52) + 서가 목차 5줄(점선 리더) +
       '연구 진행 중' 라이브 점. 다크 위 강조는 --action-on-dark, CTA 는 흰 알약+네이비
       화살표(디자인 공통 규칙). 목차 5줄은 lab-archive.html 서가와 같은 순서·수치.
     - 연구진 카드: 레터프레스 종이(#FCF9F1→#F3EEE1) 그대로 + 얼굴 6개.
       ⚠️ 얼굴·인원수는 researchers-data.js 단일 원본에서 JS 로 생성 — 여기 복사 금지.
     ⚠️ 자료 수·갱신 시각은 아직 예시(foot-note 가 밝힘). 연구원 수는 실제 값.
     ══════════════════════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: clip; touch-action: manipulation; }
  body {
    font-family: 'SUIT Variable', SUIT, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  a { text-decoration: none; color: inherit; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px 56px; }

  /* ── 히어로 — 상단 여백 104px 는 고정 nav 를 피하는 전 페이지 공통값 ── */
  .hero { padding: 104px 0 0; }
  .hero-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent-ink); }
  .hero h1 { font-family: var(--serif); font-size: 34px; font-weight: 800; line-height: 1.22; letter-spacing: -0.01em; margin-top: 10px; }
  .hero-sub { font-size: 15px; font-weight: 500; line-height: 1.62; color: var(--text-muted); margin-top: 12px; }

  /* ── 허브 카드 두 장 ── */
  .hub-grid { display: flex; flex-direction: column; gap: 14px; margin-top: 26px; }
  .hub-card {
    display: block; border-radius: var(--radius); padding: 20px 20px 16px;
    background: linear-gradient(180deg, #FCF9F1, #F3EEE1);
    border: 1px solid var(--border);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55), var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  @media (hover: hover) {
    .hub-card:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55), var(--shadow-lg); }
  }
  .hub-card:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .hub-card { transition: none; } }
  .hub-top { display: flex; align-items: center; gap: 10px; }
  .hub-name { font-family: var(--serif); font-size: 25px; font-weight: 800; letter-spacing: -0.01em; }
  .hub-desc { font-size: 14.5px; font-weight: 500; line-height: 1.58; color: var(--text-muted); margin-top: 7px; }
  .hub-meta {
    display: flex; align-items: center; gap: 7px; margin-top: 15px; padding-top: 12px;
    border-top: 1px dashed rgba(38,34,28,0.22);
    font-size: 12.5px; font-weight: 600; color: var(--text-dim);
  }
  .hub-meta b { font-weight: 800; color: var(--text); }

  /* ── 연구실 카드 = 다크 콘솔(②안). 밝은 활자는 --text-on-dark(#F5F1E8)의 rgba ── */
  .card-lab {
    background: linear-gradient(180deg, #1E4079, #142C52);
    border-color: rgba(255,255,255,0.14);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), var(--shadow);
  }
  @media (hover: hover) {
    .card-lab:hover { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), var(--shadow-lg); }
  }
  .card-lab:focus-visible { outline-color: #FFFFFF; }
  .card-lab .hub-name { color: #FFFFFF; }
  /* 화살표 버튼 — 두 카드 같은 규격(40px 원 + 20px 화살표)으로 오른쪽 끝을 맞춘다.
     ⚠️ margin-left:auto 는 알약에만 준다 — 알약 '안'의 svg 에 걸리면 화살표가 원
        오른쪽 끝으로 밀려 가운데가 어긋난다(2026-08-01 실측: 왼쪽 18px·오른쪽 0px).
     밝은 종이 카드 = 네이비 원 + 흰 화살표 / 다크 콘솔 카드 = 흰 원 + 네이비 화살표. */
  .pill {
    margin-left: auto; flex: none; width: 40px; height: 40px; border-radius: 50%;
    background: var(--action); color: var(--action-ink);
    display: flex; align-items: center; justify-content: center;
  }
  .card-lab .pill { background: #FFFFFF; color: var(--action); }
  .card-lab .hub-meta { border-color: rgba(245,241,232,0.3); color: rgba(245,241,232,0.78); }
  .card-lab .hub-meta b { color: #FFFFFF; }

  /* 서가 목차 5줄 — 점선 리더. 순서·수치는 lab-archive.html 서가와 같게 유지 */
  .ix { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
  .ix-row { display: flex; align-items: baseline; gap: 9px; font-size: 14px; }
  .ix-name { flex: none; font-weight: 600; color: rgba(245,241,232,0.93); }
  .ix-lead { flex: 1; border-bottom: 2px dotted rgba(245,241,232,0.28); position: relative; top: -3px; min-width: 18px; }
  .ix-n { flex: none; min-height: 20px; font-weight: 800; color: var(--action-on-dark); }
  .ix-n span { font-size: 12.5px; font-weight: 700; }

  /* 연구 진행 신호 */
  .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--action-on-dark); }
  @media (prefers-reduced-motion: no-preference) { .live { animation: livePulse 2.6s ease-in-out infinite; } }
  @keyframes livePulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.42; transform: scale(0.8); } }

  /* 연구진 얼굴 6개 + 이름 — researchers-data.js 에서 JS 로 채운다.
     겹쳐 쌓지 않고 6열로 편 이유: 이름을 붙이려면 얼굴과 1:1 로 보여야 한다.
     칸 폭은 flex 로 나눠 좁은 기기(360px)에서도 줄바꿈 없이 들어간다 — 얼굴 상한 42px. */
  .ppl { display: flex; gap: 8px; margin-top: 15px; }
  .ppl-item { flex: 1 1 0; min-width: 0; text-align: center; }
  .ppl-item img {
    width: 100%; max-width: 42px; aspect-ratio: 1; border-radius: 50%;
    object-fit: cover; object-position: 50% 16%; background: var(--accent-tint);
  }
  /* 이름 12px — 9대원칙 1의 하한. 더 줄이지 말 것(줄이려면 인원을 줄인다) */
  .ppl-name {
    margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--text-muted);
    letter-spacing: -0.02em; white-space: nowrap;
  }

  .foot-note { margin-top: 40px; text-align: center; font-size: 12.5px; font-weight: 500; color: var(--text-dim); }
  </style>
</head>
<body>

<main class="wrap">

  <header class="hero">
    <p class="hero-eyebrow">MONC LAB</p>
    <h1>몬크 연구실</h1>
    <p class="hero-sub">항공사 자료, 기업분석 영상, 기출문제, 면접 현장의 기록까지 — 연구진이 모아 정리합니다.</p>
  </header>

  <div class="hub-grid">

    <a class="hub-card card-lab" href="lab-archive.html">
      <div class="hub-top">
        <h2 class="hub-name">연구실</h2>
        <span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </div>
      <!-- 숫자는 lab_shelf_counts() 가 채운다 — 아래 '—' 는 스크립트 전 자리표시 -->
      <div class="ix num">
        <p class="ix-row" data-shelf="airline"><span class="ix-name">항공사 자료실</span><span class="ix-lead"></span><span class="ix-n"></span></p>
        <p class="ix-row" data-shelf="video"><span class="ix-name">영상관</span><span class="ix-lead"></span><span class="ix-n"></span></p>
        <p class="ix-row" data-shelf="question"><span class="ix-name">기출문제</span><span class="ix-lead"></span><span class="ix-n"></span></p>
        <p class="ix-row" data-shelf="report"><span class="ix-name">현장 리포트</span><span class="ix-lead"></span><span class="ix-n"></span></p>
        <p class="ix-row" data-shelf="calendar"><span class="ix-name">채용 캘린더</span><span class="ix-lead"></span><span class="ix-n"></span></p>
      </div>
      <p class="hub-meta num" id="labMeta"><i class="live"></i></p>
    </a>

    <a class="hub-card" href="researchers.html">
      <div class="hub-top">
        <h2 class="hub-name">연구진</h2>
        <span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </div>
      <p class="hub-desc">자료를 만들고 검수하는 사람들 — 이력과 전문 분야를 소개합니다.</p>
      <div class="ppl" id="labPpl"></div>
      <p class="hub-meta num" id="labPplMeta">연구원 <b>6</b>명</p>
    </a>

  </div>

  <p class="foot-note" id="labFoot" hidden></p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
/* 서가별 자료 수 — lab_shelf_counts() 가 원본. 화면 숫자는 DB 에서 셀 수 있는 값만 쓴다.
   자료가 아직 없으면 목차 줄은 '—' 로 남고 카드 발치가 '자료 준비 중'이 된다. */
(function () {
  'use strict';
  function relTime(iso) {
    var h = Math.floor((Date.now() - new Date(iso).getTime()) / 36e5);
    if (h < 1) return '방금';
    if (h < 24) return h + '시간 전';
    var d = Math.floor(h / 24);
    return d < 30 ? d + '일 전' : new Date(iso).toISOString().slice(5, 10).replace('-', '.');
  }
  /* 목차 줄의 단위 — 마크업에는 숫자도 단위도 두지 않는다(자리표시가 깜빡이던 자리) */
  var UNIT = { airline: '건', video: '편', question: '개', report: '편', calendar: '곳' };

  if (!window.MONC || !window.MONC.sb) return;
  window.MONC.sb.rpc('lab_shelf_counts').then(function (res) {
    if (res.error) return;                       // 미적용 환경이면 조용히 둔다
    var total = 0, last = null;
    var map = {};
    (res.data || []).forEach(function (r) { map[r.shelf] = r; });

    Object.keys(UNIT).forEach(function (key) {
      var cell = document.querySelector('.ix-row[data-shelf="' + key + '"] .ix-n');
      if (!cell) return;
      var n = map[key] ? (Number(map[key].n) || 0) : 0;
      total += n;
      if (map[key] && map[key].last_at && (!last || map[key].last_at > last)) last = map[key].last_at;
      // 자료가 없는 서가는 숫자를 내걸지 않는다(원장의 '준비 중'과 같은 규칙)
      cell.innerHTML = n > 0 ? (n + '<span>' + UNIT[key] + '</span>') : '<span>준비 중</span>';
    });

    var meta = document.getElementById('labMeta');
    meta.innerHTML = '<i class="live"></i>' + (total > 0
      ? '연구 진행 중 · 자료 <b>' + total + '</b>건' + (last ? ' · 갱신 ' + relTime(last) : '')
      : '자료 준비 중');
    if (total === 0) {
      var f = document.getElementById('labFoot');
      f.textContent = '자료는 준비되는 대로 서가별로 채워집니다.';
      f.hidden = false;
    }
  }).catch(function () {});
})();
</script>

<script src="researchers-data.js" defer></script>
<script>
/* 연구진 얼굴·이름·직함 구성은 researchers-data.js 단일 원본에서 생성 — 페이지에
   복사 금지(연구원이 바뀌면 카드도 같이 바뀌어야 한다).
   ⚠️ 카드에 쓰는 문구는 배열에서 셀 수 있는 사실만. 출신 항공사·경력 연수처럼
      position 문자열을 파싱해야 나오는 값은 넣지 말 것(데이터가 바뀌면 조용히 틀어진다).
   스크립트가 못 돌면 얼굴 줄만 비고 마크업의 '연구원 6명'이 남는다. */
document.addEventListener('DOMContentLoaded', function () {
  var list = window.MONC_RESEARCHERS || [];
  var box = document.getElementById('labPpl');
  if (!box || !list.length) return;

  list.forEach(function (r) {
    var item = document.createElement('span');
    item.className = 'ppl-item';
    var img = document.createElement('img');
    /* ⚠️ loading:'lazy' 금지 — 첫 화면 카드라 이득이 없고, 프리뷰(숨김 탭)에서
       영영 로드되지 않아 검증이 막힌다(전례 기록: docs/notes/lab.md). */
    img.src = r.photo; img.alt = '';
    var name = document.createElement('span');
    name.className = 'ppl-name'; name.textContent = r.name;
    item.appendChild(img); item.appendChild(name);
    box.appendChild(item);
  });

  /* 직함 구성 — '수석 연구원' 같은 role 문자열의 앞 두 글자로 묶는다 */
  var rank = {};
  list.forEach(function (r) {
    var k = String(r.role || '').replace(/\s*연구원\s*$/, '').trim();
    if (k) rank[k] = (rank[k] || 0) + 1;
  });
  var parts = Object.keys(rank).map(function (k) { return k + ' ' + rank[k]; });
  var meta = document.getElementById('labPplMeta');
  meta.innerHTML = '연구원 <b>' + list.length + '</b>명' + (parts.length ? ' · ' + parts.join(' · ') : '');
});
</script>
</body>
</html>
