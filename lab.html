  <style>
  /* ══════════════════════════════════════════════════════════════════════════
     몬크 연구실 허브 — 카드 두 장(2026-07-31 오너 확정)

     오너: "간결하게 연구실 / 연구진 이렇게 두개 카드만 딱 나와야지 그게 허브 아니냐고."
     구조: 이 페이지(허브) → 연구실 카드(lab-archive.html 원장) / 연구진 카드(researchers.html).
     그 전에 이 파일에 있던 원장(서가 5종)은 lab-archive.html 로, 연구진 2단 카드 임베드는
     researchers.html 링크로 대체(카드 규격 확정본은 researchers.html 에 그대로 있다).

     카드는 챌린지 허브의 레터프레스 종이 언어(#FCF9F1→#F3EEE1) — 새 색 없음.
     ⚠️ 카드 계기의 자료 수·갱신 시각은 아직 예시(foot-note 가 밝힘). 연구원 6명은 실제 값.
     ══════════════════════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: clip; touch-action: manipulation; }
  body {
    font-family: 'SUIT Variable', SUIT, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  a { text-decoration: none; color: inherit; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px 56px; }

  /* ── 히어로 — 상단 여백 104px 는 고정 nav 를 피하는 전 페이지 공통값 ── */
  .hero { padding: 104px 0 0; }
  .hero-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent-ink); }
  .hero h1 { font-family: var(--serif); font-size: 34px; font-weight: 800; line-height: 1.22; letter-spacing: -0.01em; margin-top: 10px; }
  .hero-sub { font-size: 15px; font-weight: 500; line-height: 1.62; color: var(--text-muted); margin-top: 12px; }

  /* ── 허브 카드 두 장 ── */
  .hub-grid { display: flex; flex-direction: column; gap: 14px; margin-top: 26px; }
  .hub-card {
    display: block; border-radius: var(--radius); padding: 20px 20px 16px;
    background: linear-gradient(180deg, #FCF9F1, #F3EEE1);
    border: 1px solid var(--border);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55), var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  @media (hover: hover) {
    .hub-card:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55), var(--shadow-lg); }
  }
  .hub-card:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .hub-card { transition: none; } }
  .hub-top { display: flex; align-items: center; gap: 10px; }
  .hub-name { font-family: var(--serif); font-size: 25px; font-weight: 800; letter-spacing: -0.01em; }
  .hub-top svg { margin-left: auto; flex: none; color: var(--accent-ink); }
  .hub-desc { font-size: 14.5px; font-weight: 500; line-height: 1.58; color: var(--text-muted); margin-top: 7px; }
  .hub-meta {
    display: flex; align-items: center; gap: 6px; margin-top: 15px; padding-top: 12px;
    border-top: 1px dashed rgba(38,34,28,0.22);
    font-size: 12.5px; font-weight: 600; color: var(--text-dim);
  }
  .hub-meta b { font-weight: 800; color: var(--text); }

  .foot-note { margin-top: 40px; text-align: center; font-size: 12.5px; font-weight: 500; color: var(--text-dim); }
  </style>

<main class="wrap">

  <header class="hero">
    <p class="hero-eyebrow">MONC LAB</p>
    <h1>몬크 연구실</h1>
    <p class="hero-sub">항공사 자료, 기업분석 영상, 기출문제, 면접 현장의 기록까지 — 연구진이 모아 정리합니다.</p>
  </header>

  <div class="hub-grid">

    <a class="hub-card" href="lab-archive.html">
      <div class="hub-top">
        <h2 class="hub-name">연구실</h2>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <p class="hub-desc">항공사 자료실 · 영상관 · 기출문제 · 현장 리포트 · 채용 캘린더</p>
      <p class="hub-meta num">자료 <b>180</b>건 · 갱신 3시간 전</p>
    </a>

    <a class="hub-card" href="researchers.html">
      <div class="hub-top">
        <h2 class="hub-name">연구진</h2>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <p class="hub-desc">자료를 만들고 검수하는 사람들 — 이력과 전문 분야를 소개합니다.</p>
      <p class="hub-meta num">연구원 <b>6</b>명</p>
    </a>

  </div>

  <p class="foot-note">자료 수·갱신 시각은 아직 예시입니다 — 자료가 연결되면 실제 값으로 바뀝니다.</p>

</main>
