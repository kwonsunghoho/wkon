# [1/2] Pages 배포 방식 전환 — 이 커밋은 '설정만' 바꾼다(배포는 안 한다)
#
# ⚠️ 왜 두 단계로 나눴나(2026-08-06)
#   Pages 배포 ID 는 커밋 SHA 그대로다. 그래서 한 커밋에 대해 배포를 만드는 워크플로가
#   둘이면 같은 ID 를 두고 서로 취소시킨다 — 이날 사고의 재현이다.
#   지금은 GitHub 자동 워크플로('pages build and deployment')가 배포를 맡고 있어서,
#   전환 커밋에서 우리 워크플로까지 배포를 만들면 정확히 그 충돌이 난다.
#   그래서 이 커밋은 **설정만 바꾸고**, 배포 단계는 다음 커밋에서 넣는다.
#   설정이 GitHub Actions 로 넘어가는 순간 자동 워크플로는 더 이상 돌지 않으므로
#   다음 커밋부터는 우리 워크플로 하나만 남는다.
#
# 전환 중에도 라이브는 안 끊긴다 — 마지막으로 성공한 배포가 그대로 서빙된다.
name: Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # enablement: true → Pages 빌드 방식을 'Deploy from a branch' 에서
      # 'GitHub Actions' 로 바꾼다. 오너가 Settings 화면에서 누르는 것과 같은 동작이다.
      # ⚠️ 커스텀 도메인(monc.ai.kr)은 레포 루트 CNAME 파일이 소스라 전환해도 유지된다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
