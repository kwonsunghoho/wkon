<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>후기 모음 — MONC 몬크</title>
  <!-- Open Graph / SNS 공유 — 크롤러는 JS 를 안 돌리므로 여기에 직접 둔다.
       ⚠️ 이 페이지는 ?kind= 로 챌린지/상담을 겸하는데 크롤러엔 한 벌만 보인다 —
          공유 카드 문구를 종류별로 나누고 싶으면 그때 페이지를 쪼개야 한다. -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://monc.ai.kr/reviews-list.html" />
  <meta property="og:title"       content="후기 모음 — MONC 몬크" />
  <meta property="og:description" content="MONC 몬크 챌린지·상담 실제 참여자 후기. 기수별·챌린지별로 진짜 후기를 확인하세요." />
  <meta property="og:image"       content="https://monc.ai.kr/images/og-image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale"      content="ko_KR" />
  <meta property="og:site_name"   content="MONC 몬크" />
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="후기 모음 — MONC 몬크" />
  <meta name="twitter:description" content="MONC 몬크 챌린지·상담 실제 참여자 후기. 기수별·챌린지별로 진짜 후기를 확인하세요." />
  <meta name="twitter:image"       content="https://monc.ai.kr/images/og-image.png" />

  <!-- Microsoft Clarity — 방문자 행동 분석(세션 녹화·히트맵·이탈 지점). 프로젝트 xlu6nkv2uh -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xlu6nkv2uh");
  </script>
  <meta name="description" content="MONC 몬크 챌린지·상담 실제 참여자 후기. 기수별·챌린지별로 진짜 후기를 확인하세요." />
  <!-- 파비콘 -->
  <link rel="icon" href="images/MONC_Logo_Full_Package/assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="images/MONC_Logo_Full_Package/assets/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/MONC_Logo_Full_Package/assets/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/MONC_Logo_Full_Package/assets/favicon/apple-touch-icon.png">
  <link rel="mask-icon" href="images/MONC_Logo_Full_Package/assets/favicon/safari-pinned-tab.svg" color="#102B56">
  <link rel="manifest" href="images/MONC_Logo_Full_Package/assets/favicon/site.webmanifest">
  <meta name="theme-color" content="#102B56">
  <link rel="stylesheet" href="tokens.css">
  <!-- 공용 상단 메뉴(2026-07-30) — 마크업은 nav.js 가 심는다. 여기에 nav 를 복사해 넣지 말 것. -->
  <link rel="stylesheet" href="nav.css">
  <script src="nav.js" defer></script>
  <!-- 인앱 브라우저(인스타·카톡) 탈출 안내 — 파일 받기·로그인이 막히는 자리 -->
  <script src="inapp.js?v=10" defer></script>
  <!-- 뒤로 왔을 때 보던 자리로 되돌리기 — 위 bfcache 새로고침이 스크롤을 버리는 걸 메운다 -->
  <script src="scroll-keep.js?v=3"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'SUIT Variable', SUIT,'Apple SD Gothic Neo',-apple-system,sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    .container { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
    a { color: inherit; }

    /* ⚠️ 보조 텍스트는 opacity 로 흐리지 말 것 — opacity:.6 은 베이지 위에서 3.89:1 로
       9대원칙 4번(4.5:1)에 미달한다. 확정 색(#5D5851 = 5.55:1)을 직접 쓴다. */
    :root { --rv-dim: #5D5851; }

    /* HERO — 요약 블록이 실적 숫자를 맡으므로 히어로는 짧게 유지한다 */
    .rv-hero { padding: 92px 0 18px; text-align: center; }
    .rv-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .24em; color: var(--accent-ink); }
    .rv-title { font-family: var(--serif); font-size: clamp(28px, 5vw, 42px); font-weight: 700; color: var(--accent); letter-spacing: -.6px; margin-top: 10px; }
    .rv-lede { font-size: 15px; color: var(--rv-dim); margin-top: 10px; word-break: keep-all; }

    /* 허브로 돌아가는 줄 — 종류별 목록은 허브의 하위 화면이라 되돌아갈 길이 보여야 한다 */
    .rv-back { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; font-size: 14px; font-weight: 800; color: var(--accent-ink); text-decoration: none; padding: 8px 4px; }
    .rv-back:hover { text-decoration: underline; }
    .rv-back svg { width: 14px; height: 14px; }

    /* ── 1층 · 요약 ──────────────────────────────────────────────
       Baymard 연구상 후기 섹션에서 가장 많이 쓰이는 요소가 '전체 요약'이다.
       개별 후기를 읽기 전에 "얼마나 쌓였나"를 3초 안에 답해 준다. */
    .rv-summary { max-width: 1120px; margin: 14px auto 0; padding: 0 20px; }
    .rv-sum-box { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 18px 20px; }
    .rv-sum-top { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
    .rv-sum-n { font-family: var(--serif); font-size: 32px; font-weight: 700; line-height: 1; color: var(--text); }
    .rv-sum-l { font-size: 15px; color: var(--rv-dim); }
    .rv-sum-break { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--border-soft); }
    .rv-sum-item { font-size: 14px; color: var(--rv-dim); }
    .rv-sum-item b { font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }

    /* ── 필터 · 픽커 + 바텀시트 ─────────────────────────────────
       ⚠️ 구 칩 나열 방식으로 되돌리지 말 것 — 375px 에서 sticky 필터바가 221px(화면 27%)를
       먹어 첫 후기가 절반만 보였다. 구 뉴스판이 같은 문제로 먼저 픽커로 전환했었다. */
    .rv-filters { position: sticky; top: 67px; z-index: 50; background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); padding: 10px 0; margin-top: 14px; border-bottom: 1px solid var(--border-soft); }
    /* ⚠️ 공용 nav(고정 67px / 모바일 57px) 바로 아래에 붙는다. */
    @media (max-width: 768px) { .rv-filters { top: 57px; } }
    .rv-pickrow { display: flex; gap: 8px; }
    .rv-pick { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); font: inherit; font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background .15s, color .15s, border-color .15s; }
    .rv-pick:hover { border-color: var(--accent-dark); }
    .rv-pick:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .rv-pick .pk-cv { font-size: 12px; color: var(--rv-dim); }   /* 9대원칙 1 하한(12px) */
    .rv-pick.set { background: var(--action-tint); border-color: var(--accent-dark); color: var(--accent-ink); font-weight: 800; }
    .rv-pick.set .pk-cv { color: var(--accent-ink); }

    .rv-scrim { position: fixed; inset: 0; z-index: 205; background: rgba(23,42,71,.45); opacity: 0; transition: opacity .22s; }
    .rv-scrim.open { opacity: 1; }
    .rv-scrim[hidden] { display: none; }
    .rv-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 210; width: min(100%, 560px); margin: 0 auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 18px calc(22px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -14px 44px rgba(23,42,71,.24); max-height: 72vh; overflow-y: auto; transform: translateY(18px); opacity: 0; transition: transform .26s cubic-bezier(.22,1,.36,1), opacity .2s; }
    .rv-sheet.open { transform: none; opacity: 1; }
    .rv-sheet[hidden] { display: none; }
    .rv-sheet-handle { width: 38px; height: 4px; border-radius: 999px; background: var(--border); margin: 6px auto 14px; }
    .rv-sheet-title { font-family: var(--serif); font-size: 18px; font-weight: 700; margin: 0 0 12px; color: var(--text); }
    .rv-sheet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (min-width: 640px) { .rv-sheet-grid { grid-template-columns: 1fr 1fr 1fr; } }
    .rv-opt { appearance: none; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; font-weight: 700; min-height: 46px; padding: 8px 10px; border-radius: 999px; -webkit-tap-highlight-color: transparent; }
    .rv-opt:hover { border-color: var(--accent-dark); }
    .rv-opt:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .rv-opt.on { background: var(--action); color: var(--action-ink); border-color: transparent; }

    /* ── 2층 · 카드 그리드 ──────────────────────────────────────
       한줄평(quote)이 있으면 명조 한줄평 카드, 없으면 스크린샷 미리보기 카드.
       ⚠️ quote 컬럼이 아직 없는 환경에서는 전원 스크린샷 카드로 떨어져 구 동작과 동일해진다. */
    .rv-count { font-size: 14px; font-weight: 700; color: var(--rv-dim); margin: 16px 2px 14px; }
    .rv-masonry { column-count: 3; column-gap: 16px; padding-bottom: 60px; }
    .rv-card {
      break-inside: avoid; margin-bottom: 16px; background: var(--surface);
      border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
      overflow: hidden; box-shadow: 0 2px 10px rgba(23,42,71,.06);
      transition: box-shadow .2s, transform .2s;
    }
    .rv-card:hover { box-shadow: 0 10px 30px rgba(23,42,71,.14); transform: translateY(-2px); }

    /* 한줄평 카드 */
    .rv-body { padding: 20px 18px 16px; display: flex; flex-direction: column; }
    .rv-verify { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; font-size: 12px; font-weight: 800; color: #2F6B42; background: rgba(47,107,66,.12); border-radius: 999px; padding: 4px 10px; margin-bottom: 13px; }
    .rv-verify svg { width: 12px; height: 12px; flex-shrink: 0; }
    .rv-quote { font-family: var(--serif); font-size: 18px; font-weight: 700; line-height: 1.55; color: var(--text); letter-spacing: -.2px; word-break: keep-all; margin: 0; white-space: pre-line; }

    /* 스크린샷 미리보기 카드 — 원본 전체를 쏟지 않고 상단만 보여 준다.
       ⚠️ 상한을 없애면 카드 하나가 600px 를 넘겨 페이지가 다시 20화면대가 된다. */
    .rv-shot { position: relative; max-height: 300px; overflow: hidden; cursor: zoom-in; display: block; width: 100%; border: 0; padding: 0; background: none; }
    .rv-shot img { width: 100%; height: auto; display: block; background: var(--surface2); }
    .rv-card.is-clipped .rv-shot::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 86px; pointer-events: none;
      background: linear-gradient(to bottom, rgba(255,255,255,0), var(--surface));
    }
    .rv-shot:focus-visible { outline: 3px solid var(--action); outline-offset: -3px; }

    /* 카드 하단 — 이름·챌린지·기수 + 원문 보기 */
    .rv-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px 13px; border-top: 1px solid var(--border-soft); flex-wrap: wrap; }
    .rv-card--quote .rv-foot { margin-top: 16px; }
    .rv-who { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; }
    .rv-name { font-family: var(--serif); font-size: 15px; font-weight: 800; color: var(--text); }
    .rv-when { font-size: 14px; font-weight: 700; color: var(--rv-dim); font-variant-numeric: tabular-nums; }
    .rv-tag { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: rgba(27,58,107,.10); color: var(--accent-ink); }
    .rv-tag-cohort { background: var(--action-tint); color: var(--accent-ink); }
    /* 시각 높이는 유지하고 ::after 로 히트 영역만 44px 로 넓힌다(9대원칙 2) */
    .rv-src { position: relative; appearance: none; border: 0; background: none; cursor: pointer; font: inherit; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; font-size: 14px; font-weight: 800; color: var(--accent-ink); padding: 5px 2px; }
    .rv-src::after { content: ''; position: absolute; left: -8px; right: -8px; top: 50%; transform: translateY(-50%); height: 44px; }
    .rv-src:hover { text-decoration: underline; }
    .rv-src svg { width: 12px; height: 12px; }
    .rv-src:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; border-radius: 4px; }

    .rv-empty { text-align: center; padding: 60px 20px; color: var(--rv-dim); font-size: 15px; }
    .rv-skeleton { border-radius: var(--radius-sm); background: var(--surface2); margin-bottom: 16px; break-inside: avoid; }

    /* LIGHTBOX — 텍스트 스크린샷이라 높이에 맞춰 줄이면 글씨가 작아진다.
       폭 기준으로 크게 띄우고(세로로 길면 스크롤), 이미지를 탭하면 더 확대. */
    .rv-lb { position: fixed; inset: 0; z-index: 300; overflow: auto; text-align: center; padding: 24px 16px 40px; background: rgba(14,22,36,.82); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); -webkit-overflow-scrolling: touch; }
    .rv-lb[hidden] { display: none; }
    .rv-lb img { display: inline-block; width: min(94vw, 820px); height: auto; max-width: none; border-radius: 12px; background: #fff; box-shadow: 0 24px 70px rgba(0,0,0,.5); cursor: zoom-in; }
    .rv-lb img.zoomed { width: min(170vw, 1300px); cursor: zoom-out; }   /* 탭 시 확대(화면보다 넓어지면 좌우 스크롤) */
    .rv-lb-close { position: fixed; top: 14px; right: 16px; z-index: 2; width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(255,255,255,.22); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
    .rv-lb-close:hover { background: rgba(255,255,255,.34); }
    .rv-lb-close:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
    .rv-lb-hint {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 2;
      display: inline-flex; align-items: center; gap: 7px; max-width: calc(100vw - 32px);
      padding: 10px 18px; border-radius: 999px;
      background: rgba(14,22,36,.85); color: #fff;
      font-size: 14px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,.4); pointer-events: none;
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    }
    .rv-lb-hint svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--action); }

    /* CTA 하단 */
    .rv-foot-cta { text-align: center; padding: 20px 0 72px; }
    .rv-foot-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 15px 34px; border-radius: 999px; background: var(--action); color: var(--action-ink); font-size: 16px; font-weight: 800; text-decoration: none; box-shadow: 0 10px 28px rgba(27,58,107,.28); transition: transform .2s; }
    .rv-foot-btn:hover { transform: translateY(-2px); }

    @media (max-width: 900px) { .rv-masonry { column-count: 2; } }
    @media (max-width: 560px) {
      .rv-masonry { column-count: 1; column-gap: 0; }
      .rv-filters { top: 56px; }
      .rv-hero { padding: 86px 0 14px; }
      .rv-sum-n { font-size: 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rv-card, .rv-foot-btn, .rv-sheet, .rv-scrim, .rv-pick { transition: none; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

  <header class="rv-hero">
    <div class="container">
      <div class="rv-eyebrow" id="rvEyebrow">REAL REVIEWS</div>
      <h1 class="rv-title" id="rvTitle">후기</h1>
      <p class="rv-lede" id="rvLede"></p>
      <a class="rv-back" href="reviews.html">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        후기 전체 보기
      </a>
    </div>
  </header>

  <!-- 1층 요약 — 개별 후기를 읽기 전에 전체 규모를 먼저 답해 준다 -->
  <div class="rv-summary" id="rvSummary" hidden>
    <div class="rv-sum-box">
      <div class="rv-sum-top">
        <span class="rv-sum-n" id="rvSumN">—</span>
        <span class="rv-sum-l" id="rvSumL">개의 실제 후기</span>
      </div>
      <div class="rv-sum-break" id="rvSumBreak" hidden></div>
    </div>
  </div>

  <div class="rv-filters" id="rvFilters" hidden>
    <div class="container">
      <div class="rv-pickrow">
        <button class="rv-pick" type="button" id="rvChBtn" hidden aria-haspopup="dialog" aria-expanded="false"><span class="pk-label">챌린지</span><span class="pk-cv" aria-hidden="true">▾</span></button>
        <button class="rv-pick" type="button" id="rvCoBtn" hidden aria-haspopup="dialog" aria-expanded="false"><span class="pk-label">기수</span><span class="pk-cv" aria-hidden="true">▾</span></button>
      </div>
    </div>
  </div>

  <main class="container">
    <div class="rv-count" id="rvCount"></div>
    <div class="rv-masonry" id="rvGrid">
      <!-- 스켈레톤 -->
      <div class="rv-skeleton" style="height:220px"></div>
      <div class="rv-skeleton" style="height:180px"></div>
      <div class="rv-skeleton" style="height:260px"></div>
      <div class="rv-skeleton" style="height:200px"></div>
      <div class="rv-skeleton" style="height:240px"></div>
      <div class="rv-skeleton" style="height:190px"></div>
    </div>
    <div class="rv-empty" id="rvEmpty" hidden>선택한 조건의 후기가 없어요.</div>

    <div class="rv-foot-cta">
      <a class="rv-foot-btn" href="apply.html">나도 도전하기 →</a>
    </div>
  </main>

  <!-- 필터 선택 바텀시트 — [챌린지]/[기수] 버튼이 연다. 옵션은 openSheet()가 동적 렌더 -->
  <div class="rv-scrim" id="rvScrim" hidden></div>
  <div class="rv-sheet" id="rvSheet" role="dialog" aria-modal="true" aria-labelledby="rvSheetTitle" hidden>
    <div class="rv-sheet-handle" aria-hidden="true"></div>
    <h2 class="rv-sheet-title" id="rvSheetTitle">챌린지 선택</h2>
    <div class="rv-sheet-grid" id="rvSheetGrid"></div>
  </div>

  <!-- 원본 라이트박스 (폭 기준 확대 + 탭 시 더 확대) -->
  <div class="rv-lb" id="rvLightbox" hidden role="dialog" aria-modal="true" aria-label="후기 원본">
    <button class="rv-lb-close" type="button" aria-label="닫기">&times;</button>
    <img src="" alt="">
    <div class="rv-lb-hint" id="rvLbHint">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.7"/><path d="M13 13l4 4M6.5 8.5h4M8.5 6.5v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      이미지를 누르면 더 크게 볼 수 있어요
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
  (function () {
    const CH_ORDER = ['보신각', '영합각', '스피닝', '승자각'];

    /* 종류별 설정 — 이 표가 페이지의 성격을 전부 정한다.
       ⚠️ 상담 후기는 실명을 노출하지 않는다(오너 확정 2026-08-01). 챌린지 후기는
          공개 카페 글이라 이름이 나가지만, 상담은 1:1 이라 성격이 다르다.
          이름 대신 시기(YYYY.MM)만 붙여 '언제 받은 상담인지'는 남긴다. */
    const KINDS = {
      challenge: {
        eyebrow: 'CHALLENGE REVIEWS',
        title: '챌린지 후기',
        lede: '2주 챌린지를 끝낸 참여자들이 직접 남긴 후기입니다.',
        docTitle: '챌린지 후기 — MONC 몬크',
        filters: true, showName: true, showDate: false,
        cta: { href: 'apply.html', label: '나도 도전하기 →' },
      },
      consult: {
        eyebrow: 'CONSULT REVIEWS',
        title: '상담 후기',
        lede: '1:1 상담을 받은 분들이 남긴 후기입니다.',
        docTitle: '상담 후기 — MONC 몬크',
        filters: false, showName: false, showDate: true,
        /* 상담 후기를 다 읽은 사람에게 붙는 행동은 상담이다(2026-08-16 오너 확정 —
           후기가 증거, 예약이 행동). 예약 주소는 consult.html 이 정본이라 직링크 금지. */
        cta: { href: 'consult.html', label: '나도 상담 받아보기 →' },
      },
    };
    const params = new URLSearchParams(location.search);
    // 모르는 값이 오면 챌린지로 떨어뜨린다(오타·옛 링크가 빈 화면이 되지 않게)
    const KIND = KINDS[params.get('kind')] ? params.get('kind') : 'challenge';
    const CFG = KINDS[KIND];

    const grid = document.getElementById('rvGrid');
    const emptyEl = document.getElementById('rvEmpty');
    const countEl = document.getElementById('rvCount');
    const filtersEl = document.getElementById('rvFilters');
    const sumEl = document.getElementById('rvSummary');
    const chBtn = document.getElementById('rvChBtn');
    const coBtn = document.getElementById('rvCoBtn');
    const scrimEl = document.getElementById('rvScrim');
    const sheetEl = document.getElementById('rvSheet');
    const sheetTitleEl = document.getElementById('rvSheetTitle');
    const sheetGridEl = document.getElementById('rvSheetGrid');
    const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // 화면 글자를 종류에 맞춰 세운다(크롤러용 <title> 도 같이 — og 는 head 고정값이다)
    document.title = CFG.docTitle;
    document.getElementById('rvEyebrow').textContent = CFG.eyebrow;
    document.getElementById('rvTitle').textContent = CFG.title;
    document.getElementById('rvLede').textContent = CFG.lede;
    const ctaEl = document.querySelector('.rv-foot-btn');
    ctaEl.href = CFG.cta.href; ctaEl.textContent = CFG.cta.label;
    emptyEl.textContent = CFG.filters ? '선택한 조건의 후기가 없어요.' : '아직 올라온 후기가 없어요.';

    let items = [];                // {url, challenge, cohort, name, date, quote}
    let fChallenge = 'all';        // 선택된 챌린지
    let fCohort = 'all';           // 선택된 기수('all' | 숫자 | 'none')
    let chSet = [], coSet = [], hasNoCohort = false;
    let sheetKind = null;

    function imgUrl(path) { return MONC.sb.storage.from('reviews').getPublicUrl(path).data.publicUrl; }
    // 상담 후기 카드에 붙는 시기 표기 — 날짜까지는 필요 없고 'YYYY.MM' 이면 충분하다
    function ym(d) { const m = String(d || '').match(/^(\d{4})-(\d{2})/); return m ? `${m[1]}.${m[2]}` : ''; }

    async function load() {
      if (!window.MONC || !window.MONC.sb) { grid.innerHTML = ''; emptyEl.hidden = false; emptyEl.textContent = '후기를 불러올 수 없어요.'; return; }
      // ⚠️ select('*') + 클라이언트 필터 — .eq('kind', …) 로 서버에서 거르면 kind 컬럼
      //    마이그레이션(20260801180000) 미적용 환경에서 400 이 난다. 미적용이면 kind 가
      //    undefined 라 전부 'challenge' 로 취급된다(챌린지 목록은 그대로, 상담은 0건).
      const { data, error } = await MONC.sb.from('reviews').select('*').eq('visible', true);
      if (error) { console.warn('후기 로드 실패:', error); grid.innerHTML = ''; emptyEl.hidden = false; emptyEl.textContent = '후기를 불러오지 못했어요.'; return; }
      items = (data || [])
        .filter(r => (r.kind || 'challenge') === KIND)
        .map(r => ({
          url: r.image_path ? imgUrl(r.image_path) : '',
          challenge: r.challenge || null,
          cohort: (r.cohort != null && r.cohort !== 0) ? Number(r.cohort) : null,
          name: r.reviewer_name || '',
          date: r.review_date || r.created_at || '',
          quote: (r.quote || '').trim(),
        // 이미지도 한줄평도 없으면 보여 줄 게 없다
        })).filter(i => i.url || i.quote);
      // 정렬: 챌린지 순 → 기수 오름차순 → 날짜 오름차순
      //   상담 후기는 challenge/cohort 가 없어 날짜 하나로 줄이 선다 — 최신이 위로 오게 뒤집는다.
      items.sort((a, b) => {
        if (!CFG.filters) return String(b.date).localeCompare(String(a.date));
        const ca = CH_ORDER.indexOf(a.challenge), cb = CH_ORDER.indexOf(b.challenge);
        if (ca !== cb) return (ca < 0 ? 99 : ca) - (cb < 0 ? 99 : cb);
        if ((a.cohort || 99) !== (b.cohort || 99)) return (a.cohort || 99) - (b.cohort || 99);
        return String(a.date).localeCompare(String(b.date));
      });
      buildSummary();
      buildFilters();
      render();
    }

    /* 1층 — 전체 규모 + 챌린지별 건수(구 필터칩이 들고 있던 정보) */
    function buildSummary() {
      if (!items.length) return;
      sumEl.hidden = false;
      document.getElementById('rvSumN').textContent = items.length;
      const brk = document.getElementById('rvSumBreak');

      // 상담 후기는 챌린지·기수 축이 없다 — 총 건수만 남기고 분해 줄은 접는다
      if (!CFG.filters) { document.getElementById('rvSumL').textContent = '개의 상담 후기'; brk.hidden = true; return; }

      const cos = [...new Set(items.map(i => i.cohort).filter(v => v != null))].sort((a, b) => a - b);
      const chs = CH_ORDER.filter(ch => items.some(i => i.challenge === ch));
      const bits = [];
      if (chs.length) bits.push(`${chs.length}개 챌린지`);
      if (cos.length) bits.push(cos.length > 1 ? `${cos[0]}~${cos[cos.length - 1]}기` : `${cos[0]}기`);
      document.getElementById('rvSumL').textContent = '개의 실제 후기' + (bits.length ? ' · ' + bits.join(' · ') : '');

      if (chs.length) {
        brk.hidden = false;
        brk.innerHTML = chs.map(ch =>
          `<span class="rv-sum-item">${esc(ch)} <b>${items.filter(i => i.challenge === ch).length}</b></span>`
        ).join('');
      }
    }

    function buildFilters() {
      if (!CFG.filters) { filtersEl.hidden = true; return; }   // 상담은 건수가 적어 필터를 두지 않는다
      chSet = CH_ORDER.filter(ch => items.some(i => i.challenge === ch));
      coSet = [...new Set(items.map(i => i.cohort).filter(v => v != null))].sort((a, b) => a - b);
      hasNoCohort = items.some(i => i.cohort == null);
      // 분류 데이터가 하나도 없으면(마이그레이션 전) 필터바 숨김 — 전체 그리드만 노출
      if (!chSet.length && !coSet.length) { filtersEl.hidden = true; return; }
      filtersEl.hidden = false;
      chBtn.hidden = !chSet.length;
      coBtn.hidden = !coSet.length && !hasNoCohort;
      syncPickers();
    }

    /* 버튼 라벨이 곧 현재 필터 상태 — 무엇으로 걸러져 있는지 항상 보인다 */
    function syncPickers() {
      const chLabel = fChallenge === 'all' ? '챌린지' : fChallenge;
      const coLabel = fCohort === 'all' ? '기수' : (fCohort === 'none' ? '기수 미상' : fCohort + '기');
      chBtn.querySelector('.pk-label').textContent = chLabel;
      coBtn.querySelector('.pk-label').textContent = coLabel;
      chBtn.classList.toggle('set', fChallenge !== 'all');
      coBtn.classList.toggle('set', fCohort !== 'all');
    }

    function openSheet(kind) {
      sheetKind = kind;
      const isCh = kind === 'ch';
      sheetTitleEl.textContent = isCh ? '챌린지 선택' : '기수 선택';
      const cur = isCh ? fChallenge : fCohort;
      sheetGridEl.innerHTML = '';
      const mk = (val, text) => {
        const b = document.createElement('button');
        b.type = 'button'; b.dataset.val = val;
        b.className = 'rv-opt' + (cur === val ? ' on' : '');
        b.textContent = text;
        return b;
      };
      sheetGridEl.appendChild(mk('all', isCh ? '전체 챌린지' : '전체 기수'));
      if (isCh) chSet.forEach(ch => sheetGridEl.appendChild(mk(ch, ch)));
      else {
        coSet.forEach(co => sheetGridEl.appendChild(mk(String(co), co + '기')));
        if (hasNoCohort) sheetGridEl.appendChild(mk('none', '기수 미상'));
      }
      scrimEl.hidden = false; sheetEl.hidden = false;
      void sheetEl.offsetWidth;                            // 강제 리플로 — hidden 해제를 먼저 커밋해 슬라이드업 전환이 걸린다
      scrimEl.classList.add('open'); sheetEl.classList.add('open');
      document.body.style.overflow = 'hidden';             // 시트 열린 동안 배경 스크롤 잠금
      (isCh ? chBtn : coBtn).setAttribute('aria-expanded', 'true');
      (sheetGridEl.querySelector('.on') || sheetGridEl.firstChild).focus();
    }

    function closeSheet() {
      if (!sheetKind) return;
      const wasCh = sheetKind === 'ch';
      sheetKind = null;
      scrimEl.classList.remove('open'); sheetEl.classList.remove('open');
      document.body.style.overflow = '';
      chBtn.setAttribute('aria-expanded', 'false');
      coBtn.setAttribute('aria-expanded', 'false');
      setTimeout(() => {                                   // 전환이 끝난 뒤 숨김(그새 재오픈이면 스킵)
        if (!sheetEl.classList.contains('open')) { scrimEl.hidden = true; sheetEl.hidden = true; }
      }, 240);
      (wasCh ? chBtn : coBtn).focus();
    }

    chBtn.addEventListener('click', () => openSheet('ch'));
    coBtn.addEventListener('click', () => openSheet('co'));
    scrimEl.addEventListener('click', closeSheet);
    sheetGridEl.addEventListener('click', e => {
      const b = e.target.closest('.rv-opt'); if (!b) return;
      if (sheetKind === 'ch') fChallenge = b.dataset.val; else fCohort = b.dataset.val;
      syncPickers(); closeSheet(); render();
    });

    function matches(i) {
      if (!CFG.filters) return true;
      if (fChallenge !== 'all' && i.challenge !== fChallenge) return false;
      if (fCohort === 'none') { if (i.cohort != null) return false; }
      else if (fCohort !== 'all' && String(i.cohort) !== fCohort) return false;
      return true;
    }

    const VERIFY_SVG = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M5 8.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const OUT_SVG = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3h7v7M13 3 4 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function render() {
      const list = items.filter(matches);
      countEl.textContent = list.length ? `${list.length}개 후기` : '';
      if (!list.length) { grid.innerHTML = ''; emptyEl.hidden = false; return; }
      emptyEl.hidden = true;

      grid.innerHTML = list.map(i => {
        // 상담 후기는 이름을 쓰지 않으므로 대체 텍스트에서도 뺀다
        const alt = (CFG.showName
          ? `${esc(i.challenge || '')} ${i.cohort ? i.cohort + '기' : ''} ${esc(i.name)} 후기`
          : `${CFG.title} ${ym(i.date)}`).replace(/\s+/g, ' ').trim();
        // 기수 칩은 챌린지 칩 옆에 있을 때만 '1기'로 충분하다. 혼자 서면 무엇의
        // 기수인지 안 읽히므로 '참여자'를 붙인다(2026-08-02 오너 지적 — 상세 카드 건과 같은 규칙).
        const tags = CFG.filters
          ? (i.challenge ? `<span class="rv-tag">${esc(i.challenge)}</span>` : '')
            + (i.cohort != null ? `<span class="rv-tag rv-tag-cohort">${i.cohort}기${i.challenge ? '' : ' 참여자'}</span>` : '')
          : '';
        const nameEl = (CFG.showName && i.name) ? `<span class="rv-name">${esc(i.name)}</span>` : '';
        const whenEl = (CFG.showDate && ym(i.date)) ? `<span class="rv-when">${ym(i.date)}</span>` : '';
        const who = (nameEl || whenEl || tags) ? `<div class="rv-who">${nameEl}${whenEl}${tags}</div>` : '';
        const srcBtn = i.url
          ? `<button class="rv-src js-open" type="button" aria-haspopup="dialog" data-src="${esc(i.url)}" data-alt="${esc(alt)}"
               aria-label="${esc(alt)} 원문 보기">원문 보기 ${OUT_SVG}</button>`
          : '';
        const foot = (who || srcBtn) ? `<div class="rv-foot">${who}${srcBtn}</div>` : '';

        // 한줄평이 있으면 그것을 앞면에 — 훑을 수 있는 층이 생긴다
        if (i.quote) {
          return `<figure class="rv-card rv-card--quote">
            <div class="rv-body">
              <span class="rv-verify">${VERIFY_SVG}실제 후기</span>
              <p class="rv-quote">${esc(i.quote)}</p>
            </div>${foot}
          </figure>`;
        }
        // 한줄평이 아직 없는 후기 — 스크린샷 상단만 미리보기로
        return `<figure class="rv-card rv-card--shot">
          <button class="rv-shot js-open" type="button" aria-haspopup="dialog" data-src="${esc(i.url)}" data-alt="${esc(alt)}" aria-label="${esc(alt)} 원문 보기">
            <img src="${esc(i.url)}" alt="${esc(alt)}" loading="lazy">
          </button>${foot}
        </figure>`;
      }).join('');

      // 잘린 카드에만 하단 페이드 — 짧은 스크린샷에 불필요한 그라디언트가 얹히지 않게 한다
      grid.querySelectorAll('.rv-card--shot img').forEach(img => {
        const mark = () => { if (img.offsetHeight > 300) img.closest('.rv-card').classList.add('is-clipped'); };
        if (img.complete && img.naturalHeight) mark(); else img.addEventListener('load', mark, { once: true });
      });
    }

    /* 라이트박스 — 폭 기준 확대(세로로 길면 스크롤), 이미지 탭 시 더 확대/원복 */
    (function initLb() {
      const lb = document.getElementById('rvLightbox');
      const lbImg = lb.querySelector('img');
      const closeBtn = lb.querySelector('.rv-lb-close');
      const hint = document.getElementById('rvLbHint');
      let trigger = null;
      function open(src, alt, el) {
        trigger = el; lbImg.src = src; lbImg.alt = alt || '후기 원본';
        lbImg.classList.remove('zoomed'); if (hint) hint.style.display = '';
        lb.hidden = false; lb.scrollTop = 0; document.body.style.overflow = 'hidden'; closeBtn.focus();
      }
      function close() {
        lb.hidden = true; lbImg.removeAttribute('src'); lbImg.classList.remove('zoomed');
        document.body.style.overflow = ''; if (trigger) { trigger.focus(); trigger = null; }
      }
      grid.addEventListener('click', (e) => {
        const el = e.target.closest('.js-open'); if (!el) return;
        open(el.dataset.src, el.dataset.alt, el);
      });
      // 이미지 탭 → 확대 토글(닫기로 전파되지 않게 처리). 확대 후엔 안내 문구 숨김.
      lbImg.addEventListener('click', (e) => {
        e.stopPropagation();
        const z = lbImg.classList.toggle('zoomed');
        if (hint) hint.style.display = z ? 'none' : '';
      });
      closeBtn.addEventListener('click', close);
      lb.addEventListener('click', (e) => { if (e.target === lb) close(); }); // 이미지 바깥(오버레이) 클릭 닫기
      // ESC — 시트가 열려 있으면 시트부터 닫는다(둘 다 동시에 닫히지 않게)
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (sheetKind) { closeSheet(); return; }
        if (!lb.hidden) close();
      });
    })();

    load();
  })();
  </script>

<script>
/* bfcache — 뒤로/앞으로 오면 크롬은 떠날 때 그리던 화면을 그대로 되살린다(파일을 새로 받지 않는다).
   배포 전에 열어 둔 탭·기록이 있으면 옛 화면이 그대로 뜬다(2026-08-03 오너 지적).
   입력값이 없는 화면이라 통째로 다시 받는다 — lab·answers·mypage 와 같은 규칙(CLAUDE.md).
   ⚠️ 홈(index.html)은 일부러 뺀다 — 뒤로 올 때마다 히어로 애니메이션이 처음부터 다시 돌아 오너가 기각했다. */
window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
</script>
