<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <!-- Open Graph / SNS 공유 — 크롤러는 JS 를 안 돌리므로 여기에 직접 둔다 -->
  <meta property="og:type"        content="website" />

  <meta name="twitter:title"       content="나만의 승준노트 — MONC 몬크" />
  <meta name="twitter:description" content="면접 답변과 자기소개서를 모아 두고 AI킬러·첨삭으로 다듬는 나만의 승준노트." />
  <meta name="twitter:image"       content="https://monc.ai.kr/images/og-image.png" />

  <link rel="apple-touch-icon" sizes="180x180" href="images/MONC_Logo_Full_Package/assets/favicon/apple-touch-icon.png">
  <meta name="theme-color" content="#102B56">
  <link rel="stylesheet" href="tokens.css">
  <!-- 공용 상단 메뉴(2026-07-30) — 마크업은 nav.js 가 심는다. 여기에 nav 를 복사해 넣지 말 것. -->
  <link rel="stylesheet" href="nav.css">
  <script src="nav.js" defer></script>
  <!-- 인앱 브라우저(인스타·카톡) 탈출 안내 — 파일 받기·로그인이 막히는 자리 -->
  <script src="inapp.js?v=10" defer></script>
  <!-- 뒤로 왔을 때 보던 자리로 되돌리기 — 위 bfcache 새로고침이 스크롤을 버리는 걸 메운다 -->
  <script src="scroll-keep.js?v=3"></script>
  <style>
    /* ══ 2026-09-23 답변 단위 2단 구조(오너 승인 · 목업 outputs/answers-note-mockup.html) ══
       화면은 셋 — ① 목록(답변 한 줄씩) ② 답변 상세(본문 바로 · 첫 버튼 고치기) ③ 답변 추가.
       전환은 해시(#a=<id> · #new · #materials)로 하고 뒤로가기가 목록으로 돌아온다.
       ⚠️ 질문별 묶음(9-22)은 실데이터로 걷어냈다 — 문항 묶음 179개 중 답변 2벌 이상 0.
          되살리려면 먼저 그 숫자부터 다시 잴 것(docs/notes/credits.md '2026-09-23').
       활자는 12(보조 메타) / 14 / 15 / 16(입력) / 17 / 20 / 26(제목) · 굵기 400/700/800 만 쓴다. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'SUIT Variable', SUIT, 'Apple SD Gothic Neo', -apple-system, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; word-break: keep-all; }
    .wrap { max-width: 780px; margin: 0 auto; padding: 8px 20px 80px; }

    /* 서브내비 — program.html .subnav 문법의 축약(상위 복귀 한 줄). 뒤로 알약·눈썹줄은 뺐다(머리 44px). */
    .sub { display: flex; align-items: center; min-height: 44px; }
    .sub-back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px 0 0;
      border: 0; background: none; font: inherit; font-size: 14px; font-weight: 700; color: var(--text-muted);
      text-decoration: none; cursor: pointer; border-radius: 6px; }
    .sub-back svg { width: 16px; height: 16px; }
    .sub-back:hover { color: var(--action-dark); }
    .sub-back:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }

    .h1row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
    h1 { font-family: var(--serif); font-weight: 700; font-size: 26px; line-height: 1.25; }
    /* [선택] 들어가기 — 제목 줄 오른쪽 글자 버튼. 답변이 없으면 JS 가 숨긴다. */
    .sel-enter { min-height: 44px; padding: 0 12px; margin-right: -12px; border: 0; background: none; font: inherit;
      font-size: 14px; font-weight: 800; color: var(--accent-ink); cursor: pointer; border-radius: 6px; }
    .sel-enter:focus-visible { outline: 3px solid var(--action); outline-offset: 0; }

    /* 탭(내 답변 · 내 소재) — 밑줄형. sojae_materials 미생성이면 JS 가 통째로 숨긴다. */
    .tabs { display: flex; margin-top: 8px; border-bottom: 1px solid var(--border-soft); }
    .tabs[hidden] { display: none; }   /* display:flex 가 UA [hidden] 을 이긴다 — 소재 표 미생성 환경에서 탭이 그대로 보인다 */
    .tabs button { flex: 1; min-height: 44px; border: 0; background: none; font: inherit; font-size: 15px; font-weight: 700;
      color: var(--text-muted); position: relative; cursor: pointer; }
    .tabs button b { font-weight: 800; color: var(--text-dim); margin-left: 4px; }
    .tabs button.on { color: var(--text); font-weight: 800; }
    .tabs button.on b { color: var(--accent-ink); }
    .tabs button.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--action); }
    .tabs button:focus-visible { outline: 3px solid var(--action); outline-offset: -3px; }

    /* 검색 + 유형 칩. 상태 칩(작성 중/완료)은 뺐다 — 초안이 전체의 1%(2026-09-23 실측). */
    .filters { margin-top: 14px; }
    .search { position: relative; }
    .search input { display: block; width: 100%; min-height: 48px; padding: 12px 16px 12px 44px; font: inherit; font-size: 16px;
      color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; }
    .search input::placeholder { color: var(--text-dim); }
    .search input:focus-visible { outline: 3px solid var(--action); outline-offset: 1px; }
    .search svg { position: absolute; left: 17px; top: 15px; width: 18px; height: 18px; color: var(--text-dim); pointer-events: none; }
    .chips { display: flex; gap: 7px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chips[hidden] { display: none; }
    .chip { flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 44px; padding: 8px 15px;
      border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; white-space: nowrap; cursor: pointer;
      color: var(--accent-ink); background: var(--surface); border: 1px solid var(--border-soft); }
    .chip:hover { border-color: var(--accent-dark); }
    .chip.on { color: var(--action-ink); background: var(--action); border-color: transparent; }
    .chip:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .count { margin-top: 10px; font-size: 14px; color: var(--text-dim); }

    /* 답변 줄 — 카드 한 장 = 답변 하나. 제목 + 본문 2줄 + 날짜·표식.
       ⚠️ 같은 제목이 여러 줄이어도 묶지 않는다 — 본문 2줄과 날짜로 구분된다(회원 6명·최대 5회 규모). */
    .rows { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 12px; align-items: flex-start; padding: 14px 15px; background: var(--surface);
      border: 1px solid var(--border-soft); border-radius: var(--radius-sm); box-shadow: var(--shadow);
      color: inherit; text-decoration: none; }
    .row:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .row-tx { flex: 1; min-width: 0; }
    .row-t { font-size: 15px; font-weight: 800; line-height: 1.45; }
    .row-p { font-size: 14px; color: var(--text-muted); margin-top: 5px; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .row-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; min-width: 56px; }
    .row-d { font-size: 12px; color: var(--text-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }  /* 보조 메타 12px */
    .row-pol { font-size: 12px; font-weight: 800; color: var(--accent-ink); white-space: nowrap; }
    .row-draft { font-size: 12px; font-weight: 800; color: #8C4318; background: rgba(140,67,24,.09);
      padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    mark { background: var(--action-tint); color: var(--accent-ink); padding: 0 2px; border-radius: 3px; }
    .empty { text-align: center; color: var(--text-muted); font-size: 15px; padding: 50px 20px; }
    .empty a { color: var(--accent-ink); font-weight: 700; }
    .loading { text-align: center; color: var(--text-dim); padding: 60px 0; }

    /* ── 선택 모드(2026-09-22 오너 "체크박스를 만들어서 한번에 삭제") ──
       평소엔 체크칸이 없다. [선택]을 누르면 줄 왼쪽에 체크칸(표시 전용)이 생기고 줄 아무 데나 눌러 고른다. */
    .selbox { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 6px;
      border: 2px solid var(--border); background: var(--surface); pointer-events: none;
      display: none; align-items: center; justify-content: center; }
    .selbox svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
    body.sel-on .selbox { display: flex; }
    body.sel-on .row { cursor: default; }
    body.sel-on .addbar, body.sel-on #quickfix-mount { display: none; }
    .sel-row.on { border-color: var(--action); box-shadow: inset 0 0 0 1px var(--action); }
    .sel-row.on .selbox { background: var(--action); border-color: var(--action); }
    .sel-row.on .selbox svg { opacity: 1; }
    /* 선택 바 — 삭제가 되돌릴 수 없어 개수를 크게 읽히게 두고, 취소가 삭제보다 앞에 온다 */
    .selbar { position: sticky; bottom: 0; z-index: 3; margin: 18px -20px 0; padding: 12px 20px 18px;
      background: linear-gradient(to top, var(--bg) 72%, rgba(255,255,255,0));
      display: flex; align-items: center; gap: 8px; }
    /* ⚠️ display:flex 가 UA 의 [hidden]{display:none} 을 이긴다 — 이 줄이 없으면 선택 모드가
       아닐 때도 바가 화면 아래 눌러앉는다(2026-09-22 실측 · lab.html .hub-meta 와 같은 함정). */
    .selbar[hidden] { display: none; }
    .selbar-n { flex: 1; min-width: 0; font-size: 15px; font-weight: 800; color: var(--text); }
    .selbar-n span { color: var(--text-muted); font-weight: 700; }
    .selbar button { min-height: 48px; padding: 0 16px; border-radius: 999px; font: inherit;
      font-size: 15px; font-weight: 800; cursor: pointer; }
    .sel-cancel { border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    .sel-del { border: 0; background: #9E3B34; color: #fff; }
    .sel-del[disabled] { opacity: .45; cursor: default; }

    /* ── 답변 추가 — 하단 고정 버튼. 저장은 무료·무제한이라는 사실 한 줄은 유지(오해가 실제로 생긴다). ── */
    .addbar { position: sticky; bottom: 0; margin: 18px -20px 0; padding: 12px 20px 16px;
      background: linear-gradient(to top, var(--bg) 70%, rgba(255,255,255,0)); }
    .add-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      min-height: 52px; border: 0; border-radius: 999px; background: var(--text); color: #fff;
      font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; text-decoration: none; }
    .add-btn svg { width: 18px; height: 18px; }
    .add-btn:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .add-note { margin-top: 8px; text-align: center; font-size: 12px; color: var(--text-dim); }

    /* ── 내 소재 탭 — 답변 쪽 구성요소는 CSS 한 벌로 숨긴다(9-22 에 [선택]·티저가 남던 결함의 수리). ── */
    #listView.mat-on .filters, #listView.mat-on #count, #listView.mat-on #list, #listView.mat-on .addbar,
    #listView.mat-on #quickfix-mount, #listView.mat-on #selEnter, #listView.mat-on #selBar { display: none; }
    .mat-count { margin-top: 14px; font-size: 14px; color: var(--text-dim); }
    .notes { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
    .note { border: 1px solid var(--border-soft); border-radius: var(--radius-sm); background: var(--surface); }
    .note > summary { list-style: none; cursor: pointer; padding: 15px; }
    .note > summary::-webkit-details-marker { display: none; }
    .note > summary:focus-visible { outline: 3px solid var(--action); outline-offset: -3px; border-radius: var(--radius-sm); }
    .note-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 7px; }
    .note-cat { display: inline-block; background: var(--accent-tint); color: var(--accent-ink); font-size: 12px;
      font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .note-date { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .note-q { font-size: 15px; font-weight: 700; line-height: 1.45; }
    .note-more { display: inline-block; font-size: 12px; color: var(--accent-ink); margin-top: 8px; font-weight: 700; }
    .note[open] .note-q { color: var(--action-dark); }
    .note[open] .note-more { color: var(--text-muted); }
    .note-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
    .mat-comp { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 8px;
      border-radius: 999px; background: var(--accent-tint); color: var(--accent-ink); margin-right: 4px; }
    .mat-body { font-size: 15px; line-height: 1.7; border-top: 1px dashed var(--border-soft);
      margin: 0 15px; padding: 13px 0 16px; }
    .mat-body dt { font-size: 14px; font-weight: 800; color: var(--text-dim); margin-top: 10px; }
    .mat-body dd { margin: 2px 0 0; white-space: pre-wrap; }
    .mat-acts { display: flex; gap: 8px; margin-top: 14px; }
    .mat-acts button { flex: 1; min-height: 44px; font: inherit; font-size: 14px; font-weight: 800;
      border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
      color: var(--text-muted); cursor: pointer; }
    .mat-acts .danger { color: #9E3B34; border-color: rgba(158,59,52,.4); }
    /* ⚠️ font-size 16px 하한 — iOS 자동 확대 방지(2026-08-02). */
    .mat-edit textarea, .mat-edit input { width: 100%; font: inherit; font-size: 16px; line-height: 1.6;
      color: var(--text); background: var(--bg2); border: 1px solid var(--border-soft);
      border-radius: var(--radius-xs); padding: 9px 11px; margin-top: 4px; }
    .mat-edit textarea { min-height: 64px; resize: vertical; }
    .lbl { font-size: 14px; font-weight: 800; color: var(--text-dim); margin-bottom: 8px; }

    /* ── 답변 상세 — 본문이 펼치기 없이 바로. 첫 버튼은 고치기(회원 64%가 쓰는 기능 · 2026-09-23 실측). ── */
    .d-meta { margin-top: 6px; font-size: 14px; font-weight: 700; color: var(--text-muted); }
    .d-air { letter-spacing: .06em; color: var(--air, var(--text-muted)); }
    /* 항공사 액센트 — lectures.css 의 --air-* 와 같은 값(사이트에서 항공사 색은 한 벌이어야 한다) */
    .air-ke { --air: #14375E; } .air-lj { --air: #3A6440; } .air-7c { --air: #8C4318; }
    .air-tw { --air: #9E3B34; } .air-ze { --air: #97323A; } .air-yp { --air: #2E3D63; }
    .air-rf { --air: #8E4064; }
    .d-title { font-family: var(--serif); font-weight: 700; font-size: 20px; line-height: 1.35; margin-top: 4px; }
    .d-main { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-soft); }
    .d-when { display: flex; align-items: baseline; gap: 8px; font-size: 14px; color: var(--text-dim);
      font-variant-numeric: tabular-nums; }
    .d-pol { margin-left: auto; font-size: 14px; font-weight: 800; color: var(--accent-ink); }
    .d-draft { margin-left: auto; font-size: 12px; font-weight: 800; color: #8C4318; background: rgba(140,67,24,.09);
      padding: 2px 8px; border-radius: 999px; }
    .d-body { margin-top: 10px; font-size: 16px; line-height: 1.75; color: var(--text); white-space: pre-wrap; }
    .d-none { color: var(--text-dim); }
    .d-acts { display: flex; gap: 8px; margin-top: 16px; }
    .d-acts[hidden] { display: none; }   /* 고치기 중엔 버튼 줄을 감춘다 — display:flex 가 [hidden] 을 이겨 실측에서 걸렸다(2026-09-23) */
    .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 14px;
      border-radius: 999px; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; text-decoration: none; }
    .btn-line { border: 1.5px solid var(--text); background: transparent; color: var(--text); }
    .btn-line:hover { background: var(--text); color: #fff; }
    .btn-fill { border: 0; background: var(--action); color: var(--action-ink); }
    .btn-fill:hover { background: var(--action-dark); }
    .btn:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .btn[disabled] { opacity: .45; cursor: default; }

    /* 고치기 칸(2026-08-23 오너) — 본문 자리에 입력칸. ⚠️ 트리거(snapshot_answer_revision)가 고치기 전 본문을 남긴다. */
    .d-edit { margin-top: 10px; }
    .d-edit textarea { width: 100%; min-height: 220px; font: inherit; font-size: 16px; line-height: 1.7;
      color: var(--text); background: var(--bg2); resize: vertical; border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; }
    .d-edit textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .d-edit-acts { display: flex; gap: 8px; margin-top: 10px; }
    .d-edit-msg { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--text-muted); }
    .d-edit-msg:empty { display: none; }
    .d-edit-msg.err { color: #9E3B34; font-weight: 700; }

    /* 첨삭 이력 · 수정 이력 — 본문 아래. 이력이 없으면 절을 그리지 않는다(잔소리 금지). */
    .d-sec { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--border-soft); }
    .d-sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .d-sec-t { font-size: 15px; font-weight: 800; }
    .d-sec-n { font-size: 14px; color: var(--text-dim); }
    .hrow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; margin-top: 8px;
      padding: 10px 12px; text-align: left; font: inherit; background: var(--bg2);
      border: 1px solid var(--border-soft); border-radius: var(--radius-xs); cursor: pointer;
      text-decoration: none; color: inherit; }
    .hrow:hover { border-color: var(--accent-dark); }
    .hrow:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .hrow-d { font-size: 14px; color: var(--text-dim); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .hrow-g { font-size: 15px; font-weight: 800; color: var(--g, var(--accent-ink)); }
    .hrow-c { font-size: 14px; color: var(--text-muted); }
    .hrow-go { margin-left: auto; font-size: 14px; font-weight: 800; color: var(--accent-ink); }
    .grade-human { --g: #2E6E42; } .grade-slight { --g: #8C4318; } .grade-heavy { --g: #9E3B34; }
    /* 수정 이력(2026-08-05) — 두 겹 접이. 바깥은 '수정 이력 N개', 안쪽은 버전마다 날짜만. 본문은 펼칠 때 받아 온다.
       ⚠️ 지난 본문을 펼치지 않은 채로 늘어놓지 말 것 — 화면이 원문 더미가 된다(오너 지시). */
    .rev-fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center;
      justify-content: space-between; gap: 8px; min-height: 44px; }
    .rev-fold > summary::-webkit-details-marker { display: none; }
    .rev-fold > summary:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; border-radius: 6px; }
    .rev-n { font-size: 14px; font-weight: 700; color: var(--accent-ink); }
    .rev-lead { margin: 2px 0 2px; font-size: 14px; color: var(--text-dim); }
    .rev-item { margin-top: 8px; background: var(--bg2); border: 1px solid var(--border-soft);
      border-radius: var(--radius-xs); }
    .rev-item > summary { list-style: none; cursor: pointer; display: flex; align-items: center;
      gap: 10px; min-height: 48px; padding: 0 12px; }
    .rev-item > summary::-webkit-details-marker { display: none; }
    .rev-item > summary:focus-visible { outline: 3px solid var(--action); outline-offset: -3px; border-radius: var(--radius-xs); }
    .rev-item[open] { border-color: var(--accent-dark); }
    .rev-d { font-size: 14px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .rev-go { margin-left: auto; font-size: 14px; font-weight: 800; color: var(--accent-ink); }
    .rev-item[open] .rev-go { color: var(--text-muted); }
    .rev-body { font-size: 15px; line-height: 1.7; white-space: pre-wrap; color: var(--text);
      border-top: 1px dashed var(--border-soft); margin: 0 12px; padding: 11px 0 14px; }

    /* 삭제 — 되돌릴 수 없어 맨 아래 약한 글자 버튼. 터치 44px 은 지킨다. */
    .d-del { display: flex; justify-content: flex-end; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border-soft); }
    .d-del button { min-height: 44px; padding: 0 14px; border: 0; background: none; font: inherit; font-size: 14px;
      font-weight: 800; color: #9E3B34; cursor: pointer; border-radius: 999px; }
    .d-del button:hover { background: #9E3B34; color: #fff; }
    .d-del button:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .d-del button[disabled] { opacity: .6; cursor: default; }

    /* ── 답변 추가 — 질문·본문 칸이 먼저, 분류는 본문 아래. 저장은 언제나 무료·무제한(2026-07-25 오너). ── */
    .f-title { display: block; width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-bottom: 1px solid var(--border);
      font: inherit; font-size: 17px; font-weight: 700; color: var(--text); background: transparent; padding: 0 0 10px; }
    .f-title::placeholder { font-weight: 400; color: var(--text-dim); }
    .f-ta { display: block; width: 100%; min-height: 300px; margin-top: 14px; padding: 14px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); resize: vertical; font: inherit; font-size: 16px; line-height: 1.75;
      color: var(--text); background: var(--surface); }
    .f-ta::placeholder { color: var(--text-dim); }
    .f-title:focus-visible, .f-ta:focus-visible { outline: 3px solid var(--action); outline-offset: 1px; }
    .f-cnt { margin-top: 6px; text-align: right; font-size: 14px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .f-cnt.over { color: #9E3B34; font-weight: 700; }
    .f-lbl { margin-top: 16px; font-size: 14px; font-weight: 800; color: var(--text-dim); }
    .f-lbl span { font-weight: 700; opacity: .8; }
    .seg { display: flex; gap: 6px; margin-top: 8px; }
    .seg button, .pick { min-height: 44px; font: inherit; font-size: 14px; font-weight: 700;
      border: 1px solid var(--border); background: var(--bg2); border-radius: var(--radius-xs);
      color: var(--text-muted); cursor: pointer; }
    .seg button { flex: 1; }
    .seg button.on { background: var(--surface); color: var(--text); border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
    .seg button:focus-visible, .pick:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
    .pick { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 12px; text-align: left; min-width: 0; }
    .pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pick .chev { width: 16px; height: 16px; opacity: .5; flex: 0 0 auto; }
    .pick.set { background: var(--surface); color: var(--text); border-color: var(--text); }
    .save-btn { width: 100%; min-height: 54px; margin-top: 18px; border: 0; border-radius: 999px;
      background: var(--action); color: var(--action-ink); font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; }
    .save-btn:disabled { opacity: .45; cursor: default; }
    .save-btn:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
    .save-note { margin-top: 10px; text-align: center; font-size: 14px; color: var(--text-dim); }
    .save-note b { color: var(--accent-ink); font-weight: 800; }
    .notice { margin-top: 12px; padding: 12px 14px; border-radius: var(--radius-xs); font-size: 14px;
      border: 1px solid rgba(158,59,52,.3); background: rgba(158,59,52,.07); color: #8A332D; }

    /* 시트(질문 유형 · 지망 항공사) — 공용 관습(버튼 → 바텀시트) */
    .sheet-mask { position: fixed; inset: 0; z-index: 80; background: rgba(23,42,71,.45);
      opacity: 0; pointer-events: none; transition: opacity .18s; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 81; max-height: 78vh; overflow-y: auto;
      background: var(--surface); border-radius: 18px 18px 0 0; padding: 8px 18px 24px;
      transform: translateY(102%); transition: transform .24s cubic-bezier(.22,.61,.36,1); }
    body.sheet-on .sheet-mask { opacity: 1; pointer-events: auto; }
    body.sheet-on .sheet { transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) { .sheet, .sheet-mask { transition: none; } }
    .sheet-inner { max-width: 780px; margin: 0 auto; }
    .grip { width: 38px; height: 4px; border-radius: 2px; background: var(--border); margin: 6px auto 14px; }
    .sheet-h { font-size: 16px; font-weight: 800; }
    .sheet-s { margin-top: 4px; margin-bottom: 12px; font-size: 14px; color: var(--text-dim); }
    .sheet-s:empty { display: none; }
    .opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 0 4px;
      border: 0; border-bottom: 1px solid var(--border-soft); background: none; font: inherit;
      font-size: 15px; font-weight: 700; color: var(--text); cursor: pointer; text-align: left; }
    .opt:last-child { border-bottom: 0; }
    .opt:focus-visible { outline: 3px solid var(--action); outline-offset: -3px; border-radius: 6px; }
    .opt .en { margin-left: auto; font-size: 14px; font-weight: 800; letter-spacing: .08em; color: var(--air); }
    .opt .hint { margin-left: auto; font-size: 14px; font-weight: 700; color: var(--text-dim); }
  </style>

  <script>
    // 소재 발굴에서 답변을 쓰고 뒤로가기로 오면(bfcache) 목록이 낡은 채로 남는다.
    window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

    function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    // 검색어를 결과에서 하이라이트. esc 를 거친 문자열에만 쓴다.
    function hi(escaped, term) {
      if (!term) return escaped;
      const t = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return escaped.replace(new RegExp('(' + esc(t) + ')', 'gi'), '<mark>$1</mark>');
    }
    const fmt = s => { const d = new Date(s); return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate(); };
    // 목록·상세 날짜는 올해면 '9.22'(연도 없이) — 폰 메모가 쓰는 표기. 다른 해면 연도를 앞에 붙인다.
    const fmtShort = s => {
      const d = new Date(s), y = d.getFullYear();
      return (y === new Date().getFullYear() ? '' : y + '.') + (d.getMonth() + 1) + '.' + d.getDate();
    };
    // 수정 이력은 하루에 여러 번 쌓일 수 있어 시각까지 보여준다(날짜만 쓰면 같은 줄이 여럿 보인다).
    const fmtT = s => {
      const d = new Date(s), p = n => String(n).padStart(2, '0');
      return fmtShort(s) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    };
    // 노트 안 행동 계측(2026-09-23) — 공용 비콘. 이벤트명 규칙 ^[a-z][a-z0-9_]{2,63}$ · 개인정보 없음.
    //    note_view(n,m) · note_open(via) · note_search · note_add_save · note_edit_save · note_polish_go · note_delete(n)
    function beacon(ev, meta) { try { if (window.moncBeacon) moncBeacon(ev, meta || {}); } catch (_) {} }

    let ROWS = [];              // 전체 답변(최신순)
    let CHECKS = new Map();     // answer_id → 검사 이력(최신순) — AI킬러 잠시 내림(2026-08-28)이라 화면엔 안 그리지만 받아 둔다
    let POLISHES = new Map();   // answer_id → 첨삭 이력(최신순) — 킬러 검사와 나란한 1:N
    // answer_id → 수정 이력(최신순). ⚠️ **본문은 안 들고 온다** — 답변마다 최대 20벌이라
    //    전부 받으면 목록 한 번에 수백 KB 가 된다. 본문은 그 버전을 펼칠 때 한 행만 받는다.
    let REVS = new Map();
    let filter = { cat: 'all', q: '' };
    let ME = null;

    // 항공사 — lecture-common.js 의 LEC.AIRLINES 와 같은 목록·같은 색(사이트에서 한 벌이어야 한다).
    // ⚠️ 'all'(만능)은 null(아직 안 정함)과 다른 값이다 — 만능은 어디에나 쓰려고 만든 답변이라
    //    첨삭 방향이 갈린다. 둘을 합치지 말 것.
    const AIRLINES = {
      ke: { ko: '대한항공', en: 'KOREAN AIR' }, lj: { ko: '진에어', en: 'JIN AIR' },
      '7c': { ko: '제주항공', en: 'JEJU AIR' }, tw: { ko: '트리니티항공', en: 'TRINITY AIRWAYS' },
      ze: { ko: '이스타항공', en: 'EASTAR JET' }, yp: { ko: '에어프레미아', en: 'AIR PREMIA' },
      rf: { ko: '에어로케이', en: 'AERO K' },
    };
    const GRADE = { human: '사람 같음', slight: '조금 티남', heavy: 'AI 티 많이 남' };
    const KIND_LABEL = { interview: '면접 답변', essay: '자소서' };

    // 유형·제목은 두 곳에서 온다 — 소재 발굴 답변은 questions, 직접 쓴 답변은 answers 자신.
    // ⚠️ answers 쪽을 먼저 본다(학생이 직접 고친 값이 문제 원본보다 우선). mypage.html 과 같은 규칙.
    function catOf(a) { return a.category || (a.questions || {}).category || ''; }
    function titleOf(a) { return (a.questions || {}).content || a.title || '(제목 없음)'; }
    function isDraft(a) { return (a.status || 'final') === 'draft'; }
    function airOf(a) { return a.airline || ''; }
    function byId(id) { return ROWS.find(x => x.id === id); }

    /* ══ 화면 전환 — 해시 라우팅 ═══════════════════════════════════════════
       #a=<id> 답변 상세 · #new 답변 추가 · #materials 소재 탭 · 그 밖은 목록.
       목록에서 눌러 들어간 화면은 [노트] 버튼이 history.back() 으로 돌아가고(뒤로가기와 같은 길),
       주소로 바로 들어온 화면은 해시를 지우고 목록을 그린다. 목록 스크롤은 떠날 때 적어 두고 돌아올 때 되돌린다. */
    let CUR_VIEW = 'list';
    let FROM_LIST = false;
    let LIST_SCROLL = 0;
    let TABS_ON = false;

    function go(hash) {
      LIST_SCROLL = window.scrollY;
      FROM_LIST = true;
      location.hash = hash;
    }
    function goBack() {
      if (FROM_LIST) { history.back(); return; }          // hashchange → route → 목록
      history.replaceState(null, '', location.pathname + location.search);
      route();
    }
    function showView(name) {
      const prev = CUR_VIEW; CUR_VIEW = name;
      document.getElementById('listView').hidden = name !== 'list';
      document.getElementById('detailView').hidden = name !== 'detail';
      document.getElementById('addView').hidden = name !== 'add';
      if (name === 'list') { if (prev !== 'list') window.scrollTo(0, LIST_SCROLL); FROM_LIST = false; }
      else window.scrollTo(0, 0);
    }
    function route() {
      const h = location.hash || '';
      const m = /^#a=(.+)$/.exec(h);
      if (SEL_MODE && m) selExit();            // 고르는 중에 다른 화면으로 가면 고르기를 접는다
      if (m) {
        renderDetail(decodeURIComponent(m[1]));
        showView('detail');
        beacon('note_open', { via: FROM_LIST ? 'list' : 'link' });
        return;
      }
      if (h === '#new') { showView('add'); return; }
      if (h === '#materials' && TABS_ON) showTab('materials');
      showView('list');
    }

    /* ══ 선택 모드 (2026-09-22 오너 "체크박스를 만들어서 한번에 삭제") ═══════════
       ⚠️ 체크칸은 **표시 전용**이다(CSS pointer-events:none). 줄 어디를 눌러도 선택되게
          두면 터치 목표가 줄 전체라 44px 걱정이 없고, 체크칸만 정확히 눌러야 하는 답답함도 없다. */
    const CHECK_SVG = '<span class="selbox" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
    let SEL_MODE = false;
    let SEL = new Set();

    function selEnter() {
      SEL_MODE = true; SEL.clear();
      document.body.classList.add('sel-on');
      document.getElementById('selBar').hidden = false;
      document.getElementById('selEnter').hidden = true;
      syncSel();
    }
    function selExit() {
      SEL_MODE = false; SEL.clear();
      document.body.classList.remove('sel-on');
      document.getElementById('selBar').hidden = true;
      document.getElementById('selEnter').hidden = !ROWS.length;
      syncSel();
    }
    // 고른 것들을 화면에 반영 — 줄 테두리·체크칸·선택 바 숫자가 한 벌이다.
    function syncSel() {
      document.querySelectorAll('#list [data-sel-id]').forEach(el => {
        el.classList.toggle('on', SEL.has(el.dataset.selId));
      });
      const n = SEL.size;
      document.getElementById('selCount').innerHTML = n
        ? ('<b>' + n + '개</b> 선택') : '<span>선택한 답변이 없어요</span>';
      document.getElementById('selDel').disabled = !n;
    }
    async function selDelete() {
      const ids = Array.from(SEL);
      if (!ids.length) return;
      if (!confirm('선택한 답변 ' + ids.length + '개를 지울까요?\n수정 이력도 같이 사라지고, 되돌릴 수 없어요.')) return;
      const btn = document.getElementById('selDel');
      btn.disabled = true; btn.textContent = '지우는 중…';
      try {
        // member_id 조건은 RLS 와 겹치지만 남겨 둔다(단건 삭제와 같은 방어).
        const { error } = await MONC.sb.from('answers').delete().in('id', ids).eq('member_id', ME);
        if (error) throw error;
      } catch (_) {
        btn.disabled = false; btn.textContent = '삭제';
        alert('지우지 못했어요. 잠시 뒤 다시 시도해 주세요.');
        return;
      }
      btn.textContent = '삭제';
      forget(ids);
      beacon('note_delete', { n: ids.length });
      selExit();
      buildChips(); render();
    }
    // 지운 답변을 화면 자료에서 걷어낸다 — 단건·일괄 삭제가 같은 뒤처리를 쓴다.
    function forget(ids) {
      ROWS = ROWS.filter(x => ids.indexOf(x.id) < 0);
      ids.forEach(id => { CHECKS.delete(id); POLISHES.delete(id); REVS.delete(id); });
      syncTabs();
    }

    /* ══ ① 목록 ═══════════════════════════════════════════════════════════ */
    function render() {
      const term = filter.q.trim().toLowerCase();
      const rows = ROWS.filter(a => {
        if (filter.cat !== 'all' && catOf(a) !== filter.cat) return false;
        if (!term) return true;
        // 제목은 소재 발굴 문제(questions.content)일 수도, 직접 쓴 제목(title)일 수도 있다
        return titleOf(a).toLowerCase().indexOf(term) >= 0
          || (a.content || '').toLowerCase().indexOf(term) >= 0;
      });

      const listEl = document.getElementById('list');
      const countEl = document.getElementById('count');
      // 걸러진 상태에서만 개수를 말한다 — 평소엔 탭의 숫자가 그 몫이다.
      countEl.hidden = rows.length === ROWS.length;
      countEl.textContent = rows.length + '개 / 전체 ' + ROWS.length + '개';
      document.querySelector('.filters').hidden = !ROWS.length;

      if (!rows.length) {
        // ⚠️ 답변이 없을 때 소재 발굴로만 보내지 않는다(2026-07-25 오너 지시).
        //    바로 답변만 쓰고 싶은 학생이 있고, 그 길을 막으면 안 된다 — 아래 '답변 추가하기'가 주된 길이다.
        listEl.innerHTML = '<p class="empty">' + (ROWS.length
          ? '조건에 맞는 답변이 없어요.'
          : '아직 저장한 답변이 없어요.<br>아래에서 <b>답변을 추가</b>하거나,'
            + ' <a href="sojae.html">소재 발굴</a>에서 캐내 보세요.') + '</p>';
        syncSel();
        return;
      }
      const rawTerm = filter.q.trim();
      listEl.innerHTML = rows.map(a => rowHtml(a, rawTerm)).join('');
      syncSel();
    }

    // 답변 한 줄 — 제목 + 본문 2줄(CSS 가 자른다) + 날짜·표식. 줄 전체가 상세로 가는 링크다.
    function rowHtml(a, rawTerm) {
      const body = (a.content || '').trim();
      const prev = body ? hi(esc(body.slice(0, 120)), rawTerm) : '<span class="d-none">아직 작성 전</span>';
      const pols = (POLISHES.get(a.id) || []).length;
      let side = '<span class="row-d">' + esc(fmtShort(a.updated_at)) + '</span>';
      if (isDraft(a)) side += '<span class="row-draft">작성 중</span>';
      else if (pols) side += '<span class="row-pol">첨삭 ' + pols + '회</span>';
      return `<a class="row sel-row" href="#a=${encodeURIComponent(a.id)}" data-sel-id="${esc(a.id)}">${CHECK_SVG}
        <div class="row-tx"><div class="row-t">${hi(esc(titleOf(a)), rawTerm)}</div><p class="row-p">${prev}</p></div>
        <div class="row-side">${side}</div></a>`;
    }

    function buildChips() {
      // 실제로 존재하는 유형만 칩으로 (없는 유형을 눌러 빈 화면을 보는 일이 없게). 유형이 하나도 없으면 줄 자체를 숨긴다.
      const cats = [];
      ROWS.forEach(a => { const c = catOf(a); if (c && cats.indexOf(c) < 0) cats.push(c); });
      if (filter.cat !== 'all' && cats.indexOf(filter.cat) < 0) filter.cat = 'all';
      const defs = [{ v: 'all', label: '전체' }].concat(cats.map(c => ({ v: c, label: window.SOJAE.CAT_LABEL[c] || c })));
      const box = document.getElementById('chips');
      box.hidden = !cats.length;
      box.innerHTML = defs.map(d =>
        `<button type="button" class="chip${filter.cat === d.v ? ' on' : ''}" ` +
        `data-v="${esc(d.v)}" aria-pressed="${filter.cat === d.v}">${esc(d.label)}</button>`
      ).join('');

      // ⚠️ 다시 그릴 때마다 붙이면 클릭 한 번이 두 번 처리된다(삭제 뒤 칩을 다시 만든다).
      if (buildChips.wired) return;
      buildChips.wired = true;
      box.addEventListener('click', e => {
        const btn = e.target.closest('.chip');
        if (!btn) return;
        const v = btn.dataset.v;
        filter.cat = (v === 'all' || filter.cat === v) ? 'all' : v;   // 같은 칩을 다시 누르면 해제
        box.querySelectorAll('.chip').forEach(c => {
          const on = filter.cat === c.dataset.v;
          c.classList.toggle('on', on);
          c.setAttribute('aria-pressed', String(on));
        });
        render();
      });
    }

    // 탭 숫자·[선택] 노출 — 첫 로드와 삭제 뒤에 같은 규칙을 쓴다.
    function syncTabs() {
      document.getElementById('tabN').textContent = ROWS.length;
      document.getElementById('matN').textContent = MATS.length;
      const enter = document.getElementById('selEnter');
      if (enter) enter.hidden = SEL_MODE || !ROWS.length;
    }

    // 목록 안에서 일어나는 일 — 줄 누르기(상세로 · 선택 모드면 고르기). render() 가 목록을
    // 통째로 다시 그리므로 줄마다 달지 않고 컨테이너 한 곳에 위임한다.
    function wireList() {
      document.getElementById('list').addEventListener('click', e => {
        const row = e.target.closest('[data-sel-id]');
        if (!row) return;
        e.preventDefault();
        const id = row.dataset.selId;
        if (SEL_MODE) {
          if (SEL.has(id)) SEL.delete(id); else SEL.add(id);
          syncSel();
          return;
        }
        go('a=' + encodeURIComponent(id));
      });
    }

    /* ══ ② 답변 상세 ══════════════════════════════════════════════════════ */
    function renderDetail(id) {
      const a = byId(id);
      const box = document.getElementById('detail');
      if (!a) {
        box.innerHTML = '<p class="empty">이 답변을 찾을 수 없어요.<br>지웠거나 주소가 잘못됐을 수 있어요.</p>';
        return;
      }
      const bits = [];
      const c = catOf(a);
      if (c && window.SOJAE.CAT_LABEL[c]) bits.push(esc(window.SOJAE.CAT_LABEL[c]));
      if (KIND_LABEL[a.doc_kind]) bits.push(esc(KIND_LABEL[a.doc_kind]));
      const air = airOf(a);
      if (air === 'all') bits.push('만능');
      else if (AIRLINES[air]) bits.push(`<span class="d-air air-${esc(air)}">${esc(AIRLINES[air].en)}</span>`);

      const pols = POLISHES.get(a.id) || [];
      const body = (a.content || '').trim();
      let main;
      if (isDraft(a)) {
        // 소재 발굴에서 온 초안은 이어쓰기로 보낸다(직접 쓴 글은 그 화면이 없다). 고치기는 완료본만.
        main = `<div class="d-when"><span>${esc(fmtT(a.updated_at))}</span><span class="d-draft">작성 중</span></div>
          <div class="d-body">${body ? esc(body) : '<span class="d-none">아직 작성 전</span>'}</div>
          ${a.question_id ? `<div class="d-acts"><a class="btn btn-fill" href="sojae.html?q=${encodeURIComponent(a.question_id)}">이어서 작성 →</a></div>` : ''}`;
      } else {
        main = `<div class="d-when"><span>${esc(fmtT(a.updated_at))}</span>${pols.length ? `<span class="d-pol">첨삭 ${pols.length}회</span>` : ''}</div>
          <div class="d-body">${esc(body)}</div>
          <div class="d-acts">
            <button type="button" class="btn btn-line" data-edit="${esc(a.id)}">고치기</button>
            <a class="btn btn-fill" href="polish.html?answer=${encodeURIComponent(a.id)}" data-polish="1">이 답변 첨삭받기</a>
          </div>`;
      }
      box.innerHTML = `${bits.length ? `<p class="d-meta">${bits.join(' · ')}</p>` : ''}
        <h2 class="d-title">${esc(titleOf(a))}</h2>
        <div class="d-main">${main}</div>
        ${histHtml(a)}${revHtml(a)}
        <div class="d-del"><button type="button" data-del="${esc(a.id)}">이 답변 삭제</button></div>`;
    }

    // 본문 아래 — 검사·첨삭 이력. 이력이 없으면 절을 그리지 않는다.
    // ⚠️ 한 답변을 고쳐 가며 여러 번 첨삭받는 게 정상 사용이라 1:N 으로 쌓인다.
    //    지난 결과는 ai-killer.html?check=<id> / polish.html?polish=<id> 가
    //    저장된 원본 그대로 다시 그린다(재검사 아님 — 차감 없음).
    // ⚠️ AI킬러 잠시 내림(2026-08-28 오너 "다 내리자") — 검사 행을 빼고 문구를 '첨삭 리포트'로.
    //    복원 시 아래 /* */ 블록을 되살리고 '첨삭 리포트'→'검사·첨삭 이력'으로 되돌린다.
    function histHtml(a) {
      const list = CHECKS.get(a.id) || [];
      const pols = POLISHES.get(a.id) || [];
      const merged = [
        /* ...list.map(c => ({ t: c.created_at, html:
          `<a class="hrow grade-${esc(c.grade)}" href="ai-killer.html?check=${encodeURIComponent(c.id)}">
             <span class="hrow-d">${esc(fmtShort(c.created_at))}</span>
             <span class="hrow-g">${esc(GRADE[c.grade] || c.grade)}</span>
             <span class="hrow-c">고칠 곳 ${Number(c.hit_count) || 0}</span>
             <span class="hrow-go">보기 →</span></a>` })), */
        ...pols.map(p => ({ t: p.created_at, html:
          `<a class="hrow" href="polish.html?polish=${encodeURIComponent(p.id)}">
             <span class="hrow-d">${esc(fmtShort(p.created_at))}</span>
             <span class="hrow-g">첨삭 리포트</span>
             <span class="hrow-go">보기 →</span></a>` })),
      ].sort((x, y) => new Date(y.t) - new Date(x.t));
      if (!merged.length) return '';
      return `<div class="d-sec">
        <div class="d-sec-h"><span class="d-sec-t">첨삭 리포트</span><span class="d-sec-n">${merged.length}회</span></div>
        ${merged.map(m => m.html).join('')}
      </div>`;
    }

    // 본문 아래 — 수정 이력(2026-08-05). 두 겹으로 접는다. 본문은 버전을 펼치는 순간 그 한 행만 받아 온다(loadRev).
    function revHtml(a) {
      const list = REVS.get(a.id) || [];
      if (!list.length) return '';
      return `<div class="d-sec"><details class="rev-fold">
        <summary><span class="d-sec-t">수정 이력</span><span class="rev-n">${list.length}개 ▾</span></summary>
        <p class="rev-lead">고치기 전 본문이에요. 최신순으로 남습니다.</p>
        ${list.map(r => `<details class="rev-item" data-rev="${esc(r.id)}">
          <summary><span class="rev-d">${esc(fmtT(r.created_at))}</span>
            <span class="rev-go">본문 보기 ▾</span></summary>
          <div class="rev-body">불러오는 중…</div></details>`).join('')}
      </details></div>`;
    }

    // 버전 하나의 본문을 그때 받아 그린다(목록 전송량을 아끼는 자리).
    async function loadRev(d) {
      const box = d.querySelector('.rev-body');
      try {
        const { data, error } = await MONC.sb.from('answer_revisions')
          .select('content').eq('id', d.dataset.rev).single();
        if (error || !data) throw error || new Error('empty');
        box.textContent = data.content;
      } catch (_) {
        box.textContent = '이 버전을 불러오지 못했어요.';
        d.dataset.loaded = '';        // 다시 펼치면 한 번 더 시도한다
      }
    }

    // 고치기 칸 열기 — 본문을 감추고 그 자리에 입력칸을 넣는다(제목·분류는 그대로 — 고치고 싶으면 지우고 새로 쓴다).
    function openEdit(btn) {
      const id = btn.dataset.edit;
      const a = byId(id);
      const box = document.getElementById('detail');
      const bodyEl = box.querySelector('.d-body');
      if (!a || !bodyEl || box.querySelector('.d-edit')) return;
      const ed = document.createElement('div');
      ed.className = 'd-edit';
      // maxlength 1500 — 답변 추가 폼(#fBody)과 같은 상한이어야 한다(한쪽만 바꾸지 말 것).
      ed.innerHTML = `<textarea maxlength="1500" aria-label="답변 본문 고치기"></textarea>
        <div class="d-edit-acts">
          <button type="button" class="btn btn-fill" data-edit-save="${esc(id)}">저장</button>
          <button type="button" class="btn btn-line" data-edit-cancel="1">취소</button>
        </div>
        <p class="d-edit-msg" role="status"></p>`;
      const ta = ed.querySelector('textarea');
      ta.value = a.content || '';
      bodyEl.hidden = true;
      bodyEl.insertAdjacentElement('afterend', ed);
      box.querySelector('.d-acts').hidden = true;
      // 커서를 맨 앞에 — 끝에 두면 긴 글은 칸이 끝으로 스크롤돼 첫 줄이 안 보인다(실측).
      try { ta.setSelectionRange(0, 0); } catch (_) {}
      ta.focus();
      ta.scrollTop = 0;
    }
    function closeEdit() {
      const box = document.getElementById('detail');
      const ed = box.querySelector('.d-edit');
      if (ed) ed.remove();
      const bodyEl = box.querySelector('.d-body');
      if (bodyEl) bodyEl.hidden = false;
      const acts = box.querySelector('.d-acts');
      if (acts) { acts.hidden = false; const b = acts.querySelector('[data-edit]'); if (b) b.focus(); }
    }
    // 고친 본문 저장. ⚠️ 실패하면 칸을 닫지 않는다 — 쓰던 글을 화면에서 잃지 않게.
    async function saveEdit(btn) {
      const id = btn.dataset.editSave;
      const a = byId(id);
      const box = document.getElementById('detail');
      const ed = box.querySelector('.d-edit');
      if (!a || !ed) return;
      const ta = ed.querySelector('textarea');
      const msgEl = ed.querySelector('.d-edit-msg');
      const text = (ta.value || '').trim();
      if (!text) {
        msgEl.className = 'd-edit-msg err';
        msgEl.textContent = '내용을 비울 수는 없어요. 지우려면 아래 삭제를 눌러 주세요.';
        ta.focus(); return;
      }
      if (text === (a.content || '').trim()) { closeEdit(); return; }   // 바뀐 게 없다

      btn.disabled = true; btn.textContent = '저장 중…'; msgEl.className = 'd-edit-msg'; msgEl.textContent = '';
      // updated_at 은 트리거(trg_answers_updated_at)가 찍는다 — 여기서 보내지 않는다.
      // member_id 조건은 RLS 와 겹치지만 남겨 둔다(삭제와 같은 방어).
      const { error } = await MONC.sb.from('answers')
        .update({ content: text }).eq('id', id).eq('member_id', ME);
      if (error) {
        btn.disabled = false; btn.textContent = '저장';
        msgEl.className = 'd-edit-msg err';
        msgEl.textContent = '저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.';
        return;
      }
      a.content = text;
      a.updated_at = new Date().toISOString();
      beacon('note_edit_save');

      // 수정 이력 — 트리거가 방금 한 벌 남겼을 수 있으니 이 답변 것만 다시 받는다
      // (안 받으면 학생이 이력을 펼쳤을 때 방금 고친 흔적이 없어 '안 남았다'로 읽힌다).
      try {
        const { data: rv } = await MONC.sb.from('answer_revisions')
          .select('id, answer_id, created_at')
          .eq('member_id', ME).eq('answer_id', id)
          .order('created_at', { ascending: false });
        REVS.set(id, rv || []);
      } catch (_) { /* answer_revisions 미생성 — 본문만 갱신하고 넘어간다 */ }
      // 상세는 다시 그리고(짧은 화면이라 자리가 튀지 않는다), 목록은 숨겨져 있으니 그 안의 미리보기만 맞춰 둔다.
      renderDetail(id);
      render();
      const b = document.querySelector('#detail [data-edit]'); if (b) b.focus();
    }

    async function deleteOne(btn) {
      const id = btn.dataset.del;
      const a = byId(id);
      if (!a) return;
      if (!confirm('이 답변을 지울까요?\n수정 이력도 같이 사라지고, 되돌릴 수 없어요.')) return;
      btn.disabled = true; btn.textContent = '지우는 중…';
      try {
        // member_id 조건은 RLS 와 겹치지만 남겨 둔다 — 실수로 남의 id 가 들어와도 0건이 된다.
        const { error } = await MONC.sb.from('answers').delete().eq('id', id).eq('member_id', ME);
        if (error) throw error;
      } catch (_) {
        btn.disabled = false; btn.textContent = '이 답변 삭제';
        alert('지우지 못했어요. 잠시 뒤 다시 시도해 주세요.');
        return;
      }
      forget([id]);
      beacon('note_delete', { n: 1 });
      buildChips(); render();
      goBack();
    }

    // 상세 안에서 일어나는 일 — 고치기 열기/취소/저장 · 첨삭 이동 계측 · 삭제 · 버전 본문 받아 오기.
    function wireDetail() {
      const box = document.getElementById('detail');
      box.addEventListener('click', async e => {
        const eOpen = e.target.closest('[data-edit]');
        if (eOpen) { e.preventDefault(); openEdit(eOpen); return; }
        const eCancel = e.target.closest('[data-edit-cancel]');
        if (eCancel) { e.preventDefault(); closeEdit(); return; }
        const eSave = e.target.closest('[data-edit-save]');
        if (eSave) { e.preventDefault(); await saveEdit(eSave); return; }
        if (e.target.closest('[data-polish]')) { beacon('note_polish_go'); return; }   // 링크는 그대로 간다
        const del = e.target.closest('[data-del]');
        if (del) { e.preventDefault(); await deleteOne(del); }
      });
      // toggle 은 버블링하지 않는다 — 캡처 단계로 받아야 위임이 먹는다.
      box.addEventListener('toggle', e => {
        const d = e.target;
        if (!d.classList || !d.classList.contains('rev-item') || !d.open) return;
        if (d.dataset.loaded) return;
        d.dataset.loaded = '1';
        loadRev(d);
      }, true);
    }

    /* ══ ③ 답변 추가 ══════════════════════════════════════════════════════
       ⚠️ 저장은 크레딧을 쓰지 않는다. 저장소에 글을 넣는 일은 언제나 무료·무제한이다.
       ⚠️ 소재 발굴을 거치지 않고 바로 쓰는 길이다(2026-07-25 오너 지시) — 소재 발굴은 관문이 아니다. */
    const form = { cat: '', kind: 'interview', air: '' };

    function pickOne(box, v) {
      box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    }
    function formValid() {
      const t = document.getElementById('fTitle').value.trim();
      const b = document.getElementById('fBody').value.trim();
      // 제목만 있어도 저장된다 — '나중에 이어서 쓰기'가 가능해야 저장소가 쓸모 있다.
      return t.length > 0 && b.length <= 1500;
    }
    function syncForm() {
      const n = document.getElementById('fBody').value.trim().length;
      const c = document.getElementById('fCnt');
      c.textContent = n.toLocaleString() + ' / 1,500자';
      c.classList.toggle('over', n > 1500);
      document.getElementById('saveBtn').disabled = !formValid();
    }

    // ── 시트(질문 유형 · 지망 항공사) — 한 시트를 내용만 바꿔 쓴다. 열 때 첫 항목에, 닫을 때 연 버튼에 포커스.
    let SHEET_KIND = '';
    let SHEET_OPENER = null;
    function openSheet(kind, opener) {
      SHEET_KIND = kind; SHEET_OPENER = opener || null;
      const h = document.getElementById('sheetH'), s = document.getElementById('sheetS'), box = document.getElementById('sheetOpts');
      if (kind === 'air') {
        h.textContent = '지망 항공사';
        s.textContent = '안 정했으면 비워도 돼요.';
        // ⚠️ '만능'을 맨 위에 둔다 — '아직 안 정했어요'와 다른 값이고, 고르는 사람이 더 많다.
        box.innerHTML =
          `<button type="button" class="opt" data-v="all">만능<span class="hint">어디에나 쓰는 답변</span></button>`
          + Object.keys(AIRLINES).map(c =>
              `<button type="button" class="opt air-${esc(c)}" data-v="${esc(c)}">${esc(AIRLINES[c].ko)}`
              + `<span class="en">${esc(AIRLINES[c].en)}</span></button>`).join('')
          + `<button type="button" class="opt" data-v="">아직 안 정했어요</button>`;
      } else {
        h.textContent = '질문 유형';
        s.textContent = '';
        const L = window.SOJAE.CAT_LABEL;
        box.innerHTML = Object.keys(L).map(c =>
            `<button type="button" class="opt" data-v="${esc(c)}">${esc(L[c])}</button>`).join('')
          + `<button type="button" class="opt" data-v="">안 정함</button>`;
      }
      const sheet = document.getElementById('sheet');
      sheet.removeAttribute('inert');
      document.body.classList.add('sheet-on');
      const first = box.querySelector('button'); if (first) first.focus();
    }
    function closeSheet() {
      document.body.classList.remove('sheet-on');
      document.getElementById('sheet').setAttribute('inert', '');
      if (SHEET_OPENER) { SHEET_OPENER.focus(); SHEET_OPENER = null; }
    }
    function sheetOpen() { return document.body.classList.contains('sheet-on'); }

    function setAir(code) {
      form.air = code || '';
      const btn = document.getElementById('fAir');
      const label = document.getElementById('fAirLabel');
      btn.classList.toggle('set', !!form.air);
      if (form.air === 'all') label.textContent = '만능 (항공사 공통)';
      else if (AIRLINES[form.air]) label.textContent = AIRLINES[form.air].ko;
      else label.textContent = '지망 항공사';
    }
    function setCat(code) {
      form.cat = code || '';
      const btn = document.getElementById('fCat');
      const label = document.getElementById('fCatLabel');
      btn.classList.toggle('set', !!form.cat);
      label.textContent = window.SOJAE.CAT_LABEL[form.cat] || '질문 유형';
    }

    async function saveAnswer() {
      const btn = document.getElementById('saveBtn');
      if (btn.disabled) return;
      btn.disabled = true; btn.textContent = '저장 중…';
      const row = {
        member_id: ME,
        title: document.getElementById('fTitle').value.trim().slice(0, 200),
        content: document.getElementById('fBody').value.trim(),
        status: 'final',
        category: form.cat || null,
        doc_kind: form.kind,
        airline: form.air || null,
      };
      // ⚠️ 분류 3종은 마이그레이션(20260725170000)이 있어야 존재한다. 미적용이면 PostgREST 가
      //    insert 를 통째로 거절하므로, 실패하면 분류를 빼고 한 번 더 넣는다 —
      //    분류 세 칸 때문에 답변 본체를 잃지 않는다.
      let { error } = await MONC.sb.from('answers').insert(row);
      if (error) {
        const { category, doc_kind, airline, ...bare } = row;
        ({ error } = await MONC.sb.from('answers').insert(bare));
        if (!error) console.warn('분류 컬럼 없음(20260725170000 미적용) — 제목·본문만 저장했다');
      }
      if (error) {
        document.getElementById('fNotice').innerHTML =
          '<div class="notice">저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.</div>';
        btn.disabled = false; btn.textContent = '저장하기';
        return;
      }
      // 저장에 성공했으니 임시 보관(draft-keep)을 지운다 — 안 지우면 다음에 빈 폼을
      // 열었을 때 이미 저장한 글이 되살아나 '중복 저장'으로 이어진다.
      if (window.moncDraftClear) moncDraftClear('answers-body');
      beacon('note_add_save');   // keepalive 라 바로 아래 이동에도 살아남는다
      // 목록·필터·이력을 한 번에 다시 그린다. ⚠️ reload() 가 아니라 replace(pathname) —
      // ?title=…#new(승자각 문항 프리필)를 그대로 물고 새로고침하면 채워진 폼이 또 열려
      // 중복 저장처럼 보인다. 주소를 목록으로 되돌리며 새로 그린다.
      location.replace(location.pathname);
    }

    /* ══ 내 소재(서랍) ═══════════════════════════════════════════════════
       다듬기(sojae-chat)가 자동 저장한 소재 카드. 학생이 여기서 고치고 지운다. */
    let MATS = [];
    const MAT_FIELDS = [
      ['title', '경험 한 줄 제목', 'input'], ['one_line', '요약', 'input'],
      ['scene', '핵심 장면', 'ta'], ['actions', '행동·판단', 'ta'],
      ['reinterpretation', '역량 재해석', 'ta'],
    ];

    function matRender() {
      const list = document.getElementById('matList');
      document.getElementById('matCount').textContent = MATS.length + '개';
      if (!MATS.length) {
        list.innerHTML = '<p class="empty">아직 소재 카드가 없어요.<br>'
          + '<a href="sojae.html">소재 발굴</a>에서 다듬기까지 하면 여기에 쌓여요.</p>';
        return;
      }
      list.innerHTML = MATS.map(m => {
        const comps = (Array.isArray(m.competencies) ? m.competencies : [])
          .map(x => '<span class="mat-comp">' + esc(x) + '</span>').join('');
        const q = (m.questions || {}).content;
        return `<details class="note" data-id="${esc(m.id)}"><summary>
            <div class="note-top"><span class="note-cat">소재 카드</span>
              <span class="note-date">${esc(fmt(m.updated_at))}</span></div>
            <div class="note-q">${esc(m.title || '(제목 없음)')}</div>
            ${comps ? '<div class="note-meta">' + comps + '</div>' : ''}
            <span class="note-more">카드 보기 ▾</span></summary>
          <div class="mat-body"><dl>
            ${q ? '<dt>유래 문제</dt><dd>' + esc(q) + '</dd>' : ''}
            ${m.one_line ? '<dt>요약</dt><dd>' + esc(m.one_line) + '</dd>' : ''}
            ${m.scene ? '<dt>핵심 장면</dt><dd>' + esc(m.scene) + '</dd>' : ''}
            ${m.actions ? '<dt>행동·판단</dt><dd>' + esc(m.actions) + '</dd>' : ''}
            ${m.reinterpretation ? '<dt>역량 재해석</dt><dd>' + esc(m.reinterpretation) + '</dd>' : ''}
          </dl>
          <div class="mat-acts">
            <button type="button" data-act="edit">수정하기</button>
            <button type="button" class="danger" data-act="del">삭제</button>
          </div></div></details>`;
      }).join('');
    }

    function matEditForm(m, host) {
      const lbl = t => '<div class="lbl" style="margin-top:10px">' + t + '</div>';
      host.innerHTML = '<div class="mat-edit">'
        + MAT_FIELDS.map(([k, label, kind]) =>
            lbl(label)
            + (kind === 'input'
                ? `<input data-f="${k}" maxlength="200" value="${esc(m[k] || '')}">`
                : `<textarea data-f="${k}">${esc(m[k] || '')}</textarea>`)).join('')
        + lbl('역량 태그 (쉼표로 구분)')
        + `<input data-f="competencies" value="${esc((Array.isArray(m.competencies) ? m.competencies : []).join(', '))}">`
        + '<div class="mat-acts"><button type="button" data-act="save">저장</button>'
        + '<button type="button" data-act="cancel">취소</button></div></div>';
    }

    async function matSave(m, host) {
      const val = f => (host.querySelector(`[data-f="${f}"]`) || {}).value || '';
      const patch = {
        title: val('title').trim().slice(0, 200) || '(제목 없음)',
        one_line: val('one_line').trim(), scene: val('scene').trim(),
        actions: val('actions').trim(), reinterpretation: val('reinterpretation').trim(),
        competencies: val('competencies').split(',').map(s => s.trim()).filter(Boolean).slice(0, 5),
      };
      const { error } = await MONC.sb.from('sojae_materials').update(patch).eq('id', m.id);
      if (error) { alert('저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.'); return; }
      Object.assign(m, patch);
      matRender();
    }

    function wireMats() {
      document.getElementById('matList').addEventListener('click', async e => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const card = btn.closest('.note');
        const m = MATS.find(x => x.id === card.dataset.id);
        if (!m) return;
        const body = card.querySelector('.mat-body');
        if (btn.dataset.act === 'edit') matEditForm(m, body);
        else if (btn.dataset.act === 'cancel') matRender();
        else if (btn.dataset.act === 'save') await matSave(m, body);
        else if (btn.dataset.act === 'del') {
          if (!confirm('이 소재 카드를 지울까요?')) return;
          const { error } = await MONC.sb.from('sojae_materials').delete().eq('id', m.id);
          if (error) { alert('지우지 못했어요.'); return; }
          MATS = MATS.filter(x => x.id !== m.id);
          matRender(); syncTabs();
        }
      });
    }

    // 탭 전환 — 답변 쪽 구성요소(검색·칩·개수·목록·추가바·미니 다듬기·[선택])는 CSS(.mat-on)가 한 벌로 숨긴다.
    function showTab(tab) {
      const onMat = tab === 'materials';
      if (onMat && SEL_MODE) selExit();
      document.getElementById('listView').classList.toggle('mat-on', onMat);
      document.getElementById('matWrap').hidden = !onMat;
      document.querySelectorAll('#tabs button').forEach(b =>
        b.classList.toggle('on', b.dataset.tab === tab));
      // 소재 탭으로 들어온 딥링크(#materials)는 답변 탭으로 돌아올 때 지운다 — 새로고침이 소재 탭에 다시 서지 않게.
      if (!onMat && location.hash === '#materials') history.replaceState(null, '', location.pathname + location.search);
    }

    (async () => {
      const session = await MONC.requireSession();
      if (!session) return;
      // 회원 페이지는 예외 없이 동의 게이트를 통과해야 한다(주소창 우회 차단)
      if (!(await MONC.requireConsent())) return;
      // 본인인증 게이트(2026-08-26 오너 지시) — 승준 도구는 인증 회원만(fail-open)
      if (!(await MONC.requireVerified())) return;

      const me = ME = session.user.id;
      try {
        // ⚠️ select('*') — 분류 3종(20260725170000) 미적용 환경에서도 조회가 통째로 깨지지 않게.
        //    컬럼을 나열하면 없는 컬럼 하나에 목록 전체가 400 이 된다.
        let { data, error } = await MONC.sb.from('answers')
          .select('*, questions(content, category)')
          .eq('member_id', me).order('updated_at', { ascending: false });
        if (error) {
          ({ data, error } = await MONC.sb.from('answers')
            .select('*').eq('member_id', me).order('updated_at', { ascending: false }));
        }
        if (error) throw error;
        ROWS = data || [];
      } catch (_) {
        document.getElementById('loading').textContent = '답변을 불러오지 못했어요.';
        return;
      }

      // 검사 이력 — 답변마다 1:N. 테이블 미적용이면 조용히 넘어간다(배지만 안 뜬다).
      try {
        const { data: cs } = await MONC.sb.from('ai_killer_checks')
          .select('id, answer_id, grade, hit_count, created_at')
          .eq('member_id', me).order('created_at', { ascending: false });
        (cs || []).forEach(c => {
          if (!c.answer_id) return;
          if (!CHECKS.has(c.answer_id)) CHECKS.set(c.answer_id, []);
          CHECKS.get(c.answer_id).push(c);
        });
      } catch (_) { /* AI킬러 마이그레이션 전 — 이력 없이 그린다 */ }

      // 첨삭 이력 — 킬러 검사와 나란한 1:N. 테이블 미적용(20260730130000 전)이면 조용히 넘어간다.
      try {
        const { data: ps } = await MONC.sb.from('answer_polishes')
          .select('id, answer_id, created_at')
          .eq('member_id', me).order('created_at', { ascending: false });
        (ps || []).forEach(p => {
          if (!p.answer_id) return;
          if (!POLISHES.has(p.answer_id)) POLISHES.set(p.answer_id, []);
          POLISHES.get(p.answer_id).push(p);
        });
      } catch (_) { /* 첨삭 마이그레이션 전 — 이력 없이 그린다 */ }

      // 수정 이력 — 답변마다 1:N. 테이블 미적용(20260805130000 전)이면 접이가 안 뜬다.
      // ⚠️ content 를 안 받는다(본문은 펼칠 때 loadRev 가 한 행씩). 목록 전송량 예산.
      try {
        const { data: rv } = await MONC.sb.from('answer_revisions')
          .select('id, answer_id, created_at')
          .eq('member_id', me).order('created_at', { ascending: false });
        (rv || []).forEach(r => {
          if (!r.answer_id) return;
          if (!REVS.has(r.answer_id)) REVS.set(r.answer_id, []);
          REVS.get(r.answer_id).push(r);
        });
      } catch (_) { /* answer_revisions 미생성 — 수정 이력 없이 그린다 */ }

      // 소재 서랍 — 테이블 미생성(v2 마이그레이션 전)이면 탭 자체를 숨긴다(degrade).
      try {
        let { data: ms, error: mErr } = await MONC.sb.from('sojae_materials')
          .select('*, questions(content)')
          .eq('member_id', me).eq('status', 'active')
          .order('updated_at', { ascending: false });
        if (mErr) {
          ({ data: ms, error: mErr } = await MONC.sb.from('sojae_materials')
            .select('*').eq('member_id', me).eq('status', 'active')
            .order('updated_at', { ascending: false }));
        }
        if (mErr) throw mErr;
        MATS = ms || [];
        TABS_ON = true;
        document.getElementById('tabs').hidden = false;
        document.getElementById('tabs').addEventListener('click', e => {
          const b = e.target.closest('button'); if (b) showTab(b.dataset.tab);
        });
        wireMats();
        matRender();
      } catch (_) { /* sojae_materials 미생성 — 탭 없이 종전 화면 그대로 */ }

      syncTabs();
      buildChips();
      render();
      wireList();
      wireDetail();

      // 선택 모드 단추 셋 — 들어가기 / 취소 / 한 번에 삭제(2026-09-22)
      document.getElementById('selEnter').addEventListener('click', selEnter);
      document.getElementById('selCancel').addEventListener('click', selExit);
      document.getElementById('selDel').addEventListener('click', selDelete);

      let t, searched = false;
      document.getElementById('q').addEventListener('input', e => {
        clearTimeout(t);
        t = setTimeout(() => {
          filter.q = e.target.value;
          if (filter.q.trim() && !searched) { searched = true; beacon('note_search'); }   // 방문당 한 번
          render();
        }, 160);
      });

      // ── 화면 전환 배선 ──
      document.getElementById('addBtn').addEventListener('click', e => { e.preventDefault(); go('new'); });
      document.getElementById('dBack').addEventListener('click', goBack);
      document.getElementById('aBack').addEventListener('click', goBack);
      window.addEventListener('hashchange', route);

      // ── 답변 추가 화면 배선 ──
      document.getElementById('fKind').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        form.kind = b.dataset.v;
        pickOne(e.currentTarget, form.kind);
        document.getElementById('fBody').placeholder = form.kind === 'interview'
          ? '면접에서 답할 내용을 넣어 주세요. 말하듯이 쓴 그대로가 정확해요.'
          : '자소서 한 문항을 넣어 주세요. 여러 문항을 섞으면 정확도가 떨어져요.';
      });
      document.getElementById('fCat').addEventListener('click', e => openSheet('cat', e.currentTarget));
      document.getElementById('fAir').addEventListener('click', e => openSheet('air', e.currentTarget));
      document.getElementById('sheetOpts').addEventListener('click', e => {
        const b = e.target.closest('[data-v]'); if (!b) return;
        if (SHEET_KIND === 'air') setAir(b.dataset.v); else setCat(b.dataset.v);
        closeSheet();
      });
      document.getElementById('sheetMask').addEventListener('click', closeSheet);
      document.getElementById('fTitle').addEventListener('input', syncForm);
      document.getElementById('fBody').addEventListener('input', syncForm);
      document.getElementById('saveBtn').addEventListener('click', saveAnswer);
      // 시트가 열려 있으면 시트만 닫고, 아니면 목록으로 돌아간다
      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        if (sheetOpen()) closeSheet();
        else if (CUR_VIEW !== 'list') goBack();
      });

      // 승자각 제출 카드(mypage)가 문항 제목을 들고 온다 — ?title=…#new 면 제목을 채워서 연다.
      // 제목 정확 일치가 '작성됨' 판정이라, 여기서 채워 주는 값이 곧 판정 키다(mypage CH_DAYS 와 한 쌍).
      const preTitle = new URLSearchParams(location.search).get('title');
      if (preTitle && location.hash === '#new') {
        const ti = document.getElementById('fTitle');
        if (!ti.value) { ti.value = preTitle.slice(0, 200); syncForm(); }
      }

      route();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      beacon('note_view', { n: ROWS.length, m: MATS.length });
    })();
  </script>
</body>
</html>
