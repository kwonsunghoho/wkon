<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 답변노트 — MONC</title>
  <link rel="icon" href="images/MONC_Logo_Full_Package/assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="images/MONC_Logo_Full_Package/assets/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/MONC_Logo_Full_Package/assets/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/MONC_Logo_Full_Package/assets/favicon/apple-touch-icon.png">
  <meta name="theme-color" content="#102B56">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', -apple-system, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
    .wrap { max-width: 780px; margin: 0 auto; padding: 24px 20px 80px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .brand-link { display: flex; align-items: center; text-decoration: none; }
    .brand-link img { height: 22px; width: auto; display: block; }
    .brand-link:hover { opacity: .7; }
    .back { display: inline-flex; align-items: center; gap: 5px; min-height: 44px; padding: 10px 16px;
      font-size: 13px; font-weight: 700; color: var(--text-muted); background: none;
      border: 1px solid var(--border); border-radius: 999px; text-decoration: none; }
    .back:hover { border-color: var(--action); color: var(--action-dark); }

    .head { margin-bottom: 18px; }
    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--accent-ink); }
    .eyebrow::before { content: '— '; color: var(--action); }
    h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(26px, 5vw, 34px); margin-top: 4px; }
    .head .sub { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    /* 필터 — sticky 로 두지 않는다(작은 화면에서 필터바가 화면을 잡아먹는다) */
    .filters { margin-bottom: 18px; }
    .search { display: block; width: 100%; min-height: 48px; padding: 12px 18px; font: inherit; font-size: 15px;
      color: var(--text); background: var(--surface); border: 1.5px solid var(--border); border-radius: 999px; }
    .search::placeholder { color: var(--text-muted); }
    .search:focus-visible { outline: 3px solid var(--action); outline-offset: 1px; }
    .chips { display: flex; gap: 7px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 44px; padding: 8px 15px;
      border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer;
      color: var(--accent-ink); background: var(--surface); border: 1px solid var(--border-soft); }
    .chip:hover { border-color: var(--accent-dark); }
    .chip.on { color: var(--action-ink); background: var(--action); border-color: transparent; }

    .count { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }

    /* 노트 카드 — mypage 와 같은 문법 */
    .notes { display: flex; flex-direction: column; gap: 10px; }
    .note { border: 1px solid var(--border-soft); border-radius: var(--radius-sm); background: var(--surface); }
    .note > summary { list-style: none; cursor: pointer; padding: 15px; }
    .note > summary::-webkit-details-marker { display: none; }
    .note-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 7px; }
    .note-cat { display: inline-block; background: var(--accent-tint); color: var(--accent-ink); font-size: 11px;
      font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .note-date { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .note-q { font-size: 15px; font-weight: 700; line-height: 1.45; }
    .note-more { display: inline-block; font-size: 12px; color: var(--accent-ink); margin-top: 8px; font-weight: 700; }
    .note[open] .note-q { color: var(--action-dark); }
    .note[open] .note-more { color: var(--text-muted); }
    .note-a { font-size: 15px; color: var(--text); line-height: 1.7; white-space: pre-wrap;
      border-top: 1px dashed var(--border-soft); margin: 0 15px; padding: 13px 0 16px; }
    .note-draft { display: block; padding: 15px; text-decoration: none; color: inherit;
      border-left: 3px solid var(--action); }
    .note-draft:hover { background: var(--surface2); }
    .note-preview { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
    .note-draft .note-more { color: var(--action-dark); }
    mark { background: var(--action-tint); color: var(--accent-ink); padding: 0 2px; border-radius: 3px; }

    .empty { text-align: center; color: var(--text-muted); font-size: 15px; padding: 50px 20px; }
    .empty a { color: var(--accent-ink); font-weight: 700; }
    .loading { text-align: center; color: var(--text-dim); padding: 60px 0; }

    /* ── 답변 메타(유형·종류·항공사·검사 등급) ──
       ⚠️ 활자 하한 14px. 특강 카드에서 한 번 지적된 원칙이라 여기서도 지킨다.
          예외는 항공사 영문 사명뿐(라틴 대문자 브랜드 마크 13px). */
    .note-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
    .tag { font-size: 14px; font-weight: 700; padding: 2px 9px; border-radius: 999px;
      background: var(--bg3); color: var(--text-muted); }
    .tag-air { background: transparent; border: 1px solid var(--border); color: var(--air, var(--text-muted));
      font-size: 13px; font-weight: 800; letter-spacing: .06em; }
    .tag-grade { font-size: 14px; font-weight: 800; color: var(--g, var(--text-muted)); background: none; padding: 0; }
    .tag-grade i { font-style: normal; font-weight: 700; opacity: .65; }
    .grade-human { --g: #2E6E42; } .grade-slight { --g: #8C4318; } .grade-heavy { --g: #9E3B34; }
    /* 항공사 액센트 — lectures.css 의 --air-* 와 같은 값(사이트에서 항공사 색은 한 벌이어야 한다) */
    .air-ke { --air: #14375E; } .air-lj { --air: #3A6440; } .air-7c { --air: #8C4318; }
    .air-tw { --air: #9E3B34; } .air-ze { --air: #97323A; } .air-yp { --air: #2E3D63; }
    .air-rf { --air: #8E4064; } .air-all { --air: var(--text); }

    /* 펼친 답변 아래 — 검사 이력 */
    .hist { border-top: 1px dashed var(--border-soft); margin: 0 15px; padding: 13px 0 16px; }
    .hist-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .hist-t { font-size: 15px; font-weight: 800; }
    .hist-n { font-size: 14px; color: var(--text-dim); }
    .hrow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; margin-top: 8px;
      padding: 10px 12px; text-align: left; font: inherit; background: var(--bg2);
      border: 1px solid var(--border-soft); border-radius: var(--radius-xs); cursor: pointer;
      text-decoration: none; color: inherit; }
    .hrow:hover { border-color: var(--accent-dark); }
    .hrow-d { font-size: 14px; color: var(--text-dim); flex: 0 0 auto; }
    .hrow-g { font-size: 15px; font-weight: 800; color: var(--g, var(--text-muted)); }
    .hrow-c { font-size: 14px; color: var(--text-muted); }
    .hrow-go { margin-left: auto; font-size: 14px; font-weight: 800; color: var(--accent-ink); }
    .hist-none { margin-top: 8px; font-size: 14px; color: var(--text-dim); }
    .hist-cta { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px;
      margin-top: 12px; border: 1.5px solid var(--text); border-radius: 999px; background: transparent;
      font: inherit; font-size: 15px; font-weight: 800; color: var(--text); text-decoration: none; }
    .hist-cta:hover { background: var(--text); color: #fff; }

    /* ── 답변 추가 — 저장소의 주인공. 무료·무제한 ──
       ⚠️ 소재 발굴을 거치지 않고 바로 쓰는 길이다(2026-07-25 오너 지시).
          소재 발굴은 소재를 캐내는 곳이지 답변을 넣는 관문이 아니다. */
    .addbar { position: sticky; bottom: 0; margin: 18px -20px 0; padding: 14px 20px 18px;
      background: linear-gradient(to top, var(--bg) 70%, rgba(255,250,243,0)); }
    .add-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      min-height: 52px; border: 0; border-radius: 999px; background: var(--text); color: #fff;
      font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; }
    .add-btn svg { width: 18px; height: 18px; }
    .add-note { margin-top: 8px; text-align: center; font-size: 14px; color: var(--text-dim); }
    .add-note b { color: var(--text-muted); font-weight: 800; }

    .form-card { background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 15px; }
    .lbl { font-size: 14px; font-weight: 800; color: var(--text-dim); margin-bottom: 8px; }
    .lbl span { font-weight: 700; color: var(--text-dim); opacity: .8; }
    .f-hr { height: 1px; background: var(--border-soft); margin: 14px 0; }
    .f-title { width: 100%; min-height: 44px; border: 0; border-bottom: 1px solid var(--border-soft);
      font: inherit; font-size: 16px; font-weight: 700; color: var(--text); background: transparent;
      padding: 0 0 10px; }
    .f-title::placeholder { font-weight: 400; color: var(--text-dim); }
    .f-ta { width: 100%; min-height: 170px; border: 0; resize: vertical; font: inherit; font-size: 15px;
      line-height: 1.75; color: var(--text); background: transparent; }
    .f-title:focus, .f-ta:focus { outline: none; }
    .seg { display: flex; gap: 6px; }
    .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .seg button, .grid2 button, .pickbtn { min-height: 44px; font: inherit; font-size: 14px; font-weight: 700;
      border: 1px solid var(--border); background: var(--bg2); border-radius: var(--radius-xs);
      color: var(--text-muted); cursor: pointer; }
    .seg button { flex: 1; }
    .seg button.on, .grid2 button.on { background: var(--surface); color: var(--text); border-color: var(--text);
      box-shadow: inset 0 0 0 1px var(--text); }
    .pickbtn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 0 13px; text-align: left; }
    .pickbtn.set { background: var(--surface); color: var(--text); border-color: var(--text); }
    .pickbtn .en { margin-left: auto; font-size: 13px; font-weight: 800; letter-spacing: .08em; color: var(--air); }
    .pickbtn .chev { margin-left: auto; width: 16px; height: 16px; opacity: .5; flex: 0 0 auto; }
    .pickbtn.set .chev { margin-left: 6px; }
    .f-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 11px;
      padding-top: 11px; border-top: 1px solid var(--border-soft); font-size: 14px; color: var(--text-dim); }
    .f-foot b { color: var(--text-muted); font-weight: 700; font-variant-numeric: tabular-nums; }
    .f-foot b.over { color: #9E3B34; }
    .save-btn { width: 100%; min-height: 54px; margin-top: 16px; border: 0; border-radius: 999px;
      background: var(--action); color: var(--action-ink); font: inherit; font-size: 17px; font-weight: 800;
      cursor: pointer; }
    .save-btn:disabled { opacity: .45; cursor: default; }
    .save-note { margin-top: 10px; text-align: center; font-size: 14px; color: var(--text-dim); }
    .save-note b { color: var(--accent-ink); font-weight: 800; }
    .notice { margin-top: 12px; padding: 12px 14px; border-radius: var(--radius-xs); font-size: 14px;
      border: 1px solid rgba(158,59,52,.3); background: rgba(158,59,52,.07); color: #8A332D; }

    /* 항공사 시트 — news.html 필터와 같은 관습(버튼 → 바텀시트) */
    .sheet-mask { position: fixed; inset: 0; z-index: 80; background: rgba(27,29,34,.45);
      opacity: 0; pointer-events: none; transition: opacity .18s; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 81; max-height: 78vh; overflow-y: auto;
      background: var(--surface); border-radius: 18px 18px 0 0; padding: 8px 18px 24px;
      transform: translateY(102%); transition: transform .24s cubic-bezier(.22,.61,.36,1); }
    body.sheet-on .sheet-mask { opacity: 1; pointer-events: auto; }
    body.sheet-on .sheet { transform: translateY(0); }
    .sheet-inner { max-width: 780px; margin: 0 auto; }
    .grip { width: 38px; height: 4px; border-radius: 2px; background: var(--border); margin: 6px auto 14px; }
    .sheet-h { font-size: 16px; font-weight: 800; }
    .sheet-s { margin-top: 4px; margin-bottom: 12px; font-size: 14px; color: var(--text-dim); }
    .opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 0 4px;
      border: 0; border-bottom: 1px solid var(--border-soft); background: none; font: inherit;
      font-size: 15px; font-weight: 700; color: var(--text); cursor: pointer; text-align: left; }
    .opt:last-child { border-bottom: 0; }
    .opt .en { margin-left: auto; font-size: 13px; font-weight: 800; letter-spacing: .08em; color: var(--air); }
    .opt .hint { margin-left: auto; font-size: 14px; font-weight: 700; color: var(--text-dim); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="index.html" class="brand-link" title="홈으로"><img src="images/MONC_Logo_Full_Package/assets/web/monc-logo-transparent-640.webp" alt="MONC" /></a>
      <a href="mypage.html" class="back">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>마이페이지</a>
    </div>

    <div id="content" style="display:none;">
      <!-- ══ 목록 ══ -->
      <div id="listView">
        <div class="head">
          <div class="eyebrow">MY ANSWERS</div>
          <h1>내 답변 저장소</h1>
          <p class="sub" id="hSub"></p>
        </div>

        <div class="filters">
          <input type="search" class="search" id="q" placeholder="질문·답변 내용 검색" aria-label="답변 검색" />
          <div class="chips" id="chips" role="group" aria-label="답변 분류 필터"></div>
        </div>

        <p class="count" id="count"></p>
        <div class="notes" id="list"></div>

        <!-- ⚠️ 저장은 크레딧과 무관하게 언제나 무료다. 그 사실을 버튼 밑에 붙여 둔다 —
             '검사 횟수가 없으면 저장도 못 하나?'라는 오해가 실제로 생긴다. -->
        <div class="addbar">
          <button type="button" class="add-btn" id="addBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                 stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            답변 추가하기
          </button>
          <p class="add-note">저장은 <b>무제한 무료</b>예요. 검사 횟수와 상관없어요.</p>
        </div>
      </div>

      <!-- ══ 답변 추가 ══ -->
      <div id="addView" hidden>
        <div class="head">
          <div class="eyebrow">NEW ANSWER</div>
          <h1>답변 추가</h1>
          <p class="sub">지금 생각나는 대로 써도 괜찮아요. 나중에 고칠 수 있어요.</p>
        </div>

        <div class="form-card">
          <div class="lbl">어떤 질문인가요</div>
          <input class="f-title" id="fTitle" maxlength="200" autocomplete="off"
                 placeholder="예) 자신의 강점을 말해 보세요">

          <div class="f-hr"></div>
          <div class="lbl">질문 유형</div>
          <div class="grid2" id="fCat" role="group" aria-label="질문 유형">
            <button type="button" data-v="experience">경험 발굴형</button>
            <button type="button" data-v="values">가치관형</button>
            <button type="button" data-v="judgment">상황 판단형</button>
            <button type="button" data-v="company">정보·기업 분석형</button>
          </div>

          <div class="f-hr"></div>
          <div class="lbl">종류</div>
          <div class="seg" id="fKind" role="group" aria-label="글 종류">
            <button type="button" data-v="interview" class="on">면접 답변</button>
            <button type="button" data-v="essay">자소서</button>
          </div>

          <div class="f-hr"></div>
          <div class="lbl">지망 항공사 <span>(선택)</span></div>
          <button type="button" class="pickbtn" id="fAir">
            <span id="fAirLabel">아직 안 정했어요</span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>

          <div class="f-hr"></div>
          <div class="lbl">답변</div>
          <textarea class="f-ta" id="fBody" maxlength="1500"
                    placeholder="면접에서 답할 내용을 넣어 주세요. 말하듯이 쓴 그대로가 정확해요."></textarea>
          <div class="f-foot"><span>나중에 이어서 써도 돼요</span><b id="fCnt">0 / 1,500자</b></div>
        </div>

        <div id="fNotice"></div>
        <button type="button" class="save-btn" id="saveBtn" disabled>저장하기</button>
        <p class="save-note">저장은 <b>무료</b>예요 · 검사는 저장한 뒤 골라서 해요</p>
        <p class="add-note" style="margin-top:14px">
          소재가 잘 안 떠오르면 <a href="sojae.html" style="color:var(--accent-ink);font-weight:800">소재 발굴</a>에서
          되묻기로 캐낼 수도 있어요.
        </p>
      </div>
    </div>

    <div class="loading" id="loading">불러오는 중…</div>
  </div>

  <!-- 항공사 선택 시트 -->
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="지망 항공사">
    <div class="sheet-inner">
      <div class="grip"></div>
      <div class="sheet-h">지망 항공사</div>
      <p class="sheet-s">항공사마다 자소서 흐름도, 면접이 보는 결도 달라요. 안 정했으면 비워도 돼요.</p>
      <div id="airOpts"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="sojae-common.js"></script>
  <script>
    // 소재 발굴에서 답변을 쓰고 뒤로가기로 오면(bfcache) 목록이 낡은 채로 남는다.
    window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

    function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    // 검색어를 결과에서 하이라이트. esc 를 거친 문자열에만 쓴다.
    function hi(escaped, term) {
      if (!term) return escaped;
      const t = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return escaped.replace(new RegExp('(' + esc(t) + ')', 'gi'), '<mark>$1</mark>');
    }
    const fmt = s => { const d = new Date(s); return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate(); };

    let ROWS = [];              // 전체 답변(최신순)
    let CHECKS = new Map();     // answer_id → 검사 이력(최신순)
    let filter = { status: 'all', cat: 'all', q: '' };
    let ME = null;

    // 항공사 — lecture-common.js 의 LEC.AIRLINES 와 같은 목록·같은 색(사이트에서 한 벌이어야 한다).
    // ⚠️ 'all'(만능)은 null(아직 안 정함)과 다른 값이다 — 만능은 어디에나 쓰려고 만든 답변이라
    //    첨삭 방향이 갈린다. 둘을 합치지 말 것.
    const AIRLINES = {
      ke: { ko: '대한항공', en: 'KOREAN AIR' }, lj: { ko: '진에어', en: 'JIN AIR' },
      '7c': { ko: '제주항공', en: 'JEJU AIR' }, tw: { ko: '티웨이항공', en: "T'WAY AIR" },
      ze: { ko: '이스타항공', en: 'EASTAR JET' }, yp: { ko: '에어프레미아', en: 'AIR PREMIA' },
      rf: { ko: '에어로케이', en: 'AERO K' },
    };
    const GRADE = { human: '사람 같음', slight: '조금 티남', heavy: 'AI 티 많이 남' };
    const KIND_LABEL = { interview: '면접 답변', essay: '자소서' };

    // 유형·제목은 두 곳에서 온다 — 소재 발굴 답변은 questions, 직접 쓴 답변은 answers 자신.
    // ⚠️ answers 쪽을 먼저 본다(학생이 직접 고친 값이 문제 원본보다 우선).
    function catOf(a) { return a.category || (a.questions || {}).category || ''; }
    function catLabel(a) { return (window.SOJAE.CAT_LABEL[catOf(a)]) || '소재 발굴'; }
    function titleOf(a) { return (a.questions || {}).content || a.title || '(제목 없음)'; }
    function isDraft(a) { return (a.status || 'final') === 'draft'; }
    function airOf(a) { return a.airline || ''; }

    function render() {
      const term = filter.q.trim().toLowerCase();
      const rows = ROWS.filter(a => {
        if (filter.status === 'draft' && !isDraft(a)) return false;
        if (filter.status === 'final' && isDraft(a)) return false;
        if (filter.cat !== 'all' && catOf(a) !== filter.cat) return false;
        if (!term) return true;
        // 제목은 소재 발굴 문제(questions.content)일 수도, 직접 쓴 제목(title)일 수도 있다
        return titleOf(a).toLowerCase().indexOf(term) >= 0
          || (a.content || '').toLowerCase().indexOf(term) >= 0;
      });

      const listEl = document.getElementById('list');
      document.getElementById('count').textContent =
        rows.length === ROWS.length ? (ROWS.length + '개') : (rows.length + '개 / 전체 ' + ROWS.length + '개');

      if (!rows.length) {
        // ⚠️ 답변이 없을 때 소재 발굴로만 보내지 않는다(2026-07-25 오너 지시).
        //    바로 답변만 쓰고 싶은 학생이 있고, 그 길을 막으면 안 된다 — 아래 '답변 추가하기'가 주된 길이다.
        listEl.innerHTML = '<p class="empty">' + (ROWS.length
          ? '조건에 맞는 답변이 없어요.'
          : '아직 저장한 답변이 없어요.<br>아래에서 <b>답변을 추가</b>하거나,'
            + ' <a href="sojae.html">소재 발굴</a>에서 캐내 보세요.') + '</p>';
        return;
      }

      const rawTerm = filter.q.trim();
      listEl.innerHTML = rows.map(a => {
        const qText = hi(esc(titleOf(a)), rawTerm);
        const top = `<div class="note-top"><span class="note-cat">${esc(catLabel(a))}</span>` +
          `<span class="note-date">${fmt(a.updated_at)}</span></div>`;
        if (isDraft(a)) {
          const body = (a.content || '').trim();
          const preview = body ? hi(esc(body.slice(0, 70)), rawTerm) + (body.length > 70 ? '…' : '')
            : '아직 작성 전 — 눌러서 이어쓰기';
          // 소재 발굴에서 온 초안만 이어쓰기로 보낸다(직접 쓴 글은 그 화면이 없다)
          const href = a.question_id ? 'sojae.html?q=' + encodeURIComponent(a.question_id) : null;
          const inner = `${top}<div class="note-q">${qText}</div><div class="note-preview">${preview}</div>`;
          return href
            ? `<a class="note note-draft" href="${href}">${inner}<span class="note-more">이어서 작성 →</span></a>`
            : `<div class="note note-draft">${inner}</div>`;
        }
        return `<details class="note"><summary>${top}<div class="note-q">${qText}</div>
          ${metaHtml(a)}<span class="note-more">답변 보기 ▾</span></summary>
          <div class="note-a">${hi(esc(a.content), rawTerm)}</div>
          ${histHtml(a)}</details>`;
      }).join('');
    }

    // 카드 메타 한 줄 — 종류·항공사·마지막 검사 등급.
    // ⚠️ 검사한 적이 없으면 **아무것도 그리지 않는다.** '아직 안 함'을 굳이 쓰면 목록이 잔소리가 된다.
    function metaHtml(a) {
      const bits = [];
      const kind = KIND_LABEL[a.doc_kind];
      if (kind) bits.push(`<span class="tag">${esc(kind)}</span>`);
      const air = airOf(a);
      if (air === 'all') bits.push('<span class="tag">만능</span>');
      else if (AIRLINES[air]) bits.push(`<span class="tag tag-air air-${esc(air)}">${esc(AIRLINES[air].en)}</span>`);
      const list = CHECKS.get(a.id) || [];
      if (list.length) {
        const last = list[0];
        bits.push(`<span class="tag tag-grade grade-${esc(last.grade)}">${esc(GRADE[last.grade] || last.grade)}`
          + (list.length > 1 ? ` <i>· ${list.length}회 검사</i>` : '') + '</span>');
      }
      return bits.length ? `<div class="note-meta">${bits.join('')}</div>` : '';
    }

    // 펼쳤을 때 아래 — 검사 이력.
    // ⚠️ 한 답변을 고쳐 가며 여러 번 검사하는 게 정상 사용이라 1:N 으로 쌓인다.
    //    지난 결과는 ai-killer.html?check=<id> 가 저장된 원본 그대로 다시 그린다.
    function histHtml(a) {
      const list = CHECKS.get(a.id) || [];
      const rows = list.map(c =>
        `<a class="hrow grade-${esc(c.grade)}" href="ai-killer.html?check=${encodeURIComponent(c.id)}">
           <span class="hrow-d">${fmt(c.created_at)}</span>
           <span class="hrow-g">${esc(GRADE[c.grade] || c.grade)}</span>
           <span class="hrow-c">고칠 곳 ${Number(c.hit_count) || 0}</span>
           <span class="hrow-go">보기 →</span></a>`).join('');
      return `<div class="hist">
        <div class="hist-h"><span class="hist-t">검사 이력</span><span class="hist-n">${list.length}회</span></div>
        ${rows || '<p class="hist-none">아직 검사하지 않은 답변이에요.</p>'}
        <a class="hist-cta" href="ai-killer.html?answer=${encodeURIComponent(a.id)}">
          ${list.length ? '고쳐서 다시 KILL AI' : '이 답변 KILL AI'}</a>
      </div>`;
    }

    function buildChips() {
      // 실제로 존재하는 분류만 칩으로 (없는 카테고리를 눌러 빈 화면을 보는 일이 없게)
      const cats = [];
      ROWS.forEach(a => { const c = catOf(a); if (c && cats.indexOf(c) < 0) cats.push(c); });
      const nDraft = ROWS.filter(isDraft).length;
      const defs = [{ k: 'status', v: 'all', label: '전체' }];
      if (nDraft) defs.push({ k: 'status', v: 'draft', label: '작성 중 ' + nDraft });
      if (nDraft && nDraft < ROWS.length) defs.push({ k: 'status', v: 'final', label: '완료 ' + (ROWS.length - nDraft) });
      cats.forEach(c => defs.push({ k: 'cat', v: c, label: window.SOJAE.CAT_LABEL[c] || c }));

      const box = document.getElementById('chips');
      box.innerHTML = defs.map(d =>
        `<button type="button" class="chip${(d.k === 'status' && d.v === 'all') ? ' on' : ''}" ` +
        `data-k="${d.k}" data-v="${esc(d.v)}" aria-pressed="${(d.k === 'status' && d.v === 'all')}">${esc(d.label)}</button>`
      ).join('');

      box.addEventListener('click', e => {
        const btn = e.target.closest('.chip');
        if (!btn) return;
        const k = btn.dataset.k, v = btn.dataset.v;
        // 같은 칩을 다시 누르면 해제. 카테고리·상태는 서로 독립.
        if (k === 'cat') filter.cat = (filter.cat === v) ? 'all' : v;
        else filter.status = v;
        box.querySelectorAll('.chip').forEach(c => {
          const on = c.dataset.k === 'cat' ? (filter.cat === c.dataset.v)
            : (filter.status === c.dataset.v);
          c.classList.toggle('on', on);
          c.setAttribute('aria-pressed', String(on));
        });
        render();
      });
    }

    // ── 답변 추가 ────────────────────────────────────────────────────────────
    // ⚠️ 저장은 크레딧을 쓰지 않는다. 저장소에 글을 넣는 일은 언제나 무료·무제한이다.
    const form = { cat: '', kind: 'interview', air: '' };

    function showAdd(on) {
      document.getElementById('listView').hidden = on;
      document.getElementById('addView').hidden = !on;
      document.documentElement.scrollTop = 0;
    }

    function pickOne(box, v) {
      box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    }

    function formValid() {
      const t = document.getElementById('fTitle').value.trim();
      const b = document.getElementById('fBody').value.trim();
      // 제목만 있어도 저장된다 — '나중에 이어서 쓰기'가 가능해야 저장소가 쓸모 있다.
      return t.length > 0 && b.length <= 1500;
    }

    function syncForm() {
      const n = document.getElementById('fBody').value.trim().length;
      const c = document.getElementById('fCnt');
      c.textContent = n.toLocaleString() + ' / 1,500자';
      c.classList.toggle('over', n > 1500);
      document.getElementById('saveBtn').disabled = !formValid();
    }

    function openAir() {
      const box = document.getElementById('airOpts');
      // ⚠️ '만능'을 맨 위에 둔다 — '아직 안 정했어요'와 다른 값이고, 고르는 사람이 더 많다.
      box.innerHTML =
        `<button type="button" class="opt" data-air="all">만능<span class="hint">어디에나 쓰는 답변</span></button>`
        + Object.keys(AIRLINES).map(c =>
            `<button type="button" class="opt air-${esc(c)}" data-air="${esc(c)}">${esc(AIRLINES[c].ko)}`
            + `<span class="en">${esc(AIRLINES[c].en)}</span></button>`).join('')
        + `<button type="button" class="opt" data-air="">아직 안 정했어요</button>`;
      document.body.classList.add('sheet-on');
    }

    function setAir(code) {
      form.air = code || '';
      const btn = document.getElementById('fAir');
      const label = document.getElementById('fAirLabel');
      btn.querySelector('.en')?.remove();
      btn.className = 'pickbtn' + (form.air ? ' set air-' + form.air : '');
      if (form.air === 'all') label.textContent = '만능 (항공사 공통)';
      else if (AIRLINES[form.air]) {
        label.textContent = AIRLINES[form.air].ko;
        const en = document.createElement('span');
        en.className = 'en'; en.textContent = AIRLINES[form.air].en;
        btn.insertBefore(en, btn.querySelector('.chev'));
      } else label.textContent = '아직 안 정했어요';
      document.body.classList.remove('sheet-on');
    }

    async function saveAnswer() {
      const btn = document.getElementById('saveBtn');
      if (btn.disabled) return;
      btn.disabled = true; btn.textContent = '저장 중…';
      const row = {
        member_id: ME,
        title: document.getElementById('fTitle').value.trim().slice(0, 200),
        content: document.getElementById('fBody').value.trim(),
        status: 'final',
        category: form.cat || null,
        doc_kind: form.kind,
        airline: form.air || null,
      };
      // ⚠️ 분류 3종은 마이그레이션(20260725170000)이 있어야 존재한다. 미적용이면 PostgREST 가
      //    insert 를 통째로 거절하므로, 실패하면 분류를 빼고 한 번 더 넣는다 —
      //    분류 세 칸 때문에 답변 본체를 잃지 않는다.
      let { error } = await MONC.sb.from('answers').insert(row);
      if (error) {
        const { category, doc_kind, airline, ...bare } = row;
        ({ error } = await MONC.sb.from('answers').insert(bare));
        if (!error) console.warn('분류 컬럼 없음(20260725170000 미적용) — 제목·본문만 저장했다');
      }
      if (error) {
        document.getElementById('fNotice').innerHTML =
          '<div class="notice">저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.</div>';
        btn.disabled = false; btn.textContent = '저장하기';
        return;
      }
      location.reload();   // 목록·필터·이력을 한 번에 다시 그린다
    }

    (async () => {
      const session = await MONC.requireSession();
      if (!session) return;
      // 회원 페이지는 예외 없이 동의 게이트를 통과해야 한다(주소창 우회 차단)
      if (!(await MONC.requireConsent())) return;

      const me = ME = session.user.id;
      try {
        // ⚠️ select('*') — 분류 3종(20260725170000) 미적용 환경에서도 조회가 통째로 깨지지 않게.
        //    컬럼을 나열하면 없는 컬럼 하나에 목록 전체가 400 이 된다.
        let { data, error } = await MONC.sb.from('answers')
          .select('*, questions(content, category)')
          .eq('member_id', me).order('updated_at', { ascending: false });
        if (error) {
          ({ data, error } = await MONC.sb.from('answers')
            .select('*').eq('member_id', me).order('updated_at', { ascending: false }));
        }
        if (error) throw error;
        ROWS = data || [];
      } catch (_) {
        document.getElementById('loading').textContent = '답변을 불러오지 못했어요.';
        return;
      }

      // 검사 이력 — 답변마다 1:N. 테이블 미적용이면 조용히 넘어간다(배지만 안 뜬다).
      try {
        const { data: cs } = await MONC.sb.from('ai_killer_checks')
          .select('id, answer_id, grade, hit_count, created_at')
          .eq('member_id', me).order('created_at', { ascending: false });
        (cs || []).forEach(c => {
          if (!c.answer_id) return;
          if (!CHECKS.has(c.answer_id)) CHECKS.set(c.answer_id, []);
          CHECKS.get(c.answer_id).push(c);
        });
      } catch (_) { /* AI킬러 마이그레이션 전 — 이력 없이 그린다 */ }

      const nDraft = ROWS.filter(isDraft).length;
      document.getElementById('hSub').textContent = ROWS.length
        ? (ROWS.length + '개' + (nDraft ? ' · 작성 중 ' + nDraft : ''))
        : '써 둔 답변을 모아 두고, 언제든 다시 검사해요';

      buildChips();
      render();

      let t;
      document.getElementById('q').addEventListener('input', e => {
        clearTimeout(t);
        t = setTimeout(() => { filter.q = e.target.value; render(); }, 160);
      });

      // ── 답변 추가 화면 배선 ──
      document.getElementById('addBtn').addEventListener('click', () => showAdd(true));
      document.getElementById('fCat').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        // 같은 걸 다시 누르면 해제 — 유형은 선택 항목이다
        form.cat = (form.cat === b.dataset.v) ? '' : b.dataset.v;
        pickOne(e.currentTarget, form.cat);
      });
      document.getElementById('fKind').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        form.kind = b.dataset.v;
        pickOne(e.currentTarget, form.kind);
        document.getElementById('fBody').placeholder = form.kind === 'interview'
          ? '면접에서 답할 내용을 넣어 주세요. 말하듯이 쓴 그대로가 정확해요.'
          : '자소서 한 문항을 넣어 주세요. 여러 문항을 섞으면 정확도가 떨어져요.';
      });
      document.getElementById('fAir').addEventListener('click', openAir);
      document.getElementById('airOpts').addEventListener('click', e => {
        const b = e.target.closest('[data-air]'); if (b) setAir(b.dataset.air);
      });
      document.getElementById('sheetMask').addEventListener('click',
        () => document.body.classList.remove('sheet-on'));
      document.getElementById('fTitle').addEventListener('input', syncForm);
      document.getElementById('fBody').addEventListener('input', syncForm);
      document.getElementById('saveBtn').addEventListener('click', saveAnswer);
      // 시트가 열려 있으면 시트만 닫고, 아니면 목록으로 돌아간다
      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        if (document.body.classList.contains('sheet-on')) document.body.classList.remove('sheet-on');
        else if (!document.getElementById('addView').hidden) showAdd(false);
      });
      // 추가 화면에서 뒤로가기를 누르면 목록으로(주소가 안 바뀌므로 브라우저가 페이지를 떠난다 —
      // 그 전에 화면 상태만 되돌린다)
      if (location.hash === '#new') showAdd(true);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    })();
  </script>
</body>
</html>
