       ══════════════════════════════════════════════════════════════ */
    body { margin:0; background:var(--bg); color:var(--text);
      font-family:'SUIT Variable',SUIT,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
      -webkit-font-smoothing:antialiased; word-break:keep-all; }
    .wrap { max-width:520px; margin:0 auto; padding:0 16px 64px; }

    .head { padding:24px 0 4px; }
    .head h1 { margin:0 0 6px; font-size:24px; line-height:1.3; letter-spacing:-0.02em; color:var(--ink); }
    .head p { margin:0; font-size:14px; line-height:1.65; color:var(--text-muted); }

    /* 돌아갈 곳 안내 — ?back= 으로 들어왔을 때만 */
    .back { display:none; margin:16px 0 0; padding:12px 14px; background:var(--bg2);

    .bal-free { margin:10px 0 0; padding-top:10px; border-top:1px solid var(--border-soft);

    .packs { display:grid; gap:10px; }
    .pack { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%;

    .pack .n { display:block; font-size:17px; font-weight:800; color:var(--ink); letter-spacing:-0.01em; }

    .led-row .v { font-weight:700; color:var(--ink); }
    .led-row .v.minus { color:var(--text-muted); font-weight:600; }

  <script src="credit-charge.js?v=1"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    /* 돌아갈 곳 — **화이트리스트만** 받는다. 주소창으로 아무 데나 넣어도
       외부로 튕기지 않게(오픈 리다이렉트 방지). */
    const BACK = {
      'polish.html':    '답변 첨삭',
      'sojae.html':     '소재 발굴',
      'ai-killer.html': 'AI킬러',
      'answers.html':   '나만의 승준노트',
      'mypage.html':    '마이페이지',
      'program.html':   '매일 답변 프로그램',
    };
    const _back = (() => {
      const v = new URLSearchParams(location.search).get('back') || '';
      return BACK[v] ? v : '';
    })();

    /* 조사 — '소재 발굴으로'가 되지 않게. 받침이 없거나 ㄹ 받침이면 '로'. */
    function ro(word) {
      const c = String(word || '').trim().slice(-1).charCodeAt(0);
      if (!(c >= 0xAC00 && c <= 0xD7A3)) return '로';       // 한글이 아니면 '로'
      const jong = (c - 0xAC00) % 28;
      return (jong === 0 || jong === 8) ? '로' : '으로';     // 8 = ㄹ
    }

    function notice(msg, err) {
      const el = $('notice');
      el.style.display = ''; el.classList.toggle('err', !!err); el.innerHTML = msg;
    }

    /* 잔액·단가·무료 — 전부 credit_wallet() 이 원장이다. 무료는 '크레딧'이 아니라
       '무엇을 몇 번'으로 말한다(두 단위를 섞으면 "5크레딧 남았는데 왜 첨삭이 안 되지"가 된다). */
    function paintWallet() {
      const w = moncCredit.wallet();
      const bal = moncCredit.balance();
      $('balN').textContent = bal.toLocaleString();

      const cp = moncCredit.cost('polish'), cs = moncCredit.cost('sojae');
      const canP = Math.floor(bal / cp), canS = Math.floor(bal / cs);
      $('balCan').innerHTML = bal <= 0
        ? '아직 크레딧이 없어요. 아래에서 충전하면 바로 쓸 수 있어요.'
        : '지금 <b>첨삭 ' + canP + '회</b> 또는 <b>소재 발굴 ' + canS + '회</b>를 할 수 있어요.';

      const left = moncCredit.dailyLeft();
      $('balFree').textContent = !w ? ''
        : left > 0
          ? '오늘 무료 ' + left + '크레딧이 남아 있어요 — 소재 발굴 ' + Math.floor(left / cs)
            + '회 · 매일 자정에 새로 채워져요'
          : '오늘 무료분을 다 썼어요 · 자정에 다시 채워져요';

      $('costTable').innerHTML =
        '<div class="cost-row"><b>소재 발굴 — 다듬기 1회</b><span>' + cs + '크레딧</span></div>'
        + '<div class="cost-row"><b>답변 첨삭 1회</b><span>' + cp + '크레딧</span></div>'
        + '<div class="cost-row free"><b>답변 저장 · 되묻기 대화</b><span>무료 · 무제한</span></div>';

      // 하루 무료는 매일 리셋된다는 사실이 재방문 이유다(2026-08-17) — 값도 서버가 원장
      const dayFree = Number(w && w.daily_free) || 0;
      const firstFree = Number(w && w.polish_free_left) || 0;
      $('freeNote').innerHTML =
        (dayFree > 0 ? '매일 <b>' + dayFree + '크레딧</b>이 무료로 채워져요(남은 무료분은 다음 날로 넘어가지 않아요).' : '')
        + (firstFree > 0 ? (dayFree > 0 ? ' ' : '') + '<b>첫 첨삭 1회는 무료</b>예요.' : '');
    }

    /* 충전 상품 — 값은 보여주기만 한다(금액 검증은 서버가 다시 읽어서 한다).
       ⚠️ 상품 이름은 저장된 label 이 아니라 개수로 짓는다(2026-08-06 단위 규칙). */
    function paintPacks() {
      const packs = moncCredit.packs();
      const el = $('packs');
      if (!packs.length) { el.innerHTML = '<p class="note">충전 상품이 아직 준비되지 않았어요.</p>'; return; }
      const cp = moncCredit.cost('polish'), cs = moncCredit.cost('sojae');
      /* 큰 팩을 고를 이유를 숫자로 말한다 — 가장 비싼 크레딧 단가(보통 제일 작은 팩)를
         기준으로 몇 % 더 받는지. 팩이 하나뿐이면 기준과 같아 배지가 안 붙는다. */
      const unit = (p) => (Number(p.price) || 0) / (Number(p.count) || 1);
      const base = packs.reduce((m, p) => Math.max(m, unit(p)), 0);
      el.innerHTML = packs.map((p) => {
        const n = Number(p.count) || 0, price = Number(p.price) || 0;
        const more = base > 0 && unit(p) > 0 ? Math.round((base / unit(p) - 1) * 100) : 0;
        return '<button class="pack" type="button" data-pack="' + esc(p.id) + '">'
          + '<span><span class="n">' + n.toLocaleString() + '크레딧'
          + (more >= 5 ? '<span class="tag">' + more + '% 더</span>' : '') + '</span>'
          + '<em>첨삭 ' + Math.floor(n / cp) + '회 · 소재 발굴 ' + Math.floor(n / cs) + '회</em></span>'
          + '<span class="p">' + price.toLocaleString() + '원</span></button>';
      }).join('');
      el.querySelectorAll('[data-pack]').forEach((b) => {
        b.addEventListener('click', () => charge(b.dataset.pack, b));
      });
    }

    async function charge(packId, btn) {
      await moncCredit.charge(packId, {
        button: btn,
        onFail: (m) => notice(esc(m).replace(/\n/g, '<br>'), true),
        onDone: onCharged,
      });
    }

    /* 충전이 끝났다 — 잔액을 다시 그리고, 왔던 도구로 돌아갈 길을 크게 연다.
       (돌아가기를 안 만들면 학생이 충전만 하고 하던 일을 잃는다.) */
    function onCharged(data) {
      paintWallet();
      loadLedger();
      notice('크레딧 ' + (Number(data && data.added) || 0) + '개를 충전했어요.');
      if (_back) {
        const go = $('backGo');
        go.href = _back;
        go.textContent = BACK[_back] + ro(BACK[_back]) + ' 돌아가기';
        go.classList.add('on');
      }
    }

    async function loadLedger() {
      try {
        // ⚠️ .eq('member_id') 를 빼면 admin 계정에선 전 회원 원장이 섞인다
        const s = await MONC.getSession();
        if (!s) return;
        const { data, error } = await MONC.sb.from('credit_ledger')
          .select('*').eq('member_id', s.user.id)
          .order('created_at', { ascending: false }).limit(10);
        if (error || !data || !data.length) return;
        const TOOL = { ai_killer: 'AI킬러', sojae: '소재 발굴', polish: '답변 첨삭', rehearsal: '모의면접' };
        const REASON = { purchase: '충전', admin_grant: '지급', use: '사용', free_use: '무료 사용', refund: '환급' };
        $('ledRows').innerHTML = data.map((r) => {
          const d = Number(r.delta) || 0;
          const amt = r.reason === 'free_use' ? '무료' : (d > 0 ? '+' + d : String(d));
          /* ⚠️ 충전·지급 행에는 도구 이름을 붙이지 않는다 — 지갑은 도구 공용인데
             credit_ledger.tool 에 'ai_killer' 가 찍혀 있어 "AI킬러 충전"으로 읽힌다. */
          const withTool = r.reason === 'use' || r.reason === 'free_use' || r.reason === 'refund';
          const what = [REASON[r.reason] || r.reason, withTool ? (TOOL[r.tool] || '') : ''].filter(Boolean).join(' · ');
          const day = String(r.created_at || '').slice(0, 10).replace(/-/g, '.').replace(/^\d{4}\./, '');
          return '<div class="led-row"><span class="d">' + esc(day) + ' · ' + esc(what) + '</span>'
            + '<span class="v' + (d > 0 ? '' : ' minus') + '">' + esc(amt) + '</span></div>';
        }).join('');
        $('ledBox').style.display = '';
      } catch (_) { /* 접이 숨김 유지 */ }
    }

    (async function init() {
      if (!(await MONC.requireConsent())) return;   // ⚠️ 동의 게이트 — 빼면 주소창으로 우회된다

      if (_back) {
        $('backNote').innerHTML = '충전하면 <b>' + esc(BACK[_back]) + '</b>' + ro(BACK[_back]) + ' 바로 돌아갈 수 있어요. 쓰던 글은 그대로 있어요.';
        $('backNote').classList.add('on');
      }

      await moncCredit.loadWallet();
      paintWallet();
      await moncCredit.loadPacks();
      paintPacks();
      loadLedger();

      // 결제 복귀·자가 회복 — 끝나면 대기 화면을 내린다(pay-return.js)
      Promise.resolve(moncCredit.handleReturn({
        onDone: onCharged,
        onFail: (m) => notice(esc(m).replace(/\n/g, '<br>'), true),
      })).finally(() => { if (window.moncPayDone) moncPayDone(); });
    })();
  </script>
</body>
</html>
